confidently wrong.","trap":"Exam trap: a rule of 'never escalate before three attempts' fails the opposite way, delaying an explicit request for a person.","cites":["Domain-5_v2 §5.8","Domain-5_v2 §5.9"],"tags":["escalation","confidence"],"core":true,"rev":false},{"id":"d5-027","domain":"D5","type":"concept","front":"An agent escalates inconsistently across similar cases. What change to the system prompt makes it consistent?","back":"Add explicit escalation criteria with few-shot examples showing when to escalate and when to resolve autonomously.","cites":["Domain-5_v2 §5.8"],"tags":["escalation","system-prompt"],"core":false,"rev":false},{"id":"d5-028","domain":"D5","type":"concept","front":"A customer lookup returns several matching accounts. What does the agent do next?","back":"Ask for another identifier — email, order number, or phone — instead of choosing a match by heuristic.","trap":"Exam trap: 'take the most recently active account' misidentifies customers, and escalating here is unnecessary since asking resolves it.","cites":["Domain-5_v2 §5.8"],"tags":["escalation","disambiguation"],"core":true,"rev":false},{"id":"d5-029","domain":"D5","type":"scenario","front":"A customer writes 'this is outrageous, I am very unhappy!' and has not asked for anyone else. The agent has a workable resolution available. Escalate now or not?","back":"Not on that message alone — acknowledge the frustration, offer the concrete resolution, and escalate the moment the customer reiterates a request for a person.","cites":["Domain-5_v2 §5.8"],"tags":["escalation","customer-support"],"core":false,"rev":false},{"id":"d5-030","domain":"D5","type":"concept","front":"At what granularity should an extraction system score confidence, and against what is the threshold set?","back":"Per field rather than per document, with the review threshold calibrated against a labeled validation set.","cites":["Domain-5_v2 §5.9"],"tags":["confidence-calibration","human-review"],"core":true,"rev":false},{"id":"d5-031","domain":"D5","type":"trap","front":"An extraction system reports 97% overall accuracy and the team wants to auto-process everything above the confidence threshold. What has to be checked first?","back":"Accuracy broken out by document type and by field — an aggregate figure can hide a rare document type failing 40% of the time.","trap":"Exam trap: the aggregate number is real and still hides the segment that will produce the incidents.","cites":["Domain-5_v2 §5.9"],"tags":["confidence-calibration","aggregate-masking"],"core":true,"rev":false},{"id":"d5-032","domain":"D5","type":"concept","front":"Why audit a random sample of high-confidence extractions that nobody flagged?","back":"To measure the true error rate of the automated path and catch new error patterns early; the sample must be stratified across document types and fields.","cites":["Domain-5_v2 §5.9"],"tags":["stratified-sampling","human-review"],"core":false,"rev":false},{"id":"d5-033","domain":"D5","type":"concept","front":"A document-analysis agent finds a government report saying 40% growth and an industry analysis saying 12%, both credible. What goes in its output?","back":"Both values, with source attribution and an explicit conflict annotation, leaving reconciliation to the coordinator or a human.","trap":"Exam trap: picking the more likely figure by heuristic takes a decision that sits above the agent's scope.","cites":["Domain-5_v2 §5.10"],"tags":["conflict-detection","provenance"],"core":true,"rev":false},{"id":"d5-034","domain":"D5","type":"concept","front":"Why should a subagent finish its analysis before reporting a source conflict rather than pausing to ask?","back":"Stopping mid-run blocks the pipeline for a decision that can be made after the work is complete and annotated.","cites":["Domain-5_v2 §5.10"],"tags":["conflict-detection","pipeline"],"core":false,"rev":false},{"id":"d5-035","domain":"D5","type":"concept","front":"What must each subagent emit so the final report can still attribute every claim after synthesis?","back":"Structured claim-to-source mappings: the claim, the source name or URL, the excerpt or location, and a date — which downstream synthesis has to preserve and merge.","trap":"Exam trap: a bibliography appended at the end leaves individual claims untraceable.","cites":["Domain-5_v2 §5.11"],"tags":["provenance","attribution"],"core":true,"rev":false},{"id":"d5-036","domain":"D5","type":"fact","front":"Which field in a structured source mapping stops a temporal difference being logged as a contradiction?","back":"The publication or data-collection date — 10% in 2023 next to 15% in 2024 reads as growth rather than disagreement.","cites":["Domain-5_v2 §5.11"],"tags":["provenance","temporal-data"],"core":false,"rev":false},{"id":"d5-037","domain":"D5","type":"fact","front":"In a synthesis report, which form does each content type get: financial data, news and analysis, technical findings, time series?","back":"Tables, prose, structured lists, and chronological ordering.","cites":["Domain-5_v2 §5.11"],"tags":["provenance","report-structure"],"core":false,"rev":false},{"id":"d5-038","domain":"D5","type":"concept","front":"Deep into a long investigation the model starts citing typical patterns instead of the specific classes it found earlier. What mechanism holds the specifics?","back":"Context degradation — write intermediate findings to a scratchpad file and read it back at the start of each continuation.","cites":["Domain-5_v2 §5.12"],"tags":["scratchpad","context-degradation"],"core":false,"rev":false},{"id":"d5-039","domain":"D5","type":"scenario","front":"A multi-agent research run crashes after two of four agents have finished. The coordinator restarts. What design lets it resume instead of re-running everything?","back":"Each agent exports its state to a known location and the coordinator loads a manifest on resume, injecting the persisted findings into the remaining agents' prompts.","trap":"Exam trap: conversation history cannot carry work across a crash, because the API holds no state of its own.","cites":["Domain-5_v2 §5.12","Domain-5_v2 §5.1"],"tags":["crash-recovery","state-persistence"],"core":true,"rev":false},{"id":"d5-040","domain":"D5","type":"fact","front":"An agent's state export for crash recovery records which four things?","back":"Its status, its key findings, the coverage it achieved, and the gaps it left.","cites":["Domain-5_v2 §5.12"],"tags":["crash-recovery","state-persistence"],"core":false,"rev":false},{"id":"d5-041","domain":"D5","type":"concept","front":"After many turns an agent drifts away from its system prompt rules. Which two changes hold the behavior longer?","back":"Inject reminder messages at conversation breakpoints, and replace verbose rule lists with few-shot examples, which keep their pattern better than abstract rules.","cites":["Domain-5_v2 §5.13"],"tags":["system-prompt","instruction-drift"],"core":false,"rev":false},{"id":"d5-042","domain":"D5","type":"concept","front":"Three tools in one agent return the same entity in three different shapes. Where does normalization belong?","back":"In a `PostToolUse` hook, so every result is normalized centrally before the model sees it.","cites":["Domain-5_v2 §5.14"],"tags":["tool-output","hooks"],"core":false,"rev":false},{"id":"d5-043","domain":"D5","type":"fact","front":"How far into prompt caching does CCA-F scope reach?","back":"Knowing that it exists is in scope; its implementation details are on the official out-of-scope list.","cites":["Exam-Mechanics_v2 Out-of-Scope Topics"],"tags":["known-gap","d5.2","exam-scope"],"core":true,"rev":false},{"id":"d5-044","domain":"D5","type":"trap","front":"An option proposes prompt caching to cut cost, while the stem's stated problem is accuracy. How should that option be read?","back":"As over-engineering — the proportionate answer fixes the stated problem first, and a cost optimization that leaves the requirement unmet is wrong here.","trap":"Exam trap: caching is a real feature, which is what makes the option tempting; it answers a question the stem did not ask.","cites":["Exam-Mechanics_v2 Answer Pattern Heuristics","Exam-Mechanics_v2 Out-of-Scope Topics"],"tags":["known-gap","d5.2","distractor-shape"],"core":true,"rev":false},{"id":"d5-045","domain":"D5","type":"trap","front":"A synthesis step reliably uses the first and last stretches of a 75K-token input and misses findings in the middle. What two changes address the position problem?","back":"Put a key-findings summary at the start, and add explicit section headings throughout the input.","trap":"Exam trap: rotating which agent's output appears first moves content around without touching the attention pattern that causes the miss.","cites":["Key-Distinctions_v1 #20","Domain-5_v2 §5.2"],"tags":["known-gap","d5.1","context-window"],"core":true,"rev":false},{"id":"d5-046","domain":"D5","type":"trap","front":"Why is compressing a long input under a 20K-token ceiling the wrong answer to a middle-of-context miss?","back":"Compression can discard the critical information itself. The failure is about where content sits, so shrinking it does not change position.","trap":"Exam trap: lost-in-the-middle is a positional attention pattern rather than a capacity limit, so shrinking the input does not move the finding out of the middle.","cites":["Key-Distinctions_v1 #20","Domain-5_v2 §5.2"],"tags":["known-gap","d5.1","context-window"],"core":true,"rev":false},{"id":"d5-047","domain":"D5","type":"trap","front":"Precise amounts and dates keep turning into vague references as a support conversation is summarized. What structure preserves them?","back":"A case-facts block held outside the summarized history and included in every prompt, updated whenever a new fact appears.","trap":"Exam trap: revising the summarization prompt to protect numbers still depends on the summarizer executing perfectly every single time.","cites":["Key-Distinctions_v1 #21","Domain-5_v2 §5.4"],"tags":["context-window","facts-persistence"],"core":true,"rev":false},{"id":"d5-048","domain":"D5","type":"trap","front":"Why does raising the summarization threshold fail to solve precision loss in a long conversation?","back":"It postpones compression. The same transactional facts are eventually summarized into vague language anyway.","trap":"Exam trap: the delay produces real improvement for a while, which makes it look like a fix rather than a deferral.","cites":["Key-Distinctions_v1 #21","Domain-5_v2 §5.4"],"tags":["context-window","summarization"],"core":true,"rev":false},{"id":"d5-050","domain":"D5","type":"trap","front":"What does a subagent give a verbose exploration that `/compact` and a split across sessions do not?","back":"The verbose output never enters the main context at all, so nothing has to be compressed or reconciled afterwards.","trap":"Exam trap: asking the same session to summarize itself periodically has already spent the tokens by the time the summary is written.","cites":["Domain-5_v2 §5.6","Key-Distinctions_v1 #22"],"tags":["context-isolation","subagents"],"core":true,"rev":false},{"id":"d5-051","domain":"D5","type":"trap","front":"Which fix targets drift caused by a long system prompt full of abstract rules?","back":"Replace the verbose rule list with few-shot examples of the behavior. Examples hold a behavioral pattern longer than abstract instructions.","trap":"Exam trap: adding more explicit rules to a prompt that is already failing does not help — the corpus fix is examples, not more instruction text.","cites":["Domain-5_v2 §5.13","Key-Distinctions_v1 #23"],"tags":["behavioral-drift","few-shot"],"core":true,"rev":false},{"id":"d5-052","domain":"D5","type":"trap","front":"Someone asks what a group concluded about one theme eleven weeks and 85K tokens ago. Which memory strategy answers it?","back":"Semantic embeddings over the full history, retrieving the specific past exchanges that are relevant to the question.","trap":"Exam trap: progressive summarization compresses the exact conclusion into an abstraction that can no longer be quoted back.","cites":["Key-Distinctions_v1 #24","Domain-5_v2 §5.7"],"tags":["long-term-memory","retrieval"],"core":true,"rev":false},{"id":"d5-053","domain":"D5","type":"trap","front":"Why does a rolling window fail the same long-history recall question that progressive summarization fails?","back":"It discards the early sessions outright, so the exchange being asked about is no longer in context in any form.","trap":"Exam trap: both options keep the day-to-day conversation working, and both lose the one early exchange the question depends on.","cites":["Domain-5_v2 §5.7","Key-Distinctions_v1 #24"],"tags":["long-term-memory","context-window"],"core":true,"rev":false},{"id":"d5-054","domain":"D5","type":"trap","front":"What makes Claude appear to remember turn 1 while answering turn 5?","back":"The application resends the prior messages in the `messages` array on every request. The API holds no server-side state.","trap":"Exam trap: a `session_id` parameter is offered as the mechanism and does not exist.","cites":["Key-Distinctions_v1 #25","Domain-5_v2 §5.1"],"tags":["stateless-api","memory"],"core":true,"rev":false},{"id":"d5-060","domain":"D5","type":"trap","front":"At 2,500 tokens and seven turns, which two explanations for behavioral drift are ruled out?","back":"Context-window overflow, impossible at that size, and the claim that a system prompt applies only to the first turn.","trap":"Exam trap: both read as mechanism-level diagnoses. The documented cause is accumulated assistant responses diluting the system prompt's influence.","cites":["Key-Distinctions_v1 #23","Domain-5_v2 §5.13"],"tags":["behavioral-drift","system-prompt"],"core":true,"rev":false},{"id":"ex-001","domain":"EX","type":"fact","front":"How many questions does CCA-F ask, and in how much time?","back":"60 questions in 120 minutes, about two minutes per question.","cites":["Official-Guide p.2","Exam-Mechanics_v2 Format"],"tags":["exam-format","numbers"],"core":true,"rev":true},{"id":"ex-002","domain":"EX","type":"fact","front":"How many correct responses can a CCA-F item have?","back":"It varies -- the exam allows multiple-choice and multiple-response items, and each item states how many responses to select. All 12 official sample questions are still single-answer with 4 options.","cites":["Exam-Mechanics_v2 Format","Official-Guide p.2"],"tags":["exam-format","scoring"],"core":true,"rev":false},{"id":"ex-003","domain":"EX","type":"fact","front":"How many scenarios frame the questions in one CCA-F sitting, out of how large a bank, and how are they selected?","back":"Four, picked at random from the full set of six.","cites":["Official-Guide p.4","Exam-Mechanics_v2 Format"],"tags":["exam-format","scenario-bank"],"core":true,"rev":true},{"id":"ex-004","domain":"EX","type":"fact","front":"What is the CCA-F score scale, and what score passes?","back":"Scaled 100 to 1,000, with 720 the minimum passing score.","cites":["Official-Guide p.3","Exam-Mechanics_v2 Scoring Context"],"tags":["scoring","numbers"],"core":true,"rev":true},{"id":"ex-005","domain":"EX","type":"concept","front":"Why is a raw percentage correct only an approximation of your CCA-F scaled score?","back":"Scaled scoring equates results across exam forms of slightly different difficulty, so the raw-to-scaled mapping shifts with the form you sit.","cites":["Official-Guide p.3","Exam-Mechanics_v2 Scoring Context"],"tags":["scoring","scaled-score"],"core":true,"rev":false},{"id":"ex-006","domain":"EX","type":"trap","front":"Does a wrong answer on the CCA-F exam cost more than an unsure one?","back":"There is no penalty for a wrong answer -- guessing costs nothing.","trap":"Exam trap: negative-marking habits from other exams make candidates deliberate on a coin-flip question. Here an unsure answer is free, so answer and move on.","cites":["Exam-Mechanics_v2 Format"],"tags":["scoring","exam-strategy"],"core":true,"rev":false},{"id":"ex-007","domain":"EX","type":"fact","front":"Roughly how many questions does each scenario block carry on a 60-question CCA-F sitting?","back":"About 15, by even division: the guide gives 60 questions and 4 scenarios but states no per-scenario count.","cites":["Exam-Mechanics_v2 Scenario Bank","Official-Guide p.2"],"tags":["exam-format","scenario-bank"],"core":true,"rev":false},{"id":"ex-008","domain":"EX","type":"fact","front":"Which six scenarios make up the official CCA-F scenario bank?","back":"Customer Support Resolution Agent; Code Generation with Claude Code; Multi-Agent Research System; Developer Productivity with Claude; Claude Code for Continuous Integration; Structured Data Extraction.","cites":["Official-Guide p.4","Official-Guide p.5"],"tags":["scenario-bank","recall"],"core":true,"rev":false},{"id":"ex-009","domain":"EX","type":"trap","front":"The community study guide covers a seventh scenario, 'Conversational AI Architecture Patterns'. Can the exam draw a block from it?","back":"It cannot. The official bank is six, and the community guide's #7 and #8 are candidate-reported, appearing in no official list.","trap":"Exam trap: the community guide's #7 and #8 are usable study material, but the exam can only draw from the official six.","cites":["Exam-Mechanics_v2 Scenario Bank","Official-Guide p.4"],"tags":["scenario-bank","sources"],"core":true,"rev":false},{"id":"ex-010","domain":"EX","type":"fact","front":"How long does the CCA-F credential stay valid?","back":"12 months from the date the credential is awarded.","cites":["Official-Guide p.2"],"tags":["credential","logistics"],"core":false,"rev":false},{"id":"ex-011","domain":"EX","type":"fact","front":"How is the CCA-F delivered, and what does a sitting cost?","back":"Online proctored or at a test center; the fee is $125 USD.","cites":["Official-Guide p.2"],"tags":["logistics","delivery"],"core":false,"rev":false},{"id":"ex-012","domain":"EX","type":"fact","front":"How many CCA-F at /* ============================ constants & helpers ============================ */

const NS_BASE = "cca-drill:v1:";
const PARAMS = new URLSearchParams(location.search);
const SIM = PARAMS.get("today");
const NS = NS_BASE + (SIM ? "sim:" : "");
const K_STATE = NS + "state", K_SESSION = NS + "session",
      K_SETTINGS = NS + "settings", K_MISSES = NS + "misses";

const EXAM_DATE = PARAMS.get("exam") || DATA.meta.examDate;
const DOM_ORDER = ["D1","D2","D3","D4","D5","EX"];
const DOM_COLOR = {D1:"var(--d1)",D2:"var(--d2)",D3:"var(--d3)",D4:"var(--d4)",D5:"var(--d5)",EX:"var(--dex)"};
const BOX_COLOR = ["#e8e1d4","#c85a3a","#c8832a","#3a7a4a","#2a5a8a"];
const BOX_NAME  = ["new","learning","firming","solid","parked"];
const INTERVAL  = {1:1, 2:2, 3:3, 4:null};   // null == park until exam eve
const MAX_REQUEUE = 2;

function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function code(s){ return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }

function pad2(n){ return (n < 10 ? "0" : "") + n; }
function isoOf(dt){ return dt.getFullYear() + "-" + pad2(dt.getMonth()+1) + "-" + pad2(dt.getDate()); }
function parseISO(s){ const p = String(s).split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(iso, n){ const d = parseISO(iso); d.setDate(d.getDate() + n); return isoOf(d); }
function daysBetween(a, b){ return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function todayStr(){ return SIM || isoOf(new Date()); }
function examEve(){ return addDays(EXAM_DATE, -1); }
function minDate(a, b){ return a <= b ? a : b; }

function load(key, fallback){
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ return fallback; }
}
function save(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); }
  catch(e){ console.warn("storage write failed", e); }
}

const CARDS = DATA.cards || [];
const BY_ID = {}; CARDS.forEach(function(c){ BY_ID[c.id] = c; });

/* ============================ state ============================ */

let state = load(K_STATE, null) || { v:1, cards:{}, streak:{last:null, n:0}, log:[] };
let settings = load(K_SETTINGS, null) || { newPerDay: defaultNewPerDay(), scope:"full" };
let session = load(K_SESSION, null);
let lastAction = null;   // single-level undo

function defaultNewPerDay(){
  const daysLeft = Math.max(1, daysBetween(todayStr(), addDays(EXAM_DATE, -2)) + 1);
  return Math.max(10, Math.ceil(CARDS.length / daysLeft));
}
function persist(){ save(K_STATE, state); }
function cardState(id){ return state.cards[id] || null; }

function inScope(c){ return settings.scope === "core" ? !!c.core : true; }

// A card enters the scheduler only once it has been graded (box >= 1). Flagging a card
// while browsing creates a box-0 stub, which must not make it due.
function isDue(id){
  const st = cardState(id);
  return st && st.b >= 1 && st.due <= todayStr();
}
function unseen(c){ const st = state.cards[c.id]; return !st || st.b === 0; }

/* interval / grading ------------------------------------------------------- */

function dueFromBox(box){
  const t = todayStr();
  const raw = INTERVAL[box] === null ? examEve() : addDays(t, INTERVAL[box]);
  return minDate(raw, examEve());
}

function applyGrade(id, g){
  const t = todayStr();
  let st = state.cards[id];
  if (!st) st = state.cards[id] = { b:1, due:t, m:0, gu:0, f:false, ls:null, first:null };
  const before = JSON.parse(JSON.stringify(st));
  if (!st.first) st.first = t;   // date first graded -- anchors the daily new-card budget
  if (g === 1){                       // missed
    st.b = 1; st.due = t; st.m = (st.m||0) + 1;
  } else if (g === 2){                // guessed it
    st.gu = (st.gu||0) + 1;
    st.due = minDate(addDays(t, 1), examEve());
  } else {                            // knew it
    st.b = Math.min(4, (st.b||1) + 1);
    st.due = dueFromBox(st.b);
  }
  st.ls = t;
  return before;
}

function bumpStreak(){
  const t = todayStr();
  if (state.streak.last === t) return;
  state.streak.n = (state.streak.last === addDays(t,-1)) ? state.streak.n + 1 : 1;
  state.streak.last = t;
}

/* ============================ queue building ============================ */

function weightedInterleave(pools, weights, n){
  const taken = {}, out = [];
  Object.keys(pools).forEach(function(d){ taken[d] = 0; });
  while (out.length < n){
    let best = null, bestRatio = Infinity;
    for (const d of Object.keys(pools)){
      if (taken[d] >= pools[d].length) continue;
      const r = taken[d] / (weights[d] || 1);
      if (r < bestRatio){ bestRatio = r; best = d; }
    }
    if (best === null) break;
    out.push(pools[best][taken[best]]); taken[best]++;
  }
  return out;
}

  const pools = {};
  DOM_ORDER.forEach(function(d){ pools[d] = []; });
  CARDS.filter(function(c){ return unseen(c) && inScope(c); }).forEach(function(c){
    pools[c.domain].push(c.id);
  });
  // Priority inside a domain: known gaps, then traps, then corpus order.
  DOM_ORDER.forEach(function(d){
    pools[d].sort(function(a, b){
      const ca = BY_ID[a], cb = BY_ID[b];
      const ga = (ca.tags||[]).indexOf("known-gap") >= 0 ? 0 : 1;
      const gb = (cb.tags||[]).indexOf("known-gap") >= 0 ? 0 : 1;
      if (ga !== gb) return ga - gb;
      const ta = ca.type === "trap" ? 0 : 1, tb = cb.type === "trap" ? 0 : 1;
      if (ta !== tb) return ta - tb;
      return a < b ? -1 : 1;
    });
  });
  return pools;
}

function dueIds(){
  return CARDS.filter(function(c){ return inScope(c) && isDue(c.id); })
    .sort(function(a, b){
      const sa = cardState(a.id), sb = cardState(b.id);
      if (sa.b !== sb.b) return sa.b - sb.b;
      const wa = DATA.weights[a.domain] || 0, wb = DATA.weights[b.domain] || 0;
      return wb - wa;
    }).map(function(c){ return c.id; });
}

function newIdsToday(){
  // Count by `first`, not by box: a card introduced today and graded "Knew it" has
  // already left box 1, and must still consume today's budget.
  const introducedToday = Object.keys(state.cards)
    .filter(function(id){ return state.cards[id].first === todayStr(); });
  const budget = Math.max(0, (settings.newPerDay|0) - introducedToday.length);
  if (budget <= 0) return [];
  const w = Object.assign({}, DATA.weights, {EX:4});
  return weightedInterleave(newCardPools(), w, budget);
}

function buildScheduledQueue(){
  return dueIds().concat(newIdsToday());
}

function riskOrder(ids){
  return ids.slice().sort(function(a, b){
    const sa = cardState(a) || {b:0,m:0}, sb = cardState(b) || {b:0,m:0};
    if (sa.b !== sb.b) return sa.b - sb.b;
    if ((sb.m||0) !== (sa.m||0)) return (sb.m||0) - (sa.m||0);
    const ka = (BY_ID[a].tags||[]).indexOf("known-gap") >= 0 ? 0 : 1;
    const kb = (BY_ID[b].tags||[]).indexOf("known-gap") >= 0 ? 0 : 1;
    return ka - kb;
  });
}

function startSession(queue, mode, writeBack){
  if (!queue.length){ alert("Nothing queued for that selection."); return; }
  session = { queue: queue, pos: 0, mode: mode, writeBack: writeBack !== false,
              startedAt: todayStr(), grades: {}, requeues: {}, shown: 0 };
  save(K_SESSION, session);
  go("session");
}

function copyState(){
  const blob = JSON.stringify({ state: state, settings: settings, exported: todayStr() });
  navigator.clipboard.writeText(blob).then(function(){
    document.getElementById("stateMsg").innerHTML = '<div class="ok-msg">State copied to the clipboard.</div>';
  }, function(){
    document.getElementById("stateMsg").innerHTML =
      '<div class="err">Clipboard blocked. Here it is to copy by hand:</div><textarea>' + esc(blob) + "</textarea>";
  });
}

function restoreState(){
  const raw = prompt("Paste a previously copied state JSON:");
  if (!raw) return;
  try {
    const obj = JSON.parse(raw);
    if (!obj.state || !obj.state.cards) throw new Error("not a state export");
    state = obj.state;
    if (obj.settings) settings = obj.settings;
    persist(); save(K_SETTINGS, settings); renderHome();
    document.getElementById("stateMsg").innerHTML = '<div class="ok-msg">State restored.</div>';
  } catch(e){
    document.getElementById("stateMsg").innerHTML = '<div class="err">Could not read that: ' + esc(e.message) + "</div>";
  }
}

/* ============================ rendering: session ============================ */

let revealed = false;

function currentEntry(){ return session ? session.queue[session.pos] : null; }
function entryCard(entry){
  if (!entry) return null;
  return BY_ID[entry.indexOf("rev:") === 0 ? entry.slice(4) : entry];
}
function isReversed(entry){ return !!entry && entry.indexOf("rev:") === 0; }

function renderSession(){
  if (!session || session.pos >= session.queue.length){ finishSession(); return; }
  const entry = currentEntry(), c = entryCard(entry);
  if (!c){ session.pos++; renderSession(); return; }

  const st = cardState(c.id);
  const rev = isReversed(entry);
  const faceFront = rev ? c.back : c.front;
  const faceBack  = rev ? c.front : c.back;

  document.getElementById("navBar").classList.remove("hidden");
  const total = session.queue.length;
  document.getElementById("progFill").style.width = (session.pos / total * 100) + "%";
  document.getElementById("progText").textContent = (session.pos + 1) + " / " + total;
  document.getElementById("progMode").textContent =
    session.mode + (session.mode === "cram" && !session.writeBack ? " (not scored)" : "");
  const g = session.grades, gv = Object.keys(g).map(function(k){ return g[k]; });
  document.getElementById("tally").innerHTML =
    '<span class="x">' + gv.filter(function(v){ return v === 1; }).length + "</span> / " +
    '<span class="mid">' + gv.filter(function(v){ return v === 2; }).length + "</span> / " +
    '<span class="ok">' + gv.filter(function(v){ return v === 3; }).length + "</span>";

  const html =
    '<div class="qcard">' +
      '<div class="qmeta">' +
        '<span class="dtag" style="background:' + DOM_COLOR[c.domain] + '">' + c.domain + "</span>" +
        '<span class="ttag">' + esc(rev ? "reversed" : c.type) + "</span>" +
        ((c.tags||[]).indexOf("known-gap") >= 0 ? '<span class="ttag" style="background:var(--coral-light);border-color:#e8bcae;color:#8a3a22">known gap</span>' : "") +
        '<button class="flagbtn' + (st && st.f ? " on" : "") + '" id="flagBtn" title="Flag (F)">&#9873;</button>' +
        '<span class="boxdot">' + (st ? BOX_NAME[st.b] : "new") + "</span>" +
      "</div>" +
      '<div class="front">' + code(faceFront) + "</div>" +
      (revealed
        ? '<div class="back">' + code(faceBack) +
            (c.trap && !rev ? '<div class="trapline">' + code(c.trap) + "</div>" : "") +
            '<div class="cites">' + (c.cites||[]).map(function(x){ return '<span class="cite">' + esc(x) + "</span>"; }).join("") + "</div>" +
          "</div>" +
          '<div class="grades">' +
            '<button class="grade g1" data-g="1">Missed<span class="k">1</span></button>' +
            '<button class="grade g2" data-g="2">Guessed it<span class="k">2</span></button>' +
            '<button class="grade g3" data-g="3">Knew it<span class="k">3</span></button>' +
          "</div>"
        : '<div class="reveal-hint">Answer it out loud, then press Space to check.</div>' +
          '<div class="btn-row"><button class="btn primary" id="revealBtn">Reveal</button></div>') +
    "</div>";

  document.getElementById("view-session").innerHTML = html;
  on("revealBtn", doReveal);
  on("flagBtn", toggleFlag);
  Array.prototype.forEach.call(document.querySelectorAll(".grade"), function(b){
    b.addEventListener("click", function(){ grade(parseInt(b.dataset.g, 10)); });
  });
}

function doReveal(){ revealed = true; renderSession(); }

function toggleFlag(){
  const c = entryCard(currentEntry()); if (!c) return;
  const st = state.cards[c.id] || (state.cards[c.id] = { b:0, due:todayStr(), m:0, gu:0, f:false, ls:null, first:null });
  st.f = !st.f; persist(); renderSession();
}

function grade(g){
  if (!revealed) return;
  const entry = currentEntry(), c = entryCard(entry);
  if (!c) return;
  const scoring = session.writeBack && !isReversed(entry);
  const before = scoring ? applyGrade(c.id, g) : null;
  lastAction = { entry: entry, pos: session.pos, before: before, scoring: scoring, id: c.id };
  session.grades[entry] = g;
  session.shown++;

  if (g === 1){
    const n = session.requeues[entry] || 0;
    if (n < MAX_REQUEUE){ session.queue.push(entry); session.requeues[entry] = n + 1; }
  }
  session.pos++;
  revealed = false;
  if (scoring){ bumpStreak(); persist(); }
  save(K_SESSION, session);
  renderSession();
}

function undo(){
  if (!lastAction || !session) return;
  if (lastAction.scoring && lastAction.before) state.cards[lastAction.id] = lastAction.before;
  // Drop a requeue this grade may have appended.
  if (session.queue[session.queue.length-1] === lastAction.entry &&
      session.requeues[lastAction.entry]){
    session.queue.pop(); session.requeues[lastAction.entry]--;
  }
  delete session.grades[lastAction.entry];
  session.pos = lastAction.pos;
  session.shown = Math.max(0, session.shown - 1);
  lastAction = null; revealed = true;
  persist(); save(K_SESSION, session);
  renderSession();
}

function finishSession(){
  if (!session) { go("home"); return; }
  const g = session.grades, entries = Object.keys(g);
  const missed = entries.filter(function(k){ return g[k] === 1; });
  if (session.writeBack && entries.length){
    const t = todayStr();
    const rec = state.log.filter(function(r){ return r.date === t; })[0];
    if (rec){ rec.done += entries.length; rec.missed += missed.length; }
    else state.log.push({ date:t, done:entries.length, missed:missed.length });
    persist();
  }
  const summary = { total: entries.length, grades: g, missed: missed, mode: session.mode };
  session = null; localStorage.removeItem(K_SESSION);
  renderSummary(summary);
}

function renderSummary(s){
  document.getElementById("navBar").classList.add("hidden");
  const gv = Object.keys(s.grades).map(function(k){ return s.grades[k]; });
  const n1 = gv.filter(function(v){ return v===1; }).length;
  const n2 = gv.filter(function(v){ return v===2; }).length;
  const n3 = gv.filter(function(v){ return v===3; }).length;

  const perDom = {};
  Object.keys(s.grades).forEach(function(k){
    const c = entryCard(k); if (!c) return;
    perDom[c.domain] = perDom[c.domain] || [0,0,0];
    perDom[c.domain][s.grades[k]-1]++;
  });
  const domRows = DOM_ORDER.filter(function(d){ return perDom[d]; }).map(function(d){
    const p = perDom[d], tot = p[0]+p[1]+p[2];
    return '<div class="dombar"><div class="nm" style="border-left:3px solid ' + DOM_COLOR[d] +
      ';padding-left:7px">' + d + '</div><div class="track">' +
      '<div class="seg" style="width:' + (p[2]/tot*100) + '%;background:var(--green)"></div>' +
      '<div class="seg" style="width:' + (p[1]/tot*100) + '%;background:var(--amber)"></div>' +
      '<div class="seg" style="width:' + (p[0]/tot*100) + '%;background:var(--coral)"></div>' +
      '</div><div class="num">' + p[2] + "/" + tot + "</div></div>";
  }).join("");

  const missList = s.missed.map(function(k){
    const c = entryCard(k); if (!c) return "";
    return '<div class="missitem"><div class="mq">' + c.domain + " &middot; " + esc(c.id) + "</div>" +
      code(c.front) + "</div>";
  }).join("");

  document.getElementById("view-summary").innerHTML =
    '<div class="card-panel">' +
      '<div class="panel-title">Session complete</div>' +
      '<div class="stat-row">' +
        '<div class="stat"><div class="v">' + s.total + '</div><div class="l">answered</div></div>' +
        '<div class="stat"><div class="v" style="color:var(--green)">' + n3 + '</div><div class="l">knew it</div></div>' +
        '<div class="stat"><div class="v" style="color:var(--amber-dark)">' + n2 + '</div><div class="l">guessed</div></div>' +
        '<div class="stat"><div class="v" style="color:var(--coral)">' + n1 + '</div><div class="l">missed</div></div>' +
      "</div>" +
      (domRows ? '<div class="dombars" style="margin-top:14px">' + domRows + "</div>" : "") +
      '<div class="btn-row">' +
        (s.missed.length ? '<button class="btn primary" id="btnCramMissed">Cram the ' + s.missed.length + " missed</button>" : "") +
        '<button class="btn" id="btnHome">Home</button>' +
      "</div>" +
    "</div>" +
    (missList ? '<div class="card-panel"><div class="panel-title">Missed this session</div>' +
      '<div class="misslist">' + missList + "</div></div>" : "");

  on("btnHome", function(){ go("home"); });
  on("btnCramMissed", function(){
    startSession(s.missed.slice(), "cram", false);
  });
  showOnly("summary");
}

        return '<div class="browserow" data-id="' + c.id + '">' +
          '<div class="bf">' + code(c.front) + "</div>" +
          '<div class="bb">' + code(c.back) +
            (c.trap ? '<div class="trapline">' + code(c.trap) + "</div>" : "") + "</div>" +
          '<div class="bm">' + c.domain + " &middot; " + c.type + " &middot; " + esc(c.id) +
            " &middot; " + (st ? BOX_NAME[st.b] : "new") +
            (c.cites||[]).map(function(x){ return " &middot; " + esc(x); }).join("") + "</div>" +
          "</div>";
      }).join("");
    Array.prototype.forEach.call(document.querySelectorAll(".browserow"), function(r){
      r.addEventListener("click", function(){ r.classList.toggle("open"); });
    });
  }
  ["bDom","bType","bBox","bFlag"].forEach(function(id){
    document.getElementById(id).addEventListener("change", refresh);
  });
  document.getElementById("bText").addEventListener("input", refresh);
  on("btnBrowseHome", function(){ go("home"); });
  on("btnPrint", function(){ buildPrint(); window.print(); });
  refresh();
}

function buildPrint(){
  let html = "<h1>CCA-F Drill Deck</h1><p>" + CARDS.length + " cards &middot; deck version " +
    DATA.meta.deckVersion + "</p>";
  DOM_ORDER.forEach(function(d){
    const rows = CARDS.filter(function(c){ return c.domain === d; });
    if (!rows.length) return;
    html += "<h2>" + d + " " + esc(DATA.domainNames[d]) + " (" + rows.length + ")</h2>";
    rows.forEach(function(c){
      html += '<div class="pcard"><div class="pf">' + code(c.front) + "</div>" +
        '<div class="pb">' + code(c.back) + "</div>" +
        (c.trap ? '<div class="pb"><em>' + code(c.trap) + "</em></div>" : "") +
        '<div class="pm">' + esc(c.id) + " &middot; " + c.type + " &middot; " +
        (c.cites||[]).map(esc).join("; ") + "</div></div>";
    });
  });
  document.getElementById("printArea").innerHTML = html;
}

/* ============================ import mock results ============================ */

function normCite(s){ return String(s).trim().toLowerCase(); }

function renderImport(){
  document.getElementById("view-import").innerHTML =
    '<div class="card-panel">' +
      '<div class="panel-title">Import mock exam results</div>' +
      '<p class="note">Paste the results JSON from a mock exam. Cards covering what you missed ' +
        "go back to box 1 and come up in the next session.</p>" +
      '<textarea id="impText" placeholder="paste results JSON here"></textarea>' +
      '<div class="btn-row">' +
        '<button class="btn primary" id="btnParse">Read it</button>' +
        '<button class="btn" id="btnImpHome">Home</button>' +
      "</div>" +
      '<div id="impOut"></div>' +
    "</div>";
  on("btnImpHome", function(){ go("home"); });
  on("btnParse", parseImport);
}

function parseImport(){
  const out = document.getElementById("impOut");
  let payload;
  try { payload = JSON.parse(document.getElementById("impText").value); }
  catch(e){ out.innerHTML = '<div class="err">That is not valid JSON: ' + esc(e.message) + "</div>"; return; }

  const examN = payload.exam_n;
  const qs = payload.questions || [];
  if (examN == null || !qs.length){
    out.innerHTML = '<div class="err">No <code>exam_n</code> or <code>questions</code> in that payload.</div>';
    return;
  }
  const map = DATA.mockMap[String(examN)] || DATA.mockMap[String(examN) + "-retrofit"] || null;
  if (!map){
    out.innerHTML = '<div class="err">No question map for exam ' + esc(examN) +
      ". The deck was built before that exam existed.</div>";
    return;
  }

  const missed = qs.filter(function(q){ return q.correct === false; });
  const matchedIds = {}, rows = [];
  missed.forEach(function(q){
    const info = map[String(q.q)] || null;
    const cites = info ? (info.c || []) : [];
    const want = cites.map(normCite);
    const hits = CARDS.filter(function(c){
      return (c.cites||[]).some(function(x){ return want.indexOf(normCite(x)) >= 0; });
    }).map(function(c){ return c.id; });
    hits.forEach(function(id){ matchedIds[id] = true; });
    rows.push({ q:q.q, domain:(info && info.d) || q.domain, topic:(info && info.t) || "",
                cites:cites, hits:hits });
  });

  const ids = Object.keys(matchedIds);
  const unmatched = rows.filter(function(r){ return !r.hits.length; });

  out.innerHTML =
    '<div class="ok-msg">Mock ' + esc(examN) + " &middot; " +
      esc(payload.total_correct) + "/" + esc(payload.total_questions) + " correct &middot; " +
      missed.length + " missed</div>" +
    '<div class="btn-row"><button class="btn primary" id="btnBoost">Boost ' + ids.length +
      " matched card" + (ids.length === 1 ? "" : "s") + "</button></div>" +
    (unmatched.length ? '<p class="note">' + unmatched.length +
      " missed question" + (unmatched.length === 1 ? " has" : "s have") +
      " no card yet. Those are the gaps worth writing cards for next.</p>" : "") +
    '<div class="misslist">' + rows.map(function(r){
      return '<div class="missitem"><div class="mq">Q' + esc(r.q) + " &middot; " + esc(r.domain) +
        " &middot; " + (r.hits.length ? r.hits.length + " card" + (r.hits.length===1?"":"s") : "no card yet") +
        "</div>" + esc(r.topic) + "</div>";
    }).join("") + "</div>";

  on("btnBoost", function(){
    const t = todayStr();
    ids.forEach(function(id){
      const st = state.cards[id] || (state.cards[id] = { b:1, due:t, m:0, gu:0, f:false, ls:null, first:null });
      st.b = 1; st.due = t; if (!st.first) st.first = t;
    });
    const misses = load(K_MISSES, []);
    misses.push({ exam: examN, date: t, missed: rows });
    save(K_MISSES, misses);
    persist();
    out.innerHTML += '<div class="ok-msg">' + ids.length + " cards moved to box 1, due today.</div>";
  });
}

/* ============================ routing ============================ */

function showOnly(name){
  ["home","session","summary","browse","import"].forEach(function(v){
    document.getElementById("view-" + v).classList.toggle("on", v === name);
  });
  document.getElementById("hero").style.display = (name === "session") ? "none" : "";
  if (name !== "session") document.getElementById("navBar").classList.add("hidden");
}

function go(name){
  if (name === "home"){ renderHome(); showOnly("home"); }
  else if (name === "session"){ revealed = false; renderSession(); showOnly("session"); }
  else if (name === "browse"){ renderBrowse(); showOnly("browse"); }
  else if (name === "import"){ renderImport(); showOnly("import"); }
  else { showOnly(name); }
  if (location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
  window.scrollTo(0, 0);
}

function routeOnLoad(){
  if (SIM){
    const b = document.getElementById("simBanner");
    b.className = "simbanner on";
    b.textContent = "Simulated date " + SIM + " - progress is sandboxed, your real state is untouched";
  }
  if (session && session.queue && session.pos < session.queue.length){ go("session"); return; }
  if (session){ session = null; localStorage.removeItem(K_SESSION); }
  go("home");
}

document.addEventListener("keydown", function(e){
  const inField = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target||{}).tagName || "");
  if (inField) return;
  const inSession = document.getElementById("view-session").classList.contains("on");
  if (!inSession) return;
  const k = e.key, c = e.code;
  if (k === " " || c === "Space" || k === "Spacebar" || k === "Enter" || c === "Enter"){
    e.preventDefault();
    if (!revealed) doReveal();
  } else if (k === "1" || k === "2" || k === "3"){
    e.preventDefault(); grade(parseInt(k, 10));
  } else if (c === "Digit1" || c === "Numpad1"){ e.preventDefault(); grade(1);
  } else if (c === "Digit2" || c === "Numpad2"){ e.preventDefault(); grade(2);
  } else if (c === "Digit3" || c === "Numpad3"){ e.preventDefault(); grade(3);
  } else if (k === "f" || k === "F"){
    e.preventDefault(); toggleFlag();
  } else if (k === "u" || k === "U"){
    e.preventDefault(); undo();
  } else if (k === "Escape"){
    e.preventDefault(); finishSession();
  }
});

document.getElementById("endBtn").addEventListener("click", finishSession);

routeOnLoad();
</script>
