al turns even when it needs both. What does the exam prefer?","back":"Instruct the model in the prompt to bundle related tool requests into a single turn, since it can request several tools at once.","cites":["Domain-2_v2 §2.8"],"tags":["bundling","d2.8","known-gap","tool-design"],"core":true,"rev":false},{"id":"d2-047","domain":"D2","type":"trap","front":"Why is a `get_customer_with_orders` composite tool the less-preferred fix for sequential tool calls?","back":"It hides the composition inside a new tool when the model can already ask for both tools in one turn.","trap":"Exam trap: the composite does remove the extra round trip, and the exam still prefers prompting for bundled requests.","cites":["Domain-2_v2 §2.8"],"tags":["bundling","d2.8","known-gap","tool-design"],"core":true,"rev":false},{"id":"d2-048","domain":"D2","type":"concept","front":"Grep and Glob both locate things in a codebase. What does each one actually search?","back":"Grep searches inside file contents for patterns; Glob matches file paths by name or extension pattern.","cites":["Domain-2_v2 §2.9"],"tags":["built-in-tools","grep-glob"],"core":true,"rev":false},{"id":"d2-049","domain":"D2","type":"trap","front":"You need every file that references a deprecated `formatDate` function. Which built-in tool finds them?","back":"Grep — the target is what is written inside the files, across the codebase.","trap":"Exam trap: Glob `**/formatDate*` looks equivalent; Glob matches file paths, so it returns files named after the function and misses every caller.","cites":["Domain-2_v2 §2.9"],"tags":["built-in-tools","grep-glob"],"core":true,"rev":false},{"id":"d2-050","domain":"D2","type":"trap","front":"A convention change has to reach every TypeScript test file. Which built-in tool enumerates them?","back":"Glob with a pattern such as `**/*.test.tsx`, because the selection criterion is the file naming pattern.","trap":"Exam trap: grepping for the word 'test' inside files matches unrelated files that mention testing and misses test files that never use the literal word.","cites":["Domain-2_v2 §2.9"],"tags":["built-in-tools","grep-glob"],"core":false,"rev":false},{"id":"d2-051","domain":"D2","type":"concept","front":"On what does the Edit tool depend to locate the text it replaces?","back":"A unique text match. When the anchor string occurs more than once, Edit cannot choose an occurrence and fails.","cites":["Domain-2_v2 §2.9"],"tags":["built-in-tools","edit"],"core":true,"rev":false},{"id":"d2-052","domain":"D2","type":"concept","front":"Edit fails because the anchor text is not unique in the file. What is the sanctioned fallback?","back":"Read the full file, modify the content programmatically, then Write the updated version.","cites":["Domain-2_v2 §2.9"],"tags":["built-in-tools","edit"],"core":true,"rev":false},{"id":"d2-053","domain":"D2","type":"trap","front":"After an Edit fails on a non-unique anchor, a teammate retries with a shorter, more generic anchor string. What happens?","back":"The odds get worse: a shorter string is likelier to occur in several places, so the same failure repeats.","trap":"Exam trap: shortening reads like loosening a too-strict match, when the failure came from ambiguity that shortening increases.","cites":["Domain-2_v2 §2.9"],"tags":["built-in-tools","edit"],"core":false,"rev":false},{"id":"d2-054","domain":"D2","type":"trap","front":"Why is running `sed` through Bash the wrong way to force a replacement Edit could not make?","back":"It bypasses the tool built for the job; the exam's sanctioned fallback is Read plus Write.","trap":"Exam trap: `sed` does complete the replacement, and reaching for the shell when a structured tool exists is the documented anti-pattern.","cites":["Domain-2_v2 §2.9"],"tags":["built-in-tools","edit","bash"],"core":true,"rev":false},{"id":"d2-055","domain":"D2","type":"scenario","front":"You are dropped into an unfamiliar large repository and need to understand how one feature works end to end. Nobody has told you which files matter. What is the first move?","back":"Grep for the entry points — the function definition or export — then Read what it finds and follow the imports outward, repeating until the picture holds.","trap":"Exam trap: reading every file first to 'get full context' spends the context window on irrelevant files, which the exam treats as the anti-pattern.","cites":["Domain-2_v2 §2.9"],"tags":["built-in-tools","investigation"],"core":true,"rev":false},{"id":"d2-056","domain":"D2","type":"trap","front":"A teammate proposes Globbing the whole tree and reading every match before running any content search. What is wrong with it?","back":"Discovery should be driven by content search first, then targeted reads; enumerating and reading everything is bulk reading with an extra step.","trap":"Exam trap: it uses the right tool for file enumeration and still reads everything before knowing what matters.","cites":["Domain-2_v2 §2.9"],"tags":["built-in-tools","investigation"],"core":false,"rev":false},{"id":"d2-057","domain":"D2","type":"scenario","front":"A rename of `calculateTax` must reach every caller. The function is wrapped by `utils/tax.ts` as `getTax` and re-exported from `index.ts`. Grepping for `calculateTax` returns a short list of call sites. What step is missing?","back":"Collect every exported name first — the original plus each wrapper or re-export alias — then Grep for each name to find the rest of the call sites.","cites":["Domain-2_v2 §2.9"],"tags":["built-in-tools","refactoring"],"core":false,"rev":false},{"id":"d2-058","domain":"D2","type":"concept","front":"Which category of work is Bash the right built-in tool for?","back":"Running shell commands: git, npm, tests, builds. Reading, searching, and editing files each have a dedicated tool.","cites":["Domain-2_v2 §2.9"],"tags":["built-in-tools","bash"],"core":false,"rev":false},{"id":"d2-061","domain":"D2","type":"trap","front":"Which tool errors are worth retrying, and which are guaranteed to fail the same way again?","back":"Transient errors such as timeouts and network faults retry with backoff. Validation, permission, and business-rule errors return immediately with detail.","trap":"Exam trap: uniform backoff across every failure burns attempts on a policy denial that no number of retries can change.","cites":["Domain-2_v2 §2.3","Key-Distinctions_v1 #9"],"tags":["error-handling","retry"],"core":true,"rev":false},{"id":"d2-062","domain":"D2","type":"trap","front":"A search tool returns zero matches. A second call times out. Which of the two is an error?","back":"Only the timeout. Zero matches is a successful query with an empty result set, so `isError` stays absent or false.","trap":"Exam trap: flagging zero matches as an error makes the agent retry a query that worked; returning an empty list for a failed query makes it report no data.","cites":["Key-Distinctions_v1 #9","Domain-2_v2 §2.3"],"tags":["error-handling","empty-results"],"core":true,"rev":false},{"id":"d2-064","domain":"D2","type":"trap","front":"Why is merging two confusable tools into a single `lookup_entity` tool the wrong repair?","back":"It discards the semantic precision that lets the model tell the two cases apart, while the ambiguity itself lives in the descriptions.","trap":"Exam trap: consolidation presents as simplification and removes the very distinction the agent was failing to make.","cites":["Domain-2_v2 §2.2","Key-Distinctions_v1 #10"],"tags":["known-gap","d2.1","tool-descriptions"],"core":true,"rev":false},{"id":"d3-001","domain":"D3","type":"fact","front":"Name the four configuration levels Claude Code discovers, from user-wide down to path-scoped.","back":"User `~/.claude/CLAUDE.md`, project `CLAUDE.md` or `.claude/CLAUDE.md` at the repo root, directory-level `CLAUDE.md` in any subdirectory, and `.claude/rules/*.md` files with YAML frontmatter.","cites":["Domain-3_v2 §3.1","Official-Guide p.13"],"tags":["known-gap","d3.1","claude-md"],"core":true,"rev":false},{"id":"d3-002","domain":"D3","type":"trap","front":"A subdirectory holds its own `CLAUDE.md`. What happens to the repo-root `CLAUDE.md` while Claude works on files in that subdirectory?","back":"Both stay in play: discovered files are concatenated into context from the root down to the working directory, so the subdirectory file adds instructions rather than replacing any.","trap":"Exam trap: reading the hierarchy as override precedence, where the most specific file wins for its own directory.","cites":["Domain-3_v2 §3.1"],"tags":["known-gap","d3.1","claude-md"],"core":true,"rev":false},{"id":"d3-003","domain":"D3","type":"trap","front":"Three developers get a coding convention applied automatically and a fourth does not, working in the same repository. Where does that convention actually live?","back":"In the original developers' `~/.claude/CLAUDE.md`, which is per-user and never travels through version control. Moving it to the project-level config fixes it.","trap":"Exam trap: the shared repo makes user-level config look like project config, so the new machine reads as broken rather than unconfigured.","cites":["Domain-3_v2 §3.1","Key-Distinctions_v1 #1"],"tags":["known-gap","d3.1","claude-md"],"core":true,"rev":false},{"id":"d3-004","domain":"D3","type":"concept","front":"Which config location carries a standard to everyone who clones the repository, and which keeps it on one machine?","back":"Project-level `CLAUDE.md` or `.claude/CLAUDE.md` is checked in and reaches the whole team; `~/.claude/CLAUDE.md` stays with that one developer.","cites":["Domain-3_v2 §3.1","Key-Distinctions_v1 #1"],"tags":["known-gap","d3.1","claude-md"],"core":true,"rev":false},{"id":"d3-005","domain":"D3","type":"fact","front":"What is the maximum nesting depth for `@` imports inside a `CLAUDE.md`?","back":"Five levels.","cites":["Domain-3_v2 §3.1"],"tags":["claude-md","import"],"core":true,"rev":false},{"id":"d3-006","domain":"D3","type":"fact","front":"How is a reference to an external standards file written inside `CLAUDE.md`, and what does a relative path resolve against?","back":"`@` immediately before the path with no space, as in `@./standards/testing.md`; relative paths resolve against the file holding the import.","cites":["Domain-3_v2 §3.1","Official-Guide p.13"],"tags":["claude-md","import"],"core":false,"rev":false},{"id":"d3-007","domain":"D3","type":"concept","front":"Each package in a monorepo has its own standards. What keeps every package from loading one shared file containing all of them?","back":"Have each package's `CLAUDE.md` `@import` only the standards files its maintainers know apply, so the package pulls in a subset instead of everything.","cites":["Domain-3_v2 §3.1","Official-Guide p.13"],"tags":["known-gap","d3.1","import"],"core":true,"rev":false},{"id":"d3-008","domain":"D3","type":"concept","front":"Claude honours a convention in some sessions and skips it in others. What is the first diagnostic step?","back":"Run `/memory` to see which memory files are loaded in each session; the file holding that convention is usually missing from one of them.","trap":"Exam trap: restating the instruction more forcefully every session treats the symptom and leaves the discovery problem in place.","cites":["Domain-3_v2 §3.1","Official-Guide p.13"],"tags":["known-gap","d3.1","memory-command"],"core":true,"rev":false},{"id":"d3-009","domain":"D3","type":"fact","front":"Which two file locations both count as project-level configuration for one repository?","back":"`CLAUDE.md` at the project root and `.claude/CLAUDE.md`; either one is project scope and both are version-controlled.","cites":["Domain-3_v2 §3.1","Key-Distinctions_v1 #1"],"tags":["claude-md","paths"],"core":false,"rev":false},{"id":"d3-010","domain":"D3","type":"concept","front":"A CI step runs Claude Code from a package subdirectory that has its own `CLAUDE.md`. Which memory files reach that run?","back":"Every discovered file from the project root down to that working directory, concatenated, so repo-wide standards still arrive without being restated in the prompt.","cites":["Domain-3_v2 §3.1","Domain-3_v2 §3.8"],"tags":["known-gap","d3.6","ci"],"core":true,"rev":false},{"id":"d3-011","domain":"D3","type":"fact","front":"What triggers a file in `.claude/rules/` to load, and where is that trigger declared?","back":"A glob match against the file being worked on, declared in the rule file's YAML frontmatter `paths:` list.","cites":["Domain-3_v2 §3.2","Official-Guide p.14"],"tags":["rules","path-scoped"],"core":true,"rev":false},{"id":"d3-012","domain":"D3","type":"concept","front":"Conventions vary by file type and the matching files are spread across many directories. Which mechanism applies the right ones wherever you are working?","back":"`.claude/rules/` files with glob `paths:` patterns, since activation follows the path of the file being edited rather than the directory you started in.","trap":"Exam trap: a `CLAUDE.md` in every subdirectory looks equivalent and breaks down once matching files live in many directories.","cites":["Domain-3_v2 §3.2","Official-Guide p.14"],"tags":["rules","path-scoped"],"core":true,"rev":false},{"id":"d3-013","domain":"D3","type":"concept","front":"What does path-scoping a convention save compared with putting the same text in the root config?","back":"Context: the rule stays out of the window until a matching file is touched, so irrelevant conventions never cost tokens.","cites":["Domain-3_v2 §3.2"],"tags":["rules","context-cost"],"core":false,"rev":false},{"id":"d3-014","domain":"D3","type":"scenario","front":"You hold three pieces of guidance: a naming standard that always applies, a convention for `**/*.test.ts` files only, and a multi-step deploy procedure run once a fortnight. Where does each belong?","back":"The always-on standard in the root `CLAUDE.md`, the test-file convention in `.claude/rules/` with a glob, and the deploy procedure in a skill under `.claude/skills/`.","cites":["Domain-3_v2 §3.2","Key-Distinctions_v1 #3"],"tags":["rules","skills","claude-md"],"core":true,"rev":false},{"id":"d3-015","domain":"D3","type":"fact","front":"Name the four `SKILL.md` frontmatter options the corpus documents.","back":"`description`, `argument-hint`, `context: fork`, and `allowed-tools`.","cites":["Domain-3_v2 §3.3","Official-Guide p.13"],"tags":["skills","frontmatter"],"core":true,"rev":false},{"id":"d3-016","domain":"D3","type":"fact","front":"Which frontmatter key prompts a developer for a required parameter when they invoke a skill with no arguments?","back":"`argument-hint`, which is displayed at invocation time.","cites":["Domain-3_v2 §3.3","Official-Guide p.14"],"tags":["skills","frontmatter"],"core":false,"rev":false},{"id":"d3-017","domain":"D3","type":"trap","front":"A skill must be limited to safe file operations. Which frontmatter key does the exam guide expect, and what does it do?","back":"`allowed-tools` in the `SKILL.md` frontmatter, which restricts tool access during skill execution — for example `allowed-tools: [Write, Read]`.","trap":"Exam trap: `.mcp.json`, `CLAUDE.md`, and a `config.json` commands array all get offered as the place to scope a skill.","cites":["Domain-3_v2 §3.3","Official-Guide p.14"],"tags":["skills","allowed-tools"],"core":true,"rev":false},{"id":"d3-018","domain":"D3","type":"concept","front":"A codebase-analysis skill produces so much output that Claude loses track of the original task. Which frontmatter change fixes it?","back":"`context: fork`, which runs the skill in an isolated subagent context so its output stays out of the main conversation.","trap":"Exam trap: a faster model or a shorter summary both leave the output landing in the main window.","cites":["Domain-3_v2 §3.3","Key-Distinctions_v1 #13"],"tags":["skills","context-fork"],"core":true,"rev":false},{"id":"d3-019","domain":"D3","type":"concept","front":"Which categories of skill work belong in a forked context, and which belong in the main session?","back":"Discovery, analysis, exploration, and brainstorming fork; implementation, design, and conversation stay in the main session.","cites":["Key-Distinctions_v1 #13","Domain-3_v2 §3.3"],"tags":["skills","context-fork"],"core":false,"rev":false},{"id":"d3-020","domain":"D3","type":"fact","front":"What is the on-disk layout of a project skill called `commit`?","back":"`.claude/skills/commit/SKILL.md` — one directory per skill, each holding a `SKILL.md`.","cites":["Domain-3_v2 §3.3"],"tags":["skills","paths"],"core":false,"rev":false},{"id":"d3-021","domain":"D3","type":"scenario","front":"A migration skill needs to create files but nothing destructive, and it prints a long diff that would crowd the session. Which two frontmatter keys does it need?","back":"`allowed-tools` scoped to the file operations it actually needs, and `context: fork` so the diff stays in an isolated subagent context.","cites":["Domain-3_v2 §3.3","Official-Guide p.14"],"tags":["skills","frontmatter"],"core":false,"rev":false},{"id":"d3-022","domain":"D3","type":"fact","front":"Which two directories produce a `/name` slash command, and which of them ships with the repository?","back":"`.claude/commands/` in the repo, which is version-controlled and team-wide, and `~/.claude/commands/`, which is personal and not shared.","cites":["Domain-3_v2 §3.4","Official-Guide p.13"],"tags":["commands","paths"],"core":true,"rev":false},{"id":"d3-023","domain":"D3","type":"fact","front":"What holds the text a user types after a slash command's name?","back":"`$ARGUMENTS`, usable inside the command file.","cites":["Domain-3_v2 §3.4"],"tags":["commands","arguments"],"core":false,"rev":false},{"id":"d3-024","domain":"D3","type":"trap","front":"In current Claude Code, how do `.claude/commands/` and `.claude/skills/` relate?","back":"Both create a `/name` command; `.claude/commands/` is the legacy form and remains supported, and skills are the current one.","trap":"Exam trap: treating the older directory as removed. Both are live, so a repo can carry either.","cites":["Domain-3_v2 §3.4"],"tags":["commands","skills"],"core":false,"rev":false},{"id":"d3-025","domain":"D3","type":"trap","front":"A personal skill and a project skill both define `/commit`. Which definition runs?","back":"The personal one at `~/.claude/skills/commit/SKILL.md` overrides the project skill of the same name.","trap":"Exam trap: renaming the personal copy to `/my-commit` dodges the clash and gives up the command name the team already knows.","cites":["Domain-3_v2 §3.5","Key-Distinctions_v1 #4"],"tags":["skills","precedence"],"core":true,"rev":false},{"id":"d3-026","domain":"D3","type":"concept","front":"Why does the same-name personal override exist?","back":"It lets one developer customize a team command without forking it for everyone or adopting a second command name.","cites":["Domain-3_v2 §3.5","Key-Distinctions_v1 #4"],"tags":["skills","precedence"],"core":false,"rev":false},{"id":"d3-027","domain":"D3","type":"fact","front":"Which tools may Claude use while planning mode is active?","back":"Read, Grep, and Glob only — exploration and design with no side effects until the plan is approved.","cites":["Domain-3_v2 §3.6"],"tags":["plan-mode"],"core":false,"rev":false},{"id":"d3-028","domain":"D3","type":"concept","front":"Which four task properties call for planning mode?","back":"Large scope, architectural decisions, several viable approaches, and changes spanning many files.","cites":["Domain-3_v2 §3.6","Official-Guide p.14"],"tags":["plan-mode"],"core":true,"rev":false},{"id":"d3-029","domain":"D3","type":"trap","front":"What is wrong with beginning in direct execution and switching to planning mode once the task turns out to be complicated?","back":"By the time the switch happens the expensive rework has already started; a task with architectural implications gets planned before any code is touched.","trap":"Exam trap: reactive mode switching reads as pragmatic and is the documented wrong answer.","cites":["Domain-3_v2 §3.6"],"tags":["plan-mode"],"core":true,"rev":false},{"id":"d3-030","domain":"D3","type":"concept","front":"A single-file bug fix arrives with a clear stack trace. Which mode, and on what grounds?","back":"Direct execution: the scope is known and the approach is defined, so a planning round adds a step without lowering risk.","cites":["Domain-3_v2 §3.6","Official-Guide p.15"],"tags":["plan-mode","direct-execution"],"core":false,"rev":false},{"id":"d3-031","domain":"D3","type":"scenario","front":"A library migration touches more than 45 files, two migration paths are on the table, and the team wants work started today. Which mode, and what is the full sequence?","back":"Planning mode for investigation and design, then approval of the plan, then direct execution to implement it.","cites":["Domain-3_v2 §3.6","Official-Guide p.15"],"tags":["plan-mode"],"core":false,"rev":false},{"id":"d3-032","domain":"D3","type":"fact","front":"Name the four iterative-refinement techniques.","back":"The interview pattern, test-driven iteration, two or three concrete input/output examples, and batching interacting feedback into one message.","cites":["Domain-3_v2 §3.7","Official-Guide p.15"],"tags":["iterative-refinement"],"core":true,"rev":false},{"id":"d3-033","domain":"D3","type":"concept","front":"Three generated versions of a feature each miss a different requirement, in a domain the developer does not know well. Which technique restarts this correctly?","back":"The interview pattern: have Claude ask its questions before implementing, so the unstated requirements surface in one turn.","cites":["Domain-3_v2 §3.7","Official-Guide p.15"],"tags":["iterative-refinement","interview-pattern"],"core":true,"rev":false},{"id":"d3-034","domain":"D3","type":"trap","front":"What is the reply to the claim that having Claude interview you first wastes a turn?","back":"On an underspecified task, one interview turn replaces several correction cycles and surfaces requirements before there is code to rework.","trap":"Exam trap: 'generate first, correct after' sounds faster and is the documented misconception.","cites":["Domain-3_v2 §3.7"],"tags":["iterative-refinement","interview-pattern"],"core":true,"rev":false},{"id":"d3-035","domain":"D3","type":"concept","front":"Why is a test suite a better refinement signal than prose acceptance criteria?","back":"Tests are machine-checkable, so each round feeds Claude concrete failures instead of a restated description.","cites":["Domain-3_v2 §3.7","Official-Guide p.15"],"tags":["iterative-refinement","tdd"],"core":false,"rev":false},{"id":"d3-036","domain":"D3","type":"trap","front":"Tests written after generation, to check the result — where does that sit relative to test-driven iteration?","back":"That is verification. Test-driven iteration writes the suite first, so generation is anchored to the spec and every round has a concrete failure to work from.","trap":"Exam trap: both orders involve a test suite, and only tests-first is the named technique.","cites":["Domain-3_v2 §3.7"],"tags":["iterative-refinement","tdd"],"core":false,"rev":false},{"id":"d3-037","domain":"D3","type":"scenario","front":"A migration script mishandles null values. The developer keeps restating the bug in prose and each round produces a partial fix. What closes it fastest?","back":"One concrete failing case: a sample input row containing nulls plus the exact expected output, iterated until that test passes.","cites":["Domain-3_v2 §3.7","Official-Guide p.16"],"tags":["iterative-refinement","tdd"],"core":false,"rev":false},{"id":"d3-038","domain":"D3","type":"concept","front":"A prose-described data transformation returns a differently shaped result on each run. What fixes it, and how many are needed?","back":"Two or three concrete input/output example pairs, which show the format and the decision logic without ambiguity.","cites":["Domain-3_v2 §3.7","Official-Guide p.15"],"tags":["iterative-refinement","examples"],"core":true,"rev":false},{"id":"d3-039","domain":"D3","type":"trap","front":"What is the documented answer to the worry that example pairs make the model copy the samples instead of generalizing?","back":"Well-chosen examples demonstrate the pattern, and the model applies it to inputs the examples never showed.","trap":"Exam trap: the copying objection is offered as grounds for rejecting examples and lengthening the prose instead.","cites":["Domain-3_v2 §3.7"],"tags":["iterative-refinement","examples"],"core":false,"rev":false},{"id":"d3-040","domain":"D3","type":"concept","front":"A review turns up three problems: a locking bug, a retry bug whose fix depends on the locking design, and an unrelated typo in a log string. How do you send them?","back":"Locking and retry go together in one detailed message because their fixes interact; the typo can travel separately or ride along.","cites":["Domain-3_v2 §3.7","Official-Guide p.16"],"tags":["iterative-refinement","feedback-batching"],"core":false,"rev":false},{"id":"d3-041","domain":"D3","type":"trap","front":"When is 'one issue per message so Claude can focus' the wrong instruction?","back":"When the issues interact: fixing them separately lets one patch contradict the other and forces another round.","trap":"Exam trap: the one-at-a-time rule is correct for independent problems, which makes it look universal.","cites":["Domain-3_v2 §3.7"],"tags":["iterative-refinement","feedback-batching"],"core":true,"rev":false},{"id":"d3-042","domain":"D3","type":"trap","front":"Which flag runs Claude Code non-interactively so an automated pipeline does not stall?","back":"`-p` (or `--print`): it processes the prompt, prints the result to stdout, and exits.","trap":"Exam trap: `CLAUDE_HEADLESS=true` and `--batch` are both offered as options and neither exists.","cites":["Domain-3_v2 §3.8","Key-Distinctions_v1 #15"],"tags":["known-gap","d3.6","ci"],"core":true,"rev":false},{"id":"d3-043","domain":"D3","type":"concept","front":"What becomes of a CI job that calls `claude` with a prompt and leaves off `-p`?","back":"It waits for interactive input that never arrives, so the pipeline hangs.","cites":["Domain-3_v2 §3.8","Official-Guide p.16"],"tags":["known-gap","d3.6","ci"],"core":true,"rev":false},{"id":"d3-044","domain":"D3","type":"trap","front":"Which two commonly offered ways of making Claude Code unattended do not exist at all?","back":"`--batch` and `CLAUDE_HEADLESS=true`; neither is a real flag or environment variable.","trap":"Exam trap: both follow familiar CLI and environment-variable conventions, which is what makes them work as distractors.","cites":["Domain-3_v2 §3.8","Key-Distinctions_v1 #15"],"tags":["known-gap","d3.6","ci"],"core":true,"rev":false},{"id":"d3-045","domain":"D3","type":"trap","front":"Redirecting from `/dev/null` on stdin also stops the process waiting for input. Why is it still the wrong exam answer?","back":"It is a Unix workaround rather than the documented mechanism; `-p` is the supported way to run without interaction.","cites":["Domain-3_v2 §3.8","Key-Distinctions_v1 #15"],"tags":["known-gap","d3.6","ci"],"core":true,"rev":false},{"id":"d3-046","domain":"D3","type":"scenario","front":"A CI review posts near-duplicate comments on unchanged code every time the author pushes another commit. The findings themselves are accurate and the reviewer prompt has not changed. What goes into the re-run?","back":"The previous run's findings, with an instruction to report only new or still-unaddressed issues.","trap":"Exam trap: 'start each re-run from a blank slate so the review stays objective' is what produces the duplicates.","cites":["Domain-3_v2 §3.8","Official-Guide p.16"],"tags":["known-gap","d3.6","ci"],"core":true,"rev":false},{"id":"d3-047","domain":"D3","type":"trap","front":"Why should the session that generated a change not be the one that reviews it?","back":"It carries its own reasoning context and is less likely to challenge its own decisions; an independent instance reviews the change better.","trap":"Exam trap: the generating session holds the most context about the change, which makes reusing it look efficient.","cites":["Domain-3_v2 §3.8","Official-Guide p.16"],"tags":["known-gap","d3.6","session-isolation"],"core":true,"rev":false},{"id":"d3-048","domain":"D3","type":"concept","front":"How does a CI-invoked Claude Code learn the project's testing standards, fixture conventions, and review criteria?","back":"From `CLAUDE.md`, the documented mechanism for giving CI-invoked Claude project context; it raises test-generation quality and cuts low-value output.","cites":["Domain-3_v2 §3.8","Official-Guide p.16"],"tags":["ci","claude-md"],"core":false,"rev":false},{"id":"d3-049","domain":"D3","type":"concept","front":"What keeps CI-generated tests from proposing scenarios the suite already covers?","back":"Put the existing test files in context when generating.","cites":["Domain-3_v2 §3.8","Official-Guide p.16"],"tags":["ci","testing"],"core":false,"rev":false},{"id":"d3-050","domain":"D3","type":"fact","front":"Which CLI flag forces print-mode output into JSON?","back":"`--output-format json`.","cites":["Domain-3_v2 §3.9","Official-Guide p.16"],"tags":["known-gap","d3.6","structured-output"],"core":true,"rev":false},{"id":"d3-051","domain":"D3","type":"fact","front":"Which flag holds Claude Code's output to a schema you supply?","back":"`--json-schema`, pointed at a schema file, so downstream tools receive output they can parse.","cites":["Domain-3_v2 §3.9","Official-Guide p.16"],"tags":["known-gap","d3.6","structured-output"],"core":true,"rev":false},{"id":"d3-052","domain":"D3","type":"scenario","front":"A pipeline must post every review finding as an inline GitHub PR comment carrying file path, line number, severity, and suggested fix. What makes the output dependable enough for the GitHub API to parse?","back":"Print mode with `--output-format json` plus `--json-schema`, so every run returns the same validated shape.","trap":"Exam trap: an 'Output Format' section in `CLAUDE.md` or a formatting instruction in the prompt both give variable compliance.","cites":["Domain-3_v2 §3.9","Official-Guide p.16"],"tags":["known-gap","d3.6","structured-output"],"core":true,"rev":false},{"id":"d3-053","domain":"D3","type":"trap","front":"What does `--json-schema` guarantee that `--output-format json` on its own does not?","back":"That the fields match your schema. The format flag alone guarantees only that the output is JSON.","trap":"Exam trap: the two are used together, and only the schema flag constrains what sits inside the JSON.","cites":["Domain-3_v2 §3.9"],"tags":["known-gap","d3.6","structured-output"],"core":true,"rev":false},{"id":"d3-054","domain":"D3","type":"fact","front":"What are the Message Batches API's cost and latency terms?","back":"50% cost savings against synchronous, with results taking up to 24 hours and no SLA.","cites":["Domain-3_v2 §3.10","Key-Distinctions_v1 #14"],"tags":["batch-api"],"core":true,"rev":true},{"id":"d3-055","domain":"D3","type":"scenario","front":"An automated review fetches related files through tool calls partway through its analysis, then keeps reasoning with what came back. Which API does it have to run on, and why?","back":"The synchronous API: a batch request cannot execute a tool mid-request and hand the result back to Claude inside that same request.","cites":["Domain-3_v2 §3.10","Key-Distinctions_v1 #14"],"tags":["batch-api"],"core":true,"rev":false},{"id":"d3-056","domain":"D3","type":"concept","front":"Which automated workloads belong on the Batch API, and which have to stay synchronous?","back":"Scheduled non-blocking work — overnight tech-debt reports, nightly test generation, weekly audits — goes to batch; blocking pre-merge checks stay synchronous because developers are waiting.","cites":["Domain-3_v2 §3.10"],"tags":["batch-api","ci"],"core":false,"rev":false},{"id":"d3-057","domain":"D3","type":"scenario","front":"A `CLAUDE.md` has grown past 400 lines, mixing coding standards with a PR checklist, deploy instructions, and migration procedures. What is the recommended reorganization?","back":"Keep the universal standards in `CLAUDE.md` and move each workflow — PR review, deploy, migrations — into a skill with trigger keywords.","trap":"Exam trap: moving everything into skills leaves the universal standards needing explicit invocation every session.","cites":["Domain-3_v2 §3.11","Official-Guide p.14"],"tags":["claude-md","skills"],"core":true,"rev":false},{"id":"d3-058","domain":"D3","type":"concept","front":"A 500-line `CLAUDE.md` is hard to read, and every line is a standing convention rather than a workflow. What is the supported way to break it up?","back":"Split it into one topic file per subject under `.claude/rules/` — `testing.md`, `api-conventions.md`, `deployment.md`.","cites":["Domain-3_v2 §3.11","Official-Guide p.13"],"tags":["claude-md","rules"],"core":false,"rev":false},{"id":"d3-059","domain":"D3","type":"concept","front":"Content must stay in every session's context but live in a separate file. Rules directory or `@import`?","back":"`@import`: the imported file remains part of the concatenated `CLAUDE.md` context, while a `.claude/rules/` file loads only on a path match.","cites":["Domain-3_v2 §3.11","Domain-3_v2 §3.1"],"tags":["claude-md","import","rules"],"core":false,"rev":false},{"id":"d3-060","domain":"D3","type":"fact","front":"What does `--resume` do, and what does `fork_session` do?","back":"`--resume` reopens a previous named session with its saved context; `fork_session` branches the current one, so both copies share context to the branch point and then diverge.","cites":["Domain-3_v2 §3.12"],"tags":["sessions"],"core":true,"rev":false},{"id":"d3-061","domain":"D3","type":"concept","front":"What can `/compact` cost you?","back":"Exact numeric values, dates, and specific details, which summarization can drop while keeping the gist.","cites":["Domain-3_v2 §3.12"],"tags":["sessions","compact"],"core":false,"rev":false},{"id":"d3-062","domain":"D3","type":"concept","front":"When is starting a fresh session better than resuming an old one?","back":"When its tool results are stale because the files have changed, or the context has degraded; restart with a short summary of the prior findings.","cites":["Domain-3_v2 §3.12"],"tags":["sessions"],"core":false,"rev":false},{"id":"d3-063","domain":"D3","type":"scenario","front":"A multi-phase task opens with a discovery sweep whose tool output would fill the window before implementation starts, and the implementation still needs those findings. What preserves the main session?","back":"Run discovery through the Explore subagent: the verbose output stays isolated and only a summary returns to the main session.","trap":"Exam trap: `/compact` mid-task drops the precision the implementation phase depends on.","cites":["Domain-3_v2 §3.12","Key-Distinctions_v1 #22"],"tags":["sessions","subagent"],"core":true,"rev":false},{"id":"d3-065","domain":"D3","type":"trap","front":"What triggers loading for CLAUDE.md, for a file under `.claude/rules/`, and for a skill?","back":"CLAUDE.md loads every session. A rules file loads when the file being worked on matches its glob. A skill loads when the user invokes it by name.","trap":"Exam trap: all three hold project guidance, so the deciding line is when each one enters context rather than what it can contain.","cites":["Key-Distinctions_v1 #3","Domain-3_v2 §3.2"],"tags":["claude-md","rules","skills"],"core":true,"rev":false},{"id":"d3-066","domain":"D3","type":"trap","front":"A long deploy-and-rollback procedure needed a few days a quarter sits in CLAUDE.md and loads on every session. Where does it belong?","back":"In a skill under `.claude/skills/`, invoked on demand, while CLAUDE.md keeps the standards that apply to every task.","trap":"Exam trap: `.claude/rules/` is path-scoped, which fits file-type conventions and not an occasion-based workflow tied to no glob.","cites":["Domain-3_v2 §3.11","Key-Distinctions_v1 #3"],"tags":["claude-md","skills","organization"],"core":true,"rev":false},{"id":"d3-068","domain":"D3","type":"trap","front":"A developer wants their own version of the team's `/commit` without changing it for anyone else. What do they create?","back":"A personal skill at `~/.claude/skills/commit/SKILL.md`, deliberately keeping the same command name.","trap":"Exam trap: naming it `/my-commit` sidesteps the collision and gives up the familiar command the whole team already types.","cites":["Key-Distinctions_v1 #4","Domain-3_v2 §3.5"],"tags":["skills","precedence"],"core":true,"rev":false},{"id":"d3-069","domain":"D3","type":"trap","front":"What does `context: fork` in SKILL.md frontmatter change about where a skill's output lands?","back":"The skill runs in an isolated subagent context, so its output stays out of the main conversation.","trap":"Exam trap: a faster model and a compressed summary are offered as fixes for context pollution. One changes speed, the other discards the analysis.","cites":["Key-Distinctions_v1 #13","Domain-3_v2 §3.3"],"tags":["skills","context-isolation"],"core":true,"rev":false},{"id":"d3-071","domain":"D3","type":"trap","front":"Of `CLAUDE_HEADLESS=true`, `--batch`, and redirecting stdin from `/dev/null`, which one does anything at all?","back":"Only the stdin redirect, and it is an undocumented Unix workaround. `-p` is the documented non-interactive mode and it prints to stdout as well.","trap":"Exam trap: two fabricated options plus one real-but-unsanctioned workaround sit beside the documented flag in the same question.","cites":["Key-Distinctions_v1 #15","Domain-3_v2 §3.8"],"tags":["known-gap","d3.6","ci"],"core":true,"rev":false},{"id":"d3-080","domain":"D3","type":"trap","front":"Claude keeps skipping a convention, so a developer restates it more forcefully in every prompt. What does that leave unchecked?","back":"Whether the file holding that convention is in the session's loaded memory set at all. `/memory` lists what is loaded.","trap":"(delete the `trap` field — d3-008 already carries this misconception)","cites":["Domain-3_v2 §3.1"],"tags":["known-gap","d3.1","memory"],"core":true,"rev":false},{"id":"d3-082","domain":"D3","type":"trap","front":"Which review findings get bundled into one feedback message, and which go one at a time?","back":"Interacting issues go together, so a single coherent change can address them. Independent issues go separately, one per message.","trap":"Exam trap: the one-issue-per-message rule is genuinely right for independent fixes and produces contradictory patches for interdependent ones.","cites":["Domain-3_v2 §3.7"],"tags":["iterative-refinement","feedback"],"core":false,"rev":false},{"id":"d4-001","domain":"D4","type":"concept","front":"A prompt's format requirements are already explicit and the output is still inconsistent. What do you add instead of refining the wording further?","back":"3-4 few-shot examples showing the exact required format, such as identified issue, location in code, and concrete fix.","cites":["Domain-4_v2 §4.1"],"tags":["few-shot","output-format"],"core":true,"rev":false},{"id":"d4-002","domain":"D4","type":"trap","front":"You fix an agent that misroutes only ambiguous requests by adding 12 examples of clear, unambiguous ones. Why does accuracy not move?","back":"Examples only help on the cases they cover; the corpus aims 4-6 examples at exactly the ambiguous cases.","trap":"Exam trap: example count reads as effort, and placement is what decides whether they help.","cites":["Domain-4_v2 §4.1"],"tags":["few-shot","tool-selection"],"core":true,"rev":false},{"id":"d4-003","domain":"D4","type":"concept","front":"Besides inconsistent output format, name the three decisions few-shot examples are the documented first-choice fix for.","back":"Ambiguous tool selection and escalation calibration.","cites":["Domain-4_v2 §4.1"],"tags":["few-shot"],"core":false,"rev":false},{"id":"d4-004","domain":"D4","type":"concept","front":"What must accompany each few-shot example written to fix ambiguous tool routing?","back":"The rationale for why that tool was chosen over the alternatives.","cites":["Domain-4_v2 §4.1"],"tags":["few-shot","tool-selection"],"core":false,"rev":false},{"id":"d4-005","domain":"D4","type":"fact","front":"Which four task shapes call for a step-by-step reasoning cue?","back":"Multi-step mathematical reasoning, multi-stage analysis, comparison across N items, and step-wise transformation.","cites":["Domain-4_v2 §4.2"],"tags":["chain-of-thought"],"core":false,"rev":false},{"id":"d4-006","domain":"D4","type":"trap","front":"A prompt translates one sentence into French. Why does adding 'Think step by step before answering' not belong here?","back":"Reasoning cues pay off on multi-step tasks; a single-step task gains nothing from one.","trap":"Exam trap: a reasoning cue reads as free accuracy, so it gets attached to tasks with no steps to reason through.","cites":["Domain-4_v2 §4.2"],"tags":["chain-of-thought"],"core":false,"rev":false},{"id":"d4-007","domain":"D4","type":"concept","front":"Tone, reasoning transparency, and a rule about asking clarifying questions all have to hold for an entire conversation. Where do they belong?","back":"The system prompt.","cites":["Domain-4_v2 §4.3"],"tags":["system-prompt"],"core":true,"rev":false},{"id":"d4-008","domain":"D4","type":"trap","front":"Why is the first user message the wrong home for persistent behavioral constraints?","back":"Its authority fades as the conversation moves on; the system prompt keeps the constraints in force on every turn.","trap":"Exam trap: the first user message and the first assistant message both look like valid places to set behavior, and the model can drift from either.","cites":["Domain-4_v2 §4.3"],"tags":["system-prompt"],"core":false,"rev":false},{"id":"d4-009","domain":"D4","type":"trap","front":"An option proposes setting response-format requirements through environment variables. Why does it fail?","back":"Environment variables reach the application, never the model; format requirements belong in the system prompt.","trap":"Exam trap: an infrastructure-flavored option sounds operationally clean while touching nothing the model reads.","cites":["Domain-4_v2 §4.3"],"tags":["system-prompt"],"core":false,"rev":false},{"id":"d4-010","domain":"D4","type":"concept","front":"What is prefilling in the Messages API?","back":"Including the opening of an assistant message in the request so Claude continues from it rather than composing a reply from scratch.","cites":["Domain-4_v2 §4.4"],"tags":["prefill"],"core":true,"rev":false},{"id":"d4-011","domain":"D4","type":"scenario","front":"Users report that the assistant opens nearly every reply with 'Certainly!' or 'I'd be happy to help!'. A system-prompt instruction to stop has already been tried. Which technique removes the openings?","back":"Prefilling: append a partial assistant message that starts the direct response, and Claude continues from it.","trap":"Exam trap: lowering temperature controls randomness rather than a specific phrase, and stripping greetings afterwards is a fragile patch.","cites":["Domain-4_v2 §4.4"],"tags":["prefill"],"core":false,"rev":false},{"id":"d4-012","domain":"D4","type":"scenario","front":"A webhook fires mid-session: the customer's package has shipped, and the next reply should reflect it without restarting the conversation. How do you inject that fact?","back":"Prefix the next user message with the status update, for example 'Your package has shipped. Now: [user message]'.","trap":"Exam trap: rebuilding the system prompt means rebuilding the session, and a synthetic user message breaks the dialogue flow.","cites":["Domain-4_v2 §4.4"],"tags":["prefill","context-injection"],"core":false,"rev":false},{"id":"d4-013","domain":"D4","type":"concept","front":"A source field is genuinely absent from some documents. How should the extraction schema treat it?","back":"Leave it out of `required` and make it nullable, so the model can return `null` instead of inventing a value.","cites":["Domain-4_v2 §4.5"],"tags":["schema-design","fabrication"],"core":true,"rev":false},{"id":"d4-014","domain":"D4","type":"trap","front":"A team marks every field `required` and non-nullable so that output is always complete. What does that actually produce?","back":"Fabricated values: a required field pressures the model to fill it whether or not the source contains the data.","trap":"Exam trap: completeness by fabrication reads as data quality until someone checks the values against the source.","cites":["Domain-4_v2 §4.5"],"tags":["schema-design","fabrication"],"core":true,"rev":false},{"id":"d4-015","domain":"D4","type":"concept","front":"A category field has a known value set today, but new categories keep appearing in the source data. What schema shape survives that?","back":"An `enum` carrying an `other` member plus a companion `detail` field for the unmatched case.","cites":["Domain-4_v2 §4.5"],"tags":["schema-design","enum"],"core":true,"rev":false},{"id":"d4-016","domain":"D4","type":"concept","front":"The model cannot confidently place a document in any category. What schema affordance keeps the output honest?","back":"An `unclear` member in the enum: an honest `unclear` beats a confident wrong category.","cites":["Domain-4_v2 §4.5"],"tags":["schema-design","enum"],"core":false,"rev":false},{"id":"d4-017","domain":"D4","type":"concept","front":"Source documents carry inconsistent date and currency formats, and the output schema is already strict. What does the design still need?","back":"Format normalization rules in the prompt: the schema fixes the output shape, the prompt governs how messy inputs map into it.","cites":["Domain-4_v2 §4.5"],"tags":["schema-design","normalization"],"core":false,"rev":false},{"id":"d4-018","domain":"D4","type":"trap","front":"A pipeline must receive schema-valid JSON on every call. Why does `tool_choice: {\"type\": \"auto\"}` fail that requirement?","back":"`auto` lets the model reply in free text instead of calling a tool, so some responses carry no `tool_use` block at all.","trap":"Exam trap: `auto` is the default, so a configuration nobody changed quietly provides no structure guarantee.","cites":["Domain-4_v2 §4.6"],"tags":["known-gap","d4.5","tool-choice"],"core":true,"rev":false},{"id":"d4-019","domain":"D4","type":"concept","front":"Three extraction tools are defined and the incoming document type is unknown. Which `tool_choice` setting guarantees structure without you picking the tool?","back":"`{\"type\": \"any\"}`: the model must call one of the defined tools and picks the best fit, so the output is always structured.","cites":["Domain-4_v2 §4.6"],"tags":["known-gap","d4.5","tool-choice"],"core":true,"rev":false},{"id":"d4-020","domain":"D4","type":"trap","front":"An enrichment step keeps running before metadata extraction has produced output. Why is `tool_choice: {\"type\": \"any\"}` the wrong correction?","back":"`any` only guarantees that some tool is called; pin the specific one with `{\"type\": \"tool\", \"name\": \"extract_metadata\"}` on the first request.","trap":"Exam trap: `any` and a named tool both feel like forcing, and only the named form decides which tool runs.","cites":["Domain-4_v2 §4.6","Domain-2_v2 §2.5"],"tags":["known-gap","d4.5","tool-choice"],"core":true,"rev":false},{"id":"d4-021","domain":"D4","type":"concept","front":"You define a tool purely to shape output and force it with `tool_choice`. Where does the extracted data live in the response?","back":"In the `input` object of the `tool_use` content block; the tool never has to execute anything.","cites":["Domain-4_v2 §4.6","Domain-2_v2 §2.1"],"tags":["known-gap","d4.5","structured-output"],"core":true,"rev":false},{"id":"d4-022","domain":"D4","type":"concept","front":"A forced tool call comes back and the conversation is meant to continue. What `stop_reason` is on that response, and what must the next request append?","back":"`stop_reason` is `tool_use`; the next request appends a `tool_result` block carrying the same `id` as the `tool_use` block it answers.","cites":["Domain-2_v2 §2.1","Domain-4_v2 §4.6"],"tags":["known-gap","d4.5","tool-use-loop"],"core":true,"rev":false},{"id":"d4-023","domain":"D4","type":"trap","front":"A team gets JSON by writing 'respond only with valid JSON matching this schema' into the prompt. Which failure modes remain?","back":"Prose preambles, markdown fences, and malformed JSON: a prompt request carries no enforcement, while a tool input schema does.","trap":"Exam trap: the instruction is explicit and polite, and the model may or may not honor it on any given call.","cites":["Domain-4_v2 §4.6"],"tags":["structured-output","json"],"core":true,"rev":false},{"id":"d4-024","domain":"D4","type":"concept","front":"A strict tool input schema is in place. What does it guarantee about the response, and what stays outside its reach?","back":"It guarantees syntactically valid, schema-shaped JSON; the values inside can still be semantically wrong.","cites":["Domain-4_v2 §4.6","Domain-4_v2 §4.7"],"tags":["known-gap","d4.5","structured-output"],"core":true,"rev":false},{"id":"d4-025","domain":"D4","type":"fact","front":"Which `tool_choice` settings guarantee that the response contains a tool call?","back":"`{\"type\": \"any\"}` and `{\"type\": \"tool\", \"name\": \"...\"}`; `{\"type\": \"auto\"}` guarantees nothing.","cites":["Domain-4_v2 §4.6"],"tags":["known-gap","d4.5","tool-choice"],"core":true,"rev":false},{"id":"d4-026","domain":"D4","type":"trap","front":"Free-text responses are being repaired with a JSON repair library before the pipeline can use them. What does the corpus prescribe instead?","back":"Define a tool whose input schema is the desired output structure and read the `tool_use` block, so the syntax errors stop being produced.","trap":"Exam trap: a repair library treats the symptom, and tool use removes the problem at the source.","cites":["Domain-4_v2 §4.6"],"tags":["structured-output"],"core":true,"rev":false},{"id":"d4-027","domain":"D4","type":"concept","front":"What separates a syntax error from a semantic error in an extraction pipeline?","back":"Syntax errors violate the schema: malformed JSON, wrong field type, missing required field. Semantic errors are schema-valid JSON with wrong content.","cites":["Domain-4_v2 §4.7"],"tags":["validation","error-classes"],"core":true,"rev":false},{"id":"d4-028","domain":"D4","type":"concept","front":"A JSON Schema or Pydantic validator runs on every extraction. Which error class does it catch completely, and which passes through untouched?","back":"It catches the syntax class deterministically; semantic errors pass by definition, since the JSON is valid and only the content is wrong.","cites":["Domain-4_v2 §4.7"],"tags":["validation","error-classes"],"core":false,"rev":false},{"id":"d4-029","domain":"D4","type":"scenario","front":"An extraction pipeline moved to `tool_use` with strict schemas. JSON parse failures went to zero, and downstream reconciliation still reports invoice totals that disagree with the line items. What is the correct reading of that result?","back":"Expected behavior: the schemas removed the syntax class, and what remains is semantic, needing business-rule validation and feedback loops.","cites":["Domain-4_v2 §4.7"],"tags":["validation","error-classes"],"core":true,"rev":false},{"id":"d4-030","domain":"D4","type":"trap","front":"Totals keep disagreeing with line items under a strict extraction schema. Why is 'tighten the schema further' the wrong response?","back":"No schema constraint can verify that numbers sum correctly; summing is a business rule checked in code.","trap":"Exam trap: tightening the schema is the reflex move when the schema is already doing everything a schema can do.","cites":["Domain-4_v2 §4.7"],"tags":["validation","semantic-errors"],"core":false,"rev":false},{"id":"d4-031","domain":"D4","type":"trap","front":"After semantic errors persist, a team reverts from `tool_use` back to prompt-based JSON. What does that cost them?","back":"The syntax error class returns on top of the semantic one they still have.","trap":"Exam trap: reverting feels like undoing a change that did not work; the change did work, on a different class of error.","cites":["Domain-4_v2 §4.7"],"tags":["validation","error-classes"],"core":false,"rev":false},{"id":"d4-032","domain":"D4","type":"concept","front":"Where does the validation layer sit relative to the model call?","back":"In your code, after the JSON arrives; model output is never consumed unvalidated.","cites":["Domain-4_v2 §4.8"],"tags":["validation"],"core":false,"rev":false},{"id":"d4-033","domain":"D4","type":"concept","front":"A team hand-maintains the tool's JSON Schema and a separate validation class, and the two keep drifting apart. What is the architectural fix?","back":"Generate the tool's JSON Schema from the Pydantic model, so one definition drives both the tool contract and post-hoc validation.","trap":"Exam trap: adding a code-review checklist item is a process patch offered for an architecture problem.","cites":["Domain-4_v2 §4.8"],"tags":["validation","pydantic"],"core":true,"rev":false},{"id":"d4-034","domain":"D4","type":"trap","front":"`tool_use` already enforces the schema at generation time. What work is left for a code validator?","back":"Business rules no JSON Schema can express, such as `sum(line_items) == total` and `start_date < end_date`, plus defense in depth for whatever consumes the data.","trap":"Exam trap: 'the schema already enforces it, so validating again is redundant' is the documented misconception.","cites":["Domain-4_v2 §4.8"],"tags":["validation","pydantic"],"core":true,"rev":false},{"id":"d4-035","domain":"D4","type":"fact","front":"What three things does a retry request carry after an extraction fails validation?","back":"The original document, the previous failed extraction, and the specific validation error.","cites":["Domain-4_v2 §4.9"],"tags":["retry-feedback"],"core":true,"rev":false},{"id":"d4-036","domain":"D4","type":"fact","front":"A retry prompt says only 'that was invalid, please try again.' What is missing?","back":"The specific validation error, for example: field `total` = 150 but the line items sum to 145.","cites":["Domain-4_v2 §4.9"],"tags":["retry-feedback"],"core":true,"rev":false},{"id":"d4-037","domain":"D4","type":"fact","front":"Which three failure kinds does retry-with-feedback actually fix?","back":"Format errors, structural errors such as a value in the wrong field, and arithmetic inconsistencies the model can re-derive.","cites":["Domain-4_v2 §4.9"],"tags":["retry-feedback"],"core":false,"rev":false},{"id":"d4-038","domain":"D4","type":"concept","front":"When does retry-with-feedback never converge, no matter how precise the error message is?","back":"When the information is absent from the source document, or the needed context lives in a document that was never provided.","cites":["Domain-4_v2 §4.9"],"tags":["retry-feedback","limits"],"core":true,"rev":false},{"id":"d4-039","domain":"D4","type":"scenario","front":"Extraction of `purchase_order_number` fails validation on 40 documents. Investigation shows those 40 never contained a PO number in the first place. What is the fix?","back":"Make the field nullable, accept `null`, and stop retrying; the pipeline should treat 'not found' as a legitimate answer.","cites":["Domain-4_v2 §4.9","Domain-4_v2 §4.5"],"tags":["retry-feedback","schema-design"],"core":true,"rev":false},{"id":"d4-040","domain":"D4","type":"scenario","front":"Validation keeps failing on documents that lack the field entirely, and the team raises max retries from 3 to 10. What is the result?","back":"Absent information stays absent; the extra attempts burn tokens and increase the pressure to fabricate a value.","trap":"Exam trap: retry-count tuning and a stronger feedback message are both loop fixes offered for a schema-design problem.","cites":["Domain-4_v2 §4.9"],"tags":["retry-feedback","limits"],"core":true,"rev":false},{"id":"d4-041","domain":"D4","type":"concept","front":"What field do you add to structured findings so repeated failures can be analyzed by cause instead of one at a time?","back":"`detected_pattern`, naming which construct triggered the finding, so dismissals and validation failures can be grouped and counted.","cites":["Domain-4_v2 §4.9"],"tags":["detected-pattern","findings"],"core":false,"rev":false},{"id":"d4-042","domain":"D4","type":"fact","front":"What bounds the retry-with-feedback loop so it cannot run forever?","back":"A max-retry limit: the loop repeats until the extraction validates or that cap is reached.","cites":["Domain-4_v2 §4.9"],"tags":["retry-feedback"],"core":false,"rev":false},{"id":"d4-043","domain":"D4","type":"fact","front":"Name the three fields of the stated-versus-calculated self-correction pattern.","back":"`stated_total` as written in the document, `calculated_total` re-derived from the line items, and a `conflict_detected` boolean.","cites":["Domain-4_v2 §4.10"],"tags":["self-correction"],"core":true,"rev":false},{"id":"d4-044","domain":"D4","type":"trap","front":"Where does the exam's self-correction check live, and what does it emit?","back":"In the output schema itself: the model re-derives the value beside the claimed one and sets a conflict boolean on every extraction.","trap":"Exam trap: asking the model 'are you sure?' after it answers looks like self-correction and is optional, conversational, and unlogged.","cites":["Domain-4_v2 §4.10"],"tags":["self-correction"],"core":true,"rev":false},{"id":"d4-045","domain":"D4","type":"scenario","front":"An invoice pipeline occasionally reports totals that do not match the line items, and the mismatch only surfaces weeks later in monthly reconciliation. What moves detection to extraction time?","back":"Extract `calculated_total` alongside `stated_total` with a `conflict_detected` flag, and route flagged records for handling as they are extracted.","cites":["Domain-4_v2 §4.10"],"tags":["self-correction"],"core":false,"rev":false},{"id":"d4-046","domain":"D4","type":"fact","front":"What discount and what processing window does the Message Batches API give?","back":"50% off synchronous pricing, with a processing window of up to 24 hours.","cites":["Domain-4_v2 §4.11"],"tags":["batch-api"],"core":true,"rev":true},{"id":"d4-047","domain":"D4","type":"trap","front":"A deadline plan assumes batches usually finish within an hour. What is wrong with that basis?","back":"The Batch API offers no latency guarantee; only the 24-hour worst case is dependable.","trap":"Exam trap: observed typical latency reads as a guarantee, and one batch that takes 23 hours blows the deadline.","cites":["Domain-4_v2 §4.11"],"tags":["batch-api","sla"],"core":true,"rev":false},{"id":"d4-048","domain":"D4","type":"fact","front":"Results are needed 30 hours from now and the work will run as a batch. What is the latest submission time?","back":"6 hours from now: the submission deadline is the downstream deadline minus the full 24-hour window.","cites":["Domain-4_v2 §4.11"],"tags":["batch-api","sla"],"core":true,"rev":false},{"id":"d4-049","domain":"D4","type":"fact","front":"Batch results can arrive in any order. What makes the join back to the original inputs correct?","back":"A meaningful, unique `custom_id` on every request; submission order is never a valid join key.","cites":["Domain-4_v2 §4.11"],"tags":["batch-api","custom-id"],"core":true,"rev":false},{"id":"d4-050","domain":"D4","type":"scenario","front":"A batch of 100 documents returns 95 successes and 5 failures on context limits. A teammate proposes re-submitting all 100. What is wrong with that?","back":"You pay again for the 95 successes and risk duplicate downstream results; re-submit only the 5, identified by `custom_id`.","cites":["Domain-4_v2 §4.11"],"tags":["batch-api","custom-id"],"core":true,"rev":false},{"id":"d4-051","domain":"D4","type":"concept","front":"The 5 failed items in a batch are identified by `custom_id`. Why not re-submit them unchanged?","back":"They failed for a reason; change the approach first, for example chunking documents that exceeded the context limit.","cites":["Domain-4_v2 §4.11"],"tags":["batch-api"],"core":false,"rev":false},{"id":"d4-052","domain":"D4","type":"concept","front":"Before committing 10,000 documents to a batch, what should be done first?","back":"Run the extraction prompt synchronously on a small representative sample and refine until the sample passes validation, then submit the volume.","cites":["Domain-4_v2 §4.11"],"tags":["batch-api","sample-first"],"core":false,"rev":false},{"id":"d4-053","domain":"D4","type":"scenario","front":"A pre-merge pull-request check is moved to the Batch API to capture the 50% saving. Why is that the wrong call?","back":"A developer is blocked on the result and batch carries no latency guarantee; blocking work stays synchronous.","trap":"Exam trap: the 50% saving applies to any workload, and latency tolerance is what decides which API fits.","cites":["Domain-4_v2 §4.11"],"tags":["batch-api","sync-vs-batch"],"core":true,"rev":false},{"id":"d4-054","domain":"D4","type":"trap","front":"A batch request defines tools and the response comes back with a `tool_use` block. Why can your client not answer it and continue inside that same batch item?","back":"Each batch request is self-contained and completes with that response; continuing the loop needs a follow-up request carrying the tool result.","trap":"Exam trap: 'the Batch API does not support tools' is false. What it lacks is multi-turn tool calling within a single request.","cites":["Domain-4_v2 §4.11"],"tags":["known-gap","d4.5","batch-api"],"core":true,"rev":false},{"id":"d4-055","domain":"D4","type":"concept","front":"A single review pass over a 14-file pull request produces deep comments on some files, shallow ones elsewhere, and contradictory verdicts on the same pattern. What is the root cause?","back":"Attention dilution from processing many items in one pass.","cites":["Domain-4_v2 §4.12"],"tags":["multi-pass","review"],"core":false,"rev":false},{"id":"d4-056","domain":"D4","type":"trap","front":"Review quality degrades across a large pull request. Why does switching to a model with a bigger context window not fix it?","back":"Attention quality is the failing dimension and it persists at any window size; split into per-file passes plus a separate integration pass.","trap":"Exam trap: a bigger context window is the reflex answer whenever the input is many files.","cites":["Domain-4_v2 §4.12"],"tags":["multi-pass","review"],"core":true,"rev":false},{"id":"d4-057","domain":"D4","type":"concept","front":"Why does a model reviewing code it just generated miss its own bugs?","back":"It still carries the generation reasoning in context and stays anchored to the decisions it already made.","cites":["Domain-4_v2 §4.13"],"tags":["independent-review"],"core":true,"rev":false},{"id":"d4-058","domain":"D4","type":"scenario","front":"The generator's prompt already ends with 'review your own code thoroughly before finishing,' and bugs still reach production. What is the architectural fix?","back":"Send the artifact to a second Claude instance that never sees the generator's reasoning, carrying only the code and the review criteria.","trap":"Exam trap: a same-conversation second pass and extended thinking both add effort by the same anchored instance.","cites":["Domain-4_v2 §4.13"],"tags":["independent-review"],"core":true,"rev":false},{"id":"d4-059","domain":"D4","type":"concept","front":"In a verification pass, what should the reviewing model report alongside each finding?","back":"Its own confidence, so routing can differ: high-confidence findings auto-comment, low-confidence findings go to human review.","cites":["Domain-4_v2 §4.13"],"tags":["independent-review","confidence"],"core":false,"rev":false},{"id":"d4-060","domain":"D4","type":"concept","front":"What is prompt chaining?","back":"Breaking a complex task into sequential focused prompts where each step's output feeds the next, for example identify issues, then generate fixes.","cites":["Domain-4_v2 §4.14"],"tags":["prompt-chaining"],"core":false,"rev":false},{"id":"d4-061","domain":"D4","type":"scenario","front":"An agent escalates simple photo-proven replacements but handles complex policy exceptions on its own. First-contact resolution sits at 55% against an 80% target. What is the fix?","back":"Add explicit escalation criteria to the system prompt with few-shot examples separating the simple cases from the complex ones.","trap":"Exam trap: a self-confidence score with a routing threshold, or a separate classifier, both add infrastructure over decision boundaries that stay unclear.","cites":["Domain-4_v2 §4.15"],"tags":["escalation"],"core":false,"rev":false},{"id":"d4-062","domain":"D4","type":"concept","front":"A code review keeps flagging correct comments because the instruction reads 'check that comments are accurate.' What replaces it?","back":"A testable criterion: flag a comment only when the behavior it claims contradicts the code's actual behavior.","cites":["Domain-4_v2 §4.16"],"tags":["instruction-specificity"],"core":false,"rev":false},{"id":"d4-063","domain":"D4","type":"scenario","front":"False-positive rates on an automated review: style 52%, documentation 48%, performance 18%, security 8%. Developers now dismiss every finding, accurate ones included. What restores trust fastest?","back":"Temporarily disable the high-false-positive categories and keep the high-precision ones running while the noisy prompts are fixed.","trap":"Exam trap: showing confidence scores still shows every finding, and cutting strictness uniformly damages the accurate categories.","cites":["Domain-4_v2 §4.17"],"tags":["trust","false-positives"],"core":true,"rev":false},{"id":"d4-064","domain":"D4","type":"concept","front":"A test-generation tool proposes 10 cases for a pull request and 6 of them duplicate tests that already exist. What is the fix?","back":"Put the existing test file in context; duplicates can only be avoided against tests the model can actually see.","trap":"Exam trap: asking for fewer cases assumes the tool orders by priority, and keyword post-processing misses semantic duplicates.","cites":["Domain-4_v2 §4.18"],"tags":["deduplication","context"],"core":false,"rev":false},{"id":"d4-065","domain":"D4","type":"trap","front":"A user sends a vague request. Why is replying with four clarifying questions the wrong move?","back":"It drives 35-40% abandonment; state the assumptions explicitly, proceed, and invite corrections.","trap":"Exam trap: bundling the questions into one message still puts the work on the user, and hidden defaults leave them unaware of what was assumed.","cites":["Domain-4_v2 §4.19"],"tags":["clarification"],"core":true,"rev":false},{"id":"d4-066","domain":"D4","type":"concept","front":"A persona-driven assistant drifts to generic advice by turn 7, and the whole conversation is only 2,500 tokens. What is the root cause?","back":"Accumulated assistant responses dilute the system prompt's influence, and the model increasingly pattern-matches its own prior output.","trap":"Exam trap: 2,500 tokens rules out context-window overflow, which is the option that reads as the obvious cause.","cites":["Domain-4_v2 §4.20"],"tags":["behavioral-drift","system-prompt"],"core":true,"rev":false},{"id":"d4-067","domain":"D4","type":"concept","front":"A 2,800-token tutor system prompt written as abstract rules stops honoring proficiency levels after 12 turns. What is the documented fix?","back":"Replace the verbose rules with few-shot examples demonstrating proficiency-level adaptation.","trap":"Exam trap: injecting a reminder every 4-5 turns treats the symptom and leaves the abstract rules in place.","cites":["Domain-4_v2 §4.20","Domain-4_v2 §4.1"],"tags":["behavioral-drift","few-shot"],"core":true,"rev":false},{"id":"d4-070","domain":"D4","type":"trap","front":"If d4-069 is killed, keep as-is. If d4-069 is kept instead, kill this one — three cards on one Key Distinction is quota waste.","back":"The rule is already stated and already being followed inconsistently. The missing piece is a concrete pattern, which examples supply.","trap":"Exam trap: lowering temperature is offered alongside; it moves randomness rather than which structure the model settles on.","cites":["Domain-4_v2 §4.1","Key-Distinctions_v1 #16"],"tags":["few-shot","prompt-engineering"],"core":true,"rev":false},{"id":"d4-071","domain":"D4","type":"trap","front":"A single-pass review of a 14-file PR goes deep on some files and shallow on others. What is the architectural fix?","back":"Trim d4-056's back to 'Attention quality is the failing dimension and it persists at any window size.' and leave the per-file-plus-integration fix to this card.","trap":"Exam trap: a larger context window is offered and changes nothing about attention quality -- more tokens available is not more attention per token.","cites":["Key-Distinctions_v1 #17","Domain-4_v2 §4.12"],"tags":["multi-pass","attention-dilution"],"core":true,"rev":false},{"id":"d4-073","domain":"D4","type":"trap","front":"Misrouting happens on a narrow band of ambiguous requests. How many examples do you add, and of what?","back":"Four to six examples aimed at exactly those ambiguous cases, each carrying the rationale for the tool chosen.","trap":"Exam trap: ten to fifteen clear-cut examples per tool cover the requests the agent already handles correctly.","cites":["Key-Distinctions_v1 #18","Domain-4_v2 §4.1"],"tags":["few-shot","tool-selection"],"core":true,"rev":false},{"id":"d4-076","domain":"D4","type":"trap","front":"Why is quietly picking a sensible default worse than naming the default you picked?","back":"The user has no way to tell what was assumed, so a mismatch only surfaces after the work has been delivered.","trap":"Exam trap: a hidden default produces a fast, confident-looking answer and is rejected alongside over-questioning.","cites":["Domain-4_v2 §4.19","Key-Distinctions_v1 #19"],"tags":["clarification","assumptions"],"core":true,"rev":false},{"id":"d5-001","domain":"D5","type":"scenario","front":"A user says in turn 1 that he loves jazz. Two turns later the assistant asks him what genres he enjoys. The conversation is only three turns long. What is the root cause?","back":"The application is not putting the earlier turns into the `messages` array on each call, so nothing from turn 1 reaches the model.","trap":"Exam trap: a three-turn conversation cannot have exceeded the context window, so that option is there to catch a guess.","cites":["Domain-5_v2 §5.1"],"tags":["stateless-api","conversation-memory"],"core":true,"rev":false},{"id":"d5-002","domain":"D5","type":"trap","front":"A design adds a `session_id` parameter so Claude can hold the thread on the server. What is wrong with it?","back":"There is no such parameter — the API keeps no state, so the application resends the whole history in `messages` on every call.","trap":"Exam trap: `session_id` is invented; it reads like a real API field because nearly every chat product has one.","cites":["Domain-5_v2 §5.1"],"tags":["stateless-api","api-mechanics"],"core":true,"rev":false},{"id":"d5-003","domain":"D5","type":"trap","front":"A team proposes a vector database so the agent can recall what the customer said earlier in the same chat. What does that misread?","back":"Within one conversation, recall comes from resending the `messages` array; retrieval infrastructure addresses long-horizon history across sessions, not the core API's turn-to-turn behavior.","trap":"Exam trap: adding retrieval is the over-engineered answer to a plain resend-the-history defect.","cites":["Domain-5_v2 §5.1","Domain-5_v2 §5.7"],"tags":["stateless-api","over-engineering"],"core":true,"rev":false},{"id":"d5-004","domain":"D5","type":"concept","front":"Latency and cost rise steadily as a support conversation passes 50 turns. What explains the curve?","back":"Every call carries the entire history, so the input token count grows with each added turn.","trap":"Exam trap: 'the model writes longer replies' and 'the database is slowing down' are the plausible wrong causes.","cites":["Domain-5_v2 §5.1"],"tags":["stateless-api","cost"],"core":true,"rev":false},{"id":"d5-005","domain":"D5","type":"fact","front":"Which request field carries the conversation history Claude can see?","back":"The `messages` array — the full history is resent on every call.","cites":["Domain-5_v2 §5.1"],"tags":["stateless-api"],"core":true,"rev":true},{"id":"d5-006","domain":"D5","type":"concept","front":"Across a long input, where does Claude's attention hold up and where does it thin out?","back":"It holds at the beginning and the end of the input and degrades through the middle.","cites":["Domain-5_v2 §5.2"],"tags":["known-gap","d5.1","lost-in-the-middle"],"core":true,"rev":false},{"id":"d5-007","domain":"D5","type":"trap","front":"Findings buried mid-input keep getting missed. Why does moving to a model with a larger context window fail to solve it?","back":"Capacity and attention are separate properties: a wider window admits more tokens without making mid-input content any more salient.","trap":"Exam trap: window size is a storage answer to a positioning problem, and it raises cost while the miss rate stays.","cites":["Key-Distinctions_v1 #17","Domain-5_v2 §5.2"],"tags":["known-gap","d5.1","lost-in-the-middle"],"core":true,"rev":false},{"id":"d5-009","domain":"D5","type":"trap","front":"To be fair to every subagent, a coordinator rotates which one's output appears first in each synthesis run. What does rotation fail to change?","back":"The underlying attention pattern — whatever lands in the middle is still read less reliably, so the loss moves rather than disappears.","trap":"Exam trap: rotation spreads the damage evenly instead of removing it.","cites":["Domain-5_v2 §5.2"],"tags":["known-gap","d5.1","lost-in-the-middle"],"core":true,"rev":false},{"id":"d5-011","domain":"D5","type":"concept","front":"Upstream agents hand the synthesis step 155K tokens of page content and reasoning traces, and it works well only under 50K. What is the root-cause fix?","back":"Change what the upstream agents return: key facts, quotes, and relevance scores as structured data instead of verbose content.","trap":"Exam trap: bolting on an intermediate summarization agent adds latency and one more failure point without fixing the source.","cites":["Domain-5_v2 §5.2"],"tags":["known-gap","d5.1","upstream-design"],"core":true,"rev":false},{"id":"d5-012","domain":"D5","type":"scenario","front":"A 40-minute cooking session has reached 78K tokens. It contains stated allergies, scaled quantities, terms clarified along the way, and a lot of general chatter. How should the history be reduced?","back":"Pull the exact values into a structured block, summarize the general discussion, and keep the recent exchanges verbatim.","cites":["Domain-5_v2 §5.3"],"tags":["context-window","hybrid-compression"],"core":true,"rev":false},{"id":"d5-013","domain":"D5","type":"trap","front":"Why is 'keep only the most recent 20K tokens' unsafe for a long cooking assistant session?","back":"Constraints stated early, such as allergies, fall outside the retained window and vanish from the prompt.","trap":"Exam trap: recency trimming is cheap and silently drops the earliest and often most binding facts.","cites":["Domain-5_v2 §5.3"],"tags":["context-window","sliding-window"],"core":false,"rev":false},{"id":"d5-015","domain":"D5","type":"trap","front":"A team stops losing discount amounts by rewriting the summarizer prompt to always keep numbers. Why is that weaker than a facts block?","back":"It depends on the summarizer behaving correctly every single time, while a facts block is never summarized at all.","trap":"Exam trap: a better summarizer prompt is the tempting fix because it targets the right symptom and needs no new structure.","cites":["Domain-5_v2 §5.4"],"tags":["case-facts","summarization"],"core":true,"rev":false},{"id":"d5-016","domain":"D5","type":"concept","front":"What does '15% discount agreed earlier' typically become after progressive summarization?","back":"A vague reference such as 'promotional pricing was discussed' — the exact figure does not survive compression.","cites":["Domain-5_v2 §5.4","Domain-5_v2 §5.3"],"tags":["summarization","precision-loss"],"core":false,"rev":false},{"id":"d5-017","domain":"D5","type":"fact","front":"Which hook event trims a tool result to the fields that matter before it lands in context?","back":"`PostToolUse` — it filters the result after the tool runs and before the output accumulates in the conversation.","cites":["Domain-5_v2 §5.5"],"tags":["tool-output","hooks"],"core":true,"rev":false},{"id":"d5-018","domain":"D5","type":"trap","front":"A system prompt tells the model to ignore the irrelevant fields in a 40-field tool result. What does that fail to save?","back":"The tokens — the whole result still enters context and keeps competing for attention on every later turn.","trap":"Exam trap: instructing the model changes what it attends to, not what the window holds.","cites":["Domain-5_v2 §5.5"],"tags":["tool-output","context-window"],"core":true,"rev":false},{"id":"d5-019","domain":"D5","type":"concept","front":"Why does one verbose tool result cost more than a single turn's worth of tokens?","back":"It stays in the history and is resent on every following turn, so its cost repeats for the rest of the session.","cites":["Domain-5_v2 §5.5","Domain-5_v2 §5.1"],"tags":["tool-output","cost"],"core":false,"rev":false},{"id":"d5-020","domain":"D5","type":"scenario","front":"You are adding error-handling wrappers across a 120-file codebase in three phases. Phase 1 discovery floods the main context window before it finishes, leaving nothing for design and implementation. What structure fixes it?","back":"Run discovery in an Explore subagent so the verbose output stays in its context; it returns a summary and phases 2 and 3 continue in the main conversation.","trap":"Exam trap: splitting the work across several sessions with `--continue` adds coordination overhead and consistency risk.","cites":["Domain-5_v2 §5.6"],"tags":["subagents","context-isolation"],"core":true,"rev":false},{"id":"d5-023","domain":"D5","type":"concept","front":"Why does progressive summarization fail a question that needs a conclusion quoted from months earlier?","back":"Summarization turns specific conclusions into abstractions, so the exact exchange can no longer be recovered.","trap":"Exam trap: XML tags marking conclusions do not solve retrieval at this scale either.","cites":["Domain-5_v2 §5.7"],"tags":["long-term-memory","summarization"],"core":false,"rev":false},{"id":"d5-024","domain":"D5","type":"concept","front":"Which class of signal should decide when a support agent escalates to a human?","back":"Structural signals: an explicit request for a person, a policy gap, missing or unresolvable data, repeated tool failures, or a financial operation above a threshold.","cites":["Domain-5_v2 §5.8"],"tags":["escalation"],"core":true,"rev":false},{"id":"d5-025","domain":"D5","type":"trap","front":"Why does sentiment analysis make a poor escalation trigger?","back":"Mood does not track case complexity — a calm message can describe a hard case and an angry one can be trivial to close.","trap":"Exam trap: sentiment-driven escalation floods the human queue with cases the agent could have resolved.","cites":["Domain-5_v2 §5.8"],"tags":["escalation","anti-pattern"],"core":true,"rev":false},{"id":"d5-026","domain":"D5","type":"trap","front":"A design escalates whenever the model rates its own confidence below 7 out of 10. What is the flaw?","back":"Self-reported confidence is uncalibrated, so it does not track real difficulty — the model can be
