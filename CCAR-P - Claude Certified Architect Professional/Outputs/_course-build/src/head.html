<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F2F5F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1820" media="(prefers-color-scheme: dark)">
<title>CCAR-P syllabus course</title>
<script>
(function () {
  var r = document.documentElement, t = null;
  try { t = (JSON.parse(localStorage.getItem('ccarp-course:v1') || '{}')).theme || null; } catch (e) {}
  var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
  if (!t && mq && mq.matches) t = 'dark';
  if (t) r.setAttribute('data-theme', t);
})();
</script>
<style>
/*FONTS*/
:root {
  color-scheme: light;
  --film: #F2F5F4; --sheet: #FBFCFB; --ink: #16212B; --graphite: #55616D;
  --rule: #CBD3D8; --rule-strong: #8C98A3;
  --blue: #1F5AA6; --blue-ink: #174A8C; --blue-tint: #E4EDF8; --on-blue: #FFFFFF;
  --red: #C2362C; --red-ink: #A12A21; --red-tint: #FBEBE9; --on-red: #FFFFFF;
  --yellow: #E9B949; --yellow-tint: #FBF1D2;
  --d1: #3A5F9A; --d2: #1B7C7A; --d3: #9C6B0E; --d4: #6B4E9B; --d5: #3F7D3C; --d6: #A8426F; --d7: #5A6773;
  --d1i: #2B4A7E; --d2i: #135F5D; --d3i: #7A5208; --d4i: #553B80; --d5i: #2F6330; --d6i: #8A3358; --d7i: #444F59;
  --font-label: "Barlow SC Course", Bahnschrift, "DIN Alternate", "Arial Narrow", system-ui, sans-serif;
  --font-prose: "Literata Course", Constantia, Charter, Georgia, serif;
  --font-mono: Consolas, "Cascadia Mono", ui-monospace, monospace;
  --grid: rgba(140, 152, 163, .22);
}
[data-theme="dark"] {
  color-scheme: dark;
  --film: #0F1820; --sheet: #141F29; --ink: #E6EDF2; --graphite: #A3B2BF;
  --rule: #2B3A47; --rule-strong: #52626F;
  --blue: #7DB2F0; --blue-ink: #9CC4F5; --blue-tint: #16283C; --on-blue: #0F1820;
  --red: #FF8A7A; --red-ink: #FFA698; --red-tint: #34201F; --on-red: #0F1820;
  --yellow: #F2C85B; --yellow-tint: #3A3216;
  --d1: #86A9E0; --d2: #5FC2BE; --d3: #E0B050; --d4: #AE95E0; --d5: #86C682; --d6: #E58BB2; --d7: #A9B7C4;
  --d1i: #86A9E0; --d2i: #5FC2BE; --d3i: #E0B050; --d4i: #AE95E0; --d5i: #86C682; --d6i: #E58BB2; --d7i: #A9B7C4;
  --grid: rgba(82, 98, 111, .28);
}
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 100%; -webkit-text-size-adjust: 100%; scroll-behavior: auto; }
body { margin: 0; background: var(--film); color: var(--ink); font-family: var(--font-prose); font-size: 1.125rem; line-height: 1.62; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }
[id] { scroll-margin-top: 76px; }
a { color: var(--blue-ink); text-underline-offset: 2px; }
a:hover { color: var(--ink); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
::selection { background: var(--yellow); color: #16212B; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 100; background: var(--ink); color: var(--film); padding: 8px 14px; font: 600 1rem var(--font-label); }
.skip:focus { top: 8px; }
button { font: inherit; color: inherit; }

/* ---------- domain context ---------- */
.page[data-dom="1"] { --dc: var(--d1); --dci: var(--d1i); --dh: url(#h-d1); }
.page[data-dom="2"] { --dc: var(--d2); --dci: var(--d2i); --dh: url(#h-d2); }
.page[data-dom="3"] { --dc: var(--d3); --dci: var(--d3i); --dh: url(#h-d3); }
.page[data-dom="4"] { --dc: var(--d4); --dci: var(--d4i); --dh: url(#h-d4); }
.page[data-dom="5"] { --dc: var(--d5); --dci: var(--d5i); --dh: url(#h-d5); }
.page[data-dom="6"] { --dc: var(--d6); --dci: var(--d6i); --dh: url(#h-d6); }
.page[data-dom="7"] { --dc: var(--d7); --dci: var(--d7i); --dh: url(#h-d7); }
.page { --dc: var(--blue); --dci: var(--blue-ink); }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 40; height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 18px; background: var(--film); border-bottom: 1.5px solid var(--ink); }
.brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); white-space: nowrap; }
.brand svg { width: 22px; height: 22px; flex: none; }
.brand b { font: 600 1.2rem/1 var(--font-label); letter-spacing: .02em; }
.brand small { font: 500 .9rem/1 var(--font-label); color: var(--graphite); }
.tabs { display: flex; gap: 2px; margin: 0 auto; padding: 0; list-style: none; }
.tabs a { position: relative; display: block; padding: 9px 12px 12px; font: 600 1rem/1 var(--font-label); color: var(--graphite); text-decoration: none; }
.tabs a::after { content: ""; position: absolute; left: 12px; bottom: 4px; height: 3px; width: calc((100% - 24px) * var(--w)); background: var(--dc); opacity: .6; }
.tabs a:hover { color: var(--ink); background: var(--yellow-tint); }
.tabs a[aria-current="true"] { color: var(--ink); }
.tabs a[aria-current="true"]::after { opacity: 1; height: 4px; }
.tools { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.tabs + .tools { margin-left: 0; }
.prog { display: flex; align-items: center; gap: 8px; margin-right: 8px; font: 600 .9rem/1 var(--font-label); color: var(--graphite); white-space: nowrap; }
.prog i { display: block; width: 64px; height: 6px; border: 1px solid var(--ink); position: relative; }
.prog i::after { content: ""; position: absolute; inset: 0; width: var(--p, 0%); background: var(--blue); }
.ic { width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; color: var(--ink); cursor: pointer; }
.ic:hover { background: var(--yellow-tint); border-color: var(--ink); }
.ic svg { width: 20px; height: 20px; }
.ic .moon { display: none; }
[data-theme="dark"] .ic .sun { display: none; }
[data-theme="dark"] .ic .moon { display: block; }

/* ---------- sheet ---------- */
main { display: block; padding: 28px 18px 72px; }
.page { display: none; }
.page.on, html:not(.js) .page { display: block; }
html:not(.js) .page { margin-bottom: 40px; }
.sheet { max-width: 1180px; margin: 0 auto; background: var(--sheet); border: 2px solid var(--ink); position: relative; }
.sheet::before { content: ""; position: absolute; inset: 6px; border: 1px solid var(--rule-strong); pointer-events: none; }
.sheet-in { position: relative; padding: 44px 54px 36px; }
.page[data-written="0"] .sheet { border-style: dashed; }

.head { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 44px; align-items: start; padding-bottom: 28px; margin-bottom: 34px; border-bottom: 2px solid var(--ink); }
.head.solo { grid-template-columns: minmax(0, 1fr); }
.head h1 { margin: 0; font: 600 clamp(1.85rem, 3vw, 2.6rem)/1.1 var(--font-label); letter-spacing: -.003em; text-wrap: balance; }
.head h1.xl { font-size: clamp(2.4rem, 5.4vw, 4rem); line-height: 1.02; letter-spacing: -.012em; }
.head .lede { margin: 14px 0 0; max-width: 40rem; font-size: 1.2rem; line-height: 1.5; color: var(--graphite); }

.tb { margin: 0; border: 1.5px solid var(--ink); display: grid; grid-template-columns: 1fr 1fr; font-family: var(--font-label); background: var(--sheet); }
.tb > div { padding: 8px 12px 9px; border-bottom: 1px solid var(--rule-strong); border-right: 1px solid var(--rule-strong); min-width: 0; }
.tb > div:nth-child(2n) { border-right: 0; }
.tb > .wide { grid-column: 1 / -1; border-right: 0; }
.tb > :last-child { border-bottom: 0; }
.tb dt { margin: 0; font-size: .78rem; color: var(--graphite); line-height: 1.2; }
.tb dd { margin: 3px 0 0; font-size: 1.15rem; font-weight: 600; line-height: 1.15; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tb dd .sw { width: 22px; height: 22px; flex: none; border: 1px solid var(--dci); }
.tb dd.dn { font-size: 1rem; line-height: 1.25; }
.tb dd.dn a { color: var(--ink); text-decoration: none; border-bottom: 1.5px solid var(--dc); }
.tb dd.dn a:hover { background: var(--yellow-tint); }
.tb dd.secs a { color: var(--ink); text-decoration: none; border-bottom: 1.5px solid var(--dc); }
.tb dd.secs a:hover { background: var(--yellow-tint); }
.readbtn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 2px 0; background: transparent; border: 0; cursor: pointer; font: 600 1rem/1.2 var(--font-label); text-align: left; }
.readbtn .bx { width: 18px; height: 18px; border: 1.8px solid var(--ink); display: inline-flex; align-items: center; justify-content: center; flex: none; background: var(--sheet); }
.readbtn .bx svg { width: 14px; height: 14px; opacity: 0; }
.readbtn[aria-pressed="true"] .bx { background: var(--blue); border-color: var(--blue); }
.readbtn[aria-pressed="true"] .bx svg { opacity: 1; stroke: var(--on-blue); }

/* ---------- chapter layout ---------- */
.chapter { display: grid; grid-template-columns: minmax(0, 38.5rem) minmax(0, 300px); column-gap: 56px; align-items: start; }
.chapter > .main { grid-column: 1; min-width: 0; }
.chapter > aside.remember { grid-column: 2; grid-row: 1; position: sticky; top: 72px; max-height: calc(100vh - 92px); overflow: auto; }
.wide-col { max-width: 54rem; }

.main p, .wide-col p { margin: 0 0 1.05em; max-width: 66ch; }
.main > p:first-child { font-size: 1.22rem; line-height: 1.56; }
.main h2, .wide-col h2 { margin: 3rem 0 .8rem; font: 600 1.6rem/1.15 var(--font-label); }
.main code, .wide-col code, .tbl code { font-family: var(--font-mono); font-size: .86em; background: var(--blue-tint); padding: .04em .32em; border-radius: 2px; }
dfn { font-style: normal; font-weight: 600; border-bottom: 2px solid var(--yellow); }
em { font-style: italic; }
strong, b { font-weight: 600; }
.num { font-variant-numeric: tabular-nums lining-nums; }
.lbl { margin-right: .4em; font: 600 .85rem/1 var(--font-label); color: var(--graphite); }
.muted { color: var(--graphite); }
.small { font-size: .9375rem; line-height: 1.5; }

/* concept block */
.concept { margin: 0 0 3.2rem; padding-left: 22px; border-left: 3px solid var(--dc); }
.concept > h3 { display: flex; align-items: baseline; gap: 14px; margin: 0 0 .7rem; font: 600 1.5rem/1.15 var(--font-label); }
.concept > h3 .sec { margin-left: auto; padding: 1px 8px; border: 1px solid var(--rule-strong); border-radius: 2px; font-size: .8125rem; font-weight: 500; color: var(--graphite); white-space: nowrap; }
.rules { list-style: none; margin: 1.3rem 0 0; padding: 0; border-top: 1.5px solid var(--ink); font-size: 1rem; line-height: 1.5; }
.rules li { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 22px; padding: 11px 0; border-bottom: 1px solid var(--rule); }
.rules li.rh { padding: 6px 0; font: 600 .8125rem/1.2 var(--font-label); color: var(--graphite); border-bottom: 1px solid var(--rule-strong); }
.rules .when { color: var(--graphite); }
.rules .then { color: var(--ink); }
.rules .why { display: block; margin-top: 3px; font-size: .9rem; color: var(--graphite); }

/* remember (margin) */
aside.remember { background: var(--blue-tint); border: 1px solid var(--blue); border-left-width: 5px; padding: 14px 16px 4px; font-size: .92rem; line-height: 1.45; }
aside.remember h2 { margin: 0 0 .7rem; font: 600 1.1rem/1.1 var(--font-label); color: var(--blue-ink); }
aside.remember ol { margin: 0; padding-left: 1.3em; }
aside.remember li { margin: 0 0 .6em; padding-left: .15em; }

/* exam block */
.bites { margin: 3.4rem 0 0; border: 1.5px solid var(--red); background: var(--red-tint); padding: 22px 24px 8px; }
.bites > h2 { margin: 0 0 .7rem; color: var(--red-ink); font: 600 1.45rem/1.15 var(--font-label); }
.bites p { max-width: none; }
.bites > p { font-size: 1.02rem; line-height: 1.55; }
.stem { margin: 0 0 1rem; padding: 12px 16px; background: var(--sheet); border-left: 4px solid var(--ink); font-size: 1rem; line-height: 1.5; }
.opts { list-style: none; margin: 0 0 1.2rem; padding: 0; font-size: 1rem; line-height: 1.5; }
.opts li { display: grid; grid-template-columns: 5.6rem 1fr; gap: 14px; padding: 10px 0; border-top: 1px solid var(--rule-strong); }
.mark { align-self: start; text-align: center; padding: 2px 6px 3px; font: 600 .8125rem/1.25 var(--font-label); border-radius: 2px; }
.opts .ok .mark { background: var(--blue); color: var(--on-blue); }
.opts .no .mark { background: var(--red); color: var(--on-red); }
.fam { display: inline-block; margin-right: 6px; padding: 0 6px; border: 1px solid var(--red); color: var(--red-ink); font: 600 .75rem/1.5 var(--font-label); text-decoration: none; border-radius: 2px; background: var(--sheet); }
.fam:hover { background: var(--red); color: var(--on-red); }

/* reveal + folds */
details.say { margin: 2.6rem 0 0; border: 1.5px solid var(--ink); background: var(--sheet); }
details.say > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: baseline; font: 500 1.05rem/1.4 var(--font-prose); }
details.say > summary::-webkit-details-marker { display: none; }
details.say > summary b { padding: 1px 9px 2px; background: var(--yellow); color: #16212B; font: 600 .9rem/1.4 var(--font-label); }
details.say[open] > summary { border-bottom: 1.5px solid var(--ink); }
details.say .ans { padding: 14px 18px 4px; }
details.say .ans p { max-width: none; }
details.deeper { margin: 1.5rem 0; padding-left: 16px; border-left: 3px solid var(--rule-strong); }
details.deeper > summary { cursor: pointer; font: 600 1.02rem/1.3 var(--font-label); color: var(--blue-ink); list-style: none; }
details.deeper > summary::-webkit-details-marker { display: none; }
details.deeper > summary::before { content: "+"; display: inline-block; width: 1.1em; font-weight: 600; }
details.deeper[open] > summary::before { content: "\2212"; }
details.deeper > div { padding-top: .6rem; }
.xlinks { margin: 3rem 0 0; padding-top: 14px; border-top: 1.5px solid var(--ink); }
.xlinks h2 { margin: 0 0 .5rem; font: 600 1.15rem/1.2 var(--font-label); }
.xlinks ul { margin: 0; padding: 0; list-style: none; font-size: 1rem; line-height: 1.5; }
.xlinks li { margin: 0 0 .55em; padding-left: 1.1em; position: relative; }
.xlinks li::before { content: ""; position: absolute; left: 0; top: .62em; width: .55em; height: 2px; background: var(--dc); }
.src { margin: 2.2rem 0 0; font: 500 .85rem/1.45 var(--font-label); color: var(--graphite); }
.src b { font-weight: 600; color: var(--ink); }
.endmark { height: 1px; }

/* callouts + tables */
.note { margin: 0 0 1.6rem; padding: 12px 16px; border: 1px solid var(--rule-strong); border-left: 5px solid var(--yellow); background: var(--yellow-tint); font-size: .98rem; line-height: 1.5; }
.note p { margin: 0 0 .5em; max-width: none; }
.note p:last-child { margin: 0; }
.note.red { border-left-color: var(--red); background: var(--red-tint); }
.note.blue { border-left-color: var(--blue); background: var(--blue-tint); }
.tbl { width: 100%; border-collapse: collapse; margin: 0 0 1.6rem; font-size: 1rem; line-height: 1.45; }
.tbl th { text-align: left; padding: 7px 12px 7px 0; border-bottom: 1.5px solid var(--ink); font: 600 .85rem/1.2 var(--font-label); color: var(--graphite); }
.tbl td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.tbl td:first-child { font-weight: 600; width: 32%; }

/* figures */
figure.fig { margin: 1.7rem 0 1.9rem; padding: 12px 12px 10px; border: 1px solid var(--rule-strong); background-color: var(--film); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 22px 22px; }
figure.fig .scroll { overflow-x: auto; }
figure.fig svg { display: block; width: 100%; height: auto; min-width: 560px; }
figure.fig figcaption { margin-top: 8px; font: 500 .875rem/1.4 var(--font-label); color: var(--graphite); max-width: 60ch; }
.sv text { font-family: var(--font-label); font-size: 13px; fill: var(--ink); }
.sv .s { fill: var(--graphite); font-size: 12px; }
.sv .b { font-weight: 600; }
.sv .h { font-size: 15px; font-weight: 600; }
.sv .m { font-size: 12px; }
.sv .big { font-size: 22px; font-weight: 600; }
.sv .tb2 { fill: var(--blue-ink); }
.sv .tr { fill: var(--red-ink); }
.sv .tc { text-anchor: middle; }
.sv .te { text-anchor: end; }
.sv .ln { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.sv .ls { stroke: var(--rule-strong); stroke-width: 1; fill: none; }
.sv .lb { stroke: var(--blue); stroke-width: 2; fill: none; }
.sv .lr { stroke: var(--red); stroke-width: 2; fill: none; }
.sv .dash { stroke-dasharray: 5 4; }
.sv .bx { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.5; }
.sv .bb { fill: var(--blue-tint); stroke: var(--blue); stroke-width: 1.5; }
.sv .br { fill: var(--red-tint); stroke: var(--red); stroke-width: 1.5; }
.sv .by { fill: var(--yellow-tint); stroke: var(--ink); stroke-width: 1.2; }
.sv .fl { fill: var(--film); stroke: var(--rule-strong); stroke-width: 1; }
.sv .pl { fill: var(--film); stroke: none; }
.sv .fi { fill: var(--ink); }
.sv .fb { fill: var(--blue); }
.sv .fr { fill: var(--red); }
.sv .fy { fill: var(--yellow); }
.sv .hatch { fill: var(--dh); opacity: .5; }

/* pager */
.pager { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: stretch; margin-top: 52px; padding-top: 20px; border-top: 2px solid var(--ink); }
.pager a { display: block; padding: 10px 14px; border: 1.5px solid var(--ink); background: var(--sheet); color: var(--ink); text-decoration: none; font: 600 1.02rem/1.25 var(--font-label); }
.pager a small { display: block; margin-bottom: 2px; font-weight: 500; font-size: .8rem; color: var(--graphite); }
.pager a:hover { background: var(--yellow-tint); }
.pager .nx { text-align: right; }
.pager .mid { display: flex; align-items: center; }
.pager .gap { visibility: hidden; }

/* ---------- start page ---------- */
.hero-meta { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 18px 0 0; padding: 0; list-style: none; font: 600 1rem/1.3 var(--font-label); }
.hero-meta li span { color: var(--graphite); font-weight: 500; }
.planwrap { margin: 6px 0 0; }
.fp { display: block; width: 100%; height: auto; }
.fp .wall { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: square; }
.fp .wall.in { stroke-width: 3.5; }
.fp .gapfill { stroke: var(--sheet); stroke-width: 7; fill: none; }
.fp .leaf { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.fp .rm .bg { fill: var(--sheet); }
.fp .rm .hatch { fill: var(--dh); opacity: .3; transition: opacity .15s; }
.fp .rm:hover .hatch, .fp .rm:focus-visible .hatch { opacity: .62; }
.fp .rm:focus-visible { outline: none; }
.fp .rm:focus-visible .bg { stroke: var(--blue); stroke-width: 4; }
.fp .code { font: 600 21px var(--font-label); fill: var(--dci); }
.fp .nm { font: 600 15px var(--font-label); fill: var(--ink); }
.fp .wt { font: 600 38px var(--font-label); fill: var(--ink); }
.fp .sub { font: 500 12.5px var(--font-label); fill: var(--graphite); }
.fp .pip { fill: var(--sheet); stroke: var(--graphite); stroke-width: 1.4; stroke-dasharray: 3 2; }
.fp .pip.w { stroke: var(--ink); stroke-dasharray: none; }
.fp .pip.r { fill: var(--dc); stroke: var(--dci); stroke-dasharray: none; }
.fp .dim { stroke: var(--graphite); stroke-width: 1; fill: none; }
.fp .dimt { font: 500 12px var(--font-label); fill: var(--graphite); }
.fp .plate { fill: var(--sheet); opacity: .82; }
.fp-draw .wall { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.3s ease-out .1s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.dom-list { display: none; list-style: none; margin: 0; padding: 0; }
.dom-list li { margin: 0 0 10px; }
.dom-list a { display: grid; grid-template-columns: 2.6rem 1fr auto; gap: 10px; align-items: baseline; padding: 10px 12px; border: 1.5px solid var(--ink); background: var(--sheet); color: var(--ink); text-decoration: none; font: 600 1.05rem/1.2 var(--font-label); }
.dom-list a span:last-child { font-size: 1.3rem; }
.legend { margin: 14px 0 0; font: 500 .9rem/1.45 var(--font-label); color: var(--graphite); max-width: 62rem; }
.doors { margin: 12px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 28px; font-size: .95rem; line-height: 1.45; }
.doors li { padding-left: 14px; position: relative; }
.doors li::before { content: ""; position: absolute; left: 0; top: .5em; width: 8px; height: 8px; border: 1.5px solid var(--ink); border-radius: 0 8px 0 0; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 48px; }
.cols2 p { max-width: none; }
.cont { display: none; }
.cont.on { display: block; }

/* objective list on domain pages */
.objlist { list-style: none; margin: 0 0 2rem; padding: 0; border-top: 1.5px solid var(--ink); }
.objlist li { border-bottom: 1px solid var(--rule); }
.objlist a { display: grid; grid-template-columns: 3.4rem 1fr auto; gap: 14px; align-items: baseline; padding: 11px 6px; text-decoration: none; color: var(--ink); font-size: 1.02rem; line-height: 1.4; }
.objlist a:hover { background: var(--yellow-tint); }
.objlist .oid { font: 600 1.05rem var(--font-label); color: var(--dci); }
.objlist .st { font: 500 .8125rem var(--font-label); color: var(--graphite); white-space: nowrap; }
.objlist .st.on { color: var(--blue-ink); font-weight: 600; }

/* plan */
.planform { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end; margin: 0 0 1.4rem; }
.planform label { display: block; font: 600 .85rem/1.2 var(--font-label); color: var(--graphite); }
.planform input[type="date"] { display: block; margin-top: 4px; padding: 7px 10px; font: 600 1rem var(--font-label); color: var(--ink); background: var(--sheet); border: 1.5px solid var(--ink); border-radius: 0; }
.planform button { padding: 8px 14px; border: 1.5px solid var(--ink); background: var(--sheet); font: 600 .95rem var(--font-label); cursor: pointer; }
.planform button:hover { background: var(--yellow-tint); }
.wk { margin: 1.6rem 0 0; }
.wk h3 { margin: 0 0 4px; padding-bottom: 4px; border-bottom: 2px solid var(--ink); font: 600 1rem/1.2 var(--font-label); color: var(--graphite); }
.dayrow { display: grid; grid-template-columns: 7.2rem minmax(0, 1fr); gap: 14px; padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--rule); border-left: 5px solid var(--blue); font-size: 1rem; line-height: 1.45; }
.dayrow.B { border-left-color: var(--yellow); }
.dayrow.C { border-left-color: var(--red); }
.dayrow.R { border-left-color: var(--rule-strong); }
.dayrow.we { background: var(--film); }
.dayrow .dt { font: 600 .98rem/1.35 var(--font-label); }
.dayrow a { text-decoration: none; font-weight: 600; border-bottom: 1.5px solid var(--dc, var(--blue)); color: var(--ink); }
.dayrow a:hover { background: var(--yellow-tint); }
.phase-key { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 0 0 6px; font: 500 .9rem var(--font-label); color: var(--graphite); }
.phase-key span::before { content: ""; display: inline-block; width: 14px; height: 10px; margin-right: 7px; background: var(--blue); }
.phase-key .B::before { background: var(--yellow); }
.phase-key .C::before { background: var(--red); }

/* samples + traps */
.samp { margin: 0 0 1.8rem; border: 1.5px solid var(--ink); }
.samp > h3 { margin: 0; padding: 9px 14px; background: var(--ink); color: var(--sheet); font: 600 1rem/1.3 var(--font-label); }
.samp > div { padding: 14px 16px 6px; }
.samp .stem { margin-bottom: .8rem; }
.alpha { margin: 0 0 1rem; padding-left: 1.7em; list-style: upper-alpha; font-size: 1rem; line-height: 1.5; }
.alpha li { margin: .3em 0; padding-left: .2em; }
.fam-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 36px; }
.fam-card { padding: 14px 0 6px; border-top: 2px solid var(--red); }
.fam-card h3 { margin: 0 0 4px; font: 600 1.15rem/1.2 var(--font-label); color: var(--red-ink); }
.fam-card p { margin: 0 0 .7em; font-size: 1rem; line-height: 1.5; max-width: none; }
.gloss dt { margin: 1.1rem 0 0; font: 600 1.15rem/1.2 var(--font-label); }
.gloss dd { margin: 3px 0 0; max-width: 62ch; font-size: 1rem; line-height: 1.5; }
.bar { display: block; height: 8px; border: 1px solid var(--ink); position: relative; min-width: 90px; }
.bar::after { content: ""; position: absolute; inset: 0; width: var(--p, 0%); background: var(--dc); }

h1[tabindex="-1"]:focus { outline: none; }
kbd { padding: 1px 6px 2px; border: 1px solid var(--rule-strong); border-bottom-width: 2px; border-radius: 2px; font: 600 .82em var(--font-label); background: var(--film); }
.chain { counter-reset: st; list-style: none; margin: 1.4rem 0 2rem; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border: 1.5px solid var(--ink); }
.chain li { counter-increment: st; padding: 12px 12px 14px; border-right: 1px solid var(--rule-strong); font: 600 1.02rem/1.2 var(--font-label); }
.chain li:last-child { border-right: 0; }
.chain li::before { content: counter(st); display: block; margin-bottom: 4px; font-size: .85rem; color: var(--dci); }
.chain li small { display: block; margin-top: 5px; font: 400 .88rem/1.35 var(--font-prose); color: var(--graphite); }
@media (max-width: 820px) { .chain { grid-template-columns: minmax(0, 1fr); } .chain li { border-right: 0; border-bottom: 1px solid var(--rule-strong); } }

/* drawer + search */
.scrim { position: fixed; inset: 0; z-index: 60; display: none; background: rgba(15, 24, 32, .58); }
.scrim.on { display: flex; align-items: flex-start; justify-content: center; padding: 11vh 14px 0; }
.dlg { width: min(660px, 100%); max-height: 74vh; display: flex; flex-direction: column; background: var(--sheet); border: 2px solid var(--ink); }
.dlg input { margin: 0; padding: 15px 18px; border: 0; border-bottom: 1.5px solid var(--ink); background: var(--sheet); color: var(--ink); font: 500 1.15rem var(--font-prose); outline: none; }
.dlg input:focus-visible { outline: none; box-shadow: inset 0 -4px 0 var(--yellow); }
.res { list-style: none; margin: 0; padding: 0; overflow: auto; }
.res li a { display: block; padding: 10px 18px; border-bottom: 1px solid var(--rule); color: var(--ink); text-decoration: none; font-size: .98rem; line-height: 1.4; }
.res li a b { font: 600 1.02rem var(--font-label); }
.res li a small { display: block; font: 500 .85rem var(--font-label); color: var(--graphite); }
.res li a[aria-selected="true"] { background: var(--yellow-tint); box-shadow: inset 4px 0 0 var(--ink); }
.res mark { background: var(--yellow); color: #16212B; }
.dlg .hint { margin: 0; padding: 8px 18px; border-top: 1px solid var(--rule-strong); font: 500 .8125rem var(--font-label); color: var(--graphite); }
.drawer { position: fixed; z-index: 70; top: 0; right: 0; bottom: 0; width: min(450px, 94vw); background: var(--sheet); border-left: 2px solid var(--ink); overflow: auto; transform: translateX(102%); visibility: hidden; transition: transform .22s ease, visibility 0s linear .22s; }
.drawer.on { transform: none; visibility: visible; transition: transform .22s ease, visibility 0s; }
.drawer header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--sheet); border-bottom: 1.5px solid var(--ink); }
.drawer header h2 { margin: 0; font: 600 1.2rem var(--font-label); flex: 1; }
.drawer .grp { margin: 0; padding: 14px 16px 0; }
.drawer .grp h3 { display: flex; align-items: center; gap: 10px; margin: 0 0 4px; font: 600 1.02rem/1.2 var(--font-label); }
.drawer .grp h3 svg { width: 18px; height: 18px; border: 1px solid var(--dci); flex: none; }
.drawer .grp h3 a { color: var(--ink); text-decoration: none; }
.drawer .grp h3 span { margin-left: auto; color: var(--graphite); font-weight: 500; }
.drawer ul { list-style: none; margin: 0; padding: 0; }
.drawer li a { display: grid; grid-template-columns: 2.9rem 1fr 1.2rem; gap: 8px; align-items: baseline; padding: 6px 8px; color: var(--ink); text-decoration: none; font-size: .95rem; line-height: 1.35; border-left: 4px solid transparent; }
.drawer li a:hover { background: var(--yellow-tint); }
.drawer li a[aria-current="page"] { background: var(--yellow-tint); border-left-color: var(--ink); }
.drawer li a .oid { font: 600 .95rem var(--font-label); color: var(--dci); }
.drawer li a .tick { font: 600 .9rem var(--font-label); color: var(--blue-ink); text-align: right; }
.drawer li a.stubp { color: var(--graphite); }
.drawer .plain a { grid-template-columns: 1fr 1.2rem; font: 600 1rem var(--font-label); }
.dfilter { margin: 0; padding: 8px 16px 10px; border-bottom: 1px solid var(--rule); }
.dfilter input { width: 100%; padding: 8px 10px; border: 1.5px solid var(--ink); background: var(--sheet); color: var(--ink); font: 500 .98rem var(--font-label); border-radius: 0; }

footer.site { max-width: 1180px; margin: 18px auto 0; font: 500 .85rem/1.5 var(--font-label); color: var(--graphite); }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .tabs a { padding-left: 8px; padding-right: 8px; }
  .tabs a::after { left: 8px; width: calc((100% - 16px) * var(--w)); }
  .brand small { display: none; }
}
@media (max-width: 980px) {
  .chapter { grid-template-columns: minmax(0, 1fr); }
  .chapter > aside.remember { grid-column: 1; grid-row: auto; position: static; max-height: none; margin-top: 2.4rem; }
  .head { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .tb { max-width: 420px; }
  .sheet-in { padding: 34px 28px 28px; }
}
@media (max-width: 820px) {
  .tabs { display: none; }
  .tools { margin-left: auto; }
  .cols2, .fam-grid, .doors { grid-template-columns: minmax(0, 1fr); }
  .fp-wrap .fp, .fp-wrap .legend { display: none; }
  .dom-list { display: block; }
}
@media (max-width: 620px) {
  body { font-size: 1.0625rem; }
  main { padding: 14px 8px 56px; }
  .topbar { padding: 0 10px; gap: 6px; }
  .prog i { display: none; }
  .sheet-in { padding: 26px 18px 22px; }
  .sheet::before { inset: 4px; }
  .rules li { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .rules li.rh { display: none; }
  .opts li { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .mark { justify-self: start; }
  .concept { padding-left: 14px; }
  .concept > h3 { flex-wrap: wrap; gap: 6px 12px; }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager .nx { text-align: left; }
  .dayrow { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  details.say > summary { grid-template-columns: minmax(0, 1fr); gap: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  .fp-draw .wall { animation: none; stroke-dashoffset: 0; }
  .drawer, .drawer.on { transition: none; }
}
@media print {
  .topbar, .drawer, .scrim, .pager, aside.remember { display: none !important; }
  .page { display: block !important; page-break-after: always; }
  body { background: #fff; }
}
</style>
</head>

<a class="skip" href="#main">Skip to content</a>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="h-d1" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V8" style="stroke:var(--d1);stroke-width:1.3"/></pattern>
    <pattern id="h-d2" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" style="fill:var(--d2)"/><circle cx="6" cy="6" r="1.2" style="fill:var(--d2)"/></pattern>
    <pattern id="h-d3" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V8M0 0H8" style="stroke:var(--d3);stroke-width:1.1;fill:none"/></pattern>
    <pattern id="h-d4" width="8" height="6" patternUnits="userSpaceOnUse"><path d="M0 3H8" style="stroke:var(--d4);stroke-width:1.3"/></pattern>
    <pattern id="h-d5" width="6" height="8" patternUnits="userSpaceOnUse"><path d="M3 0V8" style="stroke:var(--d5);stroke-width:1.3"/></pattern>
    <pattern id="h-d6" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M5 2V8M2 5H8" style="stroke:var(--d6);stroke-width:1.2;fill:none"/></pattern>
    <pattern id="h-d7" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0H8V8" style="stroke:var(--d7);stroke-width:1.1;fill:none"/></pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" style="fill:var(--ink)"/></marker>
    <marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" style="fill:var(--blue)"/></marker>
    <marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" style="fill:var(--red)"/></marker>
    <marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" style="fill:var(--graphite)"/></marker>
  </defs>
</svg>
<header class="topbar">
  <a class="brand" href="#/start" aria-label="CCAR-P syllabus course, start page">
    <svg viewBox="0 0 22 22" aria-hidden="true"><rect x="2" y="2" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M2 14H20M11 14V20" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    <b>CCAR-P</b><small>syllabus course</small>
  </a>
  <nav class="tabs" aria-label="Domains">{{TABS}}</nav>
  <div class="tools">
    <span class="prog" title="Chapters marked read"><span id="prog-n">0</span>/38 read<i id="prog-bar"></i></span>
    <button class="ic" id="btn-search" type="button" aria-label="Search the course (press /)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13L18 18"/></svg></button>
    <button class="ic" id="btn-index" type="button" aria-label="Open the sheet index" aria-expanded="false" aria-controls="drawer"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 5H17M3 10H17M3 15H17"/></svg></button>
    <button class="ic" id="btn-theme" type="button" aria-label="Switch between light and dark"><svg class="sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10" cy="10" r="3.6"/><path d="M10 2V4M10 16V18M2 10H4M16 10H18M4.4 4.4L5.8 5.8M14.2 14.2L15.6 15.6M4.4 15.6L5.8 14.2M14.2 5.8L15.6 4.4"/></svg><svg class="moon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M16 11.5A6.5 6.5 0 1 1 8.5 4a5.2 5.2 0 0 0 7.5 7.5z"/></svg></button>
  </div>

<div class="scrim" id="scrim">
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t">

    <ul class="res" id="res" role="listbox" aria-label="Search results"></ul>
    <p class="hint">Enter opens a result. Up and down arrows move. Esc closes. Press / on any page to search.</p>
  </div>
</div>
