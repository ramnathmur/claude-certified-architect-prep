n-snap\"><b>So on the exam →</b> The levels concatenate from root down to the working directory. There is no override precedence between them.</div></div></div><div class=\"an-nem\"><span class=\"lab\">⚠ Your record · The §3.1 family has cost you four papers</span>Concatenation, not override. Every discovered file contributes, root down to the working directory. If two of them conflict, both are in context and you fix the files &mdash; nothing silently wins.</div></div>\n<p>CLAUDE.md is the instruction file(s) for Claude Code. There is a three-level hierarchy:</p>\n<pre><code>1. User-level: ~/.claude/CLAUDE.md\n   - Applies only to that user\n   - NOT shared via VCS\n   - Personal preferences and working style\n\n2. Project-level: .claude/CLAUDE.md or a root CLAUDE.md\n   - Applies to all project contributors\n   - Managed via VCS\n   - Coding standards, testing standards, architectural decisions\n\n3. Directory-level: CLAUDE.md in subdirectories\n   - Applies when working with files in that directory\n   - Conventions specific to that part of the codebase\n</code></pre>\n<p><strong>Common mistake:</strong> a new team member does not receive project instructions because they were placed in <code>~/.claude/CLAUDE.md</code> (user-level) instead of <code>.claude/CLAUDE.md</code> (project-level).</p>\n<h2 id=\"s-5-2-path-syntax-file-imports\">5.2 <code>@path</code> Syntax (File Imports)</h2><div class=\"an\" style=\"--acc:var(--w-house)\" data-an=\"5.2\"><div class=\"an-top\"><span class=\"an-w\">The house you moved into</span><span class=\"an-t\">§5.2</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='14' y='34' width='48' height='60' rx='4' fill='var(--acc)' opacity='.14'/><path d='M14 34h48v60H14z'/><path d='M24 50h28M24 62h28M24 74h16'/><path d='M62 64h26' stroke-dasharray='0'/><path d='M80 56l10 8-10 8'/><rect x='94' y='34' width='48' height='60' rx='4'/><path d='M104 50h28M104 62h28M104 74h16' opacity='.7'/><path d='M30 106v10h100v-10' opacity='.5'/><path d='M40 122h16M64 122h16M88 122h16M112 122h16' opacity='.5'/><text x='80' y='142' font-size='13' fill='currentColor' stroke='none' text-anchor='middle' font-family='monospace'>max 5</text></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A note that says 'see the green folder', and the green folder.</p><div class=\"an-lab\">The analogy</div><p>Instead of one enormous laminated sheet nobody reads, the fridge note points at the folder that actually holds the detail. Chains work — up to a point, and that point is five.</p><div class=\"an-snap\"><b>So on the exam →</b> <code>@./path/file.md</code> inlines another file. Relative paths resolve from the file doing the importing. Maximum nesting depth is 5.</div></div></div></div>\n<p>CLAUDE.md can reference external files using <code>@path</code>, making configuration modular:</p>\n<pre><code class=\"language-markdown\"># Project CLAUDE.md\n\nCoding standards are described in @./standards/coding-style.md\nTest requirements are in @./standards/testing-requirements.md\nProject overview is in @README.md and dependencies are in @package.json\n</code></pre>\n<p><strong>Rules for <code>@path</code>:</strong>\n- Use <code>@</code> immediately before the file path (no space)\n- Relative and absolute paths are supported\n- Relative paths are resolved relative to the file that contains the import\n- Maximum import nesting depth is 5</p>\n<p>This avoids duplication and lets each package include only relevant standards.</p>\n<h2 id=\"s-5-3-the-claude-rules-directory\">5.3 The <code>.claude/rules/</code> Directory</h2><div class=\"an hi\" style=\"--acc:var(--w-house)\" data-an=\"5.3\"><div class=\"an-top\"><span class=\"an-w\">The house you moved into</span><span class=\"an-t\">§5.3</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M8 44L80 12l72 32'/><path d='M20 44v100h120V44'/><rect x='30' y='66' width='30' height='58' rx='3'/><rect x='66' y='66' width='30' height='58' rx='3' fill='var(--acc)' opacity='.22'/><rect x='102' y='66' width='30' height='58' rx='3'/><circle cx='55' cy='96' r='2.4' fill='currentColor'/><circle cx='91' cy='96' r='2.4' fill='currentColor'/><circle cx='127' cy='96' r='2.4' fill='currentColor'/><rect x='36' y='54' width='18' height='11' rx='2' opacity='.4'/><rect x='72' y='54' width='18' height='11' rx='2' fill='var(--acc)' opacity='.6'/><rect x='72' y='54' width='18' height='11' rx='2'/><rect x='108' y='54' width='18' height='11' rx='2' opacity='.4'/><circle cx='81' cy='136' r='7'/><path d='M81 129v-5' opacity='.6'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Notes taped to individual doors. Only the one you walk through lights up.</p><div class=\"an-lab\">The analogy</div><p>The bathroom note is invisible until you are actually in the bathroom. Brilliant when a rule genuinely only concerns bathrooms. Useless for 'shoes off at the front door', which has to live on the fridge where everyone passes it.</p><div class=\"an-snap\"><b>So on the exam →</b> Rules load on file-path glob match. If the question is not about <em>which files</em>, it is not rules.</div></div></div><div class=\"an-nem\"><span class=\"lab\">⚠ Your record · Three wrong picks across two papers</span>Exam 12 Q1 (answer was <code>/memory</code>), Exam 12 Q56 (answer was <code>.claude/commands/</code>), Exam 13 Q41 (answer was to delete prose from <code>CLAUDE.md</code>). Three different right answers, one recurring instinct. <strong>Rules answer &ldquo;which files&rdquo;. If the question is not about which files, it is not rules.</strong></div></div>\n<p><code>.claude/rules/</code> is an alternative to a monolithic CLAUDE.md, used to organize rules by topic:</p>\n<pre><code>.claude/rules/\n  testing.md          -- testing conventions\n  api-conventions.md  -- API conventions\n  deployment.md       -- deployment rules\n  react-patterns.md   -- React patterns\n</code></pre>\n<p><strong>Key feature: YAML frontmatter with <code>paths</code> for conditional loading:</strong></p>\n<pre><code class=\"language-yaml\">---\npaths: [&quot;src/api/**/*&quot;]\n---\n\nFor API files, use async/await with explicit error handling.\nEach endpoint must return a standard response wrapper.\n</code></pre>\n<pre><code class=\"language-yaml\">---\npaths: [&quot;**/*.test.tsx&quot;, &quot;**/*.test.ts&quot;]\n---\n\nTests must use describe/it blocks.\nUse data factories instead of hardcoding.\nDo not mock the database—use a test database.\n</code></pre>\n<p><strong>How it works:</strong>\n- A rule is loaded <strong>only</strong> when Claude Code edits a file matching the <code>paths</code> pattern\n- This saves context and tokens—irrelevant rules are not loaded\n- Glob patterns let you apply conventions by file type regardless of location (ideal for tests scattered across the codebase)</p>\n<p><strong>When to use <code>.claude/rules/</code> with <code>paths</code> vs directory-level CLAUDE.md:</strong>\n- <code>.claude/rules/</code> with <code>paths</code> — when conventions apply to files spread across many directories (tests, migrations)\n- Directory-level CLAUDE.md — when conventions are tied to a specific directory and are not needed elsewhere</p>\n<h2 id=\"s-5-4-custom-slash-commands-and-skills\">5.4 Custom Slash Commands and Skills</h2><div class=\"an hi\" style=\"--acc:var(--w-house)\" data-an=\"5.4\"><div class=\"an-top\"><span class=\"an-w\">The house you moved into</span><span class=\"an-t\">§5.4</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M16 26h128v112H16z'/><path d='M16 62h128M16 100h128' opacity='.45'/><rect x='28' y='34' width='40' height='22' rx='3' opacity='.5'/><rect x='78' y='34' width='40' height='22' rx='3' opacity='.5'/><rect x='28' y='72' width='40' height='22' rx='3' opacity='.5'/><rect x='84' y='66' width='56' height='34' rx='4' fill='var(--acc)' opacity='.2'/><path d='M84 66h56v34H84z'/><path d='M94 78h30M94 88h18'/><path d='M140 84h14' opacity='.7'/><path d='M148 78l8 6-8 6'/><path d='M30 110h34M78 110h34' opacity='.4'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A labelled box you take down from the cupboard when you actually need it.</p><div class=\"an-lab\">The analogy</div><p>It does not run your household. It sits on the shelf with its name printed on the front until somebody asks for it by name.</p><div class=\"an-snap\"><b>So on the exam →</b> Project commands in <code>.claude/commands/</code> ship with the clone. Personal ones in <code>~/.claude/commands/</code> do not. <code>$ARGUMENTS</code> carries whatever was typed after the name.</div></div></div><div class=\"an-nem\"><span class=\"lab\">⚠ Your record · Missed on Exam 12 Q56</span>Version-controlled and ships with the clone is the whole point of the project path. <code>~/.claude/commands/</code> reaches nobody else on the team.</div></div>\n<blockquote>\n<p><strong>Note:</strong> in the current Claude Code version, custom commands (<code>.claude/commands/</code>) are unified with skills (<code>.claude/skills/</code>). Both formats create <code>/name</code> commands. The exam guide references <code>.claude/commands/</code>—that format is still supported.</p>\n</blockquote>\n<p>Slash commands are reusable prompt templates invoked via <code>/name</code>:</p>\n<p><strong><code>.claude/commands/</code> format (legacy, supported):</strong></p>\n<pre><code>.claude/commands/\n  review.md        -- /review -- standard code review\n  test-gen.md      -- /test-gen -- test generation\n</code></pre>\n<p><strong><code>.claude/skills/</code> format (current):</strong></p>\n<pre><code>.claude/skills/\n  review/SKILL.md  -- /review -- with frontmatter configuration\n  test-gen/SKILL.md\n</code></pre>\n<p><strong>Project commands</strong> (<code>.claude/commands/</code> or <code>.claude/skills/</code>):\n- Stored in VCS and available to everyone when cloning the repo\n- Ensure consistent workflows across the team</p>\n<p><strong>User commands</strong> (<code>~/.claude/commands/</code> or <code>~/.claude/skills/</code>):\n- Personal commands not shared via VCS\n- For individual workflows</p>\n<h2 id=\"s-5-5-skills-claude-skills\">5.5 Skills — <code>.claude/skills/</code></h2><div class=\"an\" style=\"--acc:var(--w-house)\" data-an=\"5.5\"><div class=\"an-top\"><span class=\"an-w\">The house you moved into</span><span class=\"an-t\">§5.5</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M22 70h84v62H22z'/><path d='M22 70l22-40h84l-22 40z' fill='var(--acc)' opacity='.14'/><path d='M22 70l22-40h84l-22 40z'/><path d='M106 70l22-40v62l-22 40z'/><path d='M54 40h60M54 50h44M54 60h52' opacity='.8'/><path d='M34 88h56M34 100h40M34 112h56' opacity='.55'/><circle cx='128' cy='104' r='6'/><path d='M128 110v10M128 120l-10 8M128 120l10 8'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">The spec printed on the inside of the box lid.</p><div class=\"an-lab\">The analogy</div><p>Inside the lid: what this thing is, what to type after its name, which tools it is allowed to touch, and whether it makes its mess in a separate room.</p><div class=\"an-snap\"><b>So on the exam →</b> SKILL.md frontmatter: <code>description</code>, <code>argument-hint</code>, <code>allowed-tools</code>, <code>context: fork</code>. Tool scoping lives here — not in <code>.mcp.json</code>.</div></div></div></div>\n<p>Skills are advanced commands configured via SKILL.md frontmatter:</p>\n<pre><code class=\"language-yaml\">---\ncontext: fork\nallowed-tools: [&quot;Read&quot;, &quot;Grep&quot;, &quot;Glob&quot;]\nargument-hint: &quot;Path to the directory to analyze&quot;\n---\n\nAnalyze the code structure in the specified directory.\nOutput a report on dependencies and architectural patterns.\n</code></pre>\n<p><strong>Frontmatter parameters:</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Parameter</th>\n<th>Description</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>context: fork</code></td>\n<td>Runs the skill in an isolated subagent. Verbose output does not pollute the main session</td>\n</tr>\n<tr>\n<td><code>allowed-tools</code></td>\n<td>Restricts which tools are available (security—e.g., the skill cannot delete files if not allowed)</td>\n</tr>\n<tr>\n<td><code>argument-hint</code></td>\n<td>Hint that asks for an argument when invoked without parameters</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>When to use a skill vs CLAUDE.md:</strong>\n- <strong>Skill</strong> — on-demand invocation for a specific task (review, analysis, generation)\n- <strong>CLAUDE.md</strong> — always-loaded general standards and conventions</p>\n<p><strong>Personal skills (<code>~/.claude/skills/</code>):</strong>\n- Create personal variants under different names so you don't affect teammates</p>\n<h2 id=\"s-5-6-planning-mode-vs-direct-execution\">5.6 Planning Mode vs Direct Execution</h2><div class=\"an\" style=\"--acc:var(--w-house)\" data-an=\"5.6\"><div class=\"an-top\"><span class=\"an-w\">The house you moved into</span><span class=\"an-t\">§5.6</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M14 34h56v104H14z'/><path d='M14 34h56v104H14z' fill='var(--acc)' opacity='.08'/><path d='M22 46h40M22 58h40M22 70h24' stroke-dasharray='4 4' opacity='.7'/><path d='M20 88v42M20 88h6M20 130h6' opacity='.7'/><path d='M34 92h32v34H34z' stroke-dasharray='5 4'/><path d='M92 34h54v104H92z'/><circle cx='119' cy='72' r='2.6' fill='currentColor'/><path d='M119 72v-14' opacity='.5'/><path d='M104 104l16-16 8 8' stroke-width='3'/><path d='M126 90l10-10 8 8-10 10z'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Surveying the wall versus hammering one nail.</p><div class=\"an-lab\">The analogy</div><p>You measure before knocking through a supporting wall. You do not commission a structural survey to hang a picture. And you do not start swinging, then call the surveyor once it gets frightening.</p><div class=\"an-snap\"><b>So on the exam →</b> Plan mode for large or multi-approach work; direct execution when the scope is clear. Switching reactively mid-job is the documented trap.</div></div></div></div>\n<p><strong>Planning mode:</strong>\n- The model only investigates and plans; it does not make changes\n- Uses Read, Grep, Glob to explore the codebase\n- Produces an implementation plan that the user approves\n- Safe exploration with no side effects</p>\n<p><strong>When to use planning mode:</strong>\n- Large changes (dozens of files)\n- Multiple plausible approaches (microservices: how to define boundaries?)\n- Architectural decisions (which framework? what structure?)\n- Unfamiliar codebase (you must understand before changing)\n- Library migrations affecting 45+ files</p>\n<p><strong>When to use direct execution:</strong>\n- Single-file fixes with a clear stack trace\n- Adding one validation check\n- Well-understood, unambiguous changes</p>\n<p><strong>Combined approach:</strong>\n1. Planning mode for investigation and design\n2. User approves the plan\n3. Direct execution to implement the approved plan</p>\n<p><strong>Explore subagent</strong> — a specialized subagent for exploring the codebase:\n- Isolates verbose output from the main context\n- Returns only a summary\n- Prevents context-window exhaustion in multi-phase tasks</p>\n<h2 id=\"s-5-7-the-compact-command\">5.7 The <code>/compact</code> Command</h2><div class=\"an\" style=\"--acc:var(--w-house)\" data-an=\"5.7\"><div class=\"an-top\"><span class=\"an-w\">The house you moved into</span><span class=\"an-t\">§5.7</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M16 30h44v112H16z' fill='var(--acc)' opacity='.14'/><path d='M16 30h44v112H16z'/><path d='M24 44h28M24 56h28M24 68h28M24 80h28M24 92h28M24 104h28' opacity='.6'/><path d='M74 86h30' /><path d='M96 78l10 8-10 8'/><path d='M114 58h30v56h-30z'/><path d='M120 74h18M120 86h18' opacity='.6'/><text x='84' y='42' font-size='12' fill='currentColor' stroke='none' text-anchor='middle' font-family='monospace'>310</text><text x='96' y='128' font-size='12' fill='currentColor' stroke='none' text-anchor='middle' font-family='monospace'>12th</text><path d='M78 46l-4 10M92 118l-6 8' opacity='.5'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A thick diary squeezed thin, with the dates falling out of the side.</p><div class=\"an-lab\">The analogy</div><p>You keep the plot. You lose 'three hundred and ten pounds, due on the twelfth'. Which is entirely fine, right up until the next thing you do turns on it being three hundred and ten pounds due on the twelfth.</p><div class=\"an-snap\"><b>So on the exam →</b> <code>/compact</code> compresses context and can drop exact values, dates and specifics. Do not run it immediately before work that needs the precision.</div></div></div></div>\n<p><code>/compact</code> is a built-in command for compressing context:\n- Summarizes prior history to free up the context window\n- Used in long investigation sessions when the context fills up with verbose tool output\n- Risk: exact numeric values, dates, and specific details can be lost during summarization</p>\n<h2 id=\"s-5-8-the-memory-command\">5.8 The <code>/memory</code> Command</h2><div class=\"an hi\" style=\"--acc:var(--w-house)\" data-an=\"5.8\"><div class=\"an-top\"><span class=\"an-w\">The house you moved into</span><span class=\"an-t\">§5.8</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M40 130l-6-64 26-6 8 62z' fill='var(--acc)' opacity='.16'/><path d='M40 130l-6-64 26-6 8 62z'/><path d='M68 122l4-64 26 2-2 64z'/><path d='M96 124l10-62 26 6-14 62z' stroke-dasharray='5 5' opacity='.55'/><path d='M44 84h16M46 98h16M76 78h18M76 92h18' opacity='.7'/><circle cx='118' cy='36' r='14'/><path d='M128 46l14 14'/><path d='M112 36h12M118 30v12' opacity='.8'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Fanning out the rulebooks you are actually holding, and spotting the gap.</p><div class=\"an-lab\">The analogy</div><p>Before arguing about why the rule is not being followed, check whether the page carrying the rule is in your hand at all. Very often it turns out to be on somebody else's fridge.</p><div class=\"an-snap\"><b>So on the exam →</b> <code>/memory</code> lists the memory files actually loaded. First diagnostic step whenever behaviour differs between machines or between sessions.</div></div></div><div class=\"an-nem\"><span class=\"lab\">⚠ Your record · Missed on Exam 12 Q1</span>When a rule is followed on one machine and not another, the first move is diagnostic, not structural. Check which memory files actually loaded before you move anything anywhere.</div></div>\n<p><code>/memory</code> is a built-in command for managing memory between sessions:\n- Opens the <code>CLAUDE.md</code> file for editing, allowing you to save notes, preferences, and context\n- Information persists across sessions and is automatically loaded on startup\n- Useful for storing project conventions, user preferences, frequently used commands, and current work context\n- Alternative to re-explaining the same instructions in every session</p>\n<h2 id=\"s-5-9-claude-code-cli-for-ci-cd\">5.9 Claude Code CLI for CI/CD</h2><div class=\"an\" style=\"--acc:var(--w-house)\" data-an=\"5.9\"><div class=\"an-top\"><span class=\"an-w\">The house you moved into</span><span class=\"an-t\">§5.9</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='12' y='34' width='64' height='52' rx='5'/><path d='M12 48h64' opacity='.5'/><path d='M20 60h10l6 6-6 6' opacity='.8'/><path d='M42 72h24' fill='var(--acc)'/><rect x='20' y='94' width='48' height='34' rx='4' fill='var(--acc)' opacity='.18'/><path d='M20 94h48v34H20z'/><path d='M28 106h32M28 116h20' opacity='.7'/><rect x='88' y='34' width='60' height='52' rx='5'/><path d='M88 48h60' opacity='.5'/><path d='M96 62h10l6 6-6 6' opacity='.8'/><path d='M120 74h4' stroke-width='4'/><circle cx='118' cy='112' r='18'/><path d='M118 100v12l9 6'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">One terminal prints and exits. The other sits there blinking forever.</p><div class=\"an-lab\">The analogy</div><p>A pipeline has nobody at the keyboard. Without the flag that means 'answer and go', it waits politely for a human who is never coming, and the build times out at 3am.</p><div class=\"an-snap\"><b>So on the exam →</b> <code>-p</code>/<code>--print</code> runs non-interactive. <code>--output-format json</code> with <code>--json-schema</code> makes the output parseable. <code>--batch</code> and <code>CLAUDE_HEADLESS</code> do not exist.</div></div></div></div>\n<p><strong>The <code>-p</code> (or <code>--print</code>) flag:</strong></p>\n<pre><code class=\"language-bash\">claude -p &quot;Analyze this pull request for security issues&quot;\n</code></pre>\n<ul>\n<li>Non-interactive mode: processes the prompt, prints to stdout, exits</li>\n<li>Does not wait for user input</li>\n<li>The only correct way to run Claude in CI/CD pipelines</li>\n</ul>\n<p><strong>Structured output for CI:</strong></p>\n<pre><code class=\"language-bash\">claude -p &quot;Review this PR&quot; --output-format json --json-schema '{&quot;type&quot;:&quot;object&quot;,...}'\n</code></pre>\n<ul>\n<li><code>--output-format json</code> — output in JSON</li>\n<li><code>--json-schema</code> — validate output against a schema</li>\n<li>The result can be parsed to automatically post inline PR comments</li>\n</ul>\n<p><strong>Session context isolation:</strong>\nThe same Claude session that generated code is often less effective at reviewing it (the model retains its reasoning context and is less likely to challenge its own decisions). Use an independent instance for review.</p>\n<p><strong>Preventing duplicate comments:</strong>\nWhen re-reviewing after new commits, include prior review results in context and instruct Claude to report only new or unresolved issues.</p>\n<h2 id=\"s-5-10-fork-session-and-session-management\">5.10 <code>fork_session</code> and Session Management</h2><div class=\"an\" style=\"--acc:var(--w-house)\" data-an=\"5.10\"><div class=\"an-top\"><span class=\"an-w\">The house you moved into</span><span class=\"an-t\">§5.10</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M16 80h44'/><circle cx='60' cy='80' r='9' fill='var(--acc)' opacity='.35'/><circle cx='60' cy='80' r='9'/><path d='M69 76c14-10 24-22 42-30M69 84c14 10 24 22 42 30'/><circle cx='120' cy='42' r='11'/><circle cx='120' cy='118' r='11'/><path d='M115 42h10M120 37v10' opacity='.7'/><path d='M115 118h10' opacity='.7'/><path d='M132 42h18M132 118h18' opacity='.4' stroke-dasharray='4 4'/><path d='M24 66v28M16 66h16M16 94h16' opacity='.5'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">One save point, two branches that never touch again.</p><div class=\"an-lab\">The analogy</div><p>You spent two hours mapping the dungeon. You are not doing that again to try the other door — you save, and you branch.</p><div class=\"an-snap\"><b>So on the exam →</b> <code>fork_session</code> gives divergent branches from one shared baseline. <code>--resume</code> continues a named session; tell it which files changed if the code moved underneath it.</div></div></div></div>\n<p><strong><code>--resume &lt;session-name&gt;</code></strong> resumes a named session:</p>\n<pre><code class=\"language-bash\">claude --resume investigation-auth-bug\n</code></pre>\n<ul>\n<li>Continues a prior conversation with saved context</li>\n<li>Useful for long investigations across multiple sessions</li>\n<li>Risk: if files changed since the prior session, tool results may be stale</li>\n</ul>\n<p><strong><code>fork_session</code></strong> creates an independent branch from shared context:</p>\n<pre><code>Codebase investigation\n         |\n    fork_session\n    /           \\\nApproach A:      Approach B:\nRedux            Context API\n</code></pre>\n<ul>\n<li>Both forks inherit context up to the branch point</li>\n<li>Afterwards, they diverge independently</li>\n<li>Useful for comparing approaches or testing strategies</li>\n</ul>\n<p><strong>When to start a new session instead of resuming:</strong>\n- Tool results are stale (files changed)\n- A lot of time has passed and context has degraded\n- It is better to restart with \"Here is a short summary of what we found: ...\" than to resume with old tool data</p>\n<hr />", "concepts": ["5.1", "5.2", "5.3", "5.4", "5.5", "5.6", "5.7", "5.8", "5.9", "5.10"], "keywords": "Chapter 5: Claude Code — Configuration and Workflows 5.1 The CLAUDE.md Hierarchy 5.2 `@path` Syntax (File Imports) 5.3 The `.claude/rules/` Directory 5.4 Custom Slash Commands and Skills 5.5 Skills — `.claude/skills/` 5.6 Planning Mode vs Direct Execution 5.7 The `/compact` Command 5.8 The `/memory` Command 5.9 Claude Code CLI for CI/CD 5.10 `fork_session` and Session Management"}, {"id": "ch6", "group": "Part I · Theory", "title": "Prompt engineering", "short": "Ch6", "num": "6", "html": "<h1 id=\"s-chapter-6-prompt-engineering-advanced-techniques\">Chapter 6: Prompt Engineering — Advanced Techniques</h1>\n<blockquote>\n<p>Documentation: <a href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview\">Prompt Engineering</a> | <a href=\"https://github.com/anthropics/anthropic-cookbook\">Anthropic Cookbook</a></p>\n</blockquote>\n<h2 id=\"s-6-1-few-shot-prompting\">6.1 Few-shot Prompting</h2><div class=\"an hi\" style=\"--acc:var(--w-intern)\" data-an=\"6.1\"><div class=\"an-top\"><span class=\"an-w\">Training an intern</span><span class=\"an-t\">§6.1</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='14' y='24' width='42' height='54' rx='4' fill='var(--acc)' opacity='.18'/><path d='M14 24h42v54H14z'/><rect x='60' y='24' width='42' height='54' rx='4' fill='var(--acc)' opacity='.18'/><path d='M60 24h42v54H60z'/><rect x='106' y='24' width='42' height='54' rx='4' fill='var(--acc)' opacity='.18'/><path d='M106 24h42v54h-42z'/><path d='M22 40h26M22 50h26M22 60h16M68 40h26M68 50h26M68 60h16M114 40h26M114 50h26M114 60h16' opacity='.6'/><path d='M24 68l6 6 10-12M70 68l6 6 10-12M116 68l6 6 10-12' opacity='.9'/><path d='M28 96h104' stroke-dasharray='5 5' opacity='.5'/><rect x='52' y='106' width='56' height='38' rx='4'/><path d='M62 120h36M62 132h22' opacity='.7'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Three finished pieces of work on the desk, not a longer briefing document.</p><div class=\"an-lab\">The analogy</div><p>The intern read your two-page brief and still formatted it wrong. Put three completed examples in front of them and they get it in about nine seconds. Pick the three that were confusing, though — three more easy ones teach nobody anything.</p><div class=\"an-snap\"><b>So on the exam →</b> Target 4–6 examples at exactly the ambiguous cases where it gets things wrong. More examples of the obvious cases will not move the boundary.</div></div></div><div class=\"an-nem\"><span class=\"lab\">⚠ Your record · Missed on Exam 12 Q6</span>Prose instructions already failed. Adding a post-processing repair stage leaves generation exactly as unreliable as it was; examples of the exact shape are the documented fix.</div></div>\n<p>Few-shot prompting is the inclusion of 2–4 input/output examples in a prompt to demonstrate the expected behavior.</p>\n<p><strong>Why few-shot is more effective than textual descriptions:</strong>\n- A vague instruction like “be more precise” can be interpreted in many ways\n- An example unambiguously shows the expected format and decision logic\n- The model generalizes the pattern to new cases (it does not just repeat the examples)</p>\n<p><strong>Types of few-shot examples and when to use them:</strong></p>\n<ol>\n<li><strong>Examples for ambiguous scenarios:</strong></li>\n</ol>\n<pre><code>Request: &quot;My order is broken&quot;\nAction: Call get_customer -&gt; lookup_order -&gt; check status.\nRationale: “broken” may mean a damaged item; you need order details.\n\nRequest: &quot;Get me a manager&quot;\nAction: Immediately call escalate_to_human.\nRationale: The customer explicitly requests a human. Do not attempt to solve autonomously.\n</code></pre>\n<ol start=\"2\">\n<li><strong>Examples for output formatting:</strong></li>\n</ol>\n<pre><code>Finding example:\n{\n  &quot;location&quot;: &quot;src/auth/login.ts:42&quot;,\n  &quot;issue&quot;: &quot;SQL injection in the username parameter&quot;,\n  &quot;severity&quot;: &quot;critical&quot;,\n  &quot;suggested_fix&quot;: &quot;Use a parameterized query&quot;\n}\n</code></pre>\n<ol start=\"3\">\n<li><strong>Examples to separate acceptable vs problematic code:</strong></li>\n</ol>\n<pre><code>// Acceptable (do not flag):\nconst items = data.filter(x =&gt; x.active);\n\n// Problem (flag):\nconst items = data.filter(x =&gt; x.active == true); // Use strict equality ===\n</code></pre>\n<ol start=\"4\">\n<li><strong>Examples for extraction from different document formats:</strong></li>\n</ol>\n<pre><code>Document with inline citations:\n&quot;As shown in the study (Smith, 2023), the rate is 42%.&quot;\n-&gt; {&quot;value&quot;: &quot;42%&quot;, &quot;source&quot;: &quot;Smith, 2023&quot;, &quot;type&quot;: &quot;inline_citation&quot;}\n\nDocument with bibliography references:\n&quot;The rate is 42%. [1]&quot;\n-&gt; {&quot;value&quot;: &quot;42%&quot;, &quot;source&quot;: &quot;reference_1&quot;, &quot;type&quot;: &quot;bibliography&quot;}\n</code></pre>\n<ol start=\"5\">\n<li><strong>Examples for informal measurements:</strong></li>\n</ol>\n<pre><code>Text: &quot;about two handfuls of rice&quot;\n-&gt; {&quot;amount&quot;: &quot;~100g&quot;, &quot;original_text&quot;: &quot;two handfuls&quot;, &quot;precision&quot;: &quot;approximate&quot;}\n\nText: &quot;a pinch of salt&quot;\n-&gt; {&quot;amount&quot;: &quot;~1g&quot;, &quot;original_text&quot;: &quot;a pinch&quot;, &quot;precision&quot;: &quot;approximate&quot;}\n</code></pre>\n<p>Few-shot is especially effective for extracting informal and non-standard measurement units that are too diverse for purely rule-based instructions.</p>\n<p><strong>Format normalization rules in prompts:</strong>\nWhen using strict JSON schemas for structured output, add normalization rules in the prompt:</p>\n<pre><code>Normalization:\n- Dates: always ISO 8601 (YYYY-MM-DD); &quot;yesterday&quot; -&gt; compute an absolute date\n- Currency: numeric amount + currency code; &quot;five bucks&quot; -&gt; {&quot;amount&quot;: 5, &quot;currency&quot;: &quot;USD&quot;}\n- Percentages: decimal fraction; &quot;half&quot; -&gt; 0.5\n</code></pre>\n<p>This prevents semantic errors where the JSON is syntactically valid but values are inconsistent.</p>\n<h2 id=\"s-6-2-explicit-criteria-vs-vague-instructions\">6.2 Explicit Criteria vs Vague Instructions</h2><div class=\"an\" style=\"--acc:var(--w-intern)\" data-an=\"6.2\"><div class=\"an-top\"><span class=\"an-w\">Training an intern</span><span class=\"an-t\">§6.2</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='14' y='30' width='58' height='100' rx='5'/><path d='M24 50h38M24 62h38M24 74h24' opacity='.45' stroke-dasharray='4 4'/><path d='M30 96c0-6 6-9 9-6s-1 7-2 9v4' opacity='.7'/><circle cx='37' cy='110' r='1.6' fill='currentColor'/><rect x='88' y='30' width='58' height='100' rx='5' fill='var(--acc)' opacity='.12'/><path d='M88 30h58v100H88z'/><path d='M98 50l5 5 8-9M98 70l5 5 8-9M98 90l5 5 8-9M98 110l5 5 8-9'/><path d='M118 50h20M118 70h20M118 90h14M118 110h20' opacity='.75'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">'Use your judgement' next to a tick-list with numbers on it.</p><div class=\"an-lab\">The analogy</div><p>Tell an intern to flag anything that 'looks off' and you will get forty things, half of them fine. Tell them to flag only where the comment claims behaviour the code does not have, and you get the four that matter.</p><div class=\"an-snap\"><b>So on the exam →</b> Replace abstract intent with an explicitly testable condition. 'Check accuracy' becomes 'flag only when the claimed behaviour contradicts the code'.</div></div></div></div>\n<p><strong>Bad (vague):</strong></p>\n<pre><code>Check code comments for accuracy.\nBe conservative—report only high-confidence findings.\n</code></pre>\n<p><strong>Good (explicit criteria):</strong></p>\n<pre><code>Flag a comment as problematic ONLY if:\n1. The comment describes behavior that CONTRADICTS the actual code behavior\n2. The comment references a non-existent function or variable\n3. A TODO/FIXME comment refers to a bug that has already been fixed in code\n\nDo NOT flag:\n- Comments that are merely stylistically outdated\n- Comments with minor wording inaccuracies\n- Missing comments (that is a separate category)\n</code></pre>\n<p><strong>Define severity criteria with examples:</strong></p>\n<pre><code>CRITICAL: Runtime failure for users\n  Example: NullPointerException while processing a payment\n\nHIGH: Security vulnerability\n  Example: SQL injection, XSS, missing authorization checks\n\nMEDIUM: Logic bug without immediate impact\n  Example: Wrong sorting, off-by-one error\n\nLOW: Code quality\n  Example: Duplication, suboptimal algorithm for small data\n</code></pre>\n<h2 id=\"s-6-3-prompt-chaining\">6.3 Prompt Chaining</h2><div class=\"an\" style=\"--acc:var(--w-intern)\" data-an=\"6.3\"><div class=\"an-top\"><span class=\"an-w\">Training an intern</span><span class=\"an-t\">§6.3</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx='26' cy='52' r='11'/><path d='M26 63v26M26 89l-8 24M26 89l8 24'/><path d='M36 72l16-6'/><circle cx='80' cy='52' r='11'/><path d='M80 63v26M80 89l-8 24M80 89l8 24'/><path d='M70 72l-14-6M90 72l16-6'/><circle cx='134' cy='52' r='11'/><path d='M134 63v26M134 89l-8 24M134 89l8 24'/><path d='M124 72l-14-6'/><rect x='48' y='60' width='16' height='7' rx='3.5' fill='var(--acc)' opacity='.45'/><rect x='48' y='60' width='16' height='7' rx='3.5'/><rect x='102' y='60' width='16' height='7' rx='3.5' fill='var(--acc)' opacity='.45'/><rect x='102' y='60' width='16' height='7' rx='3.5'/><path d='M10 132h140' opacity='.4'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A relay baton going hand to hand, one runner per leg.</p><div class=\"an-lab\">The analogy</div><p>Nobody runs the whole race carrying everything. Leg one finds the problems. Leg two writes the fixes for exactly those problems. Each runner has one job and starts from what the last one handed over.</p><div class=\"an-snap\"><b>So on the exam →</b> Break a complex task into sequential focused prompts, each consuming the previous step's output. More focused and more consistent than one giant prompt.</div></div></div></div>\n<p>Prompt chaining breaks a complex task into a sequence of focused steps:</p>\n<pre><code>Step 1: Analyze auth.ts (local issues only)\n       -&gt; Output: list of issues in auth.ts\n\nStep 2: Analyze database.ts (local issues only)\n       -&gt; Output: list of issues in database.ts\n\nStep 3: Integration pass (cross-file dependencies)\n       -&gt; Output: issues at module boundaries\n</code></pre>\n<p><strong>Why this matters:</strong>\n- Avoids <strong>attention dilution</strong>—when the model receives too many files at once, it may miss bugs in some files while providing shallow commentary on others\n- Ensures consistent analysis quality per file\n- Allows separate analysis of cross-file interactions</p>\n<p><strong>When to use prompt chaining vs dynamic decomposition:</strong>\n- <strong>Prompt chaining</strong> — predictable, repeatable tasks (code review, file migrations)\n- <strong>Dynamic decomposition</strong> — open-ended investigations where subtasks become clear only during execution</p>\n<h2 id=\"s-6-4-the-interview-pattern\">6.4 The “Interview” Pattern</h2><div class=\"an\" style=\"--acc:var(--w-intern)\" data-an=\"6.4\"><div class=\"an-top\"><span class=\"an-w\">Training an intern</span><span class=\"an-t\">§6.4</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx='44' cy='42' r='14'/><path d='M44 56v30M44 86l-9 26M44 86l9 26M30 68h28'/><rect x='72' y='20' width='72' height='48' rx='6' fill='var(--acc)' opacity='.15'/><path d='M72 20h72v48H72z'/><path d='M72 68l-14 12 4-12' fill='none'/><path d='M84 34h48M84 44h48M84 54h30' opacity='.7'/><circle cx='138' cy='30' r='3' fill='currentColor' stroke='none'/><path d='M96 96h56' opacity='.4' stroke-dasharray='4 4'/><path d='M104 116c0-8 8-12 12-8s-2 9-3 12v3' opacity='.6'/><circle cx='113' cy='134' r='1.8' fill='currentColor'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">The intern asking four questions before touching the keyboard.</p><div class=\"an-lab\">The analogy</div><p>Three drafts came back, each missing something different, because nobody in the room knew what to specify. One round of them interviewing you costs a single turn and surfaces all four unknowns at once.</p><div class=\"an-snap\"><b>So on the exam →</b> For an underspecified brief in a domain you do not know well, have Claude interview you first. One interview turn replaces several correction cycles.</div></div></div></div>\n<p>Before implementing a solution, Claude asks clarifying questions:</p>\n<pre><code>Claude: &quot;Before implementing caching for the API, a few questions:\n1. Which cache invalidation strategy do you prefer—TTL or event-based?\n2. Is stale data acceptable when the cache is unavailable?\n3. Should caching be per-user or global?\n4. What is the expected data volume to cache?&quot;\n</code></pre>\n<p><strong>When this is useful:</strong>\n- Unfamiliar domain (fintech, healthcare, legal systems)\n- Tasks with non-obvious implications (cache strategies, failure modes)\n- Multiple viable approaches where the best choice depends on context</p>\n<h2 id=\"s-6-5-validation-and-retry-with-feedback\">6.5 Validation and Retry-with-Feedback</h2><div class=\"an\" style=\"--acc:var(--w-intern)\" data-an=\"6.5\"><div class=\"an-top\"><span class=\"an-w\">Training an intern</span><span class=\"an-t\">§6.5</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='16' y='20' width='72' height='92' rx='5'/><path d='M26 38h52M26 50h52M26 62h52' opacity='.55'/><rect x='24' y='74' width='56' height='16' rx='3' fill='var(--acc)' opacity='.22'/><path d='M24 74h56v16H24z'/><path d='M32 82h18M58 82h14' opacity='.8'/><ellipse cx='52' cy='82' rx='34' ry='14' stroke-width='2.2' opacity='.85'/><path d='M104 44a30 30 0 1 0 12-14' /><path d='M100 24l6 18 18-6' /><path d='M108 88h40M108 100h40M108 112h24' opacity='.45'/><circle cx='128' cy='68' r='4' fill='var(--acc)' opacity='.5'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Work handed back with the specific line circled in red, not a shrug.</p><div class=\"an-lab\">The analogy</div><p>'Do it again' teaches nothing. 'Your total says 150, the line items add to 145' fixes it on the next pass. And if the number was never on the invoice in the first place, no amount of handing it back will conjure one.</p><div class=\"an-snap\"><b>So on the exam →</b> Send the original input, the failed output and the specific validation error. Retry fixes format, structure and arithmetic — never genuinely absent information.</div></div></div></div>\n<p>When extracted data fails validation:</p>\n<pre><code>Step 1: Extract data from the document\nStep 2: Validate (Pydantic, JSON Schema, business rules)\nStep 3: If there's an error—retry with context:\n  - The original document\n  - The previous (incorrect) extraction\n  - The specific error: &quot;Field 'total' = 150, but sum(line_items) = 145. Re-check values.&quot;\n</code></pre>\n<p><strong>When retry will be effective:</strong>\n- Format errors (date in the wrong format)\n- Structural errors (a field placed in the wrong location)\n- Arithmetic inconsistencies (the model can re-check)</p>\n<p><strong>When retry will NOT help:</strong>\n- The information is absent from the source document\n- The required context is external (the data is in another document not provided)</p>\n<p><strong>Pydantic as a validation tool:</strong>\nPydantic is a Python library for schema-based data validation. For the exam, the key points are:\n- <strong>Structural validation:</strong> types, requiredness, enum constraints checked in code after receiving JSON from Claude\n- <strong>Semantic validation:</strong> custom validators enforce business logic (sum of items equals total; start_date &lt; end_date)\n- <strong>Validate–retry loops:</strong> on Pydantic validation failure, construct an error message and re-prompt Claude with the error context\n- <strong>JSON Schema generation:</strong> Pydantic models can generate JSON Schema for <code>tool_use</code>, providing a single source of truth</p>\n<h2 id=\"s-6-6-self-correction\">6.6 Self-correction</h2><div class=\"an\" style=\"--acc:var(--w-intern)\" data-an=\"6.6\"><div class=\"an-top\"><span class=\"an-w\">Training an intern</span><span class=\"an-t\">§6.6</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='14' y='26' width='132' height='108' rx='6'/><path d='M80 26v108' opacity='.35'/><path d='M26 44h40M26 56h40M26 68h28' opacity='.55'/><path d='M92 44h40M92 56h40M92 68h28' opacity='.55'/><text x='46' y='96' font-size='15' fill='currentColor' stroke='none' text-anchor='middle' font-family='monospace'>150</text><text x='114' y='96' font-size='15' fill='currentColor' stroke='none' text-anchor='middle' font-family='monospace'>145</text><rect x='58' y='106' width='44' height='18' rx='4' fill='var(--acc)' opacity='.3'/><path d='M58 106h44v18H58z'/><path d='M66 115l5 5 9-10'/><path d='M46 100v-8M114 100v-8' opacity='.4'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Two totals written side by side, with a box that ticks when they disagree.</p><div class=\"an-lab\">The analogy</div><p>You do not ask the intern 'are you sure?' — they will say yes. You make them write down the total as printed, then add the items up themselves, and put both numbers on the form. The disagreement becomes a field, not a feeling.</p><div class=\"an-snap\"><b>So on the exam →</b> Build the re-derivation into the output schema: <code>stated_total</code>, <code>calculated_total</code>, <code>conflict_detected</code>. Structural, not a conversational follow-up.</div></div></div></div>\n<p>A pattern for detecting internal contradictions:</p>\n<pre><code class=\"language-json\">{\n  &quot;stated_total&quot;: &quot;$150.00&quot;,\n  &quot;calculated_total&quot;: &quot;$145.00&quot;,\n  &quot;conflict_detected&quot;: true,\n  &quot;line_items&quot;: [\n    {&quot;name&quot;: &quot;Widget A&quot;, &quot;price&quot;: 75.00},\n    {&quot;name&quot;: &quot;Widget B&quot;, &quot;price&quot;: 70.00}\n  ]\n}\n</code></pre>\n<p>The model extracts both the stated value and a computed value—if they differ, <code>conflict_detected</code> allows you to handle the discrepancy.</p>\n<hr />", "concepts": ["6.1", "6.2", "6.3", "6.4", "6.5", "6.6"], "keywords": "Chapter 6: Prompt Engineering — Advanced Techniques 6.1 Few-shot Prompting 6.2 Explicit Criteria vs Vague Instructions 6.3 Prompt Chaining 6.4 The “Interview” Pattern 6.5 Validation and Retry-with-Feedback 6.6 Self-correction"}, {"id": "ch7", "group": "Part I · Theory", "title": "Message Batches API", "short": "Ch7", "num": "7", "html": "<h1 id=\"s-chapter-7-message-batches-api\">Chapter 7: Message Batches API</h1>\n<blockquote>\n<p>Documentation: <a href=\"https://platform.claude.com/docs/en/build-with-claude/message-batches\">Message Batches</a></p>\n</blockquote>\n<h2 id=\"s-7-1-overview\">7.1 Overview</h2><div class=\"an\" style=\"--acc:var(--w-laundry)\" data-an=\"7.1\"><div class=\"an-top\"><span class=\"an-w\">The launderette</span><span class=\"an-t\">§7.1</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='20' y='52' width='120' height='82' rx='8'/><path d='M20 74h120' opacity='.45'/><circle cx='80' cy='104' r='24'/><circle cx='80' cy='104' r='16' fill='var(--acc)' opacity='.2'/><circle cx='34' cy='63' r='4' fill='currentColor' stroke='none'/><circle cx='48' cy='63' r='4'/><path d='M40 20h80l-8 32H48z' fill='var(--acc)' opacity='.14'/><path d='M40 20h80l-8 32H48z'/><text x='80' y='42' font-size='14' fill='currentColor' stroke='none' text-anchor='middle' font-family='monospace'>-50%</text><path d='M112 90a20 20 0 1 1-8-10' opacity='.5'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A service counter: half price, back within twenty-four hours.</p><div class=\"an-lab\">The analogy</div><p>You hand over the bag and walk away. It comes back for half what the express counter charges. Nobody at any point tells you when.</p><div class=\"an-snap\"><b>So on the exam →</b> The Batch API processes asynchronously at 50% of the cost, with a window of up to 24 hours.</div></div></div></div>\n<p>The Message Batches API lets you submit batches of requests for asynchronous processing:</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Attribute</th>\n<th>Value</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Savings</td>\n<td><strong>50%</strong> compared to synchronous calls</td>\n</tr>\n<tr>\n<td>Processing window</td>\n<td>Up to <strong>24 hours</strong> (no latency SLA guarantee)</td>\n</tr>\n<tr>\n<td>Multi-turn tool calling</td>\n<td><strong>Not supported</strong> (one request = one response)</td>\n</tr>\n<tr>\n<td>Correlation</td>\n<td><code>custom_id</code> field to link request and response</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"s-7-2-when-to-use-batch-api-vs-synchronous-api\">7.2 When to Use Batch API vs Synchronous API</h2><div class=\"an\" style=\"--acc:var(--w-laundry)\" data-an=\"7.2\"><div class=\"an-top\"><span class=\"an-w\">The launderette</span><span class=\"an-t\">§7.2</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M18 66c0-10 10-18 26-18s26 8 26 18v58c0 6-6 10-26 10s-26-4-26-10z' fill='var(--acc)' opacity='.14'/><path d='M18 66c0-10 10-18 26-18s26 8 26 18v58c0 6-6 10-26 10s-26-4-26-10z'/><path d='M32 48c4-8 20-8 24 0'/><path d='M28 84h32M28 98h32' opacity='.5'/><path d='M18 30h52' opacity='.4' stroke-dasharray='4 4'/><path d='M104 44l16-10 16 10-8 12h-16z'/><path d='M112 56v62h32V56'/><path d='M120 74h16M120 88h16' opacity='.5'/><circle cx='128' cy='24' r='12'/><path d='M128 16v8l6 4'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">The overnight bag versus the shirt you need pressed while you wait.</p><div class=\"an-lab\">The analogy</div><p>Bedding, towels, the winter coat — all of that goes in the overnight bag and you save half. The shirt for the interview in forty minutes does not go in the overnight bag, no matter what it costs.</p><div class=\"an-snap\"><b>So on the exam →</b> Batch for non-blocking, latency-tolerant work: overnight reports, weekly audits, bulk document runs. Synchronous for anything a human or a pipeline is waiting on.</div></div></div></div>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Task</th>\n<th>API</th>\n<th>Why</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Pre-merge PR check</td>\n<td><strong>Synchronous</strong></td>\n<td>The developer is waiting; 24 hours is unacceptable</td>\n</tr>\n<tr>\n<td>Overnight tech-debt report</td>\n<td><strong>Batch</strong></td>\n<td>Result is needed by morning; 50% savings</td>\n</tr>\n<tr>\n<td>Weekly security audit</td>\n<td><strong>Batch</strong></td>\n<td>Not urgent; 50% savings</td>\n</tr>\n<tr>\n<td>Interactive code review</td>\n<td><strong>Synchronous</strong></td>\n<td>Immediate response required</td>\n</tr>\n<tr>\n<td>Processing 10,000 documents</td>\n<td><strong>Batch</strong></td>\n<td>Bulk processing; savings are significant</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"s-7-3-using-custom-id\">7.3 Using <code>custom_id</code></h2><div class=\"an\" style=\"--acc:var(--w-laundry)\" data-an=\"7.3\"><div class=\"an-top\"><span class=\"an-w\">The launderette</span><span class=\"an-t\">§7.3</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='12' y='30' width='40' height='30' rx='4'/><rect x='12' y='30' width='40' height='30' rx='4' fill='var(--acc)' opacity='.16'/><path d='M20 40h24M20 50h14' opacity='.7'/><rect x='60' y='30' width='40' height='30' rx='4'/><path d='M68 40h24M68 50h14' opacity='.7'/><rect x='108' y='30' width='40' height='30' rx='4'/><path d='M116 40h24M116 50h14' opacity='.7'/><path d='M32 62v16M80 62v16M128 62v16' opacity='.4' stroke-dasharray='3 4'/><rect x='20' y='84' width='120' height='30' rx='6'/><circle cx='44' cy='99' r='8'/><circle cx='80' cy='99' r='8'/><circle cx='116' cy='99' r='8'/><path d='M22 130h116' opacity='.35'/><path d='M36 122l4 8M74 122l-3 8M120 122l2 8' opacity='.6'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A name tag sewn into every shirt before it goes in the bag.</p><div class=\"an-lab\">The analogy</div><p>Forty shirts go in. Forty come back, in whatever order the machine felt like. Without a name tag you are holding up each one asking whose this is, and you will get it wrong.</p><div class=\"an-snap\"><b>So on the exam →</b> Results can arrive in any order. <code>custom_id</code> is the join key back to the originating request — never rely on ordering.</div></div></div></div>\n<pre><code class=\"language-json\">{\n  &quot;custom_id&quot;: &quot;doc-invoice-2024-001&quot;,\n  &quot;params&quot;: {\n    &quot;model&quot;: &quot;claude-sonnet-4-6&quot;,\n    &quot;max_tokens&quot;: 1024,\n    &quot;messages&quot;: [{&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: &quot;Extract data from: ...&quot;}]\n  }\n}\n</code></pre>\n<p><code>custom_id</code> allows you to:\n- Link the result to the original document\n- On failure, re-submit only the failed documents\n- Avoid re-processing successful documents</p>\n<h2 id=\"s-7-4-handling-failures-in-batches\">7.4 Handling Failures in Batches</h2><div class=\"an\" style=\"--acc:var(--w-laundry)\" data-an=\"7.4\"><div class=\"an-top\"><span class=\"an-w\">The launderette</span><span class=\"an-t\">§7.4</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='14' y='24' width='60' height='110' rx='6'/><path d='M24 40h40M24 54h40M24 68h40M24 82h40M24 96h40M24 110h40' opacity='.45'/><path d='M28 122l5 5 9-10' opacity='.9'/><rect x='90' y='24' width='56' height='48' rx='6' fill='var(--acc)' opacity='.18'/><path d='M90 24h56v48H90z'/><circle cx='104' cy='38' r='4' fill='var(--acc)'/><circle cx='118' cy='50' r='4' fill='var(--acc)'/><circle cx='132' cy='40' r='4' fill='var(--acc)'/><circle cx='110' cy='60' r='4' fill='var(--acc)'/><circle cx='128' cy='60' r='4' fill='var(--acc)'/><path d='M118 82v20'/><path d='M108 94l10 10 10-10'/><rect x='96' y='108' width='44' height='26' rx='5' stroke-dasharray='5 4'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Ninety-five clean shirts, five with a stain, and only five going back in.</p><div class=\"an-lab\">The analogy</div><p>You do not rewash the whole load because five came back marked. You pull the five, work out what the stain actually was, treat it, and send back exactly those five.</p><div class=\"an-snap\"><b>So on the exam →</b> Identify failures by <code>custom_id</code>, fix the cause — chunk the long documents, say — then re-submit only the failures. Re-sending all 100 pays twice for the 95.</div></div></div></div>\n<ol>\n<li>Submit a batch of 100 documents</li>\n<li>95 succeed; 5 fail (context limit exceeded)</li>\n<li>Identify failures by <code>custom_id</code></li>\n<li>Modify strategy (e.g., split long documents into chunks)</li>\n<li>Re-submit only the 5 failed documents</li>\n</ol>\n<h2 id=\"s-7-5-sla-planning\">7.5 SLA Planning</h2><div class=\"an hi\" style=\"--acc:var(--w-laundry)\" data-an=\"7.5\"><div class=\"an-top\"><span class=\"an-w\">The launderette</span><span class=\"an-t\">§7.5</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='16' y='30' width='128' height='104' rx='7'/><path d='M16 56h128' opacity='.5'/><path d='M44 30V18M116 30V18'/><path d='M32 70h20v18H32zM60 70h20v18H60zM88 70h20v18H88zM116 70h20v18h-20z' opacity='.3'/><rect x='32' y='70' width='20' height='18' rx='3' fill='var(--acc)' opacity='.4'/><path d='M32 70h20v18H32z'/><path d='M116 98h20v18h-20z'/><rect x='116' y='98' width='20' height='18' rx='3' fill='var(--acc)' opacity='.18'/><path d='M52 79h60' stroke-dasharray='5 4'/><path d='M106 73l8 6-8 6'/><text x='84' y='128' font-size='13' fill='currentColor' stroke='none' text-anchor='middle' font-family='monospace'>-24h</text></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A calendar with the drop-off marked a full day before the deadline.</p><div class=\"an-lab\">The analogy</div><p>'It usually comes back in an hour' is a story about the average day. The counter promises twenty-four. You plan against the promise, because the one time it takes twenty-three hours is the morning you needed it.</p><div class=\"an-snap\"><b>So on the exam →</b> Submission deadline = downstream deadline − 24h. Plan against the worst case, never the typical observed time.</div></div></div><div class=\"an-nem\"><span class=\"lab\">⚠ Your record · Missed on Exam 12 Q57</span>You chose a synchronous fallback. Batch has no latency SLA, so the plan is arithmetic, not a safety net: submission deadline = downstream deadline minus 24 hours.</div></div>\n<p>If you need a result in 30 hours and the Batch API can take up to 24 hours:\n- Submission window: 30 - 24 = <strong>6 hours</strong>\n- Batches must be submitted no later than 24 hours before the deadline\n- For frequent submissions, split into 4-hour windows</p>\n<hr />", "concepts": ["7.1", "7.2", "7.3", "7.4", "7.5"], "keywords": "Chapter 7: Message Batches API 7.1 Overview 7.2 When to Use Batch API vs Synchronous API 7.3 Using `custom_id` 7.4 Handling Failures in Batches 7.5 SLA Planning"}, {"id": "ch8", "group": "Part I · Theory", "title": "Task decomposition strategies", "short": "Ch8", "num": "8", "html": "<h1 id=\"s-chapter-8-task-decomposition-strategies\">Chapter 8: Task Decomposition Strategies</h1>\n<h2 id=\"s-8-1-fixed-pipelines-prompt-chaining\">8.1 Fixed Pipelines (Prompt Chaining)</h2><div class=\"an\" style=\"--acc:var(--w-road)\" data-an=\"8.1\"><div class=\"an-top\"><span class=\"an-w\">The road trip</span><span class=\"an-t\">§8.1</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='30' y='16' width='100' height='128' rx='6' fill='var(--acc)' opacity='.1'/><path d='M30 16h100v128H30z'/><circle cx='52' cy='40' r='6'/><circle cx='52' cy='68' r='6'/><circle cx='52' cy='96' r='6'/><circle cx='52' cy='124' r='6'/><path d='M52 46v16M52 74v16M52 102v16'/><path d='M68 40h44M68 68h44M68 96h32M68 124h44' opacity='.7'/><path d='M30 16h100' stroke-width='3'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A printed itinerary with every stop already listed.</p><div class=\"an-lab\">The analogy</div><p>Same route every time. Same five stops, same order, and you can hand the sheet to anyone and get the same trip back. Perfect when the road genuinely does not change.</p><div class=\"an-snap\"><b>So on the exam →</b> Use a fixed sequential pipeline when the structure is predictable and every step is known in advance — reviews that always follow one template.</div></div></div></div>\n<p>Each step is defined in advance:</p>\n<pre><code>Document -&gt; Metadata extraction -&gt; Data extraction -&gt; Validation -&gt; Enrichment -&gt; Final output\n</code></pre>\n<p><strong>When to use:</strong>\n- The task structure is predictable (reviews always follow the same template)\n- All steps are known up front\n- You need stability and reproducibility</p>\n<h2 id=\"s-8-2-dynamic-adaptive-decomposition\">8.2 Dynamic Adaptive Decomposition</h2><div class=\"an\" style=\"--acc:var(--w-road)\" data-an=\"8.2\"><div class=\"an-top\"><span class=\"an-w\">The road trip</span><span class=\"an-t\">§8.2</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M20 138c14-30 6-46 24-58s34 4 46-14 14-30 26-40' stroke-dasharray='0'/><path d='M56 66l-10-4M56 66l-2-10' opacity='.7'/><circle cx='20' cy='138' r='6' fill='var(--acc)' opacity='.5'/><circle cx='20' cy='138' r='6'/><circle cx='116' cy='26' r='7'/><path d='M112 26h8M116 22v8' opacity='.7'/><path d='M74 96h44' stroke-dasharray='5 4' opacity='.4'/><path d='M84 84h26l-6 12h-26z' fill='var(--acc)' opacity='.35'/><path d='M84 84h26l-6 12H78z'/><path d='M96 108v-12' opacity='.6'/><path d='M126 76l14-6M132 96l14 2' opacity='.4'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A satnav rerouting the moment a road closes.</p><div class=\"an-lab\">The analogy</div><p>You know roughly where you are going. You do not know that the bridge is shut until you get to the bridge. The plan for the rest of the journey is written after you find out.</p><div class=\"an-snap\"><b>So on the exam →</b> Generate subtasks from what earlier steps discover. Correct when the scope is unknown up front — mapping a legacy codebase before deciding what to test.</div></div></div></div>\n<p>Subtasks are generated based on intermediate results:</p>\n<pre><code>1. &quot;Add tests for a legacy codebase&quot;\n2. -&gt; First: map the structure (Glob, Grep)\n3. -&gt; Found: 3 modules with no tests, 2 with partial coverage\n4. -&gt; Prioritize: start with the payments module (high risk)\n5. -&gt; During work: discovered a dependency on an external API\n6. -&gt; Adapt: add a mock for the external API before writing tests\n</code></pre>\n<p><strong>When to use:</strong>\n- Open-ended investigative tasks\n- When the full scope is unknown up front\n- When each step depends on the results of the previous step</p>\n<h2 id=\"s-8-3-multi-pass-code-review\">8.3 Multi-pass Code Review</h2><div class=\"an\" style=\"--acc:var(--w-road)\" data-an=\"8.3\"><div class=\"an-top\"><span class=\"an-w\">The road trip</span><span class=\"an-t\">§8.3</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M16 24h40v40H16zM60 24h40v40H60zM104 24h40v40h-40z'/><path d='M24 38h24M24 48h16M68 38h24M68 48h16M112 38h24M112 48h16' opacity='.55'/><path d='M22 58l4 4 7-8M66 58l4 4 7-8M110 58l4 4 7-8' opacity='.85'/><rect x='16' y='84' width='128' height='54' rx='6' fill='var(--acc)' opacity='.12'/><path d='M16 84h128v54H16z'/><path d='M36 100v22M76 100v22M116 100v22' opacity='.5'/><path d='M36 111h40M76 111h40'/><path d='M64 105l8 6-8 6M104 105l8 6-8 6'/><path d='M36 68v12M80 68v12M124 68v12' opacity='.4' stroke-dasharray='3 4'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">One pass per street, then one pass over the whole map for the one-way conflicts.</p><div class=\"an-lab\">The analogy</div><p>Survey fourteen streets in a single sweep and you will do three of them properly and glance at the rest. Do them one at a time, then take one more run over the whole map looking only for where they contradict each other.</p><div class=\"an-snap\"><b>So on the exam →</b> Per-file passes for local issues, then a separate integration pass for cross-file problems. A bigger context window does not fix attention dilution.</div></div></div></div>\n<p>For pull requests with 10+ files:</p>\n<pre><code>Pass 1 (per-file): Analyze auth.ts -&gt; list local issues\nPass 1 (per-file): Analyze database.ts -&gt; list local issues\nPass 1 (per-file): Analyze routes.ts -&gt; list local issues\n...\nPass 2 (integration): Analyze relationships between files\n  -&gt; Cross-file issues: inconsistent types, circular dependencies\n</code></pre>\n<p><strong>Why a single pass over 14 files is bad:</strong>\n- Attention dilution: deep analysis for some files, shallow for others\n- Inconsistent comments: a pattern is flagged in one file but approved in another\n- Missed bugs: obvious errors get skipped due to cognitive overload</p>\n<hr />", "concepts": ["8.1", "8.2", "8.3"], "keywords": "Chapter 8: Task Decomposition Strategies 8.1 Fixed Pipelines (Prompt Chaining) 8.2 Dynamic Adaptive Decomposition 8.3 Multi-pass Code Review"}, {"id": "ch9", "group": "Part I · Theory", "title": "Escalation and human-in-the-loop", "short": "Ch9", "num": "9", "html": "<h1 id=\"s-chapter-9-escalation-and-human-in-the-loop\">Chapter 9: Escalation and Human-in-the-Loop</h1>\n<h2 id=\"s-9-1-when-to-escalate-to-a-human\">9.1 When to Escalate to a Human</h2><div class=\"an hi\" style=\"--acc:var(--w-triage)\" data-an=\"9.1\"><div class=\"an-top\"><span class=\"an-w\">The triage desk</span><span class=\"an-t\">§9.1</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='20' y='20' width='120' height='96' rx='6'/><path d='M20 42h120' opacity='.5'/><path d='M34 60l5 5 9-10M34 78l5 5 9-10M34 96l5 5 9-10'/><path d='M58 62h64M58 80h64M58 98h44' opacity='.7'/><rect x='34' y='28' width='16' height='8' rx='2' fill='var(--acc)' opacity='.5'/><path d='M60 32h50' opacity='.6'/><path d='M52 132c0-10 10-14 10-14M74 132h44' opacity='.35' stroke-dasharray='4 4'/><circle cx='62' cy='132' r='3' fill='currentColor' stroke='none' opacity='.4'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A triage board with four hard criteria on it, and no box for 'seems upset'.</p><div class=\"an-lab\">The analogy</div><p>The nurse escalates on things you can point at: the protocol does not cover this, they asked for the doctor by name, three attempts have failed, the decision is above the desk. Volume is not on the board.</p><div class=\"an-snap\"><b>So on the exam →</b> Escalate on structural signals — policy gap, explicit request for a human, no progress after real attempts, high-stakes ambiguity.</div></div></div><div class=\"an-nem\"><span class=\"lab\">⚠ Your record · Both directions have cost you a paper</span>Exam 11 escalated an ambiguity that one question would have resolved. Escalate on structural signals &mdash; policy gap, an explicit request for a human, repeated failure. Not on how upset someone sounds, and not on a model's own confidence score.</div></div>\n<p><strong>Escalation triggers (clear rules):</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Situation</th>\n<th>Action</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>The customer explicitly asks “get me a manager”</td>\n<td>Escalate immediately; do not attempt to solve</td>\n</tr>\n<tr>\n<td>Policy does not cover the request</td>\n<td>Escalate (e.g., competitor price matching when policy is silent)</td>\n</tr>\n<tr>\n<td>The agent cannot make progress</td>\n<td>Escalate after a reasonable number of attempts</td>\n</tr>\n<tr>\n<td>Financial operation above a threshold</td>\n<td>Escalate (preferably enforced via a hook, not a prompt)</td>\n</tr>\n<tr>\n<td>Multiple matches when searching for a customer</td>\n<td>Ask for additional identifiers; do not guess</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>What is NOT a reliable trigger:</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Unreliable method</th>\n<th>Why it fails</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Sentiment analysis</td>\n<td>Customer mood does not correlate with case complexity</td>\n</tr>\n<tr>\n<td>Model self-rated confidence (1–10)</td>\n<td>The model can be confidently wrong; calibration is poor</td>\n</tr>\n<tr>\n<td>An automatic classifier</td>\n<td>Overengineering; may require training data you don’t have</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"s-9-2-escalation-patterns\">9.2 Escalation Patterns</h2><div class=\"an\" style=\"--acc:var(--w-triage)\" data-an=\"9.2\"><div class=\"an-top\"><span class=\"an-w\">The triage desk</span><span class=\"an-t\">§9.2</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx='40' cy='40' r='14'/><path d='M40 54v30M40 84l-9 26M40 84l9 26M26 66h28'/><path d='M58 24c8-4 16-4 22 0M62 34c6-3 12-3 16 0' opacity='.8'/><circle cx='120' cy='40' r='14'/><path d='M120 54v30M120 84l-9 26M120 84l9 26M106 66h28'/><rect x='84' y='16' width='34' height='22' rx='5' fill='var(--acc)' opacity='.25'/><path d='M84 16h34v22H84z'/><path d='M92 26h18' opacity='.8'/><path d='M96 38l-6 8 12-8' fill='none'/><path d='M10 128h140' opacity='.35'/><path d='M28 118h24' opacity='.5' stroke-dasharray='3 4'/><path d='M108 118h24'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Someone shouting who can be helped, next to someone quietly asking for the doctor.</p><div class=\"an-lab\">The analogy</div><p>The loud one usually has a problem you can fix in ninety seconds. Acknowledge it, offer the fix, and only move them along if they ask a second time. The quiet request for the doctor goes through immediately, first time of asking.</p><div class=\"an-snap\"><b>So on the exam →</b> An explicit request for a human escalates at once. Frustration alone does not — acknowledge, offer a resolution, and escalate if they reiterate.</div></div></div></div>\n<p><strong>Immediate escalation:</strong></p>\n<pre><code>Customer: &quot;I want to speak to a manager&quot;\nAgent: [immediately calls escalate_to_human]\nNOT: &quot;I can help with your issue, let me...&quot;\n</code></pre>\n<p><strong>Escalation after an attempt to resolve:</strong></p>\n<pre><code>Customer: &quot;My refrigerator broke two days after purchase&quot;\nAgent: [checks the order, offers a warranty replacement]\nIf the customer is not satisfied -&gt; escalate\n</code></pre>\n<p><strong>Nuanced escalation (acknowledge → resolve → escalate on reiteration):</strong></p>\n<pre><code>Customer: &quot;This is outrageous, I'm very unhappy with the quality!&quot;\nAgent: [acknowledges frustration] &quot;I understand your frustration.&quot;\n       [offers resolution] &quot;I can offer a replacement or a refund.&quot;\nCustomer: &quot;No, I want to talk to someone!&quot;\nAgent: [customer insists again -&gt; immediate escalation]\n</code></pre>\n<p>Key principle: acknowledge emotion first, then propose a concrete solution, and only escalate if the customer reiterates the desire for a human. Do not escalate on the first expression of dissatisfaction (that is not the same as requesting a manager).</p>\n<p><strong>Escalation for a policy gap:</strong></p>\n<pre><code>Customer: &quot;Competitor X has this item 30% cheaper—give me a discount&quot;\nPolicy: covers price adjustments only on your own site\nAgent: [escalates — policy does not cover competitor price matching]\n</code></pre>\n<h2 id=\"s-9-3-structured-handoff-protocols\">9.3 Structured Handoff Protocols</h2><div class=\"an\" style=\"--acc:var(--w-triage)\" data-an=\"9.3\"><div class=\"an-top\"><span class=\"an-w\">The triage desk</span><span class=\"an-t\">§9.3</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='40' y='14' width='80' height='104' rx='6' fill='var(--acc)' opacity='.12'/><path d='M40 14h80v104H40z'/><rect x='62' y='6' width='36' height='16' rx='4'/><path d='M52 42h24M84 42h24M52 58h56M52 74h40M52 90h56' opacity='.7'/><path d='M52 42h24' stroke-width='3'/><circle cx='30' cy='128' r='11'/><path d='M30 139h-8M30 139h8' opacity='.6'/><circle cx='130' cy='128' r='11'/><path d='M130 139h-8M130 139h8' opacity='.6'/><path d='M44 128h72' stroke-dasharray='5 4'/><path d='M106 122l8 6-8 6'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">The handover sheet the next shift reads, because they never saw the patient arrive.</p><div class=\"an-lab\">The analogy</div><p>The incoming nurse was not there for any of it. Everything they will ever know is on that one sheet: who, what is wrong, what has already been tried, what you recommend. A shrug and 'they're upset about something' is not a handover.</p><div class=\"an-snap\"><b>So on the exam →</b> The human has no transcript access. The summary must carry customer ID, root cause, the amount, actions already taken and a recommended action.</div></div></div></div>\n<p>On escalation, the agent should pass a structured summary to a human:</p>\n<pre><code class=\"language-json\">{\n  &quot;customer_id&quot;: &quot;CUST-12345&quot;,\n  &quot;customer_name&quot;: &quot;Ivan Petrov&quot;,\n  &quot;issue_summary&quot;: &quot;Refund request for a damaged item&quot;,\n  &quot;order_id&quot;: &quot;ORD-67890&quot;,\n  &quot;root_cause&quot;: &quot;Item arrived damaged; photos attached&quot;,\n  &quot;actions_taken&quot;: [\n    &quot;Verified customer via get_customer&quot;,\n    &quot;Confirmed order via lookup_order&quot;,\n    &quot;Offered a standard replacement — customer insists on a refund&quot;\n  ],\n  &quot;refund_amount&quot;: &quot;$89.99&quot;,\n  &quot;recommended_action&quot;: &quot;Approve a full refund&quot;,\n  &quot;escalation_reason&quot;: &quot;Customer requested to speak with a manager&quot;\n}\n</code></pre>\n<p>The human operator does not have access to the full conversation transcript—they only see this summary. Therefore it must be complete and self-contained.</p>\n<h2 id=\"s-9-4-confidence-calibration-and-human-oversight\">9.4 Confidence Calibration and Human Oversight</h2><div class=\"an\" style=\"--acc:var(--w-triage)\" data-an=\"9.4\"><div class=\"an-top\"><span class=\"an-w\">The triage desk</span><span class=\"an-t\">§9.4</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M16 118h128' /><path d='M16 118V26' /><path d='M32 118V64h18v54zM58 118V52h18v66zM84 118V46h18v72zM110 118V96h18v22z' fill='var(--acc)' opacity='.18'/><path d='M32 118V64h18v54zM58 118V52h18v66zM84 118V46h18v72z'/><path d='M110 118V96h18v22z' stroke-width='3'/><path d='M16 58h128' stroke-dasharray='6 5' opacity='.6'/><text x='138' y='52' font-size='11' fill='currentColor' stroke='none' text-anchor='end' font-family='monospace'>97%</text><path d='M119 90V78' opacity='.7'/><circle cx='119' cy='72' r='2' fill='currentColor' stroke='none'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">An overall pass rate of 97%, and one ward inside it running at 60%.</p><div class=\"an-lab\">The analogy</div><p>The hospital-wide number looks excellent, and it is hiding one ward where things go wrong four times in ten. You do not find that by staring harder at the average — you find it by checking each ward on its own.</p><div class=\"an-snap\"><b>So on the exam →</b> Score confidence per field, tune thresholds against labelled data, and sample the automated stream in a stratified way. Aggregate accuracy hides per-segment failure.</div></div></div></div>\n<p>For data extraction systems:</p>\n<ol>\n<li><strong>Field-level confidence scores:</strong> the model outputs a confidence score per extracted field</li>\n<li><strong>Calibration:</strong> use labeled validation sets to tune thresholds</li>\n<li><strong>Routing:</strong>\n   - High confidence + stable accuracy -&gt; automated processing\n   - Low confidence or ambiguous sources -&gt; human review</li>\n</ol>\n<p><strong>Stratified random sampling:</strong>\n- Even for high-confidence extractions, regularly audit a sample\n- An aggregate 97% accuracy can hide 40% errors for a particular document type\n- Analyze accuracy by document type and by field, not only overall</p>\n<hr />", "concepts": ["9.1", "9.2", "9.3", "9.4"], "keywords": "Chapter 9: Escalation and Human-in-the-Loop 9.1 When to Escalate to a Human 9.2 Escalation Patterns 9.3 Structured Handoff Protocols 9.4 Confidence Calibration and Human Oversight"}, {"id": "ch10", "group": "Part I · Theory", "title": "Error handling in multi-agent systems", "short": "Ch10", "num": "10", "html": "<h1 id=\"s-chapter-10-error-handling-in-multi-agent-systems\">Chapter 10: Error Handling in Multi-agent Systems</h1>\n<h2 id=\"s-10-1-error-categories\">10.1 Error Categories</h2><div class=\"an\" style=\"--acc:var(--w-radio)\" data-an=\"10.1\"><div class=\"an-top\"><span class=\"an-w\">The ship&#x27;s radio</span><span class=\"an-t\">§10.1</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='16' y='34' width='128' height='92' rx='8'/><path d='M16 58h128' opacity='.45'/><circle cx='44' cy='84' r='13' fill='var(--acc)' opacity='.4'/><circle cx='44' cy='84' r='13'/><circle cx='78' cy='84' r='13'/><circle cx='112' cy='84' r='13' fill='var(--acc)' opacity='.2'/><circle cx='112' cy='84' r='13'/><circle cx='61' cy='112' r='7'/><circle cx='95' cy='112' r='7'/><path d='M30 46h24M62 46h24M94 46h36' opacity='.6'/><path d='M44 78v6M78 78v6M112 78v6' opacity='.65'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Four lamps on the bridge panel, and each one starts a different drill.</p><div class=\"an-lab\">The analogy</div><p>Squall passing — hold and try again. Wrong coordinates typed — fix the numbers, do not repeat them. Harbour refusing entry on the rules — no amount of asking changes it. No key for the door — go and find someone who has one.</p><div class=\"an-snap\"><b>So on the exam →</b> Transient → retry. Validation → fix the input. Business → explain the outcome, never retry. Permission → escalate or change credentials.</div></div></div></div>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Category</th>\n<th>Examples</th>\n<th>Retryable</th>\n<th>Agent action</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Transient</strong></td>\n<td>Timeout, 503, network failure</td>\n<td>Yes</td>\n<td>Retry with exponential backoff</td>\n</tr>\n<tr>\n<td><strong>Validation</strong></td>\n<td>Invalid input format, missing required field</td>\n<td>No (fix input)</td>\n<td>Modify request and retry</td>\n</tr>\n<tr>\n<td><strong>Business</strong></td>\n<td>Policy violation, threshold exceeded</td>\n<td>No</td>\n<td>Explain to the user; propose an alternative</td>\n</tr>\n<tr>\n<td><strong>Permission</strong></td>\n<td>Access denied</td>\n<td>No</td>\n<td>Escalate</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"s-10-2-error-handling-anti-patterns\">10.2 Error-handling Anti-patterns</h2><div class=\"an\" style=\"--acc:var(--w-radio)\" data-an=\"10.2\"><div class=\"an-top\"><span class=\"an-w\">The ship&#x27;s radio</span><span class=\"an-t\">§10.2</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M20 96h120l-16 34H36z' fill='var(--acc)' opacity='.14'/><path d='M20 96h120l-16 34H36z'/><path d='M76 96V34l44 22-44 18' /><path d='M64 96V52' opacity='.6'/><path d='M28 112c10 6 20 6 30 0s20-6 30 0 20 6 30 0' opacity='.5'/><circle cx='48' cy='68' r='11'/><path d='M48 79v10' opacity='.6'/><path d='M40 62l5 5 8-9' opacity='.9'/><path d='M118 24l10 10M128 24l-10 10' stroke-width='2.6'/><path d='M108 44h34' opacity='.4' stroke-dasharray='4 4'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A crew member who radios 'all fine' with the engine room already flooding.</p><div class=\"an-lab\">The analogy</div><p>Two ways to sink a ship. Say nothing and hope somebody notices the list. Or abandon the whole vessel because one pump failed. Both are on the panel; neither is on the training course.</p><div class=\"an-snap\"><b>So on the exam →</b> Never catch an error and return success. Never terminate the whole workflow for one subagent failure. Never hand back a bare 'failed' with nothing attached.</div></div></div></div>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Anti-pattern</th>\n<th>Problem</th>\n<th>Correct approach</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Generic status “search unavailable”</td>\n<td>The coordinator can’t decide how to recover</td>\n<td>Return error type, query, partial results, alternatives</td>\n</tr>\n<tr>\n<td>Sile
