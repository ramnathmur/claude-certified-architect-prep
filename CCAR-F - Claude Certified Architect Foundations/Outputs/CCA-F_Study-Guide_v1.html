oke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M16 118h128' /><path d='M16 118V26' /><path d='M32 118V64h18v54zM58 118V52h18v66zM84 118V46h18v72zM110 118V96h18v22z' fill='var(--acc)' opacity='.18'/><path d='M32 118V64h18v54zM58 118V52h18v66zM84 118V46h18v72z'/><path d='M110 118V96h18v22z' stroke-width='3'/><path d='M16 58h128' stroke-dasharray='6 5' opacity='.6'/><text x='138' y='52' font-size='11' fill='currentColor' stroke='none' text-anchor='end' font-family='monospace'>97%</text><path d='M119 90V78' opacity='.7'/><circle cx='119' cy='72' r='2' fill='currentColor' stroke='none'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">An overall pass rate of 97%, and one ward inside it running at 60%.</p><div class=\"an-lab\">The analogy</div><p>The hospital-wide number looks excellent, and it is hiding one ward where things go wrong four times in ten. You do not find that by staring harder at the average — you find it by checking each ward on its own.</p><div class=\"an-snap\"><b>So on the exam →</b> Score confidence per field, tune thresholds against labelled data, and sample the automated stream in a stratified way. Aggregate accuracy hides per-segment failure.</div></div></div></div>", "nemesis": false, "world": "The triage desk", "analogy": "The hospital-wide number looks excellent, and it is hiding one ward where things go wrong four times in ten. You do not find that by staring harder at the average — you find it by checking each ward on its own."}, {"id": "10.1", "title": "Error Categories", "picture": "Four lamps on the bridge panel, and each one starts a different drill.", "snapback": "Transient → retry. Validation → fix the input. Business → explain the outcome, never retry. Permission → escalate or change credentials.", "html": "<div class=\"an\" style=\"--acc:var(--w-radio)\" data-an=\"10.1\"><div class=\"an-top\"><span class=\"an-w\">The ship&#x27;s radio</span><span class=\"an-t\">§10.1</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='16' y='34' width='128' height='92' rx='8'/><path d='M16 58h128' opacity='.45'/><circle cx='44' cy='84' r='13' fill='var(--acc)' opacity='.4'/><circle cx='44' cy='84' r='13'/><circle cx='78' cy='84' r='13'/><circle cx='112' cy='84' r='13' fill='var(--acc)' opacity='.2'/><circle cx='112' cy='84' r='13'/><circle cx='61' cy='112' r='7'/><circle cx='95' cy='112' r='7'/><path d='M30 46h24M62 46h24M94 46h36' opacity='.6'/><path d='M44 78v6M78 78v6M112 78v6' opacity='.65'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Four lamps on the bridge panel, and each one starts a different drill.</p><div class=\"an-lab\">The analogy</div><p>Squall passing — hold and try again. Wrong coordinates typed — fix the numbers, do not repeat them. Harbour refusing entry on the rules — no amount of asking changes it. No key for the door — go and find someone who has one.</p><div class=\"an-snap\"><b>So on the exam →</b> Transient → retry. Validation → fix the input. Business → explain the outcome, never retry. Permission → escalate or change credentials.</div></div></div></div>", "nemesis": false, "world": "The ship's radio", "analogy": "Squall passing — hold and try again. Wrong coordinates typed — fix the numbers, do not repeat them. Harbour refusing entry on the rules — no amount of asking changes it. No key for the door — go and find someone who has one."}, {"id": "10.2", "title": "Error-handling Anti-patterns", "picture": "A crew member who radios 'all fine' with the engine room already flooding.", "snapback": "Never catch an error and return success. Never terminate the whole workflow for one subagent failure. Never hand back a bare 'failed' with nothing attached.", "html": "<div class=\"an\" style=\"--acc:var(--w-radio)\" data-an=\"10.2\"><div class=\"an-top\"><span class=\"an-w\">The ship&#x27;s radio</span><span class=\"an-t\">§10.2</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M20 96h120l-16 34H36z' fill='var(--acc)' opacity='.14'/><path d='M20 96h120l-16 34H36z'/><path d='M76 96V34l44 22-44 18' /><path d='M64 96V52' opacity='.6'/><path d='M28 112c10 6 20 6 30 0s20-6 30 0 20 6 30 0' opacity='.5'/><circle cx='48' cy='68' r='11'/><path d='M48 79v10' opacity='.6'/><path d='M40 62l5 5 8-9' opacity='.9'/><path d='M118 24l10 10M128 24l-10 10' stroke-width='2.6'/><path d='M108 44h34' opacity='.4' stroke-dasharray='4 4'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A crew member who radios 'all fine' with the engine room already flooding.</p><div class=\"an-lab\">The analogy</div><p>Two ways to sink a ship. Say nothing and hope somebody notices the list. Or abandon the whole vessel because one pump failed. Both are on the panel; neither is on the training course.</p><div class=\"an-snap\"><b>So on the exam →</b> Never catch an error and return success. Never terminate the whole workflow for one subagent failure. Never hand back a bare 'failed' with nothing attached.</div></div></div></div>", "nemesis": false, "world": "The ship's radio", "analogy": "Two ways to sink a ship. Say nothing and hope somebody notices the list. Or abandon the whole vessel because one pump failed. Both are on the panel; neither is on the training course."}, {"id": "10.3", "title": "A Structured Subagent Error", "picture": "A full radio call: what broke, what was tried, what still works, what to do next.", "snapback": "Return failure type, what was attempted, any partial results, and the alternatives worth trying. That is what lets the coordinator choose retry, reroute, continue or escalate.", "html": "<div class=\"an\" style=\"--acc:var(--w-radio)\" data-an=\"10.3\"><div class=\"an-top\"><span class=\"an-w\">The ship&#x27;s radio</span><span class=\"an-t\">§10.3</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='18' y='38' width='40' height='84' rx='6'/><rect x='26' y='50' width='24' height='18' rx='3' fill='var(--acc)' opacity='.25'/><path d='M26 50h24v18H26z'/><circle cx='32' cy='82' r='4'/><circle cx='44' cy='82' r='4'/><circle cx='32' cy='96' r='4'/><circle cx='44' cy='96' r='4'/><path d='M38 38V16'/><path d='M62 30a30 30 0 0 1 0 40M74 20a44 44 0 0 1 0 60' opacity='.7'/><rect x='88' y='40' width='58' height='80' rx='5' fill='var(--acc)' opacity='.1'/><path d='M88 40h58v80H88z'/><path d='M98 56h38M98 70h38M98 84h24M98 98h38' opacity='.75'/><path d='M98 56h14' stroke-width='3'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A full radio call: what broke, what was tried, what still works, what to do next.</p><div class=\"an-lab\">The analogy</div><p>'Problem down here' gets you nothing. 'Engine room flooding, valve three shut, pumps holding at forty per cent, recommend rerouting to the aft pumps' gets you a decision from the bridge in about four seconds.</p><div class=\"an-snap\"><b>So on the exam →</b> Return failure type, what was attempted, any partial results, and the alternatives worth trying. That is what lets the coordinator choose retry, reroute, continue or escalate.</div></div></div></div>", "nemesis": false, "world": "The ship's radio", "analogy": "'Problem down here' gets you nothing. 'Engine room flooding, valve three shut, pumps holding at forty per cent, recommend rerouting to the aft pumps' gets you a decision from the bridge in about four seconds."}, {"id": "10.4", "title": "Coverage Annotations in the Final Synthesis", "picture": "A chart with two areas surveyed properly and one marked 'sounding not taken'.", "snapback": "Complete the synthesis on what arrived, mark which conclusions are well supported and where the gaps are, and pass the uncertainty upward.", "html": "<div class=\"an\" style=\"--acc:var(--w-radio)\" data-an=\"10.4\"><div class=\"an-top\"><span class=\"an-w\">The ship&#x27;s radio</span><span class=\"an-t\">§10.4</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='16' y='20' width='128' height='120' rx='6'/><path d='M28 44c18-6 30 4 44 0s24-10 44-4' opacity='.7'/><path d='M28 76c18-6 30 4 44 0s24-10 44-4' opacity='.7'/><path d='M36 34h30v26H36z' fill='var(--acc)' opacity='.2'/><path d='M36 34h30v26H36z'/><path d='M40 42l5 5 8-9' opacity='.9'/><path d='M78 34h34v26H78z'/><path d='M82 42l5 5 8-9' opacity='.9'/><path d='M46 92h62v34H46z' stroke-dasharray='6 5'/><path d='M56 106h42M56 116h26' opacity='.5' stroke-dasharray='4 4'/><path d='M66 100l24 22M90 100l-24 22' opacity='.25'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A chart with two areas surveyed properly and one marked 'sounding not taken'.</p><div class=\"an-lab\">The analogy</div><p>You do not throw the chart away because one bay was too rough to sound. You draw what you surveyed, and you write across the bay that nobody has been in there — so the next skipper knows exactly how much to trust it.</p><div class=\"an-snap\"><b>So on the exam →</b> Complete the synthesis on what arrived, mark which conclusions are well supported and where the gaps are, and pass the uncertainty upward.</div></div></div></div>", "nemesis": false, "world": "The ship's radio", "analogy": "You do not throw the chart away because one bay was too rough to sound. You draw what you surveyed, and you write across the bay that nobody has been in there — so the next skipper knows exactly how much to trust it."}, {"id": "11.1", "title": "Extract Facts into a Separate Block", "picture": "A passport pouch on a strap, never buried in the pack.", "snapback": "Pull transactional facts — amounts, dates, IDs, agreed terms — into a case-facts block included in every prompt, outside the summarised history.", "html": "<div class=\"an\" style=\"--acc:var(--w-pack)\" data-an=\"11.1\"><div class=\"an-top\"><span class=\"an-w\">The rucksack</span><span class=\"an-t\">§11.1</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M46 54c0-14 8-22 34-22s34 8 34 22v72c0 8-8 14-34 14s-34-6-34-14z' fill='var(--acc)' opacity='.1'/><path d='M46 54c0-14 8-22 34-22s34 8 34 22v72c0 8-8 14-34 14s-34-6-34-14z'/><path d='M62 32c4-10 32-10 36 0'/><path d='M56 78c10 8 38 8 48 0' opacity='.4' stroke-dasharray='4 4'/><rect x='108' y='60' width='40' height='34' rx='5' fill='var(--acc)' opacity='.3'/><path d='M108 60h40v34h-40z'/><path d='M116 72h24M116 82h14' opacity='.85'/><path d='M114 60V48a14 14 0 0 1 28 0v12'/><path d='M60 100h40M60 114h24' opacity='.35'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A passport pouch on a strap, never buried in the pack.</p><div class=\"an-lab\">The analogy</div><p>Everything else can be rolled, squashed and repacked at the hostel. The passport, the booking reference and the allergy card live in the pouch on the outside, where nothing that happens to the rucksack can touch them.</p><div class=\"an-snap\"><b>So on the exam →</b> Pull transactional facts — amounts, dates, IDs, agreed terms — into a case-facts block included in every prompt, outside the summarised history.</div></div></div></div>", "nemesis": false, "world": "The rucksack", "analogy": "Everything else can be rolled, squashed and repacked at the hostel. The passport, the booking reference and the allergy card live in the pouch on the outside, where nothing that happens to the rucksack can touch them."}, {"id": "11.2", "title": "Trimming Tool Results", "picture": "Food out of its boxes, boxes in the bin, before the pack is closed.", "snapback": "Trim tool output to the relevant fields with a <code>PostToolUse</code> hook, before it enters context. Choose what to keep from what downstream actually uses.", "html": "<div class=\"an\" style=\"--acc:var(--w-pack)\" data-an=\"11.2\"><div class=\"an-top\"><span class=\"an-w\">The rucksack</span><span class=\"an-t\">§11.2</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='16' y='24' width='58' height='46' rx='5'/><path d='M16 40h58' opacity='.4'/><path d='M26 52h38M26 62h24' opacity='.5'/><path d='M26 30h12M44 30h22' opacity='.5'/><path d='M80 46h24'/><path d='M96 38l10 8-10 8'/><rect x='112' y='30' width='34' height='34' rx='5' fill='var(--acc)' opacity='.25'/><path d='M112 30h34v34h-34z'/><path d='M120 42h18M120 52h10' opacity='.85'/><path d='M40 84c0-4 4-6 8-6h44c4 0 8 2 8 6l-6 46c0 5-6 8-24 8s-24-3-24-8z'/><path d='M36 84h72' stroke-width='3'/><path d='M56 76v-6h32v6' opacity='.7'/><path d='M56 96l6 30M80 96v30M100 96l-6 30' opacity='.4'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Food out of its boxes, boxes in the bin, before the pack is closed.</p><div class=\"an-lab\">The analogy</div><p>Forty fields came back and five of them matter. Carrying the other thirty-five is not free — you pay for the weight on every step of every day that follows, and it makes the useful five harder to find.</p><div class=\"an-snap\"><b>So on the exam →</b> Trim tool output to the relevant fields with a <code>PostToolUse</code> hook, before it enters context. Choose what to keep from what downstream actually uses.</div></div></div></div>", "nemesis": false, "world": "The rucksack", "analogy": "Forty fields came back and five of them matter. Carrying the other thirty-five is not free — you pay for the weight on every step of every day that follows, and it makes the useful five harder to find."}, {"id": "11.3", "title": "Position-aware Input", "picture": "You remember what is at the top of the pack and what is at the bottom.", "snapback": "Attention is reliable at the beginning and end of long input and degrades in the middle. Put a key-findings summary at the start and add explicit section headings throughout.", "html": "<div class=\"an\" style=\"--acc:var(--w-pack)\" data-an=\"11.3\"><div class=\"an-top\"><span class=\"an-w\">The rucksack</span><span class=\"an-t\">§11.3</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M44 34c0-10 8-16 36-16s36 6 36 16v100c0 8-10 12-36 12s-36-4-36-12z'/><rect x='50' y='36' width='60' height='24' rx='4' fill='var(--acc)' opacity='.35'/><path d='M50 36h60v24H50z'/><path d='M58 48h44' opacity='.85'/><rect x='50' y='68' width='60' height='40' rx='4' opacity='.35' stroke-dasharray='5 5'/><path d='M60 84h40M60 96h40' opacity='.2'/><rect x='50' y='116' width='60' height='22' rx='4' fill='var(--acc)' opacity='.35'/><path d='M50 116h60v22H50z'/><path d='M58 127h44' opacity='.85'/><path d='M126 44v14M126 128v-14' opacity='.7'/><path d='M120 50l6-8 6 8M120 122l6 8 6-8' opacity='.7'/><path d='M126 76v28' opacity='.25' stroke-dasharray='4 5'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">You remember what is at the top of the pack and what is at the bottom.</p><div class=\"an-lab\">The analogy</div><p>Whatever went in the middle at four in the morning is gone until you unpack the whole thing on a hostel floor. So the head torch goes in the lid, and the map goes in the front pocket.</p><div class=\"an-snap\"><b>So on the exam →</b> Attention is reliable at the beginning and end of long input and degrades in the middle. Put a key-findings summary at the start and add explicit section headings throughout.</div></div></div></div>", "nemesis": false, "world": "The rucksack", "analogy": "Whatever went in the middle at four in the morning is gone until you unpack the whole thing on a hostel floor. So the head torch goes in the lid, and the map goes in the front pocket."}, {"id": "11.4", "title": "Scratchpad Files", "picture": "A trail journal you write in each night and read each morning.", "snapback": "Write intermediate findings to a scratchpad file and read it back at each continuation. It survives context limits and stops the drift into vague generalities.", "html": "<div class=\"an\" style=\"--acc:var(--w-pack)\" data-an=\"11.4\"><div class=\"an-top\"><span class=\"an-w\">The rucksack</span><span class=\"an-t\">§11.4</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M28 20h84v116H28z' fill='var(--acc)' opacity='.1'/><path d='M28 20h84v116H28z'/><path d='M44 20v116' opacity='.4'/><path d='M56 40h44M56 54h44M56 68h30M56 86h44M56 100h24' opacity='.65'/><circle cx='36' cy='40' r='2.4'/><circle cx='36' cy='54' r='2.4'/><circle cx='36' cy='68' r='2.4'/><path d='M124 34l14 8-42 74-16 8 2-18z'/><path d='M118 44l14 8' opacity='.6'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A trail journal you write in each night and read each morning.</p><div class=\"an-lab\">The analogy</div><p>Six weeks in, you cannot hold every river crossing in your head, and the version in your head has quietly turned into 'rivers are usually fine'. The journal still says which one had the rope.</p><div class=\"an-snap\"><b>So on the exam →</b> Write intermediate findings to a scratchpad file and read it back at each continuation. It survives context limits and stops the drift into vague generalities.</div></div></div></div>", "nemesis": false, "world": "The rucksack", "analogy": "Six weeks in, you cannot hold every river crossing in your head, and the version in your head has quietly turned into 'rivers are usually fine'. The journal still says which one had the rope."}, {"id": "11.5", "title": "Delegating to Subagents to Protect Context", "picture": "Sending someone ahead to scout, who comes back with one paragraph.", "snapback": "Run verbose discovery in a subagent so the output never enters the main window. It returns a concise summary and the main session keeps its capacity for the work.", "html": "<div class=\"an\" style=\"--acc:var(--w-pack)\" data-an=\"11.5\"><div class=\"an-top\"><span class=\"an-w\">The rucksack</span><span class=\"an-t\">§11.5</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx='34' cy='60' r='12'/><path d='M34 72v26M34 98l-8 22M34 98l8 22M22 82h24'/><path d='M56 66h40' stroke-dasharray='5 4'/><path d='M86 60l10 6-10 6'/><circle cx='120' cy='42' r='12'/><path d='M120 54v22M120 76l-8 20M120 76l8 20M108 62h24'/><path d='M104 116h44v22h-44z' fill='var(--acc)' opacity='.25'/><path d='M104 116h44v22h-44z'/><path d='M112 126h28' opacity='.85'/><path d='M120 100v14' stroke-dasharray='4 4' opacity='.6'/><path d='M14 30c10-6 20-6 28 0' opacity='.35'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Sending someone ahead to scout, who comes back with one paragraph.</p><div class=\"an-lab\">The analogy</div><p>You do not all walk the eight kilometres to find out whether the bridge is standing. One person goes, sees everything, and comes back with a sentence. The rest of you are still fresh when it matters.</p><div class=\"an-snap\"><b>So on the exam →</b> Run verbose discovery in a subagent so the output never enters the main window. It returns a concise summary and the main session keeps its capacity for the work.</div></div></div></div>", "nemesis": false, "world": "The rucksack", "analogy": "You do not all walk the eight kilometres to find out whether the bridge is standing. One person goes, sees everything, and comes back with a sentence. The rest of you are still fresh when it matters."}, {"id": "11.6", "title": "Structured State Persistence", "picture": "Cairns left along the route, and a note at base camp saying who has reached where.", "snapback": "Each agent exports structured state — status, findings, coverage, gaps — to a known location, and the coordinator loads a manifest on resume and continues from the checkpoint.", "html": "<div class=\"an\" style=\"--acc:var(--w-pack)\" data-an=\"11.6\"><div class=\"an-top\"><span class=\"an-w\">The rucksack</span><span class=\"an-t\">§11.6</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M20 130l16-26 12 14 20-42 16 30 14-22 18 46z' fill='var(--acc)' opacity='.12'/><path d='M20 130l16-26 12 14 20-42 16 30 14-22 18 46z'/><circle cx='36' cy='100' r='5' fill='var(--acc)' opacity='.6'/><circle cx='36' cy='100' r='5'/><circle cx='68' cy='76' r='5' fill='var(--acc)' opacity='.6'/><circle cx='68' cy='76' r='5'/><circle cx='114' cy='82' r='5'/><path d='M41 100h22M73 78h36' stroke-dasharray='4 4' opacity='.5'/><rect x='44' y='16' width='72' height='40' rx='5'/><path d='M54 30l5 5 8-9M54 44l5 5 8-9' opacity='.85'/><path d='M76 32h30M76 46h18' opacity='.65'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Cairns left along the route, and a note at base camp saying who has reached where.</p><div class=\"an-lab\">The analogy</div><p>Someone twists an ankle four hours from the end. Nobody restarts from the trailhead — you read the note at base, see three parties are through the pass and one is not, and you carry on from there.</p><div class=\"an-snap\"><b>So on the exam →</b> Each agent exports structured state — status, findings, coverage, gaps — to a known location, and the coordinator loads a manifest on resume and continues from the checkpoint.</div></div></div></div>", "nemesis": false, "world": "The rucksack", "analogy": "Someone twists an ankle four hours from the end. Nobody restarts from the trailhead — you read the note at base, see three parties are through the pass and one is not, and you carry on from there."}, {"id": "12.1", "title": "The Attribution Loss Problem", "picture": "An exhibit bag with the label torn off.", "snapback": "Require structured claim-to-source mappings from every subagent and require synthesis to preserve them. A bibliography records what was read, not which source produced this claim.", "html": "<div class=\"an\" style=\"--acc:var(--w-court)\" data-an=\"12.1\"><div class=\"an-top\"><span class=\"an-w\">Chain of custody</span><span class=\"an-t\">§12.1</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M40 34h80v104H40z' fill='var(--acc)' opacity='.1'/><path d='M40 34h80v104H40z'/><path d='M40 34l14-18h52l14 18'/><rect x='56' y='58' width='48' height='30' rx='4'/><path d='M64 70h32M64 80h20' opacity='.6'/><path d='M56 104h48M56 118h30' opacity='.4' stroke-dasharray='4 4'/><path d='M112 24l22-8 6 20-22 8z' opacity='.5' stroke-dasharray='5 4'/><path d='M118 30l16-6' opacity='.4'/><path d='M104 44l24-12' opacity='.35'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">An exhibit bag with the label torn off.</p><div class=\"an-lab\">The analogy</div><p>The evidence is genuine. Nobody can say where it came from, who handled it, or when. In a courtroom that makes it worthless, and a list of everywhere you went that day does not fix it.</p><div class=\"an-snap\"><b>So on the exam →</b> Require structured claim-to-source mappings from every subagent and require synthesis to preserve them. A bibliography records what was read, not which source produced this claim.</div></div></div></div>", "nemesis": false, "world": "Chain of custody", "analogy": "The evidence is genuine. Nobody can say where it came from, who handled it, or when. In a courtroom that makes it worthless, and a list of everywhere you went that day does not fix it."}, {"id": "12.2", "title": "Handling Conflicting Data", "picture": "Two witness statements entered into the record side by side, both signed.", "snapback": "Complete the analysis carrying both values with attribution, and annotate the conflict explicitly. Do not resolve it by heuristic and do not block waiting for a ruling.", "html": "<div class=\"an\" style=\"--acc:var(--w-court)\" data-an=\"12.2\"><div class=\"an-top\"><span class=\"an-w\">Chain of custody</span><span class=\"an-t\">§12.2</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M80 20v18M56 38h48'/><path d='M80 38v76'/><path d='M56 114h48'/><path d='M34 46l-16 34h32zM126 46l-16 34h32z'/><path d='M34 38v8M126 38v8'/><path d='M18 80a16 16 0 0 0 32 0M110 80a16 16 0 0 0 32 0' fill='var(--acc)' opacity='.14'/><path d='M18 80a16 16 0 0 0 32 0M110 80a16 16 0 0 0 32 0'/><path d='M34 46h92' opacity='0'/><path d='M64 46h32' opacity='.5'/><text x='34' y='34' font-size='13' fill='currentColor' stroke='none' text-anchor='middle' font-family='monospace'>40</text><text x='126' y='34' font-size='13' fill='currentColor' stroke='none' text-anchor='middle' font-family='monospace'>12</text><path d='M62 126h36' stroke-width='3'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Two witness statements entered into the record side by side, both signed.</p><div class=\"an-lab\">The analogy</div><p>Two credible witnesses give different numbers. The clerk does not average them, and does not quietly pick the one from the more impressive address. Both go in the record, attributed, and somebody senior decides.</p><div class=\"an-snap\"><b>So on the exam →</b> Complete the analysis carrying both values with attribution, and annotate the conflict explicitly. Do not resolve it by heuristic and do not block waiting for a ruling.</div></div></div></div>", "nemesis": false, "world": "Chain of custody", "analogy": "Two credible witnesses give different numbers. The clerk does not average them, and does not quietly pick the one from the more impressive address. Both go in the record, attributed, and somebody senior decides."}, {"id": "12.3", "title": "Include Dates for Correct Interpretation", "picture": "Two statements that contradict each other until you read the dates on them.", "snapback": "Require publication or collection dates in every structured output. Without them, ordinary change over time gets reported as sources disagreeing.", "html": "<div class=\"an\" style=\"--acc:var(--w-court)\" data-an=\"12.3\"><div class=\"an-top\"><span class=\"an-w\">Chain of custody</span><span class=\"an-t\">§12.3</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='14' y='34' width='58' height='76' rx='5'/><rect x='88' y='34' width='58' height='76' rx='5'/><path d='M24 54h38M24 66h38M24 78h22' opacity='.55'/><path d='M98 54h38M98 66h38M98 78h22' opacity='.55'/><text x='43' y='102' font-size='13' fill='currentColor' stroke='none' text-anchor='middle' font-family='monospace'>10%</text><text x='117' y='102' font-size='13' fill='currentColor' stroke='none' text-anchor='middle' font-family='monospace'>15%</text><rect x='22' y='16' width='42' height='16' rx='4' fill='var(--acc)' opacity='.3'/><path d='M22 16h42v16H22z'/><rect x='96' y='16' width='42' height='16' rx='4' fill='var(--acc)' opacity='.3'/><path d='M96 16h42v16H96z'/><text x='43' y='28' font-size='11' fill='currentColor' stroke='none' text-anchor='middle' font-family='monospace'>2023</text><text x='117' y='28' font-size='11' fill='currentColor' stroke='none' text-anchor='middle' font-family='monospace'>2024</text><path d='M72 122h16' /><path d='M80 116l8 6-8 6'/><path d='M40 122h24' opacity='.4' stroke-dasharray='4 4'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Two statements that contradict each other until you read the dates on them.</p><div class=\"an-lab\">The analogy</div><p>One says ten per cent, the other fifteen. Enormous scandal, until somebody turns the pages over and finds they were taken a year apart. Then it stops being a contradiction and starts being growth.</p><div class=\"an-snap\"><b>So on the exam →</b> Require publication or collection dates in every structured output. Without them, ordinary change over time gets reported as sources disagreeing.</div></div></div></div>", "nemesis": false, "world": "Chain of custody", "analogy": "One says ten per cent, the other fifteen. Enormous scandal, until somebody turns the pages over and finds they were taken a year apart. Then it stops being a contradiction and starts being growth."}, {"id": "12.4", "title": "Render by Content Type", "picture": "You do not read a spreadsheet aloud as a story.", "snapback": "Financial and tabular data as tables, news and analysis as prose, technical findings as structured lists, time series in chronological order.", "html": "<div class=\"an\" style=\"--acc:var(--w-court)\" data-an=\"12.4\"><div class=\"an-top\"><span class=\"an-w\">Chain of custody</span><span class=\"an-t\">§12.4</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='14' y='24' width='60' height='50' rx='4' fill='var(--acc)' opacity='.14'/><path d='M14 24h60v50H14z'/><path d='M14 40h60M34 24v50M54 24v50' opacity='.65'/><rect x='86' y='24' width='60' height='50' rx='4'/><path d='M94 38h44M94 48h44M94 58h28' opacity='.65'/><rect x='14' y='88' width='60' height='50' rx='4'/><circle cx='24' cy='102' r='2.4' fill='currentColor'/><circle cx='24' cy='114' r='2.4' fill='currentColor'/><circle cx='24' cy='126' r='2.4' fill='currentColor'/><path d='M34 102h32M34 114h32M34 126h20' opacity='.65'/><rect x='86' y='88' width='60' height='50' rx='4'/><path d='M94 128l14-18 12 10 18-22' /><circle cx='94' cy='128' r='2.4' fill='currentColor'/><circle cx='138' cy='98' r='2.4' fill='currentColor'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">You do not read a spreadsheet aloud as a story.</p><div class=\"an-lab\">The analogy</div><p>Financials go in the exhibit table where the columns line up. The account of what happened goes in prose. Read the table out as a flowing narrative and everyone in the room loses the numbers.</p><div class=\"an-snap\"><b>So on the exam →</b> Financial and tabular data as tables, news and analysis as prose, technical findings as structured lists, time series in chronological order.</div></div></div></div>", "nemesis": false, "world": "Chain of custody", "analogy": "Financials go in the exhibit table where the columns line up. The account of what happened goes in prose. Read the table out as a flowing narrative and everyone in the room loses the numbers."}, {"id": "13.1", "title": "Tool Selection Reference", "picture": "The catalogue drawer next to a full-text search of every page.", "snapback": "Glob matches file paths. Grep searches file contents. 'Which files use this function' is a content question, so it is Grep — every time.", "html": "<div class=\"an hi\" style=\"--acc:var(--w-library)\" data-an=\"13.1\"><div class=\"an-top\"><span class=\"an-w\">The library</span><span class=\"an-t\">§13.1</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='12' y='38' width='60' height='72' rx='5'/><path d='M12 62h60M12 86h60' opacity='.5'/><circle cx='42' cy='50' r='2.6' fill='currentColor'/><circle cx='42' cy='74' r='2.6' fill='currentColor'/><circle cx='42' cy='98' r='2.6' fill='currentColor'/><path d='M24 124h36' opacity='.5'/><path d='M88 34c14-6 26-6 26 4v72c0-10-12-10-26-4z' fill='var(--acc)' opacity='.14'/><path d='M88 34c14-6 26-6 26 4v72c0-10-12-10-26-4zM148 34c-14-6-26-6-26 4v72c0 10 12 10 26 4z'/><path d='M96 54h14M96 66h14M130 54h12M130 66h12' opacity='.55'/><circle cx='118' cy='96' r='15'/><path d='M129 107l12 12'/><path d='M112 96h12' opacity='.7'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">The catalogue drawer next to a full-text search of every page.</p><div class=\"an-lab\">The analogy</div><p>The catalogue finds books by title and shelf mark. It cannot tell you which books mention a name on page ninety. For that you need something that reads inside, and asking the catalogue will get you a confident, wrong, very short answer.</p><div class=\"an-snap\"><b>So on the exam →</b> Glob matches file paths. Grep searches file contents. 'Which files use this function' is a content question, so it is Grep — every time.</div></div></div><div class=\"an-nem\"><span class=\"lab\">⚠ Your record · Missed on Exams 4 and 5</span>Glob matches file <em>paths</em>. Grep searches file <em>contents</em>. &ldquo;Find everywhere this symbol is used&rdquo; is a content question every single time.</div></div>", "nemesis": true, "world": "The library", "analogy": "The catalogue finds books by title and shelf mark. It cannot tell you which books mention a name on page ninety. For that you need something that reads inside, and asking the catalogue will get you a confident, wrong, very short answer."}, {"id": "13.2", "title": "Incremental Investigation Strategy", "picture": "Following the citations, rather than reading the whole floor.", "snapback": "Grep to locate entry points, Read the files you found, Grep for their usages, Read those. Reading everything up front to 'get full context' is the named anti-pattern.", "html": "<div class=\"an\" style=\"--acc:var(--w-library)\" data-an=\"13.2\"><div class=\"an-top\"><span class=\"an-w\">The library</span><span class=\"an-t\">§13.2</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M14 24h20v112H14zM38 24h16v112H38zM58 24h22v112H58z' opacity='.35'/><path d='M14 24h20v112H14z' fill='var(--acc)' opacity='.18'/><path d='M14 24h20v112H14z'/><circle cx='24' cy='52' r='9'/><path d='M31 59l8 8'/><path d='M46 66h34' stroke-dasharray='4 4'/><path d='M72 60l8 6-8 6'/><rect x='88' y='40' width='58' height='34' rx='4'/><path d='M96 52h34M96 62h20' opacity='.6'/><path d='M117 74v14' stroke-dasharray='4 4'/><rect x='88' y='92' width='58' height='34' rx='4' fill='var(--acc)' opacity='.14'/><path d='M88 92h58v34H88z'/><path d='M96 104h34M96 114h20' opacity='.6'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Following the citations, rather than reading the whole floor.</p><div class=\"an-lab\">The analogy</div><p>You have one afternoon and eleven thousand books. You find one paper on the subject, read its references, pull those three, read theirs. You do not begin at shelf A and work east.</p><div class=\"an-snap\"><b>So on the exam →</b> Grep to locate entry points, Read the files you found, Grep for their usages, Read those. Reading everything up front to 'get full context' is the named anti-pattern.</div></div></div></div>", "nemesis": false, "world": "The library", "analogy": "You have one afternoon and eleven thousand books. You find one paper on the subject, read its references, pull those three, read theirs. You do not begin at shelf A and work east."}, {"id": "13.3", "title": "Fallback: Read + Write Instead of Edit", "picture": "A correction that needs a sentence appearing exactly once on the page.", "snapback": "Edit needs a unique anchor. When it fails, Read the file, modify the content, Write it back. A shorter anchor is more likely to be non-unique, not less.", "html": "<div class=\"an hi\" style=\"--acc:var(--w-library)\" data-an=\"13.3\"><div class=\"an-top\"><span class=\"an-w\">The library</span><span class=\"an-t\">§13.3</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='14' y='22' width='62' height='84' rx='4'/><path d='M24 40h42M24 54h42M24 68h42M24 82h42' opacity='.4'/><ellipse cx='45' cy='40' rx='26' ry='8' opacity='.9'/><ellipse cx='45' cy='68' rx='26' ry='8' opacity='.9'/><ellipse cx='45' cy='82' rx='26' ry='8' opacity='.9'/><path d='M22 118l10 10M32 118l-10 10' stroke-width='2.6'/><path d='M52 123h30'/><path d='M74 117l8 6-8 6'/><rect x='94' y='22' width='54' height='84' rx='4' fill='var(--acc)' opacity='.14'/><path d='M94 22h54v84H94z'/><path d='M104 40h34M104 54h34M104 68h34M104 82h20' opacity='.7'/><path d='M110 118l5 5 9-10' /><path d='M130 123h14' opacity='.5'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A correction that needs a sentence appearing exactly once on the page.</p><div class=\"an-lab\">The analogy</div><p>Tell the archivist to change 'the rate is fixed' and they will ask which of the four. Give them a shorter phrase and it gets worse, not better — now it appears eleven times. So you take the page, retype it whole, and put it back.</p><div class=\"an-snap\"><b>So on the exam →</b> Edit needs a unique anchor. When it fails, Read the file, modify the content, Write it back. A shorter anchor is more likely to be non-unique, not less.</div></div></div><div class=\"an-nem\"><span class=\"lab\">⚠ Your record · Worth one look</span>A shorter anchor is <em>more</em> likely to be non-unique, not less. When Edit cannot find a unique match, Read then Write is the sanctioned fallback &mdash; not <code>sed</code>.</div></div>", "nemesis": true, "world": "The library", "analogy": "Tell the archivist to change 'the rate is fixed' and they will ask which of the four. Give them a shorter phrase and it gets worse, not better — now it appears eleven times. So you take the page, retype it whole, and put it back."}];
const WORLDS = {"post": "The postal service", "kitchen": "The restaurant", "crew": "The film crew", "plug": "The plug standard", "house": "The house you moved into", "intern": "Training an intern", "laundry": "The launderette", "road": "The road trip", "triage": "The triage desk", "radio": "The ship's radio", "pack": "The rucksack", "court": "Chain of custody", "library": "The library"};
const KEY = "cca-guide-v1";

let cur = 0, tocOpen = false, cramFilter = "all";
const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ---------- chrome ---------- */
function buildRail(){
  $("#rail").innerHTML = SECTIONS.map((s,i)=>
    `<button class="chip${i===cur?" on":""}" data-i="${i}">${esc(s.short||s.title)}</button>`).join("");
}
function buildTOC(){
  const groups = [];
  SECTIONS.forEach((s,i)=>{
    let g = groups.find(x=>x.name===s.group);
    if(!g){ g={name:s.group,items:[]}; groups.push(g); }
    g.items.push({s,i});
  });
  $("#tocIn").innerHTML = groups.map(g=>
    `<div class="toc-g"><h4>${esc(g.name)}</h4>`+
    g.items.map(({s,i})=>`<a data-i="${i}" class="${i===cur?"cur":""}">${
      s.num?`<b>${esc(s.num)}</b>`:""}${esc(s.title)}</a>`).join("")+`</div>`).join("");
}
function setTOC(open){ tocOpen=open; $("#toc").classList.toggle("open",open);
  $("#tocBtn").classList.toggle("on",open); if(open) buildTOC(); }

/* ---------- render ---------- */
function render(i,push){
  cur = Math.max(0, Math.min(SECTIONS.length-1, i));
  const s = SECTIONS[cur];
  $("#view").innerHTML = s.id==="cram" ? cramHTML() : s.html;
  $("#pos").textContent = (cur+1)+" / "+SECTIONS.length;
  $("#progBar").style.width = ((cur+1)/SECTIONS.length*100)+"%";
  buildRail(); if(tocOpen) buildTOC();
  const chip = $(`.chip[data-i="${cur}"]`); if(chip) chip.scrollIntoView({block:"nearest",inline:"center"});
  const p = SECTIONS[cur-1], n = SECTIONS[cur+1];
  $("#fnav").innerHTML =
    `<a class="${p?"":"off"}" data-i="${cur-1}"><span class="d">Previous</span><span class="t">${p?esc(p.title):"—"}</span></a>`+
    `<a class="nx ${n?"":"off"}" data-i="${cur+1}"><span class="d">Next</span><span class="t">${n?esc(n.title):"—"}</span></a>`;
  if(push!==false && location.hash.slice(1)!==s.id) history.replaceState(null,"","#"+s.id);
  try{ localStorage.setItem(KEY, s.id); }catch(e){}
  window.scrollTo({top:0,behavior:"instant"});
}

/* ---------- cram ---------- */
function cramHTML(){
  const list = ANALOGIES.filter(a =>
    cramFilter==="all" ? true : cramFilter==="nem" ? !!a.nemesis : a.id.split(".")[0]===cramFilter);
  const chapters = [...new Set(ANALOGIES.map(a=>a.id.split(".")[0]))]
    .sort((a,b)=>a-b);
  return `<div class="kick">Cram mode</div><h1>All ${ANALOGIES.length} pictures, no source text</h1>
  <div class="cram-note">Every analogy from Part I, back to back. Filter to the ones you have actually
  been getting wrong, or walk a single chapter. Nothing here is from the guide — it is all scaffolding
  for recall.</div>
  <div class="cram-f">
    <button class="chip${cramFilter==="all"?" on":""}" data-cf="all">All ${ANALOGIES.length}</button>
    <button class="chip${cramFilter==="nem"?" on":""}" data-cf="nem">Your misses (${ANALOGIES.filter(a=>a.nemesis).length})</button>
    ${chapters.map(c=>`<button class="chip${cramFilter===c?" on":""}" data-cf="${c}">Ch ${c}</button>`).join("")}
  </div>
  ${list.map(a=>a.html).join("") || "<p>Nothing matches that filter.</p>"}`;
}

/* ---------- search ---------- */
let srSel = -1, srHits = [];
function search(v){
  const sr = $("#sr");
  v = v.trim().toLowerCase();
  if(v.length < 2){ sr.classList.remove("open"); return; }
  srHits = [];
  SECTIONS.forEach((s,i)=>{
    if((s.title+" "+(s.num||"")+" "+(s.keywords||"")).toLowerCase().includes(v))
      srHits.push({i,t:s.title,g:s.group});
  });
  ANALOGIES.forEach(a=>{
    if((a.title+" "+a.picture+" "+a.snapback+" "+a.world+" "+a.analogy+" §"+a.id).toLowerCase().includes(v)){
      const si = SECTIONS.findIndex(s=>s.concepts && s.concepts.includes(a.id));
      if(si>=0 && !srHits.some(h=>h.i===si && h.a===a.id))
        srHits.push({i:si,t:"§"+a.id+" "+a.title,g:"Analogy · "+a.world});
    }
  });
  srHits = srHits.slice(0,24); srSel = -1;
  const r = $("#q").getBoundingClientRect();
  sr.style.left = Math.max(8, Math.min(r.left, innerWidth-Math.min(420,innerWidth*.92)-8))+"px";
  sr.style.top = (r.bottom+6)+"px";
  sr.innerHTML = srHits.length
    ? srHits.map((h,k)=>`<a data-i="${h.i}" data-k="${k}"><span class="g">${esc(h.g)}</span><br>${esc(h.t)}</a>`).join("")
    : `<div class="none">Nothing matches “${esc(v)}”.</div>`;
  sr.classList.add("open");
}
function srMove(d){
  if(!srHits.length) return;
  srSel = (srSel+d+srHits.length)%srHits.length;
  [...$("#sr").querySelectorAll("a")].forEach((a,k)=>a.classList.toggle("sel",k===srSel));
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const chip = e.target.closest(".chip[data-i]");
  if(chip){ render(+chip.dataset.i); return; }
  const cf = e.target.closest("[data-cf]");
  if(cf){ cramFilter = cf.dataset.cf; render(cur); return; }
  const link = e.target.closest("[data-i]");
  if(link){ render(+link.dataset.i); setTOC(false); $("#sr").classList.remove("open"); return; }
  if(e.target.closest("#tocBtn")){ setTOC(!tocOpen); return; }
  if(e.target.closest("#cramBtn")){ const i=SECTIONS.findIndex(s=>s.id==="cram"); if(i>=0) render(i); setTOC(false); return; }
  if(e.target.closest("#thBtn")){
    const d = document.documentElement;
    const now = d.getAttribute("data-theme") ||
      (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
    d.setAttribute("data-theme", now==="dark"?"light":"dark");
    try{ localStorage.setItem(KEY+"-th", d.getAttribute("data-theme")); }catch(e){}
    return;
  }
  const rv = e.target.closest(".rv");
  if(rv){ const a = rv.parentElement.querySelector(".ans");
    const open = a.classList.toggle("show");
    rv.textContent = open ? "Hide answer" : "Reveal answer"; return; }
  const ra = e.target.closest("#revealAll");
  if(ra){ const all=[...$("#view").querySelectorAll(".ans")];
    const anyHidden = all.some(a=>!a.classList.contains("show"));
    all.forEach(a=>a.classList.toggle("show",anyHidden));
    $("#view").querySelectorAll(".rv").forEach(b=>b.textContent=anyHidden?"Hide answer":"Reveal answer");
    ra.textContent = anyHidden?"Hide all answers":"Reveal all answers"; return; }
  if(!e.target.closest("#sr") && !e.target.closest("#q")) $("#sr").classList.remove("open");
  if(!e.target.closest(".toc") && !e.target.closest("#tocBtn")) setTOC(false);
});
$("#q").addEventListener("input", e=>search(e.target.value));
$("#q").addEventListener("keydown", e=>{
  if(e.key==="ArrowDown"){ e.preventDefault(); srMove(1); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); srMove(-1); }
  else if(e.key==="Enter" && srSel>=0){ render(srHits[srSel].i); $("#sr").classList.remove("open"); $("#q").blur(); }
  else if(e.key==="Escape"){ $("#sr").classList.remove("open"); $("#q").blur(); }
});
document.addEventListener("keydown", e=>{
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(e.key==="/" && !typing){ e.preventDefault(); $("#q").focus(); return; }
  if(typing) return;
  if(e.key==="ArrowRight") render(cur+1);
  else if(e.key==="ArrowLeft") render(cur-1);
  else if(e.key==="t"||e.key==="T") setTOC(!tocOpen);
  else if(e.key==="Escape"){ setTOC(false); $("#sr").classList.remove("open"); }
});
addEventListener("hashchange", ()=>{
  const i = SECTIONS.findIndex(s=>s.id===location.hash.slice(1));
  if(i>=0 && i!==cur) render(i,false);
});

/* ---------- boot ---------- */
(function(){
  try{ const th = localStorage.getItem(KEY+"-th"); if(th) document.documentElement.setAttribute("data-theme",th); }catch(e){}
  let start = 0;
  const h = location.hash.slice(1);
  if(h){ const i = SECTIONS.findIndex(s=>s.id===h); if(i>=0) start=i; }
  else { try{ const last = localStorage.getItem(KEY);
    if(last){ const i = SECTIONS.findIndex(s=>s.id===last); if(i>=0) start=i; } }catch(e){} }
  render(start);
})();
</script>
</body>
</html>
