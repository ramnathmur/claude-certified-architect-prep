Color'/><path d='M28 118l7 8 14-16' opacity='0'/><path d='M30 116h28' opacity='.5'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Two plates: one obviously wrong, one plated perfectly with the wrong fish.</p><div class=\"an-lab\">The analogy</div><p>The pass catches the first before it leaves the kitchen. The second walks straight out to the table, because it matches the diagram in every measurable way. Only the person who ordered cod finds out.</p><div class=\"an-snap\"><b>So on the exam →</b> Schemas eliminate the syntax class outright and do nothing for the semantic class. Valid JSON still holds a wrong number.</div></div></div></div>", "nemesis": false, "world": "The restaurant", "analogy": "The pass catches the first before it leaves the kitchen. The second walks straight out to the table, because it matches the diagram in every measurable way. Only the person who ordered cod finds out."}, {"id": "3.1", "title": "What is an Agentic Loop", "picture": "A clapperboard with a loop arrow: shoot, watch it back, decide, go again.", "snapback": "Send → inspect <code>stop_reason</code> → execute any tools → append the results → send again, until <code>end_turn</code>.", "html": "<div class=\"an\" style=\"--acc:var(--w-crew)\" data-an=\"3.1\"><div class=\"an-top\"><span class=\"an-w\">The film crew</span><span class=\"an-t\">§3.1</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M28 62h74v46H28z'/><path d='M28 46h74l-8 16H36z' fill='var(--acc)' opacity='.2'/><path d='M28 46h74l-8 16H36z'/><path d='M44 46l-6 16M60 46l-6 16M76 46l-6 16M92 46l-6 16' opacity='.7'/><path d='M124 60a44 44 0 1 1-32-16' stroke-dasharray='0'/><path d='M112 40l14 6-8 13'/><rect x='44' y='76' width='42' height='24' rx='3' opacity='.55'/><path d='M52 88h26' opacity='.55'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A clapperboard with a loop arrow: shoot, watch it back, decide, go again.</p><div class=\"an-lab\">The analogy</div><p>The director is not working through a fixed list of takes. They shoot one, watch it on the monitor, and that is what tells them whether there is a next one.</p><div class=\"an-snap\"><b>So on the exam →</b> Send → inspect <code>stop_reason</code> → execute any tools → append the results → send again, until <code>end_turn</code>.</div></div></div></div>", "nemesis": false, "world": "The film crew", "analogy": "The director is not working through a fixed list of takes. They shoot one, watch it on the monitor, and that is what tells them whether there is a next one."}, {"id": "3.2", "title": "AgentDefinition Configuration", "picture": "A crew lanyard: name, job, and exactly which kit you may sign out.", "snapback": "<code>name</code>/<code>description</code>, <code>system_prompt</code>, <code>allowed_tools</code>. The tool list is a whitelist, and least privilege per subagent type is the whole point.", "html": "<div class=\"an\" style=\"--acc:var(--w-crew)\" data-an=\"3.2\"><div class=\"an-top\"><span class=\"an-w\">The film crew</span><span class=\"an-t\">§3.2</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M60 14l20 26 20-26' opacity='.6'/><rect x='42' y='40' width='76' height='104' rx='6'/><rect x='42' y='40' width='76' height='26' rx='6' fill='var(--acc)' opacity='.18'/><path d='M56 54h48'/><circle cx='80' cy='84' r='13'/><path d='M60 82h6M94 82h6' opacity='.5'/><path d='M56 108h30M56 120h30M56 132h30'/><path d='M96 104h10v10H96zM96 116h10v10H96z' fill='var(--acc)' opacity='.25'/><path d='M96 104h10v10H96zM96 116h10v10H96zM96 128h10v10H96z'/><path d='M96 128l10 10M106 128l-10 10' stroke-width='2'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A crew lanyard: name, job, and exactly which kit you may sign out.</p><div class=\"an-lab\">The analogy</div><p>The badge says who you are, what you are here to do, and which three items from the equipment cage you are allowed to take. The cage does not care what your job description aspires to.</p><div class=\"an-snap\"><b>So on the exam →</b> <code>name</code>/<code>description</code>, <code>system_prompt</code>, <code>allowed_tools</code>. The tool list is a whitelist, and least privilege per subagent type is the whole point.</div></div></div></div>", "nemesis": false, "world": "The film crew", "analogy": "The badge says who you are, what you are here to do, and which three items from the equipment cage you are allowed to take. The cage does not care what your job description aspires to."}, {"id": "3.3", "title": "Hub-and-Spoke: Coordinator and Subagents", "picture": "Every line runs through the chair in the middle. The crew-to-crew line is crossed out.", "snapback": "Subagents never communicate directly. The coordinator sees every exchange, handles errors uniformly, and controls what each subagent receives.", "html": "<div class=\"an hi\" style=\"--acc:var(--w-crew)\" data-an=\"3.3\"><div class=\"an-top\"><span class=\"an-w\">The film crew</span><span class=\"an-t\">§3.3</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx='80' cy='80' r='22' fill='var(--acc)' opacity='.18'/><circle cx='80' cy='80' r='22'/><path d='M72 74h16M72 82h16M72 90h10' opacity='.7'/><circle cx='80' cy='20' r='13'/><circle cx='140' cy='80' r='13'/><circle cx='80' cy='140' r='13'/><circle cx='20' cy='80' r='13'/><path d='M80 33v25M127 80h-25M80 127v-25M33 80h25'/><path d='M32 32l36 36' opacity='.35' stroke-dasharray='4 5'/><path d='M40 30l-14 14M26 30l14 14' stroke-width='2.2'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Every line runs through the chair in the middle. The crew-to-crew line is crossed out.</p><div class=\"an-lab\">The analogy</div><p>Camera does not brief sound. Sound does not brief wardrobe. It all goes through the person in the chair — which is precisely how that person knows what happened when something goes wrong at 2am.</p><div class=\"an-snap\"><b>So on the exam →</b> Subagents never communicate directly. The coordinator sees every exchange, handles errors uniformly, and controls what each subagent receives.</div></div></div><div class=\"an-nem\"><span class=\"lab\">⚠ Your record · Missed on Exam 12 Q17</span>Subagents never see the coordinator's history. When one reports it has nothing to work with, the coordinator passes the findings into its prompt &mdash; it does not hand the subagent a new tool to go and fetch them.</div></div>", "nemesis": true, "world": "The film crew", "analogy": "Camera does not brief sound. Sound does not brief wardrobe. It all goes through the person in the chair — which is precisely how that person knows what happened when something goes wrong at 2am."}, {"id": "3.4", "title": "The Task Tool for Spawning Subagents", "picture": "Two directors — one issued a radio, one not.", "snapback": "A coordinator's <code>allowedTools</code> must include <code>Task</code>. No prompt can grant a tool that the configuration withholds.", "html": "<div class=\"an\" style=\"--acc:var(--w-crew)\" data-an=\"3.4\"><div class=\"an-top\"><span class=\"an-w\">The film crew</span><span class=\"an-t\">§3.4</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='20' y='48' width='34' height='72' rx='6'/><rect x='28' y='58' width='18' height='16' rx='2' fill='var(--acc)' opacity='.25'/><path d='M37 48V24'/><path d='M62 44a26 26 0 0 1 0 34M74 34a40 40 0 0 1 0 54' opacity='.75'/><rect x='104' y='48' width='34' height='72' rx='6'/><rect x='112' y='58' width='18' height='16' rx='2'/><path d='M121 48V30' opacity='.35' stroke-dasharray='3 4'/><path d='M112 22l18 18M130 22l-18 18' stroke-width='2.4'/><path d='M112 96h18M112 108h18' opacity='.5'/><path d='M28 96h18M28 108h18' opacity='.5'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Two directors — one issued a radio, one not.</p><div class=\"an-lab\">The analogy</div><p>You can write 'delegates freely to the crew' into somebody's job description all day long. If nobody handed them a radio, they will quietly do the entire job themselves and you will never hear a word about it.</p><div class=\"an-snap\"><b>So on the exam →</b> A coordinator's <code>allowedTools</code> must include <code>Task</code>. No prompt can grant a tool that the configuration withholds.</div></div></div></div>", "nemesis": false, "world": "The film crew", "analogy": "You can write 'delegates freely to the crew' into somebody's job description all day long. If nobody handed them a radio, they will quietly do the entire job themselves and you will never hear a word about it."}, {"id": "3.5", "title": "Hooks in the Agent SDK", "picture": "A safety officer who physically stops the take before it rolls.", "snapback": "<code>PreToolUse</code> runs before and can block or modify. <code>PostToolUse</code> runs after and reshapes the output. Deterministic code — not an instruction.", "html": "<div class=\"an\" style=\"--acc:var(--w-crew)\" data-an=\"3.5\"><div class=\"an-top\"><span class=\"an-w\">The film crew</span><span class=\"an-t\">§3.5</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M18 56h40v40H18z'/><path d='M58 66l22-12v52l-22-12z' fill='var(--acc)' opacity='.2'/><path d='M58 66l22-12v52l-22-12z'/><circle cx='114' cy='40' r='12'/><path d='M114 52v34'/><path d='M114 86l-10 34M114 86l10 34'/><path d='M114 62l-14 10M114 62l16-6'/><path d='M130 56l6-12' stroke-width='3'/><path d='M96 30h44' stroke-width='4' stroke-linecap='butt' opacity='.9'/><path d='M96 116h48' stroke-dasharray='6 5' opacity='.5'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A safety officer who physically stops the take before it rolls.</p><div class=\"an-lab\">The analogy</div><p>They do not advise. They do not hope. They stand in front of the camera when the shot breaks the rules, and they do it whether or not the director agrees, on every single take.</p><div class=\"an-snap\"><b>So on the exam →</b> <code>PreToolUse</code> runs before and can block or modify. <code>PostToolUse</code> runs after and reshapes the output. Deterministic code — not an instruction.</div></div></div></div>", "nemesis": false, "world": "The film crew", "analogy": "They do not advise. They do not hope. They stand in front of the camera when the shot breaks the rules, and they do it whether or not the director agrees, on every single take."}, {"id": "4.1", "title": "What is MCP", "picture": "One socket shape, three very different appliances.", "snapback": "MCP is the open protocol connecting Claude to external tools, readable data and prompt templates through one interface.", "html": "<div class=\"an\" style=\"--acc:var(--w-plug)\" data-an=\"4.1\"><div class=\"an-top\"><span class=\"an-w\">The plug standard</span><span class=\"an-t\">§4.1</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='54' y='96' width='52' height='48' rx='6' fill='var(--acc)' opacity='.16'/><rect x='54' y='96' width='52' height='48' rx='6'/><circle cx='70' cy='116' r='5'/><circle cx='90' cy='116' r='5'/><path d='M70 128h20'/><path d='M80 96V76'/><path d='M40 40h80v22H40z'/><path d='M56 62v14M80 62v14M104 62v14'/><rect x='30' y='16' width='24' height='24' rx='4'/><rect x='68' y='12' width='24' height='28' rx='4'/><circle cx='118' cy='28' r='13'/><path d='M56 28h12M106 28h-14' opacity='.5' stroke-dasharray='3 4'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">One socket shape, three very different appliances.</p><div class=\"an-lab\">The analogy</div><p>Before the standard, every appliance shipped with its own strange prongs and its own adapter you inevitably lost. The standard does not make the kettle boil faster. It means the kettle plugs into anything without a bespoke lead.</p><div class=\"an-snap\"><b>So on the exam →</b> MCP is the open protocol connecting Claude to external tools, readable data and prompt templates through one interface.</div></div></div></div>", "nemesis": false, "world": "The plug standard", "analogy": "Before the standard, every appliance shipped with its own strange prongs and its own adapter you inevitably lost. The standard does not make the kettle boil faster. It means the kettle plugs into anything without a bespoke lead."}, {"id": "4.2", "title": "MCP Servers", "picture": "An appliance with buttons on the front and a booklet in the side pocket.", "snapback": "One server exposes three primitives: tools (actions you call), resources (data you read), prompts (reusable templates).", "html": "<div class=\"an\" style=\"--acc:var(--w-plug)\" data-an=\"4.2\"><div class=\"an-top\"><span class=\"an-w\">The plug standard</span><span class=\"an-t\">§4.2</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='22' y='34' width='92' height='96' rx='7'/><rect x='36' y='50' width='64' height='24' rx='4' fill='var(--acc)' opacity='.2'/><circle cx='48' cy='96' r='9'/><circle cx='68' cy='96' r='9'/><circle cx='88' cy='96' r='9'/><path d='M44 116h48' opacity='.5'/><path d='M120 56h26v54h-26z' fill='var(--acc)' opacity='.12'/><path d='M120 56h26v54h-26z'/><path d='M126 68h14M126 78h14M126 88h9'/><path d='M114 82h6' opacity='.6'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">An appliance with buttons on the front and a booklet in the side pocket.</p><div class=\"an-lab\">The analogy</div><p>The server is the machine. Its buttons are the things you can make it do. It came with a booklet you can read without pressing anything, and a card of pre-written settings for common jobs.</p><div class=\"an-snap\"><b>So on the exam →</b> One server exposes three primitives: tools (actions you call), resources (data you read), prompts (reusable templates).</div></div></div></div>", "nemesis": false, "world": "The plug standard", "analogy": "The server is the machine. Its buttons are the things you can make it do. It came with a booklet you can read without pressing anything, and a card of pre-written settings for common jobs."}, {"id": "4.3", "title": "Configuring MCP Servers", "picture": "The building's wiring versus the extension lead you brought from home.", "snapback": "<code>.mcp.json</code> at project root is version-controlled and shared. <code>~/.claude.json</code> is yours only. <code>${VAR}</code> keeps credentials out of the repo.", "html": "<div class=\"an\" style=\"--acc:var(--w-plug)\" data-an=\"4.3\"><div class=\"an-top\"><span class=\"an-w\">The plug standard</span><span class=\"an-t\">§4.3</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M14 62L52 30l38 32'/><path d='M22 62v72h60V62' /><path d='M34 84h16v16H34z' fill='var(--acc)' opacity='.2'/><path d='M34 84h16v16H34zM56 84h16v16H56z'/><path d='M42 100v34M64 100v34' opacity='.5' stroke-dasharray='3 4'/><path d='M110 44a14 14 0 1 1 0 28 14 14 0 0 1 0-28z'/><path d='M124 58c14 0 18 12 18 22s-6 22-18 26-16-6-16-16 6-16 14-16' /><rect x='96' y='114' width='26' height='18' rx='3' fill='var(--acc)' opacity='.2'/><path d='M96 114h26v18H96z'/><path d='M103 114v-8M115 114v-8'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">The building's wiring versus the extension lead you brought from home.</p><div class=\"an-lab\">The analogy</div><p>The wiring is in the walls — everyone who moves in inherits it. The lead in your bag is yours alone, which is fine right up until you assume your teammate has one too.</p><div class=\"an-snap\"><b>So on the exam →</b> <code>.mcp.json</code> at project root is version-controlled and shared. <code>~/.claude.json</code> is yours only. <code>${VAR}</code> keeps credentials out of the repo.</div></div></div></div>", "nemesis": false, "world": "The plug standard", "analogy": "The wiring is in the walls — everyone who moves in inherits it. The lead in your bag is yours alone, which is fine right up until you assume your teammate has one too."}, {"id": "4.4", "title": "The isError Flag in MCP", "picture": "A lit fault light beside an appliance that simply produced nothing.", "snapback": "<code>isError: true</code> when the query could not run. Zero matches is a success with an empty result — never an error.", "html": "<div class=\"an\" style=\"--acc:var(--w-plug)\" data-an=\"4.4\"><div class=\"an-top\"><span class=\"an-w\">The plug standard</span><span class=\"an-t\">§4.4</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='14' y='40' width='58' height='84' rx='6'/><circle cx='43' cy='60' r='9' fill='var(--acc)' opacity='.5'/><circle cx='43' cy='60' r='9'/><path d='M43 55v6' stroke-width='2.4'/><circle cx='43' cy='66' r='1.3' fill='currentColor'/><path d='M28 86h30M28 98h30M28 110h18' opacity='.55'/><path d='M34 34l4-10M52 34l-4-10' opacity='.7'/><rect x='88' y='40' width='58' height='84' rx='6'/><circle cx='117' cy='60' r='9'/><path d='M100 90h34v26h-34z' stroke-dasharray='5 5'/><path d='M108 103h18' opacity='.5'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A lit fault light beside an appliance that simply produced nothing.</p><div class=\"an-lab\">The analogy</div><p>'It broke' and 'it worked, and there was genuinely nothing in there' look identical from across the room, and they lead you to do opposite things. One deserves another go. The other is your answer.</p><div class=\"an-snap\"><b>So on the exam →</b> <code>isError: true</code> when the query could not run. Zero matches is a success with an empty result — never an error.</div></div></div></div>", "nemesis": false, "world": "The plug standard", "analogy": "'It broke' and 'it worked, and there was genuinely nothing in there' look identical from across the room, and they lead you to do opposite things. One deserves another go. The other is your answer."}, {"id": "4.5", "title": "MCP Resources", "picture": "Reading the contents page, versus pressing every button to find out what the machine does.", "snapback": "Resources hand the model a readable map of what data exists, without spending tool calls on exploratory guessing.", "html": "<div class=\"an\" style=\"--acc:var(--w-plug)\" data-an=\"4.5\"><div class=\"an-top\"><span class=\"an-w\">The plug standard</span><span class=\"an-t\">§4.5</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M18 40c18-8 34-8 44 4v76c-10-12-26-12-44-4z' fill='var(--acc)' opacity='.14'/><path d='M18 40c18-8 34-8 44 4v76c-10-12-26-12-44-4zM106 40c-18-8-34-8-44 4v76c10-12 26-12 44-4z'/><path d='M28 60h22M28 72h22M28 84h14M74 60h22M74 72h22M74 84h14' opacity='.7'/><path d='M126 44h22v22h-22zM126 76h22v22h-22z'/><circle cx='137' cy='120' r='11'/><path d='M137 113v6' opacity='.7'/><path d='M120 36l6-8M154 36l-6-8' opacity='.6'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Reading the contents page, versus pressing every button to find out what the machine does.</p><div class=\"an-lab\">The analogy</div><p>You can discover the menu by pressing all fourteen buttons and watching what happens. Or you can read the two-page contents list that came in the box, and then press exactly the one you needed.</p><div class=\"an-snap\"><b>So on the exam →</b> Resources hand the model a readable map of what data exists, without spending tool calls on exploratory guessing.</div></div></div></div>", "nemesis": false, "world": "The plug standard", "analogy": "You can discover the menu by pressing all fourteen buttons and watching what happens. Or you can read the two-page contents list that came in the box, and then press exactly the one you needed."}, {"id": "5.1", "title": "The CLAUDE.md Hierarchy", "picture": "Three notes from three floors, all ending up in the same hand.", "snapback": "The levels concatenate from root down to the working directory. There is no override precedence between them.", "html": "<div class=\"an hi\" style=\"--acc:var(--w-house)\" data-an=\"5.1\"><div class=\"an-top\"><span class=\"an-w\">The house you moved into</span><span class=\"an-t\">§5.1</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M10 46L80 12l70 34'/><path d='M22 46v96h116V46'/><path d='M22 78h116M22 110h116' opacity='.45'/><rect x='34' y='54' width='22' height='18' rx='2' fill='var(--acc)' opacity='.25'/><rect x='34' y='86' width='22' height='18' rx='2' fill='var(--acc)' opacity='.25'/><rect x='34' y='118' width='22' height='18' rx='2' fill='var(--acc)' opacity='.25'/><path d='M34 54h22v18H34zM34 86h22v18H34zM34 118h22v18H34z'/><path d='M56 63h34M56 95h20a14 14 0 0 0 14-14V63M56 127h20a30 30 0 0 0 30-30V63' opacity='.75'/><rect x='96' y='52' width='30' height='22' rx='3'/><path d='M103 60h16M103 67h10' opacity='.7'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Three notes from three floors, all ending up in the same hand.</p><div class=\"an-lab\">The analogy</div><p>Building rules, flat rules, room rules. You do not reach the room and discover the building rules have evaporated — you are holding all three at once. If two of them disagree, that is now a piece of paper you have to go and fix.</p><div class=\"an-snap\"><b>So on the exam →</b> The levels concatenate from root down to the working directory. There is no override precedence between them.</div></div></div><div class=\"an-nem\"><span class=\"lab\">⚠ Your record · The §3.1 family has cost you four papers</span>Concatenation, not override. Every discovered file contributes, root down to the working directory. If two of them conflict, both are in context and you fix the files &mdash; nothing silently wins.</div></div>", "nemesis": true, "world": "The house you moved into", "analogy": "Building rules, flat rules, room rules. You do not reach the room and discover the building rules have evaporated — you are holding all three at once. If two of them disagree, that is now a piece of paper you have to go and fix."}, {"id": "5.2", "title": "@path Syntax (File Imports)", "picture": "A note that says 'see the green folder', and the green folder.", "snapback": "<code>@./path/file.md</code> inlines another file. Relative paths resolve from the file doing the importing. Maximum nesting depth is 5.", "html": "<div class=\"an\" style=\"--acc:var(--w-house)\" data-an=\"5.2\"><div class=\"an-top\"><span class=\"an-w\">The house you moved into</span><span class=\"an-t\">§5.2</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='14' y='34' width='48' height='60' rx='4' fill='var(--acc)' opacity='.14'/><path d='M14 34h48v60H14z'/><path d='M24 50h28M24 62h28M24 74h16'/><path d='M62 64h26' stroke-dasharray='0'/><path d='M80 56l10 8-10 8'/><rect x='94' y='34' width='48' height='60' rx='4'/><path d='M104 50h28M104 62h28M104 74h16' opacity='.7'/><path d='M30 106v10h100v-10' opacity='.5'/><path d='M40 122h16M64 122h16M88 122h16M112 122h16' opacity='.5'/><text x='80' y='142' font-size='13' fill='currentColor' stroke='none' text-anchor='middle' font-family='monospace'>max 5</text></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A note that says 'see the green folder', and the green folder.</p><div class=\"an-lab\">The analogy</div><p>Instead of one enormous laminated sheet nobody reads, the fridge note points at the folder that actually holds the detail. Chains work — up to a point, and that point is five.</p><div class=\"an-snap\"><b>So on the exam →</b> <code>@./path/file.md</code> inlines another file. Relative paths resolve from the file doing the importing. Maximum nesting depth is 5.</div></div></div></div>", "nemesis": false, "world": "The house you moved into", "analogy": "Instead of one enormous laminated sheet nobody reads, the fridge note points at the folder that actually holds the detail. Chains work — up to a point, and that point is five."}, {"id": "5.3", "title": "The .claude/rules/ Directory", "picture": "Notes taped to individual doors. Only the one you walk through lights up.", "snapback": "Rules load on file-path glob match. If the question is not about <em>which files</em>, it is not rules.", "html": "<div class=\"an hi\" style=\"--acc:var(--w-house)\" data-an=\"5.3\"><div class=\"an-top\"><span class=\"an-w\">The house you moved into</span><span class=\"an-t\">§5.3</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M8 44L80 12l72 32'/><path d='M20 44v100h120V44'/><rect x='30' y='66' width='30' height='58' rx='3'/><rect x='66' y='66' width='30' height='58' rx='3' fill='var(--acc)' opacity='.22'/><rect x='102' y='66' width='30' height='58' rx='3'/><circle cx='55' cy='96' r='2.4' fill='currentColor'/><circle cx='91' cy='96' r='2.4' fill='currentColor'/><circle cx='127' cy='96' r='2.4' fill='currentColor'/><rect x='36' y='54' width='18' height='11' rx='2' opacity='.4'/><rect x='72' y='54' width='18' height='11' rx='2' fill='var(--acc)' opacity='.6'/><rect x='72' y='54' width='18' height='11' rx='2'/><rect x='108' y='54' width='18' height='11' rx='2' opacity='.4'/><circle cx='81' cy='136' r='7'/><path d='M81 129v-5' opacity='.6'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Notes taped to individual doors. Only the one you walk through lights up.</p><div class=\"an-lab\">The analogy</div><p>The bathroom note is invisible until you are actually in the bathroom. Brilliant when a rule genuinely only concerns bathrooms. Useless for 'shoes off at the front door', which has to live on the fridge where everyone passes it.</p><div class=\"an-snap\"><b>So on the exam →</b> Rules load on file-path glob match. If the question is not about <em>which files</em>, it is not rules.</div></div></div><div class=\"an-nem\"><span class=\"lab\">⚠ Your record · Three wrong picks across two papers</span>Exam 12 Q1 (answer was <code>/memory</code>), Exam 12 Q56 (answer was <code>.claude/commands/</code>), Exam 13 Q41 (answer was to delete prose from <code>CLAUDE.md</code>). Three different right answers, one recurring instinct. <strong>Rules answer &ldquo;which files&rdquo;. If the question is not about which files, it is not rules.</strong></div></div>", "nemesis": true, "world": "The house you moved into", "analogy": "The bathroom note is invisible until you are actually in the bathroom. Brilliant when a rule genuinely only concerns bathrooms. Useless for 'shoes off at the front door', which has to live on the fridge where everyone passes it."}, {"id": "5.4", "title": "Custom Slash Commands and Skills", "picture": "A labelled box you take down from the cupboard when you actually need it.", "snapback": "Project commands in <code>.claude/commands/</code> ship with the clone. Personal ones in <code>~/.claude/commands/</code> do not. <code>$ARGUMENTS</code> carries whatever was typed after the name.", "html": "<div class=\"an hi\" style=\"--acc:var(--w-house)\" data-an=\"5.4\"><div class=\"an-top\"><span class=\"an-w\">The house you moved into</span><span class=\"an-t\">§5.4</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M16 26h128v112H16z'/><path d='M16 62h128M16 100h128' opacity='.45'/><rect x='28' y='34' width='40' height='22' rx='3' opacity='.5'/><rect x='78' y='34' width='40' height='22' rx='3' opacity='.5'/><rect x='28' y='72' width='40' height='22' rx='3' opacity='.5'/><rect x='84' y='66' width='56' height='34' rx='4' fill='var(--acc)' opacity='.2'/><path d='M84 66h56v34H84z'/><path d='M94 78h30M94 88h18'/><path d='M140 84h14' opacity='.7'/><path d='M148 78l8 6-8 6'/><path d='M30 110h34M78 110h34' opacity='.4'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A labelled box you take down from the cupboard when you actually need it.</p><div class=\"an-lab\">The analogy</div><p>It does not run your household. It sits on the shelf with its name printed on the front until somebody asks for it by name.</p><div class=\"an-snap\"><b>So on the exam →</b> Project commands in <code>.claude/commands/</code> ship with the clone. Personal ones in <code>~/.claude/commands/</code> do not. <code>$ARGUMENTS</code> carries whatever was typed after the name.</div></div></div><div class=\"an-nem\"><span class=\"lab\">⚠ Your record · Missed on Exam 12 Q56</span>Version-controlled and ships with the clone is the whole point of the project path. <code>~/.claude/commands/</code> reaches nobody else on the team.</div></div>", "nemesis": true, "world": "The house you moved into", "analogy": "It does not run your household. It sits on the shelf with its name printed on the front until somebody asks for it by name."}, {"id": "5.5", "title": "Skills — .claude/skills/", "picture": "The spec printed on the inside of the box lid.", "snapback": "SKILL.md frontmatter: <code>description</code>, <code>argument-hint</code>, <code>allowed-tools</code>, <code>context: fork</code>. Tool scoping lives here — not in <code>.mcp.json</code>.", "html": "<div class=\"an\" style=\"--acc:var(--w-house)\" data-an=\"5.5\"><div class=\"an-top\"><span class=\"an-w\">The house you moved into</span><span class=\"an-t\">§5.5</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M22 70h84v62H22z'/><path d='M22 70l22-40h84l-22 40z' fill='var(--acc)' opacity='.14'/><path d='M22 70l22-40h84l-22 40z'/><path d='M106 70l22-40v62l-22 40z'/><path d='M54 40h60M54 50h44M54 60h52' opacity='.8'/><path d='M34 88h56M34 100h40M34 112h56' opacity='.55'/><circle cx='128' cy='104' r='6'/><path d='M128 110v10M128 120l-10 8M128 120l10 8'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">The spec printed on the inside of the box lid.</p><div class=\"an-lab\">The analogy</div><p>Inside the lid: what this thing is, what to type after its name, which tools it is allowed to touch, and whether it makes its mess in a separate room.</p><div class=\"an-snap\"><b>So on the exam →</b> SKILL.md frontmatter: <code>description</code>, <code>argument-hint</code>, <code>allowed-tools</code>, <code>context: fork</code>. Tool scoping lives here — not in <code>.mcp.json</code>.</div></div></div></div>", "nemesis": false, "world": "The house you moved into", "analogy": "Inside the lid: what this thing is, what to type after its name, which tools it is allowed to touch, and whether it makes its mess in a separate room."}, {"id": "5.6", "title": "Planning Mode vs Direct Execution", "picture": "Surveying the wall versus hammering one nail.", "snapback": "Plan mode for large or multi-approach work; direct execution when the scope is clear. Switching reactively mid-job is the documented trap.", "html": "<div class=\"an\" style=\"--acc:var(--w-house)\" data-an=\"5.6\"><div class=\"an-top\"><span class=\"an-w\">The house you moved into</span><span class=\"an-t\">§5.6</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M14 34h56v104H14z'/><path d='M14 34h56v104H14z' fill='var(--acc)' opacity='.08'/><path d='M22 46h40M22 58h40M22 70h24' stroke-dasharray='4 4' opacity='.7'/><path d='M20 88v42M20 88h6M20 130h6' opacity='.7'/><path d='M34 92h32v34H34z' stroke-dasharray='5 4'/><path d='M92 34h54v104H92z'/><circle cx='119' cy='72' r='2.6' fill='currentColor'/><path d='M119 72v-14' opacity='.5'/><path d='M104 104l16-16 8 8' stroke-width='3'/><path d='M126 90l10-10 8 8-10 10z'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Surveying the wall versus hammering one nail.</p><div class=\"an-lab\">The analogy</div><p>You measure before knocking through a supporting wall. You do not commission a structural survey to hang a picture. And you do not start swinging, then call the surveyor once it gets frightening.</p><div class=\"an-snap\"><b>So on the exam →</b> Plan mode for large or multi-approach work; direct execution when the scope is clear. Switching reactively mid-job is the documented trap.</div></div></div></div>", "nemesis": false, "world": "The house you moved into", "analogy": "You measure before knocking through a supporting wall. You do not commission a structural survey to hang a picture. And you do not start swinging, then call the surveyor once it gets frightening."}, {"id": "5.7", "title": "The /compact Command", "picture": "A thick diary squeezed thin, with the dates falling out of the side.", "snapback": "<code>/compact</code> compresses context and can drop exact values, dates and specifics. Do not run it immediately before work that needs the precision.", "html": "<div class=\"an\" style=\"--acc:var(--w-house)\" data-an=\"5.7\"><div class=\"an-top\"><span class=\"an-w\">The house you moved into</span><span class=\"an-t\">§5.7</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M16 30h44v112H16z' fill='var(--acc)' opacity='.14'/><path d='M16 30h44v112H16z'/><path d='M24 44h28M24 56h28M24 68h28M24 80h28M24 92h28M24 104h28' opacity='.6'/><path d='M74 86h30' /><path d='M96 78l10 8-10 8'/><path d='M114 58h30v56h-30z'/><path d='M120 74h18M120 86h18' opacity='.6'/><text x='84' y='42' font-size='12' fill='currentColor' stroke='none' text-anchor='middle' font-family='monospace'>310</text><text x='96' y='128' font-size='12' fill='currentColor' stroke='none' text-anchor='middle' font-family='monospace'>12th</text><path d='M78 46l-4 10M92 118l-6 8' opacity='.5'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A thick diary squeezed thin, with the dates falling out of the side.</p><div class=\"an-lab\">The analogy</div><p>You keep the plot. You lose 'three hundred and ten pounds, due on the twelfth'. Which is entirely fine, right up until the next thing you do turns on it being three hundred and ten pounds due on the twelfth.</p><div class=\"an-snap\"><b>So on the exam →</b> <code>/compact</code> compresses context and can drop exact values, dates and specifics. Do not run it immediately before work that needs the precision.</div></div></div></div>", "nemesis": false, "world": "The house you moved into", "analogy": "You keep the plot. You lose 'three hundred and ten pounds, due on the twelfth'. Which is entirely fine, right up until the next thing you do turns on it being three hundred and ten pounds due on the twelfth."}, {"id": "5.8", "title": "The /memory Command", "picture": "Fanning out the rulebooks you are actually holding, and spotting the gap.", "snapback": "<code>/memory</code> lists the memory files actually loaded. First diagnostic step whenever behaviour differs between machines or between sessions.", "html": "<div class=\"an hi\" style=\"--acc:var(--w-house)\" data-an=\"5.8\"><div class=\"an-top\"><span class=\"an-w\">The house you moved into</span><span class=\"an-t\">§5.8</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M40 130l-6-64 26-6 8 62z' fill='var(--acc)' opacity='.16'/><path d='M40 130l-6-64 26-6 8 62z'/><path d='M68 122l4-64 26 2-2 64z'/><path d='M96 124l10-62 26 6-14 62z' stroke-dasharray='5 5' opacity='.55'/><path d='M44 84h16M46 98h16M76 78h18M76 92h18' opacity='.7'/><circle cx='118' cy='36' r='14'/><path d='M128 46l14 14'/><path d='M112 36h12M118 30v12' opacity='.8'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Fanning out the rulebooks you are actually holding, and spotting the gap.</p><div class=\"an-lab\">The analogy</div><p>Before arguing about why the rule is not being followed, check whether the page carrying the rule is in your hand at all. Very often it turns out to be on somebody else's fridge.</p><div class=\"an-snap\"><b>So on the exam →</b> <code>/memory</code> lists the memory files actually loaded. First diagnostic step whenever behaviour differs between machines or between sessions.</div></div></div><div class=\"an-nem\"><span class=\"lab\">⚠ Your record · Missed on Exam 12 Q1</span>When a rule is followed on one machine and not another, the first move is diagnostic, not structural. Check which memory files actually loaded before you move anything anywhere.</div></div>", "nemesis": true, "world": "The house you moved into", "analogy": "Before arguing about why the rule is not being followed, check whether the page carrying the rule is in your hand at all. Very often it turns out to be on somebody else's fridge."}, {"id": "5.9", "title": "Claude Code CLI for CI/CD", "picture": "One terminal prints and exits. The other sits there blinking forever.", "snapback": "<code>-p</code>/<code>--print</code> runs non-interactive. <code>--output-format json</code> with <code>--json-schema</code> makes the output parseable. <code>--batch</code> and <code>CLAUDE_HEADLESS</code> do not exist.", "html": "<div class=\"an\" style=\"--acc:var(--w-house)\" data-an=\"5.9\"><div class=\"an-top\"><span class=\"an-w\">The house you moved into</span><span class=\"an-t\">§5.9</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='12' y='34' width='64' height='52' rx='5'/><path d='M12 48h64' opacity='.5'/><path d='M20 60h10l6 6-6 6' opacity='.8'/><path d='M42 72h24' fill='var(--acc)'/><rect x='20' y='94' width='48' height='34' rx='4' fill='var(--acc)' opacity='.18'/><path d='M20 94h48v34H20z'/><path d='M28 106h32M28 116h20' opacity='.7'/><rect x='88' y='34' width='60' height='52' rx='5'/><path d='M88 48h60' opacity='.5'/><path d='M96 62h10l6 6-6 6' opacity='.8'/><path d='M120 74h4' stroke-width='4'/><circle cx='118' cy='112' r='18'/><path d='M118 100v12l9 6'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">One terminal prints and exits. The other sits there blinking forever.</p><div class=\"an-lab\">The analogy</div><p>A pipeline has nobody at the keyboard. Without the flag that means 'answer and go', it waits politely for a human who is never coming, and the build times out at 3am.</p><div class=\"an-snap\"><b>So on the exam →</b> <code>-p</code>/<code>--print</code> runs non-interactive. <code>--output-format json</code> with <code>--json-schema</code> makes the output parseable. <code>--batch</code> and <code>CLAUDE_HEADLESS</code> do not exist.</div></div></div></div>", "nemesis": false, "world": "The house you moved into", "analogy": "A pipeline has nobody at the keyboard. Without the flag that means 'answer and go', it waits politely for a human who is never coming, and the build times out at 3am."}, {"id": "5.10", "title": "fork_session and Session Management", "picture": "One save point, two branches that never touch again.", "snapback": "<code>fork_session</code> gives divergent branches from one shared baseline. <code>--resume</code> continues a named session; tell it which files changed if the code moved underneath it.", "html": "<div class=\"an\" style=\"--acc:var(--w-house)\" data-an=\"5.10\"><div class=\"an-top\"><span class=\"an-w\">The house you moved into</span><span class=\"an-t\">§5.10</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M16 80h44'/><circle cx='60' cy='80' r='9' fill='var(--acc)' opacity='.35'/><circle cx='60' cy='80' r='9'/><path d='M69 76c14-10 24-22 42-30M69 84c14 10 24 22 42 30'/><circle cx='120' cy='42' r='11'/><circle cx='120' cy='118' r='11'/><path d='M115 42h10M120 37v10' opacity='.7'/><path d='M115 118h10' opacity='.7'/><path d='M132 42h18M132 118h18' opacity='.4' stroke-dasharray='4 4'/><path d='M24 66v28M16 66h16M16 94h16' opacity='.5'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">One save point, two branches that never touch again.</p><div class=\"an-lab\">The analogy</div><p>You spent two hours mapping the dungeon. You are not doing that again to try the other door — you save, and you branch.</p><div class=\"an-snap\"><b>So on the exam →</b> <code>fork_session</code> gives divergent branches from one shared baseline. <code>--resume</code> continues a named session; tell it which files changed if the code moved underneath it.</div></div></div></div>", "nemesis": false, "world": "The house you moved into", "analogy": "You spent two hours mapping the dungeon. You are not doing that again to try the other door — you save, and you branch."}, {"id": "6.1", "title": "Few-shot Prompting", "picture": "Three finished pieces of work on the desk, not a longer briefing document.", "snapback": "Target 4–6 examples at exactly the ambiguous cases where it gets things wrong. More examples of the obvious cases will not move the boundary.", "html": "<div class=\"an hi\" style=\"--acc:var(--w-intern)\" data-an=\"6.1\"><div class=\"an-top\"><span class=\"an-w\">Training an intern</span><span class=\"an-t\">§6.1</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='14' y='24' width='42' height='54' rx='4' fill='var(--acc)' opacity='.18'/><path d='M14 24h42v54H14z'/><rect x='60' y='24' width='42' height='54' rx='4' fill='var(--acc)' opacity='.18'/><path d='M60 24h42v54H60z'/><rect x='106' y='24' width='42' height='54' rx='4' fill='var(--acc)' opacity='.18'/><path d='M106 24h42v54h-42z'/><path d='M22 40h26M22 50h26M22 60h16M68 40h26M68 50h26M68 60h16M114 40h26M114 50h26M114 60h16' opacity='.6'/><path d='M24 68l6 6 10-12M70 68l6 6 10-12M116 68l6 6 10-12' opacity='.9'/><path d='M28 96h104' stroke-dasharray='5 5' opacity='.5'/><rect x='52' y='106' width='56' height='38' rx='4'/><path d='M62 120h36M62 132h22' opacity='.7'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Three finished pieces of work on the desk, not a longer briefing document.</p><div class=\"an-lab\">The analogy</div><p>The intern read your two-page brief and still formatted it wrong. Put three completed examples in front of them and they get it in about nine seconds. Pick the three that were confusing, though — three more easy ones teach nobody anything.</p><div class=\"an-snap\"><b>So on the exam →</b> Target 4–6 examples at exactly the ambiguous cases where it gets things wrong. More examples of the obvious cases will not move the boundary.</div></div></div><div class=\"an-nem\"><span class=\"lab\">⚠ Your record · Missed on Exam 12 Q6</span>Prose instructions already failed. Adding a post-processing repair stage leaves generation exactly as unreliable as it was; examples of the exact shape are the documented fix.</div></div>", "nemesis": true, "world": "Training an intern", "analogy": "The intern read your two-page brief and still formatted it wrong. Put three completed examples in front of them and they get it in about nine seconds. Pick the three that were confusing, though — three more easy ones teach nobody anything."}, {"id": "6.2", "title": "Explicit Criteria vs Vague Instructions", "picture": "'Use your judgement' next to a tick-list with numbers on it.", "snapback": "Replace abstract intent with an explicitly testable condition. 'Check accuracy' becomes 'flag only when the claimed behaviour contradicts the code'.", "html": "<div class=\"an\" style=\"--acc:var(--w-intern)\" data-an=\"6.2\"><div class=\"an-top\"><span class=\"an-w\">Training an intern</span><span class=\"an-t\">§6.2</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='14' y='30' width='58' height='100' rx='5'/><path d='M24 50h38M24 62h38M24 74h24' opacity='.45' stroke-dasharray='4 4'/><path d='M30 96c0-6 6-9 9-6s-1 7-2 9v4' opacity='.7'/><circle cx='37' cy='110' r='1.6' fill='currentColor'/><rect x='88' y='30' width='58' height='100' rx='5' fill='var(--acc)' opacity='.12'/><path d='M88 30h58v100H88z'/><path d='M98 50l5 5 8-9M98 70l5 5 8-9M98 90l5 5 8-9M98 110l5 5 8-9'/><path d='M118 50h20M118 70h20M118 90h14M118 110h20' opacity='.75'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">'Use your judgement' next to a tick-list with numbers on it.</p><div class=\"an-lab\">The analogy</div><p>Tell an intern to flag anything that 'looks off' and you will get forty things, half of them fine. Tell them to flag only where the comment claims behaviour the code does not have, and you get the four that matter.</p><div class=\"an-snap\"><b>So on the exam →</b> Replace abstract intent with an explicitly testable condition. 'Check accuracy' becomes 'flag only when the claimed behaviour contradicts the code'.</div></div></div></div>", "nemesis": false, "world": "Training an intern", "analogy": "Tell an intern to flag anything that 'looks off' and you will get forty things, half of them fine. Tell them to flag only where the comment claims behaviour the code does not have, and you get the four that matter."}, {"id": "6.3", "title": "Prompt Chaining", "picture": "A relay baton going hand to hand, one runner per leg.", "snapback": "Break a complex task into sequential focused prompts, each consuming the previous step's output. More focused and more consistent than one giant prompt.", "html": "<div class=\"an\" style=\"--acc:var(--w-intern)\" data-an=\"6.3\"><div class=\"an-top\"><span class=\"an-w\">Training an intern</span><span class=\"an-t\">§6.3</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx='26' cy='52' r='11'/><path d='M26 63v26M26 89l-8 24M26 89l8 24'/><path d='M36 72l16-6'/><circle cx='80' cy='52' r='11'/><path d='M80 63v26M80 89l-8 24M80 89l8 24'/><path d='M70 72l-14-6M90 72l16-6'/><circle cx='134' cy='52' r='11'/><path d='M134 63v26M134 89l-8 24M134 89l8 24'/><path d='M124 72l-14-6'/><rect x='48' y='60' width='16' height='7' rx='3.5' fill='var(--acc)' opacity='.45'/><rect x='48' y='60' width='16' height='7' rx='3.5'/><rect x='102' y='60' width='16' height='7' rx='3.5' fill='var(--acc)' opacity='.45'/><rect x='102' y='60' width='16' height='7' rx='3.5'/><path d='M10 132h140' opacity='.4'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A relay baton going hand to hand, one runner per leg.</p><div class=\"an-lab\">The analogy</div><p>Nobody runs the whole race carrying everything. Leg one finds the problems. Leg two writes the fixes for exactly those problems. Each runner has one job and starts from what the last one handed over.</p><div class=\"an-snap\"><b>So on the exam →</b> Break a complex task into sequential focused prompts, each consuming the previous step's output. More focused and more consistent than one giant prompt.</div></div></div></div>", "nemesis": false, "world": "Training an intern", "analogy": "Nobody runs the whole race carrying everything. Leg one finds the problems. Leg two writes the fixes for exactly those problems. Each runner has one job and starts from what the last one handed over."}, {"id": "6.4", "title": "The Interview Pattern", "picture": "The intern asking four questions before touching the keyboard.", "snapback": "For an underspecified brief in a domain you do not know well, have Claude interview you first. One interview turn replaces several correction cycles.", "html": "<div class=\"an\" style=\"--acc:var(--w-intern)\" data-an=\"6.4\"><div class=\"an-top\"><span class=\"an-w\">Training an intern</span><span class=\"an-t\">§6.4</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx='44' cy='42' r='14'/><path d='M44 56v30M44 86l-9 26M44 86l9 26M30 68h28'/><rect x='72' y='20' width='72' height='48' rx='6' fill='var(--acc)' opacity='.15'/><path d='M72 20h72v48H72z'/><path d='M72 68l-14 12 4-12' fill='none'/><path d='M84 34h48M84 44h48M84 54h30' opacity='.7'/><circle cx='138' cy='30' r='3' fill='currentColor' stroke='none'/><path d='M96 96h56' opacity='.4' stroke-dasharray='4 4'/><path d='M104 116c0-8 8-12 12-8s-2 9-3 12v3' opacity='.6'/><circle cx='113' cy='134' r='1.8' fill='currentColor'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">The intern asking four questions before touching the keyboard.</p><div class=\"an-lab\">The analogy</div><p>Three drafts came back, each missing something different, because nobody in the room knew what to specify. One round of them interviewing you costs a single turn and surfaces all four unknowns at once.</p><div class=\"an-snap\"><b>So on the exam →</b> For an underspecified brief in a domain you do not know well, have Claude interview you first. One interview turn replaces several correction cycles.</div></div></div></div>", "nemesis": false, "world": "Training an intern", "analogy": "Three drafts came back, each missing something different, because nobody in the room knew what to specify. One round of them interviewing you costs a single turn and surfaces all four unknowns at once."}, {"id": "6.5", "title": "Validation and Retry-with-Feedback", "picture": "Work handed back with the specific line circled in red, not a shrug.", "snapback": "Send the original input, the failed output and the specific validation error. Retry fixes format, structure and arithmetic — never genuinely absent information.", "html": "<div class=\"an\" style=\"--acc:var(--w-intern)\" data-an=\"6.5\"><div class=\"an-top\"><span class=\"an-w\">Training an intern</span><span class=\"an-t\">§6.5</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='16' y='20' width='72' height='92' rx='5'/><path d='M26 38h52M26 50h52M26 62h52' opacity='.55'/><rect x='24' y='74' width='56' height='16' rx='3' fill='var(--acc)' opacity='.22'/><path d='M24 74h56v16H24z'/><path d='M32 82h18M58 82h14' opacity='.8'/><ellipse cx='52' cy='82' rx='34' ry='14' stroke-width='2.2' opacity='.85'/><path d='M104 44a30 30 0 1 0 12-14' /><path d='M100 24l6 18 18-6' /><path d='M108 88h40M108 100h40M108 112h24' opacity='.45'/><circle cx='128' cy='68' r='4' fill='var(--acc)' opacity='.5'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Work handed back with the specific line circled in red, not a shrug.</p><div class=\"an-lab\">The analogy</div><p>'Do it again' teaches nothing. 'Your total says 150, the line items add to 145' fixes it on the next pass. And if the number was never on the invoice in the first place, no amount of handing it back will conjure one.</p><div class=\"an-snap\"><b>So on the exam →</b> Send the original input, the failed output and the specific validation error. Retry fixes format, structure and arithmetic — never genuinely absent information.</div></div></div></div>", "nemesis": false, "world": "Training an intern", "analogy": "'Do it again' teaches nothing. 'Your total says 150, the line items add to 145' fixes it on the next pass. And if the number was never on the invoice in the first place, no amount of handing it back will conjure one."}, {"id": "6.6", "title": "Self-correction", "picture": "Two totals written side by side, with a box that ticks when they disagree.", "snapback": "Build the re-derivation into the output schema: <code>stated_total</code>, <code>calculated_total</code>, <code>conflict_detected</code>. Structural, not a conversational follow-up.", "html": "<div class=\"an\" style=\"--acc:var(--w-intern)\" data-an=\"6.6\"><div class=\"an-top\"><span class=\"an-w\">Training an intern</span><span class=\"an-t\">§6.6</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='14' y='26' width='132' height='108' rx='6'/><path d='M80 26v108' opacity='.35'/><path d='M26 44h40M26 56h40M26 68h28' opacity='.55'/><path d='M92 44h40M92 56h40M92 68h28' opacity='.55'/><text x='46' y='96' font-size='15' fill='currentColor' stroke='none' text-anchor='middle' font-family='monospace'>150</text><text x='114' y='96' font-size='15' fill='currentColor' stroke='none' text-anchor='middle' font-family='monospace'>145</text><rect x='58' y='106' width='44' height='18' rx='4' fill='var(--acc)' opacity='.3'/><path d='M58 106h44v18H58z'/><path d='M66 115l5 5 9-10'/><path d='M46 100v-8M114 100v-8' opacity='.4'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Two totals written side by side, with a box that ticks when they disagree.</p><div class=\"an-lab\">The analogy</div><p>You do not ask the intern 'are you sure?' — they will say yes. You make them write down the total as printed, then add the items up themselves, and put both numbers on the form. The disagreement becomes a field, not a feeling.</p><div class=\"an-snap\"><b>So on the exam →</b> Build the re-derivation into the output schema: <code>stated_total</code>, <code>calculated_total</code>, <code>conflict_detected</code>. Structural, not a conversational follow-up.</div></div></div></div>", "nemesis": false, "world": "Training an intern", "analogy": "You do not ask the intern 'are you sure?' — they will say yes. You make them write down the total as printed, then add the items up themselves, and put both numbers on the form. The disagreement becomes a field, not a feeling."}, {"id": "7.1", "title": "Batches: Overview", "picture": "A service counter: half price, back within twenty-four hours.", "snapback": "The Batch API processes asynchronously at 50% of the cost, with a window of up to 24 hours.", "html": "<div class=\"an\" style=\"--acc:var(--w-laundry)\" data-an=\"7.1\"><div class=\"an-top\"><span class=\"an-w\">The launderette</span><span class=\"an-t\">§7.1</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='20' y='52' width='120' height='82' rx='8'/><path d='M20 74h120' opacity='.45'/><circle cx='80' cy='104' r='24'/><circle cx='80' cy='104' r='16' fill='var(--acc)' opacity='.2'/><circle cx='34' cy='63' r='4' fill='currentColor' stroke='none'/><circle cx='48' cy='63' r='4'/><path d='M40 20h80l-8 32H48z' fill='var(--acc)' opacity='.14'/><path d='M40 20h80l-8 32H48z'/><text x='80' y='42' font-size='14' fill='currentColor' stroke='none' text-anchor='middle' font-family='monospace'>-50%</text><path d='M112 90a20 20 0 1 1-8-10' opacity='.5'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A service counter: half price, back within twenty-four hours.</p><div class=\"an-lab\">The analogy</div><p>You hand over the bag and walk away. It comes back for half what the express counter charges. Nobody at any point tells you when.</p><div class=\"an-snap\"><b>So on the exam →</b> The Batch API processes asynchronously at 50% of the cost, with a window of up to 24 hours.</div></div></div></div>", "nemesis": false, "world": "The launderette", "analogy": "You hand over the bag and walk away. It comes back for half what the express counter charges. Nobody at any point tells you when."}, {"id": "7.2", "title": "Batch API vs Synchronous API", "picture": "The overnight bag versus the shirt you need pressed while you wait.", "snapback": "Batch for non-blocking, latency-tolerant work: overnight reports, weekly audits, bulk document runs. Synchronous for anything a human or a pipeline is waiting on.", "html": "<div class=\"an\" style=\"--acc:var(--w-laundry)\" data-an=\"7.2\"><div class=\"an-top\"><span class=\"an-w\">The launderette</span><span class=\"an-t\">§7.2</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M18 66c0-10 10-18 26-18s26 8 26 18v58c0 6-6 10-26 10s-26-4-26-10z' fill='var(--acc)' opacity='.14'/><path d='M18 66c0-10 10-18 26-18s26 8 26 18v58c0 6-6 10-26 10s-26-4-26-10z'/><path d='M32 48c4-8 20-8 24 0'/><path d='M28 84h32M28 98h32' opacity='.5'/><path d='M18 30h52' opacity='.4' stroke-dasharray='4 4'/><path d='M104 44l16-10 16 10-8 12h-16z'/><path d='M112 56v62h32V56'/><path d='M120 74h16M120 88h16' opacity='.5'/><circle cx='128' cy='24' r='12'/><path d='M128 16v8l6 4'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">The overnight bag versus the shirt you need pressed while you wait.</p><div class=\"an-lab\">The analogy</div><p>Bedding, towels, the winter coat — all of that goes in the overnight bag and you save half. The shirt for the interview in forty minutes does not go in the overnight bag, no matter what it costs.</p><div class=\"an-snap\"><b>So on the exam →</b> Batch for non-blocking, latency-tolerant work: overnight reports, weekly audits, bulk document runs. Synchronous for anything a human or a pipeline is waiting on.</div></div></div></div>", "nemesis": false, "world": "The launderette", "analogy": "Bedding, towels, the winter coat — all of that goes in the overnight bag and you save half. The shirt for the interview in forty minutes does not go in the overnight bag, no matter what it costs."}, {"id": "7.3", "title": "Using custom_id", "picture": "A name tag sewn into every shirt before it goes in the bag.", "snapback": "Results can arrive in any order. <code>custom_id</code> is the join key back to the originating request — never rely on ordering.", "html": "<div class=\"an\" style=\"--acc:var(--w-laundry)\" data-an=\"7.3\"><div class=\"an-top\"><span class=\"an-w\">The launderette</span><span class=\"an-t\">§7.3</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='12' y='30' width='40' height='30' rx='4'/><rect x='12' y='30' width='40' height='30' rx='4' fill='var(--acc)' opacity='.16'/><path d='M20 40h24M20 50h14' opacity='.7'/><rect x='60' y='30' width='40' height='30' rx='4'/><path d='M68 40h24M68 50h14' opacity='.7'/><rect x='108' y='30' width='40' height='30' rx='4'/><path d='M116 40h24M116 50h14' opacity='.7'/><path d='M32 62v16M80 62v16M128 62v16' opacity='.4' stroke-dasharray='3 4'/><rect x='20' y='84' width='120' height='30' rx='6'/><circle cx='44' cy='99' r='8'/><circle cx='80' cy='99' r='8'/><circle cx='116' cy='99' r='8'/><path d='M22 130h116' opacity='.35'/><path d='M36 122l4 8M74 122l-3 8M120 122l2 8' opacity='.6'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A name tag sewn into every shirt before it goes in the bag.</p><div class=\"an-lab\">The analogy</div><p>Forty shirts go in. Forty come back, in whatever order the machine felt like. Without a name tag you are holding up each one asking whose this is, and you will get it wrong.</p><div class=\"an-snap\"><b>So on the exam →</b> Results can arrive in any order. <code>custom_id</code> is the join key back to the originating request — never rely on ordering.</div></div></div></div>", "nemesis": false, "world": "The launderette", "analogy": "Forty shirts go in. Forty come back, in whatever order the machine felt like. Without a name tag you are holding up each one asking whose this is, and you will get it wrong."}, {"id": "7.4", "title": "Handling Failures in Batches", "picture": "Ninety-five clean shirts, five with a stain, and only five going back in.", "snapback": "Identify failures by <code>custom_id</code>, fix the cause — chunk the long documents, say — then re-submit only the failures. Re-sending all 100 pays twice for the 95.", "html": "<div class=\"an\" style=\"--acc:var(--w-laundry)\" data-an=\"7.4\"><div class=\"an-top\"><span class=\"an-w\">The launderette</span><span class=\"an-t\">§7.4</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='14' y='24' width='60' height='110' rx='6'/><path d='M24 40h40M24 54h40M24 68h40M24 82h40M24 96h40M24 110h40' opacity='.45'/><path d='M28 122l5 5 9-10' opacity='.9'/><rect x='90' y='24' width='56' height='48' rx='6' fill='var(--acc)' opacity='.18'/><path d='M90 24h56v48H90z'/><circle cx='104' cy='38' r='4' fill='var(--acc)'/><circle cx='118' cy='50' r='4' fill='var(--acc)'/><circle cx='132' cy='40' r='4' fill='var(--acc)'/><circle cx='110' cy='60' r='4' fill='var(--acc)'/><circle cx='128' cy='60' r='4' fill='var(--acc)'/><path d='M118 82v20'/><path d='M108 94l10 10 10-10'/><rect x='96' y='108' width='44' height='26' rx='5' stroke-dasharray='5 4'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Ninety-five clean shirts, five with a stain, and only five going back in.</p><div class=\"an-lab\">The analogy</div><p>You do not rewash the whole load because five came back marked. You pull the five, work out what the stain actually was, treat it, and send back exactly those five.</p><div class=\"an-snap\"><b>So on the exam →</b> Identify failures by <code>custom_id</code>, fix the cause — chunk the long documents, say — then re-submit only the failures. Re-sending all 100 pays twice for the 95.</div></div></div></div>", "nemesis": false, "world": "The launderette", "analogy": "You do not rewash the whole load because five came back marked. You pull the five, work out what the stain actually was, treat it, and send back exactly those five."}, {"id": "7.5", "title": "SLA Planning", "picture": "A calendar with the drop-off marked a full day before the deadline.", "snapback": "Submission deadline = downstream deadline − 24h. Plan against the worst case, never the typical observed time.", "html": "<div class=\"an hi\" style=\"--acc:var(--w-laundry)\" data-an=\"7.5\"><div class=\"an-top\"><span class=\"an-w\">The launderette</span><span class=\"an-t\">§7.5</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='16' y='30' width='128' height='104' rx='7'/><path d='M16 56h128' opacity='.5'/><path d='M44 30V18M116 30V18'/><path d='M32 70h20v18H32zM60 70h20v18H60zM88 70h20v18H88zM116 70h20v18h-20z' opacity='.3'/><rect x='32' y='70' width='20' height='18' rx='3' fill='var(--acc)' opacity='.4'/><path d='M32 70h20v18H32z'/><path d='M116 98h20v18h-20z'/><rect x='116' y='98' width='20' height='18' rx='3' fill='var(--acc)' opacity='.18'/><path d='M52 79h60' stroke-dasharray='5 4'/><path d='M106 73l8 6-8 6'/><text x='84' y='128' font-size='13' fill='currentColor' stroke='none' text-anchor='middle' font-family='monospace'>-24h</text></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A calendar with the drop-off marked a full day before the deadline.</p><div class=\"an-lab\">The analogy</div><p>'It usually comes back in an hour' is a story about the average day. The counter promises twenty-four. You plan against the promise, because the one time it takes twenty-three hours is the morning you needed it.</p><div class=\"an-snap\"><b>So on the exam →</b> Submission deadline = downstream deadline − 24h. Plan against the worst case, never the typical observed time.</div></div></div><div class=\"an-nem\"><span class=\"lab\">⚠ Your record · Missed on Exam 12 Q57</span>You chose a synchronous fallback. Batch has no latency SLA, so the plan is arithmetic, not a safety net: submission deadline = downstream deadline minus 24 hours.</div></div>", "nemesis": true, "world": "The launderette", "analogy": "'It usually comes back in an hour' is a story about the average day. The counter promises twenty-four. You plan against the promise, because the one time it takes twenty-three hours is the morning you needed it."}, {"id": "8.1", "title": "Fixed Pipelines (Prompt Chaining)", "picture": "A printed itinerary with every stop already listed.", "snapback": "Use a fixed sequential pipeline when the structure is predictable and every step is known in advance — reviews that always follow one template.", "html": "<div class=\"an\" style=\"--acc:var(--w-road)\" data-an=\"8.1\"><div class=\"an-top\"><span class=\"an-w\">The road trip</span><span class=\"an-t\">§8.1</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='30' y='16' width='100' height='128' rx='6' fill='var(--acc)' opacity='.1'/><path d='M30 16h100v128H30z'/><circle cx='52' cy='40' r='6'/><circle cx='52' cy='68' r='6'/><circle cx='52' cy='96' r='6'/><circle cx='52' cy='124' r='6'/><path d='M52 46v16M52 74v16M52 102v16'/><path d='M68 40h44M68 68h44M68 96h32M68 124h44' opacity='.7'/><path d='M30 16h100' stroke-width='3'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A printed itinerary with every stop already listed.</p><div class=\"an-lab\">The analogy</div><p>Same route every time. Same five stops, same order, and you can hand the sheet to anyone and get the same trip back. Perfect when the road genuinely does not change.</p><div class=\"an-snap\"><b>So on the exam →</b> Use a fixed sequential pipeline when the structure is predictable and every step is known in advance — reviews that always follow one template.</div></div></div></div>", "nemesis": false, "world": "The road trip", "analogy": "Same route every time. Same five stops, same order, and you can hand the sheet to anyone and get the same trip back. Perfect when the road genuinely does not change."}, {"id": "8.2", "title": "Dynamic Adaptive Decomposition", "picture": "A satnav rerouting the moment a road closes.", "snapback": "Generate subtasks from what earlier steps discover. Correct when the scope is unknown up front — mapping a legacy codebase before deciding what to test.", "html": "<div class=\"an\" style=\"--acc:var(--w-road)\" data-an=\"8.2\"><div class=\"an-top\"><span class=\"an-w\">The road trip</span><span class=\"an-t\">§8.2</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M20 138c14-30 6-46 24-58s34 4 46-14 14-30 26-40' stroke-dasharray='0'/><path d='M56 66l-10-4M56 66l-2-10' opacity='.7'/><circle cx='20' cy='138' r='6' fill='var(--acc)' opacity='.5'/><circle cx='20' cy='138' r='6'/><circle cx='116' cy='26' r='7'/><path d='M112 26h8M116 22v8' opacity='.7'/><path d='M74 96h44' stroke-dasharray='5 4' opacity='.4'/><path d='M84 84h26l-6 12h-26z' fill='var(--acc)' opacity='.35'/><path d='M84 84h26l-6 12H78z'/><path d='M96 108v-12' opacity='.6'/><path d='M126 76l14-6M132 96l14 2' opacity='.4'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A satnav rerouting the moment a road closes.</p><div class=\"an-lab\">The analogy</div><p>You know roughly where you are going. You do not know that the bridge is shut until you get to the bridge. The plan for the rest of the journey is written after you find out.</p><div class=\"an-snap\"><b>So on the exam →</b> Generate subtasks from what earlier steps discover. Correct when the scope is unknown up front — mapping a legacy codebase before deciding what to test.</div></div></div></div>", "nemesis": false, "world": "The road trip", "analogy": "You know roughly where you are going. You do not know that the bridge is shut until you get to the bridge. The plan for the rest of the journey is written after you find out."}, {"id": "8.3", "title": "Multi-pass Code Review", "picture": "One pass per street, then one pass over the whole map for the one-way conflicts.", "snapback": "Per-file passes for local issues, then a separate integration pass for cross-file problems. A bigger context window does not fix attention dilution.", "html": "<div class=\"an\" style=\"--acc:var(--w-road)\" data-an=\"8.3\"><div class=\"an-top\"><span class=\"an-w\">The road trip</span><span class=\"an-t\">§8.3</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M16 24h40v40H16zM60 24h40v40H60zM104 24h40v40h-40z'/><path d='M24 38h24M24 48h16M68 38h24M68 48h16M112 38h24M112 48h16' opacity='.55'/><path d='M22 58l4 4 7-8M66 58l4 4 7-8M110 58l4 4 7-8' opacity='.85'/><rect x='16' y='84' width='128' height='54' rx='6' fill='var(--acc)' opacity='.12'/><path d='M16 84h128v54H16z'/><path d='M36 100v22M76 100v22M116 100v22' opacity='.5'/><path d='M36 111h40M76 111h40'/><path d='M64 105l8 6-8 6M104 105l8 6-8 6'/><path d='M36 68v12M80 68v12M124 68v12' opacity='.4' stroke-dasharray='3 4'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">One pass per street, then one pass over the whole map for the one-way conflicts.</p><div class=\"an-lab\">The analogy</div><p>Survey fourteen streets in a single sweep and you will do three of them properly and glance at the rest. Do them one at a time, then take one more run over the whole map looking only for where they contradict each other.</p><div class=\"an-snap\"><b>So on the exam →</b> Per-file passes for local issues, then a separate integration pass for cross-file problems. A bigger context window does not fix attention dilution.</div></div></div></div>", "nemesis": false, "world": "The road trip", "analogy": "Survey fourteen streets in a single sweep and you will do three of them properly and glance at the rest. Do them one at a time, then take one more run over the whole map looking only for where they contradict each other."}, {"id": "9.1", "title": "When to Escalate to a Human", "picture": "A triage board with four hard criteria on it, and no box for 'seems upset'.", "snapback": "Escalate on structural signals — policy gap, explicit request for a human, no progress after real attempts, high-stakes ambiguity.", "html": "<div class=\"an hi\" style=\"--acc:var(--w-triage)\" data-an=\"9.1\"><div class=\"an-top\"><span class=\"an-w\">The triage desk</span><span class=\"an-t\">§9.1</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='20' y='20' width='120' height='96' rx='6'/><path d='M20 42h120' opacity='.5'/><path d='M34 60l5 5 9-10M34 78l5 5 9-10M34 96l5 5 9-10'/><path d='M58 62h64M58 80h64M58 98h44' opacity='.7'/><rect x='34' y='28' width='16' height='8' rx='2' fill='var(--acc)' opacity='.5'/><path d='M60 32h50' opacity='.6'/><path d='M52 132c0-10 10-14 10-14M74 132h44' opacity='.35' stroke-dasharray='4 4'/><circle cx='62' cy='132' r='3' fill='currentColor' stroke='none' opacity='.4'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A triage board with four hard criteria on it, and no box for 'seems upset'.</p><div class=\"an-lab\">The analogy</div><p>The nurse escalates on things you can point at: the protocol does not cover this, they asked for the doctor by name, three attempts have failed, the decision is above the desk. Volume is not on the board.</p><div class=\"an-snap\"><b>So on the exam →</b> Escalate on structural signals — policy gap, explicit request for a human, no progress after real attempts, high-stakes ambiguity.</div></div></div><div class=\"an-nem\"><span class=\"lab\">⚠ Your record · Both directions have cost you a paper</span>Exam 11 escalated an ambiguity that one question would have resolved. Escalate on structural signals &mdash; policy gap, an explicit request for a human, repeated failure. Not on how upset someone sounds, and not on a model's own confidence score.</div></div>", "nemesis": true, "world": "The triage desk", "analogy": "The nurse escalates on things you can point at: the protocol does not cover this, they asked for the doctor by name, three attempts have failed, the decision is above the desk. Volume is not on the board."}, {"id": "9.2", "title": "Escalation Patterns", "picture": "Someone shouting who can be helped, next to someone quietly asking for the doctor.", "snapback": "An explicit request for a human escalates at once. Frustration alone does not — acknowledge, offer a resolution, and escalate if they reiterate.", "html": "<div class=\"an\" style=\"--acc:var(--w-triage)\" data-an=\"9.2\"><div class=\"an-top\"><span class=\"an-w\">The triage desk</span><span class=\"an-t\">§9.2</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx='40' cy='40' r='14'/><path d='M40 54v30M40 84l-9 26M40 84l9 26M26 66h28'/><path d='M58 24c8-4 16-4 22 0M62 34c6-3 12-3 16 0' opacity='.8'/><circle cx='120' cy='40' r='14'/><path d='M120 54v30M120 84l-9 26M120 84l9 26M106 66h28'/><rect x='84' y='16' width='34' height='22' rx='5' fill='var(--acc)' opacity='.25'/><path d='M84 16h34v22H84z'/><path d='M92 26h18' opacity='.8'/><path d='M96 38l-6 8 12-8' fill='none'/><path d='M10 128h140' opacity='.35'/><path d='M28 118h24' opacity='.5' stroke-dasharray='3 4'/><path d='M108 118h24'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Someone shouting who can be helped, next to someone quietly asking for the doctor.</p><div class=\"an-lab\">The analogy</div><p>The loud one usually has a problem you can fix in ninety seconds. Acknowledge it, offer the fix, and only move them along if they ask a second time. The quiet request for the doctor goes through immediately, first time of asking.</p><div class=\"an-snap\"><b>So on the exam →</b> An explicit request for a human escalates at once. Frustration alone does not — acknowledge, offer a resolution, and escalate if they reiterate.</div></div></div></div>", "nemesis": false, "world": "The triage desk", "analogy": "The loud one usually has a problem you can fix in ninety seconds. Acknowledge it, offer the fix, and only move them along if they ask a second time. The quiet request for the doctor goes through immediately, first time of asking."}, {"id": "9.3", "title": "Structured Handoff Protocols", "picture": "The handover sheet the next shift reads, because they never saw the patient arrive.", "snapback": "The human has no transcript access. The summary must carry customer ID, root cause, the amount, actions already taken and a recommended action.", "html": "<div class=\"an\" style=\"--acc:var(--w-triage)\" data-an=\"9.3\"><div class=\"an-top\"><span class=\"an-w\">The triage desk</span><span class=\"an-t\">§9.3</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='40' y='14' width='80' height='104' rx='6' fill='var(--acc)' opacity='.12'/><path d='M40 14h80v104H40z'/><rect x='62' y='6' width='36' height='16' rx='4'/><path d='M52 42h24M84 42h24M52 58h56M52 74h40M52 90h56' opacity='.7'/><path d='M52 42h24' stroke-width='3'/><circle cx='30' cy='128' r='11'/><path d='M30 139h-8M30 139h8' opacity='.6'/><circle cx='130' cy='128' r='11'/><path d='M130 139h-8M130 139h8' opacity='.6'/><path d='M44 128h72' stroke-dasharray='5 4'/><path d='M106 122l8 6-8 6'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">The handover sheet the next shift reads, because they never saw the patient arrive.</p><div class=\"an-lab\">The analogy</div><p>The incoming nurse was not there for any of it. Everything they will ever know is on that one sheet: who, what is wrong, what has already been tried, what you recommend. A shrug and 'they're upset about something' is not a handover.</p><div class=\"an-snap\"><b>So on the exam →</b> The human has no transcript access. The summary must carry customer ID, root cause, the amount, actions already taken and a recommended action.</div></div></div></div>", "nemesis": false, "world": "The triage desk", "analogy": "The incoming nurse was not there for any of it. Everything they will ever know is on that one sheet: who, what is wrong, what has already been tried, what you recommend. A shrug and 'they're upset about something' is not a handover."}, {"id": "9.4", "title": "Confidence Calibration and Human Oversight", "picture": "An overall pass rate of 97%, and one ward inside it running at 60%.", "snapback": "Score confidence per field, tune thresholds against labelled data, and sample the automated stream in a stratified way. Aggregate accuracy hides per-segment failure.", "html": "<div class=\"an\" style=\"--acc:var(--w-triage)\" data-an=\"9.4\"><div class=\"an-top\"><span class=\"an-w\">The triage desk</span><span class=\"an-t\">§9.4</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" str
