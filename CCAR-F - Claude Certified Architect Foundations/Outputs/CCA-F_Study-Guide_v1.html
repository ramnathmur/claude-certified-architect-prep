nt suppression (empty result = success)</td>\n<td>Coordinator thinks there were no matches, but it was a failure</td>\n<td>Distinguish “no results” from “search failure”</td>\n</tr>\n<tr>\n<td>Aborting the whole workflow on one failure</td>\n<td>You lose all partial results</td>\n<td>Continue with partial results; annotate gaps</td>\n</tr>\n<tr>\n<td>Infinite retries inside a subagent</td>\n<td>Latency and wasted resources</td>\n<td>Local recovery (1–2 retries), then propagate to coordinator</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"s-10-3-a-structured-subagent-error\">10.3 A Structured Subagent Error</h2><div class=\"an\" style=\"--acc:var(--w-radio)\" data-an=\"10.3\"><div class=\"an-top\"><span class=\"an-w\">The ship&#x27;s radio</span><span class=\"an-t\">§10.3</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='18' y='38' width='40' height='84' rx='6'/><rect x='26' y='50' width='24' height='18' rx='3' fill='var(--acc)' opacity='.25'/><path d='M26 50h24v18H26z'/><circle cx='32' cy='82' r='4'/><circle cx='44' cy='82' r='4'/><circle cx='32' cy='96' r='4'/><circle cx='44' cy='96' r='4'/><path d='M38 38V16'/><path d='M62 30a30 30 0 0 1 0 40M74 20a44 44 0 0 1 0 60' opacity='.7'/><rect x='88' y='40' width='58' height='80' rx='5' fill='var(--acc)' opacity='.1'/><path d='M88 40h58v80H88z'/><path d='M98 56h38M98 70h38M98 84h24M98 98h38' opacity='.75'/><path d='M98 56h14' stroke-width='3'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A full radio call: what broke, what was tried, what still works, what to do next.</p><div class=\"an-lab\">The analogy</div><p>'Problem down here' gets you nothing. 'Engine room flooding, valve three shut, pumps holding at forty per cent, recommend rerouting to the aft pumps' gets you a decision from the bridge in about four seconds.</p><div class=\"an-snap\"><b>So on the exam →</b> Return failure type, what was attempted, any partial results, and the alternatives worth trying. That is what lets the coordinator choose retry, reroute, continue or escalate.</div></div></div></div>\n<pre><code class=\"language-json\">{\n  &quot;status&quot;: &quot;partial_failure&quot;,\n  &quot;failure_type&quot;: &quot;timeout&quot;,\n  &quot;attempted_query&quot;: &quot;AI impact on music industry 2024&quot;,\n  &quot;partial_results&quot;: [\n    {&quot;title&quot;: &quot;AI Music Generation Report&quot;, &quot;url&quot;: &quot;...&quot;, &quot;relevance&quot;: 0.8}\n  ],\n  &quot;alternative_approaches&quot;: [\n    &quot;Try a narrower query: 'AI music composition tools'&quot;,\n    &quot;Use an alternative data source&quot;\n  ],\n  &quot;coverage_impact&quot;: &quot;Not covered: AI impact on music production&quot;\n}\n</code></pre>\n<p>This provides the coordinator with the information needed to decide:\n- Retry with a modified query?\n- Use partial results?\n- Delegate to a different subagent?\n- Continue without this section and annotate the gap?</p>\n<h2 id=\"s-10-4-coverage-annotations-in-the-final-synthesis\">10.4 Coverage Annotations in the Final Synthesis</h2><div class=\"an\" style=\"--acc:var(--w-radio)\" data-an=\"10.4\"><div class=\"an-top\"><span class=\"an-w\">The ship&#x27;s radio</span><span class=\"an-t\">§10.4</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='16' y='20' width='128' height='120' rx='6'/><path d='M28 44c18-6 30 4 44 0s24-10 44-4' opacity='.7'/><path d='M28 76c18-6 30 4 44 0s24-10 44-4' opacity='.7'/><path d='M36 34h30v26H36z' fill='var(--acc)' opacity='.2'/><path d='M36 34h30v26H36z'/><path d='M40 42l5 5 8-9' opacity='.9'/><path d='M78 34h34v26H78z'/><path d='M82 42l5 5 8-9' opacity='.9'/><path d='M46 92h62v34H46z' stroke-dasharray='6 5'/><path d='M56 106h42M56 116h26' opacity='.5' stroke-dasharray='4 4'/><path d='M66 100l24 22M90 100l-24 22' opacity='.25'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A chart with two areas surveyed properly and one marked 'sounding not taken'.</p><div class=\"an-lab\">The analogy</div><p>You do not throw the chart away because one bay was too rough to sound. You draw what you surveyed, and you write across the bay that nobody has been in there — so the next skipper knows exactly how much to trust it.</p><div class=\"an-snap\"><b>So on the exam →</b> Complete the synthesis on what arrived, mark which conclusions are well supported and where the gaps are, and pass the uncertainty upward.</div></div></div></div>\n<pre><code class=\"language-markdown\">## Report: AI Impact on Creative Industries\n\n### Visual Art (FULL COVERAGE)\n[research results]\n\n### Music (PARTIAL COVERAGE — search agent timeout)\n[partial results]\n⚠️ Note: coverage for this section is limited due to a timeout in the search agent.\n\n### Literature (FULL COVERAGE)\n[research results]\n</code></pre>\n<hr />", "concepts": ["10.1", "10.2", "10.3", "10.4"], "keywords": "Chapter 10: Error Handling in Multi-agent Systems 10.1 Error Categories 10.2 Error-handling Anti-patterns 10.3 A Structured Subagent Error 10.4 Coverage Annotations in the Final Synthesis"}, {"id": "ch11", "group": "Part I · Theory", "title": "Context management in production", "short": "Ch11", "num": "11", "html": "<h1 id=\"s-chapter-11-context-management-in-production-systems\">Chapter 11: Context Management in Production Systems</h1>\n<h2 id=\"s-11-1-extract-facts-into-a-separate-block\">11.1 Extract Facts into a Separate Block</h2><div class=\"an\" style=\"--acc:var(--w-pack)\" data-an=\"11.1\"><div class=\"an-top\"><span class=\"an-w\">The rucksack</span><span class=\"an-t\">§11.1</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M46 54c0-14 8-22 34-22s34 8 34 22v72c0 8-8 14-34 14s-34-6-34-14z' fill='var(--acc)' opacity='.1'/><path d='M46 54c0-14 8-22 34-22s34 8 34 22v72c0 8-8 14-34 14s-34-6-34-14z'/><path d='M62 32c4-10 32-10 36 0'/><path d='M56 78c10 8 38 8 48 0' opacity='.4' stroke-dasharray='4 4'/><rect x='108' y='60' width='40' height='34' rx='5' fill='var(--acc)' opacity='.3'/><path d='M108 60h40v34h-40z'/><path d='M116 72h24M116 82h14' opacity='.85'/><path d='M114 60V48a14 14 0 0 1 28 0v12'/><path d='M60 100h40M60 114h24' opacity='.35'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A passport pouch on a strap, never buried in the pack.</p><div class=\"an-lab\">The analogy</div><p>Everything else can be rolled, squashed and repacked at the hostel. The passport, the booking reference and the allergy card live in the pouch on the outside, where nothing that happens to the rucksack can touch them.</p><div class=\"an-snap\"><b>So on the exam →</b> Pull transactional facts — amounts, dates, IDs, agreed terms — into a case-facts block included in every prompt, outside the summarised history.</div></div></div></div>\n<p>Instead of relying on conversation history (which degrades during summarization), extract key facts into a structured block:</p>\n<pre><code>=== CASE FACTS (updated whenever a new fact appears) ===\nCustomer ID: CUST-12345\nOrder ID: ORD-67890\nOrder Date: 2025-01-15\nOrder Amount: $89.99\nIssue: Damaged item on delivery\nCustomer Request: Full refund\nStatus: Pending manager approval\n===\n</code></pre>\n<p>Include this block in every prompt, regardless of how history is summarized.</p>\n<h2 id=\"s-11-2-trimming-tool-results\">11.2 Trimming Tool Results</h2><div class=\"an\" style=\"--acc:var(--w-pack)\" data-an=\"11.2\"><div class=\"an-top\"><span class=\"an-w\">The rucksack</span><span class=\"an-t\">§11.2</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='16' y='24' width='58' height='46' rx='5'/><path d='M16 40h58' opacity='.4'/><path d='M26 52h38M26 62h24' opacity='.5'/><path d='M26 30h12M44 30h22' opacity='.5'/><path d='M80 46h24'/><path d='M96 38l10 8-10 8'/><rect x='112' y='30' width='34' height='34' rx='5' fill='var(--acc)' opacity='.25'/><path d='M112 30h34v34h-34z'/><path d='M120 42h18M120 52h10' opacity='.85'/><path d='M40 84c0-4 4-6 8-6h44c4 0 8 2 8 6l-6 46c0 5-6 8-24 8s-24-3-24-8z'/><path d='M36 84h72' stroke-width='3'/><path d='M56 76v-6h32v6' opacity='.7'/><path d='M56 96l6 30M80 96v30M100 96l-6 30' opacity='.4'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Food out of its boxes, boxes in the bin, before the pack is closed.</p><div class=\"an-lab\">The analogy</div><p>Forty fields came back and five of them matter. Carrying the other thirty-five is not free — you pay for the weight on every step of every day that follows, and it makes the useful five harder to find.</p><div class=\"an-snap\"><b>So on the exam →</b> Trim tool output to the relevant fields with a <code>PostToolUse</code> hook, before it enters context. Choose what to keep from what downstream actually uses.</div></div></div></div>\n<p>If <code>lookup_order</code> returns 40+ fields but you only need 5 for the current task:</p>\n<pre><code class=\"language-python\"># PostToolUse hook: keep only relevant fields\n@hook(&quot;PostToolUse&quot;, tool=&quot;lookup_order&quot;)\ndef trim_order_fields(result):\n    return {\n        &quot;order_id&quot;: result[&quot;order_id&quot;],\n        &quot;status&quot;: result[&quot;status&quot;],\n        &quot;total&quot;: result[&quot;total&quot;],\n        &quot;items&quot;: result[&quot;items&quot;],\n        &quot;return_eligible&quot;: result[&quot;return_eligible&quot;]\n    }\n</code></pre>\n<p>This conserves context and reduces noise.</p>\n<h2 id=\"s-11-3-position-aware-input\">11.3 Position-aware Input</h2><div class=\"an\" style=\"--acc:var(--w-pack)\" data-an=\"11.3\"><div class=\"an-top\"><span class=\"an-w\">The rucksack</span><span class=\"an-t\">§11.3</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M44 34c0-10 8-16 36-16s36 6 36 16v100c0 8-10 12-36 12s-36-4-36-12z'/><rect x='50' y='36' width='60' height='24' rx='4' fill='var(--acc)' opacity='.35'/><path d='M50 36h60v24H50z'/><path d='M58 48h44' opacity='.85'/><rect x='50' y='68' width='60' height='40' rx='4' opacity='.35' stroke-dasharray='5 5'/><path d='M60 84h40M60 96h40' opacity='.2'/><rect x='50' y='116' width='60' height='22' rx='4' fill='var(--acc)' opacity='.35'/><path d='M50 116h60v22H50z'/><path d='M58 127h44' opacity='.85'/><path d='M126 44v14M126 128v-14' opacity='.7'/><path d='M120 50l6-8 6 8M120 122l6 8 6-8' opacity='.7'/><path d='M126 76v28' opacity='.25' stroke-dasharray='4 5'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">You remember what is at the top of the pack and what is at the bottom.</p><div class=\"an-lab\">The analogy</div><p>Whatever went in the middle at four in the morning is gone until you unpack the whole thing on a hostel floor. So the head torch goes in the lid, and the map goes in the front pocket.</p><div class=\"an-snap\"><b>So on the exam →</b> Attention is reliable at the beginning and end of long input and degrades in the middle. Put a key-findings summary at the start and add explicit section headings throughout.</div></div></div></div>\n<p>Place critical information with the lost-in-the-middle effect in mind:</p>\n<pre><code>[KEY FINDINGS — at the top]\nFound 3 critical vulnerabilities...\n\n[DETAILED RESULTS — middle]\n=== File auth.ts ===\n...\n=== File database.ts ===\n...\n\n[ACTION ITEMS — at the end]\nPriority: fix auth.ts vulnerabilities before merge.\n</code></pre>\n<h2 id=\"s-11-4-scratchpad-files\">11.4 Scratchpad Files</h2><div class=\"an\" style=\"--acc:var(--w-pack)\" data-an=\"11.4\"><div class=\"an-top\"><span class=\"an-w\">The rucksack</span><span class=\"an-t\">§11.4</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M28 20h84v116H28z' fill='var(--acc)' opacity='.1'/><path d='M28 20h84v116H28z'/><path d='M44 20v116' opacity='.4'/><path d='M56 40h44M56 54h44M56 68h30M56 86h44M56 100h24' opacity='.65'/><circle cx='36' cy='40' r='2.4'/><circle cx='36' cy='54' r='2.4'/><circle cx='36' cy='68' r='2.4'/><path d='M124 34l14 8-42 74-16 8 2-18z'/><path d='M118 44l14 8' opacity='.6'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A trail journal you write in each night and read each morning.</p><div class=\"an-lab\">The analogy</div><p>Six weeks in, you cannot hold every river crossing in your head, and the version in your head has quietly turned into 'rivers are usually fine'. The journal still says which one had the rope.</p><div class=\"an-snap\"><b>So on the exam →</b> Write intermediate findings to a scratchpad file and read it back at each continuation. It survives context limits and stops the drift into vague generalities.</div></div></div></div>\n<p>In long investigations, the agent can write key findings to a scratchpad file:</p>\n<pre><code># investigation-scratchpad.md\n## Key findings\n- PaymentProcessor in src/payments/processor.ts inherits from BaseProcessor\n- refund() is called from 3 places: OrderController, AdminPanel, CronJob\n- External PaymentGateway API has a rate limit of 100 req/min\n- Migration #47 added refund_reason (NOT NULL) — 2024-12-01\n</code></pre>\n<p>When context degrades (or in a new session), the agent can consult the scratchpad instead of re-running discovery.</p>\n<h2 id=\"s-11-5-delegating-to-subagents-to-protect-context\">11.5 Delegating to Subagents to Protect Context</h2><div class=\"an\" style=\"--acc:var(--w-pack)\" data-an=\"11.5\"><div class=\"an-top\"><span class=\"an-w\">The rucksack</span><span class=\"an-t\">§11.5</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx='34' cy='60' r='12'/><path d='M34 72v26M34 98l-8 22M34 98l8 22M22 82h24'/><path d='M56 66h40' stroke-dasharray='5 4'/><path d='M86 60l10 6-10 6'/><circle cx='120' cy='42' r='12'/><path d='M120 54v22M120 76l-8 20M120 76l8 20M108 62h24'/><path d='M104 116h44v22h-44z' fill='var(--acc)' opacity='.25'/><path d='M104 116h44v22h-44z'/><path d='M112 126h28' opacity='.85'/><path d='M120 100v14' stroke-dasharray='4 4' opacity='.6'/><path d='M14 30c10-6 20-6 28 0' opacity='.35'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Sending someone ahead to scout, who comes back with one paragraph.</p><div class=\"an-lab\">The analogy</div><p>You do not all walk the eight kilometres to find out whether the bridge is standing. One person goes, sees everything, and comes back with a sentence. The rest of you are still fresh when it matters.</p><div class=\"an-snap\"><b>So on the exam →</b> Run verbose discovery in a subagent so the output never enters the main window. It returns a concise summary and the main session keeps its capacity for the work.</div></div></div></div>\n<pre><code>Main agent: &quot;Investigate dependencies of the payments module&quot;\n  -&gt; Subagent (Explore): reads 15 files, traces imports\n  -&gt; Returns: &quot;Payments depends on AuthService, OrderModel, and the external PaymentGateway API&quot;\n\nMain agent: keeps one line in context instead of 15 files\n</code></pre>\n<p><strong>Separate context layer:</strong>\nIn multi-agent systems, each subagent operates within a limited context budget—it receives only the information required for its task. The coordinator acts as a separate context layer: it aggregates subagent outputs, stores global state, and allocates context. This prevents “context leakage,” where one agent consumes the window with information irrelevant to others.</p>\n<p><strong>Constrained context budgets for subagents:</strong>\n- Send minimal context: a specific task + necessary data\n- Instruct the subagent to return structured results, not raw data dumps\n- Use <code>allowedTools</code> to limit the subagent’s toolset—fewer tools means fewer distractions and lower context cost</p>\n<h2 id=\"s-11-6-structured-state-persistence-for-crash-recovery\">11.6 Structured State Persistence (for crash recovery)</h2><div class=\"an\" style=\"--acc:var(--w-pack)\" data-an=\"11.6\"><div class=\"an-top\"><span class=\"an-w\">The rucksack</span><span class=\"an-t\">§11.6</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M20 130l16-26 12 14 20-42 16 30 14-22 18 46z' fill='var(--acc)' opacity='.12'/><path d='M20 130l16-26 12 14 20-42 16 30 14-22 18 46z'/><circle cx='36' cy='100' r='5' fill='var(--acc)' opacity='.6'/><circle cx='36' cy='100' r='5'/><circle cx='68' cy='76' r='5' fill='var(--acc)' opacity='.6'/><circle cx='68' cy='76' r='5'/><circle cx='114' cy='82' r='5'/><path d='M41 100h22M73 78h36' stroke-dasharray='4 4' opacity='.5'/><rect x='44' y='16' width='72' height='40' rx='5'/><path d='M54 30l5 5 8-9M54 44l5 5 8-9' opacity='.85'/><path d='M76 32h30M76 46h18' opacity='.65'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Cairns left along the route, and a note at base camp saying who has reached where.</p><div class=\"an-lab\">The analogy</div><p>Someone twists an ankle four hours from the end. Nobody restarts from the trailhead — you read the note at base, see three parties are through the pass and one is not, and you carry on from there.</p><div class=\"an-snap\"><b>So on the exam →</b> Each agent exports structured state — status, findings, coverage, gaps — to a known location, and the coordinator loads a manifest on resume and continues from the checkpoint.</div></div></div></div>\n<p>Each agent exports its state to a known location:</p>\n<pre><code class=\"language-json\">// agent-state/web-search-agent.json\n{\n  &quot;status&quot;: &quot;completed&quot;,\n  &quot;queries_executed&quot;: [&quot;AI music 2024&quot;, &quot;AI music composition&quot;],\n  &quot;results_count&quot;: 12,\n  &quot;key_findings&quot;: [...],\n  &quot;coverage&quot;: [&quot;music composition&quot;, &quot;music production&quot;],\n  &quot;gaps&quot;: [&quot;music distribution&quot;, &quot;music licensing&quot;]\n}\n</code></pre>\n<p>The coordinator loads a manifest on resume:</p>\n<pre><code class=\"language-json\">// agent-state/manifest.json\n{\n  &quot;web-search&quot;: &quot;completed&quot;,\n  &quot;doc-analysis&quot;: &quot;in_progress&quot;,\n  &quot;synthesis&quot;: &quot;not_started&quot;\n}\n</code></pre>\n<hr />", "concepts": ["11.1", "11.2", "11.3", "11.4", "11.5", "11.6"], "keywords": "Chapter 11: Context Management in Production Systems 11.1 Extract Facts into a Separate Block 11.2 Trimming Tool Results 11.3 Position-aware Input 11.4 Scratchpad Files 11.5 Delegating to Subagents to Protect Context 11.6 Structured State Persistence (for crash recovery)"}, {"id": "ch12", "group": "Part I · Theory", "title": "Preserving provenance", "short": "Ch12", "num": "12", "html": "<h1 id=\"s-chapter-12-preserving-provenance\">Chapter 12: Preserving Provenance</h1>\n<h2 id=\"s-12-1-the-attribution-loss-problem\">12.1 The Attribution Loss Problem</h2><div class=\"an\" style=\"--acc:var(--w-court)\" data-an=\"12.1\"><div class=\"an-top\"><span class=\"an-w\">Chain of custody</span><span class=\"an-t\">§12.1</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M40 34h80v104H40z' fill='var(--acc)' opacity='.1'/><path d='M40 34h80v104H40z'/><path d='M40 34l14-18h52l14 18'/><rect x='56' y='58' width='48' height='30' rx='4'/><path d='M64 70h32M64 80h20' opacity='.6'/><path d='M56 104h48M56 118h30' opacity='.4' stroke-dasharray='4 4'/><path d='M112 24l22-8 6 20-22 8z' opacity='.5' stroke-dasharray='5 4'/><path d='M118 30l16-6' opacity='.4'/><path d='M104 44l24-12' opacity='.35'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">An exhibit bag with the label torn off.</p><div class=\"an-lab\">The analogy</div><p>The evidence is genuine. Nobody can say where it came from, who handled it, or when. In a courtroom that makes it worthless, and a list of everywhere you went that day does not fix it.</p><div class=\"an-snap\"><b>So on the exam →</b> Require structured claim-to-source mappings from every subagent and require synthesis to preserve them. A bibliography records what was read, not which source produced this claim.</div></div></div></div>\n<p>When summarizing results from multiple sources, the “claim → source” link can be lost:</p>\n<pre><code>Bad: &quot;The AI music market is estimated at $3.2B.&quot; (No source, no year.)\n\nGood:\n{\n  &quot;claim&quot;: &quot;The AI music market is estimated at $3.2B.&quot;,\n  &quot;source_url&quot;: &quot;https://example.com/report&quot;,\n  &quot;source_name&quot;: &quot;Global AI Music Report 2024&quot;,\n  &quot;publication_date&quot;: &quot;2024-06-15&quot;,\n  &quot;confidence&quot;: 0.9\n}\n</code></pre>\n<h2 id=\"s-12-2-handling-conflicting-data\">12.2 Handling Conflicting Data</h2><div class=\"an\" style=\"--acc:var(--w-court)\" data-an=\"12.2\"><div class=\"an-top\"><span class=\"an-w\">Chain of custody</span><span class=\"an-t\">§12.2</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M80 20v18M56 38h48'/><path d='M80 38v76'/><path d='M56 114h48'/><path d='M34 46l-16 34h32zM126 46l-16 34h32z'/><path d='M34 38v8M126 38v8'/><path d='M18 80a16 16 0 0 0 32 0M110 80a16 16 0 0 0 32 0' fill='var(--acc)' opacity='.14'/><path d='M18 80a16 16 0 0 0 32 0M110 80a16 16 0 0 0 32 0'/><path d='M34 46h92' opacity='0'/><path d='M64 46h32' opacity='.5'/><text x='34' y='34' font-size='13' fill='currentColor' stroke='none' text-anchor='middle' font-family='monospace'>40</text><text x='126' y='34' font-size='13' fill='currentColor' stroke='none' text-anchor='middle' font-family='monospace'>12</text><path d='M62 126h36' stroke-width='3'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Two witness statements entered into the record side by side, both signed.</p><div class=\"an-lab\">The analogy</div><p>Two credible witnesses give different numbers. The clerk does not average them, and does not quietly pick the one from the more impressive address. Both go in the record, attributed, and somebody senior decides.</p><div class=\"an-snap\"><b>So on the exam →</b> Complete the analysis carrying both values with attribution, and annotate the conflict explicitly. Do not resolve it by heuristic and do not block waiting for a ruling.</div></div></div></div>\n<p>When two sources provide different values:</p>\n<pre><code class=\"language-json\">{\n  &quot;claim&quot;: &quot;Share of AI-generated music on streaming platforms&quot;,\n  &quot;values&quot;: [\n    {\n      &quot;value&quot;: &quot;12%&quot;,\n      &quot;source&quot;: &quot;Spotify Annual Report 2024&quot;,\n      &quot;date&quot;: &quot;2024-03&quot;,\n      &quot;methodology&quot;: &quot;Automated classification&quot;\n    },\n    {\n      &quot;value&quot;: &quot;8%&quot;,\n      &quot;source&quot;: &quot;Music Industry Association Survey&quot;,\n      &quot;date&quot;: &quot;2024-07&quot;,\n      &quot;methodology&quot;: &quot;Survey of 500 labels&quot;\n    }\n  ],\n  &quot;conflict_detected&quot;: true,\n  &quot;possible_explanation&quot;: &quot;Difference in methodology and time period&quot;\n}\n</code></pre>\n<p>Do not arbitrarily choose one value. Preserve both with attribution and let the coordinator decide.</p>\n<h2 id=\"s-12-3-include-dates-for-correct-interpretation\">12.3 Include Dates for Correct Interpretation</h2><div class=\"an\" style=\"--acc:var(--w-court)\" data-an=\"12.3\"><div class=\"an-top\"><span class=\"an-w\">Chain of custody</span><span class=\"an-t\">§12.3</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='14' y='34' width='58' height='76' rx='5'/><rect x='88' y='34' width='58' height='76' rx='5'/><path d='M24 54h38M24 66h38M24 78h22' opacity='.55'/><path d='M98 54h38M98 66h38M98 78h22' opacity='.55'/><text x='43' y='102' font-size='13' fill='currentColor' stroke='none' text-anchor='middle' font-family='monospace'>10%</text><text x='117' y='102' font-size='13' fill='currentColor' stroke='none' text-anchor='middle' font-family='monospace'>15%</text><rect x='22' y='16' width='42' height='16' rx='4' fill='var(--acc)' opacity='.3'/><path d='M22 16h42v16H22z'/><rect x='96' y='16' width='42' height='16' rx='4' fill='var(--acc)' opacity='.3'/><path d='M96 16h42v16H96z'/><text x='43' y='28' font-size='11' fill='currentColor' stroke='none' text-anchor='middle' font-family='monospace'>2023</text><text x='117' y='28' font-size='11' fill='currentColor' stroke='none' text-anchor='middle' font-family='monospace'>2024</text><path d='M72 122h16' /><path d='M80 116l8 6-8 6'/><path d='M40 122h24' opacity='.4' stroke-dasharray='4 4'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Two statements that contradict each other until you read the dates on them.</p><div class=\"an-lab\">The analogy</div><p>One says ten per cent, the other fifteen. Enormous scandal, until somebody turns the pages over and finds they were taken a year apart. Then it stops being a contradiction and starts being growth.</p><div class=\"an-snap\"><b>So on the exam →</b> Require publication or collection dates in every structured output. Without them, ordinary change over time gets reported as sources disagreeing.</div></div></div></div>\n<p>Without dates, temporal differences can be misinterpreted as contradictions:</p>\n<pre><code>Bad: &quot;Source A says 10%, source B says 15%. Contradiction.&quot;\nGood: &quot;Source A (2023) says 10%, source B (2024) says 15%. Likely +5% growth over a year.&quot;\n</code></pre>\n<h2 id=\"s-12-4-render-by-content-type\">12.4 Render by Content Type</h2><div class=\"an\" style=\"--acc:var(--w-court)\" data-an=\"12.4\"><div class=\"an-top\"><span class=\"an-w\">Chain of custody</span><span class=\"an-t\">§12.4</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='14' y='24' width='60' height='50' rx='4' fill='var(--acc)' opacity='.14'/><path d='M14 24h60v50H14z'/><path d='M14 40h60M34 24v50M54 24v50' opacity='.65'/><rect x='86' y='24' width='60' height='50' rx='4'/><path d='M94 38h44M94 48h44M94 58h28' opacity='.65'/><rect x='14' y='88' width='60' height='50' rx='4'/><circle cx='24' cy='102' r='2.4' fill='currentColor'/><circle cx='24' cy='114' r='2.4' fill='currentColor'/><circle cx='24' cy='126' r='2.4' fill='currentColor'/><path d='M34 102h32M34 114h32M34 126h20' opacity='.65'/><rect x='86' y='88' width='60' height='50' rx='4'/><path d='M94 128l14-18 12 10 18-22' /><circle cx='94' cy='128' r='2.4' fill='currentColor'/><circle cx='138' cy='98' r='2.4' fill='currentColor'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">You do not read a spreadsheet aloud as a story.</p><div class=\"an-lab\">The analogy</div><p>Financials go in the exhibit table where the columns line up. The account of what happened goes in prose. Read the table out as a flowing narrative and everyone in the room loses the numbers.</p><div class=\"an-snap\"><b>So on the exam →</b> Financial and tabular data as tables, news and analysis as prose, technical findings as structured lists, time series in chronological order.</div></div></div></div>\n<p>Don’t force everything into one format:\n- Financial data -&gt; tables\n- News and analysis -&gt; prose\n- Technical findings -&gt; structured lists\n- Time series -&gt; chronological ordering</p>\n<hr />", "concepts": ["12.1", "12.2", "12.3", "12.4"], "keywords": "Chapter 12: Preserving Provenance 12.1 The Attribution Loss Problem 12.2 Handling Conflicting Data 12.3 Include Dates for Correct Interpretation 12.4 Render by Content Type"}, {"id": "ch13", "group": "Part I · Theory", "title": "Claude Code built-in tools", "short": "Ch13", "num": "13", "html": "<h1 id=\"s-chapter-13-claude-code-built-in-tools\">Chapter 13: Claude Code Built-in Tools</h1>\n<h2 id=\"s-13-1-tool-selection-reference\">13.1 Tool Selection Reference</h2><div class=\"an hi\" style=\"--acc:var(--w-library)\" data-an=\"13.1\"><div class=\"an-top\"><span class=\"an-w\">The library</span><span class=\"an-t\">§13.1</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='12' y='38' width='60' height='72' rx='5'/><path d='M12 62h60M12 86h60' opacity='.5'/><circle cx='42' cy='50' r='2.6' fill='currentColor'/><circle cx='42' cy='74' r='2.6' fill='currentColor'/><circle cx='42' cy='98' r='2.6' fill='currentColor'/><path d='M24 124h36' opacity='.5'/><path d='M88 34c14-6 26-6 26 4v72c0-10-12-10-26-4z' fill='var(--acc)' opacity='.14'/><path d='M88 34c14-6 26-6 26 4v72c0-10-12-10-26-4zM148 34c-14-6-26-6-26 4v72c0 10 12 10 26 4z'/><path d='M96 54h14M96 66h14M130 54h12M130 66h12' opacity='.55'/><circle cx='118' cy='96' r='15'/><path d='M129 107l12 12'/><path d='M112 96h12' opacity='.7'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">The catalogue drawer next to a full-text search of every page.</p><div class=\"an-lab\">The analogy</div><p>The catalogue finds books by title and shelf mark. It cannot tell you which books mention a name on page ninety. For that you need something that reads inside, and asking the catalogue will get you a confident, wrong, very short answer.</p><div class=\"an-snap\"><b>So on the exam →</b> Glob matches file paths. Grep searches file contents. 'Which files use this function' is a content question, so it is Grep — every time.</div></div></div><div class=\"an-nem\"><span class=\"lab\">⚠ Your record · Missed on Exams 4 and 5</span>Glob matches file <em>paths</em>. Grep searches file <em>contents</em>. &ldquo;Find everywhere this symbol is used&rdquo; is a content question every single time.</div></div>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Task</th>\n<th>Tool</th>\n<th>Example</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Find files by name/pattern</td>\n<td><strong>Glob</strong></td>\n<td><code>**/*.test.tsx</code>, <code>src/components/**/*.ts</code></td>\n</tr>\n<tr>\n<td>Search within files</td>\n<td><strong>Grep</strong></td>\n<td>Function name, error message, import</td>\n</tr>\n<tr>\n<td>Read a file in full</td>\n<td><strong>Read</strong></td>\n<td>Load a file for analysis</td>\n</tr>\n<tr>\n<td>Write a new file</td>\n<td><strong>Write</strong></td>\n<td>Create a file from scratch</td>\n</tr>\n<tr>\n<td>Edit an existing file precisely</td>\n<td><strong>Edit</strong></td>\n<td>Replace a specific snippet via unique text match</td>\n</tr>\n<tr>\n<td>Run a shell command</td>\n<td><strong>Bash</strong></td>\n<td>git, npm, run tests, build</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"s-13-2-incremental-investigation-strategy\">13.2 Incremental Investigation Strategy</h2><div class=\"an\" style=\"--acc:var(--w-library)\" data-an=\"13.2\"><div class=\"an-top\"><span class=\"an-w\">The library</span><span class=\"an-t\">§13.2</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M14 24h20v112H14zM38 24h16v112H38zM58 24h22v112H58z' opacity='.35'/><path d='M14 24h20v112H14z' fill='var(--acc)' opacity='.18'/><path d='M14 24h20v112H14z'/><circle cx='24' cy='52' r='9'/><path d='M31 59l8 8'/><path d='M46 66h34' stroke-dasharray='4 4'/><path d='M72 60l8 6-8 6'/><rect x='88' y='40' width='58' height='34' rx='4'/><path d='M96 52h34M96 62h20' opacity='.6'/><path d='M117 74v14' stroke-dasharray='4 4'/><rect x='88' y='92' width='58' height='34' rx='4' fill='var(--acc)' opacity='.14'/><path d='M88 92h58v34H88z'/><path d='M96 104h34M96 114h20' opacity='.6'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Following the citations, rather than reading the whole floor.</p><div class=\"an-lab\">The analogy</div><p>You have one afternoon and eleven thousand books. You find one paper on the subject, read its references, pull those three, read theirs. You do not begin at shelf A and work east.</p><div class=\"an-snap\"><b>So on the exam →</b> Grep to locate entry points, Read the files you found, Grep for their usages, Read those. Reading everything up front to 'get full context' is the named anti-pattern.</div></div></div></div>\n<p>Do not read all files at once. Build understanding incrementally:</p>\n<pre><code>1. Grep: find entry points (function definition, export)\n2. Read: read the found files\n3. Grep: find usages (import, calls)\n4. Read: read consumer files\n5. Repeat until you have a complete picture\n</code></pre>\n<h2 id=\"s-13-3-fallback-read-write-instead-of-edit\">13.3 Fallback: Read + Write Instead of Edit</h2><div class=\"an hi\" style=\"--acc:var(--w-library)\" data-an=\"13.3\"><div class=\"an-top\"><span class=\"an-w\">The library</span><span class=\"an-t\">§13.3</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='14' y='22' width='62' height='84' rx='4'/><path d='M24 40h42M24 54h42M24 68h42M24 82h42' opacity='.4'/><ellipse cx='45' cy='40' rx='26' ry='8' opacity='.9'/><ellipse cx='45' cy='68' rx='26' ry='8' opacity='.9'/><ellipse cx='45' cy='82' rx='26' ry='8' opacity='.9'/><path d='M22 118l10 10M32 118l-10 10' stroke-width='2.6'/><path d='M52 123h30'/><path d='M74 117l8 6-8 6'/><rect x='94' y='22' width='54' height='84' rx='4' fill='var(--acc)' opacity='.14'/><path d='M94 22h54v84H94z'/><path d='M104 40h34M104 54h34M104 68h34M104 82h20' opacity='.7'/><path d='M110 118l5 5 9-10' /><path d='M130 123h14' opacity='.5'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A correction that needs a sentence appearing exactly once on the page.</p><div class=\"an-lab\">The analogy</div><p>Tell the archivist to change 'the rate is fixed' and they will ask which of the four. Give them a shorter phrase and it gets worse, not better — now it appears eleven times. So you take the page, retype it whole, and put it back.</p><div class=\"an-snap\"><b>So on the exam →</b> Edit needs a unique anchor. When it fails, Read the file, modify the content, Write it back. A shorter anchor is more likely to be non-unique, not less.</div></div></div><div class=\"an-nem\"><span class=\"lab\">⚠ Your record · Worth one look</span>A shorter anchor is <em>more</em> likely to be non-unique, not less. When Edit cannot find a unique match, Read then Write is the sanctioned fallback &mdash; not <code>sed</code>.</div></div>\n<p>When Edit fails due to a non-unique text match:\n1. Read — load the full file content\n2. Modify the content programmatically\n3. Write — write the updated version</p>\n<hr />", "concepts": ["13.1", "13.2", "13.3"], "keywords": "Chapter 13: Claude Code Built-in Tools 13.1 Tool Selection Reference 13.2 Incremental Investigation Strategy 13.3 Fallback: Read + Write Instead of Edit"}, {"id": "d1", "group": "Part II · Domains", "title": "D1 Agent architecture (27%)", "short": "D1", "num": "", "html": "<h1 id=\"s-part-ii-exam-domain-notes\">PART II: EXAM DOMAIN NOTES</h1>\n<hr />\n<h1 id=\"s-domain-1-agent-architecture-and-orchestration-27\">Domain 1: Agent Architecture and Orchestration (27%)</h1>\n<h2 id=\"s-1-1-designing-agentic-loops-for-autonomous-task-execution\">1.1 Designing Agentic Loops for Autonomous Task Execution</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li>Agent loop lifecycle: send a Claude request, check <code>stop_reason</code> (<code>\"tool_use\"</code> vs <code>\"end_turn\"</code>), execute tools, return results for the next iteration</li>\n<li>Tool results are appended to the conversation history so the model can decide the next action</li>\n<li>Model-driven decision making (Claude chooses the next tool) vs hard-coded decision trees</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Flow control: continue the loop when <code>stop_reason = \"tool_use\"</code> and stop on <code>\"end_turn\"</code></li>\n<li>Appending tool results to context between iterations</li>\n<li>Anti-patterns to avoid: parsing assistant text for completion, using arbitrary iteration limits as the primary stopping mechanism</li>\n</ul>\n<h2 id=\"s-1-2-orchestrating-multi-agent-systems-coordinator-subagent\">1.2 Orchestrating Multi-agent Systems (Coordinator–Subagent)</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li>Hub-and-spoke architecture: the coordinator owns all inter-agent communication, error handling, and routing</li>\n<li>Subagents operate with isolated context—they do not automatically inherit the coordinator’s history</li>\n<li>Coordinator responsibilities: task decomposition, delegation, result aggregation, dynamic selection of subagents</li>\n<li>Risk of overly narrow decomposition by the coordinator</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Split research coverage among subagents to minimize duplication</li>\n<li>Implement iterative refinement loops (coordinator evaluates synthesis and re-routes tasks)</li>\n<li>Route all communication through the coordinator for observability</li>\n</ul>\n<h2 id=\"s-1-3-configuring-subagent-calls-context-passing-and-spawning\">1.3 Configuring Subagent Calls, Context Passing, and Spawning</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li><code>Task</code> tool spawns subagents; the coordinator’s <code>allowedTools</code> must include <code>\"Task\"</code></li>\n<li>Subagent context must be explicitly included in the prompt; subagents do not inherit parent context</li>\n<li><code>AgentDefinition</code> configuration: descriptions, system prompts, tool constraints</li>\n<li>Session management via <code>fork_session</code> for exploring alternatives</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Include full outputs from prior agents in the subagent prompt</li>\n<li>Use structured formats to separate data from metadata when passing context</li>\n<li>Spawn parallel subagents via multiple <code>Task</code> calls in a single coordinator turn</li>\n<li>Write coordinator prompts in terms of goals and quality criteria rather than step-by-step instructions</li>\n</ul>\n<h2 id=\"s-1-4-implementing-multi-step-workflows-with-enforcement-and-h\">1.4 Implementing Multi-step Workflows with Enforcement and Handoff Patterns</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li>The difference between <strong>programmatic enforcement</strong> (hooks, preconditions) and <strong>prompt guidance</strong> for ordering a workflow</li>\n<li>When you need deterministic guarantees (e.g., identity verification before financial operations), prompts alone are insufficient</li>\n<li>Structured handoff protocols during escalation (customer ID, reason, recommended action)</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Programmatic preconditions that block downstream calls until prior steps are complete (e.g., block <code>process_refund</code> until <code>get_customer</code> returns a verified ID)</li>\n<li>Decompose multi-aspect customer requests into separate items</li>\n<li>Produce structured summaries when escalating to a human</li>\n</ul>\n<h2 id=\"s-1-5-agent-sdk-hooks-for-intercepting-tool-calls-and-normaliz\">1.5 Agent SDK Hooks for Intercepting Tool Calls and Normalizing Data</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li>Hook patterns (e.g., <code>PostToolUse</code>) to intercept tool results before the model consumes them</li>\n<li>Hooks that intercept outgoing calls to enforce compliance rules (e.g., block refunds above a threshold)</li>\n<li>Hooks provide <strong>deterministic guarantees</strong> vs prompt instructions that provide <strong>probabilistic compliance</strong></li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li><code>PostToolUse</code> hooks for normalizing data formats (Unix timestamps, ISO 8601, numeric status codes)</li>\n<li>Interception hooks to block policy-violating actions with redirection to escalation</li>\n<li>Choose hooks over prompts when business rules require guaranteed compliance</li>\n</ul>\n<h2 id=\"s-1-6-task-decomposition-strategies-for-complex-workflows\">1.6 Task Decomposition Strategies for Complex Workflows</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li><strong>Fixed pipelines</strong> (prompt chaining) vs <strong>dynamic adaptive decomposition</strong> based on intermediate results</li>\n<li>Prompt chaining: sequential steps (analyze each file separately, then run an integration pass)</li>\n<li>Adaptive investigation plans that generate subtasks based on what was discovered</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Use prompt chaining for predictable multi-aspect reviews; use dynamic decomposition for open-ended investigations</li>\n<li>Split large code reviews into per-file analysis plus a separate cross-file integration pass</li>\n<li>Decompose open-ended tasks: map structure first, then build a prioritized plan</li>\n</ul>\n<h2 id=\"s-1-7-session-state-resuming-and-forking\">1.7 Session State, Resuming, and Forking</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li><code>--resume &lt;session-name&gt;</code> to continue named sessions</li>\n<li><code>fork_session</code> to create independent investigation branches from shared context</li>\n<li>The importance of informing the agent about file changes when resuming sessions</li>\n<li>A new session with a structured summary can be more reliable than resuming with stale results</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Use <code>--resume</code> to continue named investigation sessions</li>\n<li>Use <code>fork_session</code> to compare approaches in parallel</li>\n<li>Choose between resuming (context still current) vs starting a new session (results stale)</li>\n</ul>\n<hr />", "concepts": [], "keywords": "PART II: EXAM DOMAIN NOTES Domain 1: Agent Architecture and Orchestration (27%) 1.1 Designing Agentic Loops for Autonomous Task Execution Key knowledge: Key skills: 1.2 Orchestrating Multi-agent Systems (Coordinator–Subagent) Key knowledge: Key skills: 1.3 Configuring Subagent Calls, Context Passing, and Spawning Key knowledge: Key skills: 1.4 Implementing Multi-step Workflows with Enforcement and Handoff Patterns Key knowledge: Key skills: 1.5 Agent SDK Hooks for Intercepting Tool Calls and Normalizing Data Key knowledge: Key skills: 1.6 Task Decomposition Strategies for Complex Workflows Key knowledge: Key skills: 1.7 Session State, Resuming, and Forking Key knowledge: Key skills:"}, {"id": "d2", "group": "Part II · Domains", "title": "D2 Tool design and MCP (18%)", "short": "D2", "num": "", "html": "<h1 id=\"s-domain-2-tool-design-and-mcp-integration-18\">Domain 2: Tool Design and MCP Integration (18%)</h1>\n<h2 id=\"s-2-1-designing-tool-interfaces-with-clear-descriptions\">2.1 Designing Tool Interfaces with Clear Descriptions</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li>Tool descriptions are the <strong>primary mechanism</strong> an LLM uses to select tools; minimal descriptions lead to unreliable selection</li>\n<li>The importance of including input formats, example queries, edge cases, and applicability boundaries</li>\n<li>Ambiguous or overlapping descriptions cause misrouting</li>\n<li>System prompt wording can create unintended associations with tools</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Write descriptions that clearly distinguish each tool from similar alternatives</li>\n<li>Rename tools to eliminate functional overlap (e.g., <code>analyze_content</code> -&gt; <code>extract_web_results</code>)</li>\n<li>Split general-purpose tools into specialized ones with clear input/output contracts</li>\n</ul>\n<h2 id=\"s-2-2-implementing-structured-error-responses-for-mcp-tools\">2.2 Implementing Structured Error Responses for MCP Tools</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li>The <code>isError</code> flag in MCP tool responses</li>\n<li>The difference between <strong>transient errors</strong> (timeouts), <strong>validation errors</strong> (bad input), <strong>business errors</strong> (policy violations), and <strong>access/permission errors</strong></li>\n<li>Generic errors (\"Operation failed\") prevent correct recovery decisions</li>\n<li>The difference between retryable and non-retryable errors</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Return structured metadata such as <code>errorCategory</code> (transient/validation/permission), <code>isRetryable</code>, and a human-readable message</li>\n<li>Use <code>retryable: false</code> for business-rule violations with clear user-facing explanations</li>\n<li>Do local recovery inside subagents for transient failures; propagate only errors they cannot resolve</li>\n<li>Distinguish access failures (retry decision) from valid empty results (no matches)</li>\n</ul>\n<h2 id=\"s-2-3-allocating-tools-across-agents-and-configuring-tool-choi\">2.3 Allocating Tools Across Agents and Configuring <code>tool_choice</code></h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li>Too many tools per agent (e.g., 18 instead of 4–5) <strong>reduces</strong> tool selection reliability</li>\n<li>Agents with tools outside their specialization tend to misuse them</li>\n<li>Scoped tool access: only role-relevant tools plus a limited set of cross-role utilities</li>\n<li><code>tool_choice</code>: <code>\"auto\"</code>, <code>\"any\"</code>, and forced tool selection (<code>{\"type\": \"tool\", \"name\": \"...\"}</code>)</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Restrict each subagent’s toolset to what is relevant for its role</li>\n<li>Replace general tools with constrained alternatives (e.g., <code>fetch_url</code> -&gt; <code>load_document</code>)</li>\n<li>Use <code>tool_choice: \"any\"</code> to guarantee a tool call instead of a text answer</li>\n<li>Force a specific tool to ensure execution order</li>\n</ul>\n<h2 id=\"s-2-4-integrating-mcp-servers-into-claude-code-and-agent-workf\">2.4 Integrating MCP Servers into Claude Code and Agent Workflows</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li>MCP server scope: project (<code>.mcp.json</code>) for teams vs user (<code>~/.claude.json</code>) for experiments</li>\n<li>Environment variable substitution in <code>.mcp.json</code> (e.g., <code>${GITHUB_TOKEN}</code>) for secret management</li>\n<li>Tools from all connected MCP servers are discovered on connection and are available simultaneously</li>\n<li>MCP resources as “content catalogs” (task summaries, database schemas) to reduce exploratory tool calls</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Configure shared MCP servers in project <code>.mcp.json</code> with env-var-based tokens</li>\n<li>Keep personal/experimental servers in <code>~/.claude.json</code></li>\n<li>Prefer community MCP servers over custom servers for standard integrations</li>\n</ul>\n<h2 id=\"s-2-5-selecting-and-applying-built-in-tools-read-write-edit-ba\">2.5 Selecting and Applying Built-in Tools (Read, Write, Edit, Bash, Grep, Glob)</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li><strong>Grep</strong>: search within file contents (function names, error messages, imports)</li>\n<li><strong>Glob</strong>: find files by name/extension patterns</li>\n<li><strong>Read/Write</strong>: full-file operations; <strong>Edit</strong>: precise changes via unique text matches</li>\n<li>If Edit fails due to non-unique matches, fall back to Read + Write</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Use Grep for content search and Glob for file discovery by patterns</li>\n<li>Build understanding incrementally: Grep entry points, then Read to trace flows</li>\n<li>Trace function usage through wrapper modules</li>\n</ul>\n<hr />", "concepts": [], "keywords": "Domain 2: Tool Design and MCP Integration (18%) 2.1 Designing Tool Interfaces with Clear Descriptions Key knowledge: Key skills: 2.2 Implementing Structured Error Responses for MCP Tools Key knowledge: Key skills: 2.3 Allocating Tools Across Agents and Configuring `tool_choice` Key knowledge: Key skills: 2.4 Integrating MCP Servers into Claude Code and Agent Workflows Key knowledge: Key skills: 2.5 Selecting and Applying Built-in Tools (Read, Write, Edit, Bash, Grep, Glob) Key knowledge: Key skills:"}, {"id": "d3", "group": "Part II · Domains", "title": "D3 Claude Code config (20%)", "short": "D3", "num": "", "html": "<h1 id=\"s-domain-3-claude-code-configuration-and-workflows-20\">Domain 3: Claude Code Configuration and Workflows (20%)</h1>\n<h2 id=\"s-3-1-configuring-claude-md-with-hierarchy-scope-and-modular-o\">3.1 Configuring CLAUDE.md with Hierarchy, Scope, and Modular Organization</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li>CLAUDE.md hierarchy: user (<code>~/.claude/CLAUDE.md</code>), project (<code>.claude/CLAUDE.md</code> or root <code>CLAUDE.md</code>), and directory-level (CLAUDE.md in subdirectories)</li>\n<li>User-level settings apply only to one user and are not shared via VCS</li>\n<li><code>@path</code> syntax for referencing external files (e.g., <code>@./standards/coding-style.md</code>) to modularize CLAUDE.md</li>\n<li>The <code>.claude/rules/</code> directory for topic-focused rule files instead of a monolithic CLAUDE.md</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Diagnose hierarchy issues (a new team member misses instructions because they are user-level instead of project-level)</li>\n<li>Use <code>@path</code> (e.g., <code>@./standards/testing.md</code>) to selectively include standards in each package’s CLAUDE.md</li>\n<li>Split large CLAUDE.md into multiple <code>.claude/rules/</code> files (testing.md, api-conventions.md, deployment.md)</li>\n</ul>\n<h2 id=\"s-3-2-creating-and-configuring-custom-slash-commands-and-skill\">3.2 Creating and Configuring Custom Slash Commands and Skills</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li><strong>Project commands</strong> in <code>.claude/commands/</code> (shared via VCS) vs <strong>user commands</strong> in <code>~/.claude/commands/</code></li>\n<li>Skills in <code>.claude/skills/</code> with <code>SKILL.md</code> frontmatter: <code>context: fork</code>, <code>allowed-tools</code>, <code>argument-hint</code></li>\n<li><code>context: fork</code> runs the skill in an isolated subagent context so it does not pollute the main session</li>\n<li>Personal skill variants can live in <code>~/.claude/skills/</code> under different names</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Store project slash commands in <code>.claude/commands/</code> so the whole team gets them</li>\n<li>Use <code>context: fork</code> to isolate skills with verbose output</li>\n<li>Use <code>allowed-tools</code> to restrict what tools a skill can use</li>\n<li>Use <code>argument-hint</code> to prompt developers for required parameters</li>\n</ul>\n<h2 id=\"s-3-3-using-path-specific-rules-for-conditional-convention-loa\">3.3 Using Path-specific Rules for Conditional Convention Loading</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li><code>.claude/rules/</code> files can include YAML frontmatter <code>paths</code> to activate rules based on glob patterns</li>\n<li>Path-scoped rules load <strong>only</strong> when editing matching files, saving context and tokens</li>\n<li>Glob-based path rules can be preferable to directory-level CLAUDE.md when conventions apply across many directories (e.g., tests)</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Create <code>.claude/rules/</code> files with <code>paths: [\"terraform/**/*\"]</code> to load only when working on matching files</li>\n<li>Use glob patterns (<code>**/*.test.tsx</code>) to apply conventions by file type regardless of location</li>\n<li>Prefer path-specific rules over directory-level CLAUDE.md when conventions span the codebase</li>\n</ul>\n<h2 id=\"s-3-4-deciding-when-to-use-planning-mode-vs-direct-execution\">3.4 Deciding When to Use Planning Mode vs Direct Execution</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li><strong>Planning mode</strong>: for complex tasks with large changes, multiple viable approaches, and architectural decisions</li>\n<li><strong>Direct execution</strong>: for simple, well-understood changes (e.g., adding a single validation)</li>\n<li>Planning mode enables safe exploration of the codebase before making changes</li>\n<li>Explore subagent isolates verbose discovery output</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Use planning mode for tasks with architectural consequences (microservices, migrations touching 45+ files)</li>\n<li>Use direct execution for fixes with a clear stack trace and a single file</li>\n<li>Use Explore subagent to prevent context-window exhaustion in multi-phase tasks</li>\n<li>Combine approaches: plan for discovery, then execute for implementation</li>\n</ul>\n<h2 id=\"s-3-5-iterative-refinement-for-progressive-improvement\">3.5 Iterative Refinement for Progressive Improvement</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li>Concrete input/output examples are the most effective way to communicate expectations</li>\n<li><strong>Test-driven iteration</strong>: write tests first, then iterate based on failures</li>\n<li>The “interview” pattern: Claude asks questions to surface non-obvious design considerations</li>\n<li>When to provide all issues in one message (interdependent) vs sequentially (independent)</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Provide 2–3 concrete input/output examples to clarify transformation requirements</li>\n<li>Build test sets with expected behavior, edge cases, and performance requirements before implementation</li>\n<li>Use the interview pattern to surface design aspects (cache invalidation, failure modes)</li>\n<li>Provide concrete test cases with sample inputs and expected outputs for edge cases</li>\n</ul>\n<h2 id=\"s-3-6-integrating-claude-code-into-ci-cd-pipelines\">3.6 Integrating Claude Code into CI/CD Pipelines</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li>The <code>-p</code> (or <code>--print</code>) flag for non-interactive mode in automated pipelines</li>\n<li><code>--output-format json</code> and <code>--json-schema</code> for structured output in CI</li>\n<li>CLAUDE.md provides project context (testing standards, review criteria) for CI-triggered Claude Code</li>\n<li><strong>Session context isolation</strong>: the same session that generated code is less effective at reviewing it than an independent instance</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Run Claude Code in CI with <code>-p</code> to avoid hanging on interactive input</li>\n<li>Use <code>--output-format json</code> + <code>--json-schema</code> for structured results (e.g., inline PR comments)</li>\n<li>Include prior review results when re-running after new commits (report only new/unfixed issues)</li>\n<li>Document testing standards and available fixtures in CLAUDE.md to improve test generation quality</li>\n<li>Include existing test files in context when generating new tests to avoid duplication and keep style consistent</li>\n</ul>\n<hr />", "concepts": [], "keywords": "Domain 3: Claude Code Configuration and Workflows (20%) 3.1 Configuring CLAUDE.md with Hierarchy, Scope, and Modular Organization Key knowledge: Key skills: 3.2 Creating and Configuring Custom Slash Commands and Skills Key knowledge: Key skills: 3.3 Using Path-specific Rules for Conditional Convention Loading Key knowledge: Key skills: 3.4 Deciding When to Use Planning Mode vs Direct Execution Key knowledge: Key skills: 3.5 Iterative Refinement for Progressive Improvement Key knowledge: Key skills: 3.6 Integrating Claude Code into CI/CD Pipelines Key knowledge: Key skills:"}, {"id": "d4", "group": "Part II · Domains", "title": "D4 Prompt engineering (20%)", "short": "D4", "num": "", "html": "<h1 id=\"s-domain-4-prompt-engineering-and-structured-output-20\">Domain 4: Prompt Engineering and Structured Output (20%)</h1>\n<h2 id=\"s-4-1-designing-prompts-with-explicit-criteria-to-improve-accu\">4.1 Designing Prompts with Explicit Criteria to Improve Accuracy</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li>Explicit criteria are more effective than vague instructions (e.g., “flag comments only when they contradict code” vs “check comment accuracy”)</li>\n<li>Generic guidance like “be more conservative” works worse than concrete categorical criteria</li>\n<li>The effect of false positives on developer trust: high false-positive rates in some categories undermine trust in accurate categories</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Define review criteria: what to report (bugs, security) vs what to ignore (minor style)</li>\n<li>Temporarily disable categories with high false-positive rates</li>\n<li>Define explicit severity criteria with code examples for each level</li>\n</ul>\n<h2 id=\"s-4-2-using-few-shot-prompting-to-improve-output-consistency\">4.2 Using Few-shot Prompting to Improve Output Consistency</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li>Few-shot examples are the most effective method for producing consistently formatted, actionable output</li>\n<li>Few-shot can demonstrate handling of ambiguous cases (tool selection, gaps in test coverage)</li>\n<li>Few-shot helps the model generalize to new patterns rather than just repeating defaults</li>\n<li>Few-shot can reduce hallucinations in extraction tasks</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Provide 2–4 targeted examples for ambiguous scenarios with rationale</li>\n<li>Include few-shot examples that demonstrate the output format (location, issue, severity, suggested fix)</li>\n<li>Provide examples that distinguish acceptable code patterns from real issues</li>\n<li>Provide examples of correct extraction from documents with different structures</li>\n</ul>\n<h2 id=\"s-4-3-enforcing-structured-output-with-tool-use-and-json-schem\">4.3 Enforcing Structured Output with <code>tool_use</code> and JSON Schemas</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li><code>tool_use</code> with JSON Schemas is the most reliable way to guarantee schema-conformant output and eliminate JSON syntax errors</li>\n<li>With <code>tool_choice: \"auto\"</code> the model can return text; with <code>\"any\"</code> it must call a tool; forced selection chooses a specific tool</li>\n<li>Strict JSON Schemas eliminate syntax errors but do not prevent semantic errors (totals don’t add up; values in wrong fields)</li>\n<li>Schema design: required vs optional fields; enums with “other” plus a detail string for extensibility</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Define extraction tools with JSON Schemas and parse data from <code>tool_use</code> results</li>\n<li>Use <code>tool_choice: \"any\"</code> to guarantee structured output when multiple schemas exist</li>\n<li>Force a specific tool call: <code>tool_choice: {\"type\": \"tool\", \"name\": \"extract_metadata\"}</code></li>\n<li>Make fields optional/nullable when the source may not contain information to avoid fabricating values</li>\n<li>Use enum values like <code>\"unclear\"</code> and <code>\"other\"</code> plus detail fields for extensible categorization</li>\n</ul>\n<h2 id=\"s-4-4-implementing-validation-retries-and-feedback-loops-for-e\">4.4 Implementing Validation, Retries, and Feedback Loops for Extraction Quality</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li>Retry-with-error-feedback: include concrete validation errors in the retry prompt to guide corrections</li>\n<li>Retries are ineffective when the information is simply absent from the source</li>\n<li>Feedback loop design: track the pattern that triggered a finding (<code>detected_pattern</code>)</li>\n<li>Semantic errors (totals don’t reconcile) vs syntax errors (addressed by <code>tool_use</code>)</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Follow-up prompts with the original document, an incorrect extraction, and specific validation errors</li>\n<li>Identify when retry will be ineffective (the required info is only in an external document)</li>\n<li>Include <code>detected_pattern</code> fields in findings to analyze false positives</li>\n<li>Design self-correction by extracting both <code>calculated_total</code> and <code>stated_total</code> to detect discrepancies</li>\n</ul>\n<h2 id=\"s-4-5-designing-efficient-batch-processing-strategies\">4.5 Designing Efficient Batch Processing Strategies</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li>Message Batches API: 50% savings, up to 24-hour processing window, no latency SLA guarantees</li>\n<li>Batch processing is suitable for non-blocking tasks (overnight reports, audits) and not suitable for blocking tasks (pre-merge checks)</li>\n<li>Batch API does not support multi-turn tool calling within a single request</li>\n<li><code>custom_id</code> fields correlate request/response within batches</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Use synchronous API for blocking checks; use Batch API for overnight/weekly workloads</li>\n<li>Plan batch submission cadence based on SLA needs (e.g., 4-hour windows for a 30-hour guarantee with 24-hour processing)</li>\n<li>Handle failures by re-submitting only failed documents (identified by <code>custom_id</code>)</li>\n<li>Iterate on prompts using a sample before running large-scale processing</li>\n</ul>\n<h2 id=\"s-4-6-designing-multi-instance-and-multi-pass-review-architect\">4.6 Designing Multi-instance and Multi-pass Review Architectures</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li>Self-review limitations: the model retains its reasoning context and is less likely to challenge its own decisions</li>\n<li>Independent review instances (without generation context) are better at finding subtle issues</li>\n<li>Multi-pass review: per-file local analysis plus a cross-file integration pass to avoid attention dilution</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Use a second independent Claude instance to review changes without generation context</li>\n<li>Split multi-file reviews into per-file passes plus integration passes for cross-file dataflow analysis</li>\n<li>Use verification passes with self-rated confidence to route reviews in a calibrated way</li>\n</ul>\n<hr />", "concepts": [], "keywords": "Domain 4: Prompt Engineering and Structured Output (20%) 4.1 Designing Prompts with Explicit Criteria to Improve Accuracy Key knowledge: Key skills: 4.2 Using Few-shot Prompting to Improve Output Consistency Key knowledge: Key skills: 4.3 Enforcing Structured Output with `tool_use` and JSON Schemas Key knowledge: Key skills: 4.4 Implementing Validation, Retries, and Feedback Loops for Extraction Quality Key knowledge: Key skills: 4.5 Designing Efficient Batch Processing Strategies Key knowledge: Key skills: 4.6 Designing Multi-instance and Multi-pass Review Architectures Key knowledge: Key skills:"}, {"id": "d5", "group": "Part II · Domains", "title": "D5 Context and reliability (15%)", "short": "D5", "num": "", "html": "<h1 id=\"s-domain-5-context-management-and-reliability-15\">Domain 5: Context Management and Reliability (15%)</h1>\n<h2 id=\"s-5-1-managing-conversation-context-to-preserve-critical-infor\">5.1 Managing Conversation Context to Preserve Critical Information</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li>Risks of progressive summarization: numeric values, percentages, and dates get condensed into vague summaries</li>\n<li>Lost-in-the-middle effect: models reliably process the start and end of long inputs, but may miss findings from the middle</li>\n<li>Tool outputs can accumulate in context disproportionately to relevance (40+ fields when 5 are needed)</li>\n<li>The importance of sending the full conversation history in subsequent API requests</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Extract transactional facts into a persistent “case facts” block outside the summarized history</li>\n<li>Trim verbose tool outputs down to relevant fields</li>\n<li>Place key findings at the beginning of aggregated data with explicit section headings</li>\n<li>Require subagents to include metadata (dates, sources) in structured outputs</li>\n</ul>\n<h2 id=\"s-5-2-designing-effective-escalation-patterns-and-resolving-am\">5.2 Designing Effective Escalation Patterns and Resolving Ambiguity</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li>Suitable escalation triggers: explicit request for a human, policy gaps/exceptions, inability to make progress</li>\n<li>Immediate escalation (explicit request) vs attempt-to-resolve (within agent scope)</li>\n<li>Sentiment analysis and model confidence self-ratings are unreliable proxies for case complexity</li>\n<li>Multiple customer matches require asking for additional identifiers, not heuristic guessing</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Explicit escalation criteria with few-shot examples in the system prompt</li>\n<li>Execute explicit requests for a human immediately without additional investigation</li>\n<li>Escalate when policy is ambiguous or silent for a specific request</li>\n<li>Ask for additional identifiers when tool results contain multiple matches</li>\n</ul>\n<h2 id=\"s-5-3-implementing-error-propagation-strategies-in-multi-agent\">5.3 Implementing Error Propagation Strategies in Multi-agent Systems</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li>Structured error context (failure type, query, partial results, alternatives) enables smarter coordinator recovery</li>\n<li>Distinguish access failures (timeouts require a retry decision) from valid empty results (no matches)</li>\n<li>Generic error statuses (“search unavailable”) hide valuable context from the coordinator</li>\n<li>Silent suppression or aborting the whole workflow on a single failure are both anti-patterns</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Return structured error context: failure type, what was attempted, partial results, possible alternatives</li>\n<li>Distinguish access failures from valid empty results</li>\n<li>Perform local recovery in subagents for transient failures; propagate only non-recoverable errors with partial results</li>\n<li>Annotate coverage in synthesis: what is well-supported vs where gaps remain</li>\n</ul>\n<h2 id=\"s-5-4-managing-context-efficiently-when-investigating-large-co\">5.4 Managing Context Efficiently When Investigating Large Codebases</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li>Context degradation in long sessions: the model starts producing unstable answers and referring to “typical patterns” instead of specific classes</li>\n<li>Scratchpad files preserve key findings across context boundaries</li>\n<li>Delegating to subagents isolates verbose discovery output</li>\n<li>Structured state persistence enables crash recovery</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Spawn subagents for specific questions while keeping high-level coordination in the main agent</li>\n<li>Use scratchpad files to store key findings and reference them later</li>\n<li>Summarize key findings before spawning next-phase subagents</li>\n<li>Use <code>/compact</code> to reduce context usage during long investigations</li>\n</ul>\n<h2 id=\"s-5-5-designing-workflows-with-human-oversight-and-confidence-\">5.5 Designing Workflows with Human Oversight and Confidence Calibration</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li>Aggregate metrics (e.g., 97% overall accuracy) can mask poor performance on specific document types or fields</li>\n<li>Stratified random sampling measures error rates in high-confidence extractions</li>\n<li>Field-level confidence calibration using labeled validation sets</li>\n<li>Validate accuracy by document type and field segment before automating</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Implement stratified random sampling to detect new error patterns</li>\n<li>Analyze accuracy by document type and field to validate stable performance</li>\n<li>Output field-level confidence scores and calibrate review thresholds using labeled data</li>\n<li>Route low-confidence or ambiguous-source extractions to human review</li>\n</ul>\n<h2 id=\"s-5-6-preserving-provenance-and-handling-uncertainty-in-multi-\">5.6 Preserving Provenance and Handling Uncertainty in Multi-source Synthesis</h2>\n<h3 id=\"s-key-knowledge\">Key knowledge:</h3>\n<ul>\n<li>Attribution is lost during summarization without preserving “claim → source” mappings</li>\n<li>Structured mappings must be preserved during aggregation</li>\n<li>Handle conflicting statistics by annotating conflicts with attribution rather than arbitrarily choosing one value</li>\n<li>Include publication/collection dates to avoid misreading temporal differences as contradictions</li>\n</ul>\n<h3 id=\"s-key-skills\">Key skills:</h3>\n<ul>\n<li>Require subagents to output “claim → source” mappings (URL, document name, quotes)</li>\n<li>Structure reports to separate stable findings from disputed ones</li>\n<li>Preserve conflicting values with annotations and pass them to the coordinator for reconciliation</li>\n<li>Include publication dates for correct temporal interpretation</li>\n<li>Render content by type: financial data as tables, news as prose, technical findings as structured lists</li>\n</ul>\n<hr />", "concepts": [], "keywords": "Domain 5: Context Management and Reliability (15%) 5.1 Managing Conversation Context to Preserve Critical Information Key knowledge: Key skills: 5.2 Designing Effective Escalation Patterns and Resolving Ambiguity Key knowledge: Key skills: 5.3 Implementing Error Propagation Strategies in Multi-agent Systems Key knowledge: Key skills: 5.4 Managing Context Efficiently When Investigating Large Codebases Key knowledge: Key skills: 5.5 Designing Workflows with Human Oversight and Confidence Calibration Key knowledge: Key skills: 5.6 Preserving Provenance and Handling Uncertainty in Multi-source Synthesis Key knowledge: Key skills:"}, {"id": "worked", "group": "Assessment", "title": "12 worked questions with explanations", "short": "Worked", "num": "", "html": "<button class=\"btn\" id=\"revealAll\" style=\"margin:6px 0 14px\">Reveal all answers</button><h1 id=\"s-examples-of-exam-questions-with-explanations\">Examples of Exam Questions with Explanations</h1>\n<div class=\"qz\"><div class=\"qh\">Question 1 (Scenario: Customer Support Agent)</div>\n<p><strong>Situation:</strong> Data shows that in 12% of cases the agent skips <code>get_customer</code> and calls <code>lookup_order</code> using only the customer’s name, which leads to incorrect refunds.</p>\n<p><strong>Which change is most effective?</strong></p>\n<ul>\n<li>A) Add a programmatic precondition that blocks <code>lookup_order</code> and <code>process_refund</code> until an ID is obtained from <code>get_customer</code></li>\n<li>B) Improve the system prompt</li>\n<li>C) Add few-shot examples</li>\n<li>D) Implement a routing classifier</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> When critical business logic requires a specific tool sequence, software provides <strong>deterministic guarantees</strong> that prompt-based approaches (B, C) cannot. D addresses availability, not tool ordering.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 2 (Scenario: Customer Support Agent)</div>\n<p><strong>Situation:</strong> The agent often calls <code>get_customer</code> instead of <code>lookup_order</code> for order-related questions. Tool descriptions are minimal and similar.</p>\n<p><strong>What is the first step?</strong></p>\n<ul>\n<li>A) Few-shot examples</li>\n<li>B) Expand each tool’s description with input formats, examples, and boundaries</li>\n<li>C) Add a routing layer</li>\n<li>D) Merge the tools</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: B</strong></p>\n<p><strong>Why B:</strong> Tool descriptions are the model’s primary selection mechanism. This is the lowest-effort, highest-impact fix. A adds tokens without addressing the root cause. C is overengineering. D requires more effort than justified.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 3 (Scenario: Customer Support Agent)</div>\n<p><strong>Situation:</strong> The agent resolves only 55% of issues with a target of 80%. It escalates simple cases and tries to handle complex policy exceptions autonomously.</p>\n<p><strong>How do you improve calibration?</strong></p>\n<ul>\n<li>A) Add explicit escalation criteria with few-shot examples</li>\n<li>B) Self-rated confidence (1–10) with automatic escalation</li>\n<li>C) A separate classifier trained on historical data</li>\n<li>D) Sentiment analysis</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> It directly addresses the root cause—unclear decision boundaries. B is unreliable (the model can be confidently wrong). C is overengineering. D solves a different problem (mood != complexity).</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 4 (Scenario: Code Generation with Claude Code)</div>\n<p><strong>Situation:</strong> You need a custom <code>/review</code> command for standard code review that is available to the whole team when they clone the repository.</p>\n<p><strong>Where should you create the command file?</strong></p>\n<ul>\n<li>A) <code>.claude/commands/</code> in the project repository</li>\n<li>B) <code>~/.claude/commands/</code></li>\n<li>C) Root <code>CLAUDE.md</code></li>\n<li>D) <code>.claude/config.json</code></li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> Project commands stored in <code>.claude/commands/</code> are version-controlled and automatically available to everyone. B is for personal commands. C is for instructions, not command definitions. D does not exist.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 5 (Scenario: Code Generation with Claude Code)</div>\n<p><strong>Situation:</strong> You need to restructure a monolith into microservices (dozens of files, service-boundary decisions).</p>\n<p><strong>What approach should you use?</strong></p>\n<ul>\n<li>A) Planning mode: explore the codebase, understand dependencies, design an approach</li>\n<li>B) Direct execution incrementally</li>\n<li>C) Direct execution with detailed up-front instructions</li>\n<li>D) Direct execution and switch to planning when it gets hard</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> Planning mode is designed for large changes, multiple possible approaches, and architectural decisions. B risks expensive rework. C assumes you already know the structure. D is reactive.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 6 (Scenario: Code Generation with Claude Code)</div>\n<p><strong>Situation:</strong> A codebase has different conventions across areas (React, API, database). Tests are co-located with code. You want conventions to be applied automatically.</p>\n<p><strong>What approach should you use?</strong></p>\n<ul>\n<li>A) <code>.claude/rules/</code> files with YAML frontmatter and glob patterns</li>\n<li>B) Put everything in the root CLAUDE.md</li>\n<li>C) Skills in <code>.claude/skills/</code></li>\n<li>D) CLAUDE.md in every directory</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> <code>.claude/rules/</code> with glob patterns (e.g., <code>**/*.test.tsx</code>) enables automatic convention application based on file paths—ideal for tests spread across the codebase. B relies on model inference. C is manual/on-demand. D does not work well when relevant files are in many directories.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 7 (Scenario: Multi-agent Research System)</div>\n<p><strong>Situation:</strong> The system researches “AI impact on creative industries,” but reports cover only visual art. The coordinator decomposed the topic into: “AI in digital art,” “AI in graphic design,” “AI in photography.”</p>\n<p><strong>What’s the cause?</strong></p>\n<ul>\n<li>A) The synthesis agent does not detect gaps</li>\n<li>B) The coordinator decomposed the task too narrowly</li>\n<li>C) The web search agent does not search thoroughly enough</li>\n<li>D) The document analysis agent filters out non-visual sources</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: B</strong></p>\n<p><strong>Why B:</strong> The logs show the coordinator decomposed “creative industries” only into visual subtopics, completely missing music, literature, and film. Subagents executed correctly—the issue is what they were assigned.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 8 (Scenario: Multi-agent Research System)</div>\n<p><strong>Situation:</strong> A web-search subagent times out while researching a complex topic. You need to design how error information is passed back to the coordinator.</p>\n<p><strong>Which error propagation approach best enables intelligent recovery?</strong></p>\n<ul>\n<li>A) Return structured error context to the coordinator: failure type, query, partial results, and alternatives</li>\n<li>B) Implement automatic retries with exponential backoff inside the subagent, then return a generic “search unavailable” status</li>\n<li>C) Catch the timeout inside the subagent and return an empty result set marked as success</li>\n<li>D) Propagate the timeout exception t
