o a top-level handler that terminates the whole workflow</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> Structured error context gives the coordinator what it needs to decide whether to retry with a modified query, try an alternative approach, or continue with partial results. B hides context behind a generic status. C masks failure as success. D aborts the entire workflow unnecessarily.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 9 (Scenario: Multi-agent Research System)</div>\n<p><strong>Situation:</strong> The synthesis agent often needs to verify specific claims while merging results. Currently, when verification is needed, the synthesis agent hands control back to the coordinator, which calls the web-search agent and then re-runs synthesis with the new results. This adds 2–3 extra round trips per task and increases latency by 40%. Your assessment shows that 85% of these checks are simple fact checks (dates, names, statistics), while 15% require deeper investigation.</p>\n<p><strong>How do you reduce overhead while maintaining reliability?</strong></p>\n<ul>\n<li>A) Give the synthesis agent a limited <code>verify_fact</code> tool for simple checks, and continue routing complex verification through the coordinator</li>\n<li>B) Accumulate all verification needs into a batch and return them to the coordinator at the end</li>\n<li>C) Give the synthesis agent full access to all web-search tools</li>\n<li>D) Proactively cache additional context around each source</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> This applies the principle of least privilege: the synthesis agent gets exactly what it needs for the 85% common case (simple fact checks) while preserving the coordinator-mediated path for complex investigations. B introduces blocking dependencies (later synthesis steps may depend on earlier verified facts). C breaks separation of responsibilities. D relies on speculative caching that cannot reliably predict needs.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 10 (Scenario: Claude Code for CI)</div>\n<p><strong>Situation:</strong> A pipeline runs <code>claude \"Analyze this pull request for security issues\"</code>, but hangs waiting for interactive input.</p>\n<p><strong>What is the correct approach?</strong></p>\n<ul>\n<li>A) Use the <code>-p</code> flag: <code>claude -p \"Analyze this pull request for security issues\"</code></li>\n<li>B) Set <code>CLAUDE_HEADLESS=true</code></li>\n<li>C) Redirect stdin from <code>/dev/null</code></li>\n<li>D) Use <code>--batch</code></li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> <code>-p</code> (or <code>--print</code>) is the documented way to run Claude Code in non-interactive mode. It processes the prompt, prints to stdout, and exits. The other options are either non-existent features or Unix workarounds.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 11 (Scenario: Claude Code for CI)</div>\n<p><strong>Situation:</strong> The team wants to reduce API cost for automated analysis. Claude currently serves two workflows in real time: (1) a blocking pre-merge check that must complete before developers can merge a PR, and (2) a tech-debt report generated overnight for morning review. A manager proposes moving both to the Message Batches API to save 50%.</p>\n<p><strong>How should you evaluate this proposal?</strong></p>\n<ul>\n<li>A) Use batch processing only for tech-debt reports; keep real-time calls for pre-merge checks</li>\n<li>B) Move both workflows to batch processing and poll for completion</li>\n<li>C) Keep real-time calls for both to avoid ordering issues in batch results</li>\n<li>D) Move both to batch processing with a fallback to real time if a batch takes too long</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> The Message Batches API saves 50%, but processing time can be up to 24 hours with no guaranteed latency SLA. That makes it unsuitable for blocking pre-merge checks where developers are waiting, but ideal for overnight batch workloads like tech-debt reports.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 12 (Scenario: Multi-file Code Review)</div>\n<p><strong>Situation:</strong> A pull request changes 14 files in an inventory tracking module. A single-pass review of all files produces inconsistent results: detailed comments for some files but superficial ones for others, missed obvious bugs, and contradictory feedback (a pattern is flagged as problematic in one file but approved in identical code in another file).</p>\n<p><strong>How should you restructure the review?</strong></p>\n<ul>\n<li>A) Split into focused passes: analyze each file individually for local issues, then run a separate integration pass for cross-file data flows</li>\n<li>B) Require developers to split large PRs into submissions of 3–4 files</li>\n<li>C) Switch to a higher-tier model with a larger context window to review all 14 files in one pass</li>\n<li>D) Run three independent full-PR review passes and report only issues found in at least two runs</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> Focused passes directly address the root cause—attention dilution when processing many files at once. Per-file analysis ensures consistent depth, and a separate integration pass catches cross-file issues. B shifts burden to developers without improving the system. C is a misconception: larger context does not fix attention quality. D suppresses real bugs by requiring consensus across inconsistent detections.</p></div></div>", "concepts": [], "keywords": "Examples of Exam Questions with Explanations Question 1 (Scenario: Customer Support Agent) Question 2 (Scenario: Customer Support Agent) Question 3 (Scenario: Customer Support Agent) Question 4 (Scenario: Code Generation with Claude Code) Question 5 (Scenario: Code Generation with Claude Code) Question 6 (Scenario: Code Generation with Claude Code) Question 7 (Scenario: Multi-agent Research System) Question 8 (Scenario: Multi-agent Research System) Question 9 (Scenario: Multi-agent Research System) Question 10 (Scenario: Claude Code for CI) Question 11 (Scenario: Claude Code for CI) Question 12 (Scenario: Multi-file Code Review)"}, {"id": "pt-mars", "group": "Assessment", "title": "Practice · Multi-agent research (Q1–15)", "short": "PT 1–15", "num": "", "html": "<button class=\"btn\" id=\"revealAll\" style=\"margin:6px 0 14px\">Reveal all answers</button><h1 id=\"s-practice-test\">Practice Test</h1>\n<blockquote>\n<p>60 questions across 4 scenarios. Format and difficulty match the real exam.</p>\n<p>Alternatively, you can practice these questions in an exam-like HTML file: <a href=\"practical_test_en.html\">Practical Test (EN)</a></p>\n</blockquote>\n<h2 id=\"s-scenario-multi-agent-research-system\">Scenario: Multi-agent Research System</h2>\n<hr />\n<div class=\"qz\"><div class=\"qh\">Question 1 (Scenario: Multi-agent Research System)</div>\n<p><strong>Situation:</strong> A document analysis agent discovers that two credible sources contain directly contradictory statistics for a key metric: a government report states 40% growth, while an industry analysis states 12%. Both sources look credible, and the discrepancy could materially affect the research conclusions. How should the document analysis agent handle this situation most effectively?</p>\n<p><strong>Which approach is most effective?</strong></p>\n<ul>\n<li>A) Apply credibility heuristics to pick the most likely correct number, finish analysis with that value, and add a footnote mentioning the discrepancy.</li>\n<li>B) Include both numbers in the analysis output without marking them as conflicting, letting the synthesis agent decide which to use based on broader context.</li>\n<li>C) Stop analysis and immediately escalate to the coordinator, asking it to decide which source is more authoritative before continuing.</li>\n<li>D) Complete analysis with both numbers, explicitly annotate the conflict with source attribution, and let the coordinator decide how to reconcile the data before passing to synthesis.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: D</strong></p>\n<p><strong>Why D:</strong> This approach preserves separation of responsibilities: the analysis agent completes its core work without blocking, preserves both conflicting values with clear attribution, and correctly passes reconciliation to the coordinator, which has broader context.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 2 (Scenario: Multi-agent Research System)</div>\n<p><strong>Situation:</strong> The web-search and document-analysis agents have completed their tasks and returned results to the coordinator. What is the next step for creating an integrated research report?</p>\n<p><strong>Which next step is most appropriate?</strong></p>\n<ul>\n<li>A) Each agent sends its results directly to the report-writing agent, bypassing the coordinator.</li>\n<li>B) The document analysis agent requests web-search results and merges them internally.</li>\n<li>C) The coordinator passes both sets of results to the synthesis agent for a unified integration.</li>\n<li>D) The coordinator concatenates the raw outputs from both agents and returns them as the final result.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: C</strong></p>\n<p><strong>Why C:</strong> In a coordinator–subagent architecture, the coordinator forwards both result sets to the synthesis agent for centralized integration, preserving control and ensuring high-quality merging.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 3 (Scenario: Multi-agent Research System)</div>\n<p><strong>Situation:</strong> A document analysis subagent frequently fails when processing PDF files: some have corrupted sections that trigger parsing exceptions, others are password-protected, and sometimes the parsing library hangs on large files. Currently, any exception immediately terminates the subagent and returns an error to the coordinator, which must decide whether to retry, skip, or fail the whole task. This causes excessive coordinator involvement in routine error handling. What architectural improvement is most effective?</p>\n<p><strong>Which improvement is most effective?</strong></p>\n<ul>\n<li>A) Create a dedicated error-handling agent that monitors all failures via a shared queue and decides recovery actions, sending restart commands directly to subagents.</li>\n<li>B) Configure the subagent to always return partial results with a success status, embedding error details in metadata; the coordinator treats all responses as successful.</li>\n<li>C) Make the coordinator validate all documents before sending them to the subagent, rejecting documents that might cause failures.</li>\n<li>D) Implement local recovery in the subagent for transient failures and escalate to the coordinator only errors it cannot resolve, including attempted steps and partial results.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: D</strong></p>\n<p><strong>Why D:</strong> Handle errors at the lowest level capable of resolving them. Local recovery reduces coordinator workload while still escalating truly unrecoverable issues with full context and partial progress.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 4 (Scenario: Multi-agent Research System)</div>\n<p><strong>Situation:</strong> After running the system on “AI impact on creative industries,” you observe that every subagent completes successfully: the web-search agent finds relevant articles, the document analysis agent summarizes them correctly, and the synthesis agent produces coherent text. However, final reports cover only visual art and completely miss music, literature, and film. In the coordinator logs, you see it decomposed the topic into three subtasks: “AI in digital art,” “AI in graphic design,” and “AI in photography.” What is the most likely root cause?</p>\n<p><strong>What is the most likely root cause?</strong></p>\n<ul>\n<li>A) The synthesis agent lacks instructions to detect coverage gaps.</li>\n<li>B) The document analysis agent filters out non-visual sources due to overly strict relevance criteria.</li>\n<li>C) The coordinator’s task decomposition is too narrow, assigning subagents work that does not cover all relevant areas.</li>\n<li>D) The web-search agent’s queries are insufficient and should be broadened to cover more sectors.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: C</strong></p>\n<p><strong>Why C:</strong> The coordinator decomposed a broad topic only into visual-art subtasks, missing music, literature, and film entirely. Since subagents executed their assignments correctly, the narrow decomposition is the obvious root cause.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 5 (Scenario: Multi-agent Research System)</div>\n<p><strong>Situation:</strong> The web-search subagent returns results for only 3 of 5 requested source categories (competitor sites and industry reports succeed, but news archives and social feeds time out). The document analysis subagent successfully processes all provided documents. The synthesis subagent must produce a summary from mixed-quality upstream inputs. Which error-propagation strategy is most effective?</p>\n<p><strong>Which error-propagation strategy is most effective?</strong></p>\n<ul>\n<li>A) Continue synthesis using only successful sources and produce an output without mentioning which data was unavailable.</li>\n<li>B) The synthesis subagent returns an error to the coordinator, triggering a full retry or task failure due to incomplete data.</li>\n<li>C) The synthesis subagent asks the coordinator to retry timed-out sources with a longer timeout before starting synthesis.</li>\n<li>D) Structure the synthesis output with coverage annotations that indicate which conclusions are well-supported and where gaps exist due to unavailable sources.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: D</strong></p>\n<p><strong>Why D:</strong> Coverage annotations implement graceful degradation with transparency, preserving value from completed work while propagating uncertainty to enable informed decisions about confidence.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 6 (Scenario: Multi-agent Research System)</div>\n<p><strong>Situation:</strong> The document analysis subagent encounters a corrupted PDF file that it cannot parse. When designing the system’s error handling, what is the most effective way to handle this failure?</p>\n<p><strong>Which approach is most effective?</strong></p>\n<ul>\n<li>A) Return an error with context to the coordinator agent, allowing it to decide how to proceed.</li>\n<li>B) Silently skip the corrupted document and continue processing the remaining files to avoid interrupting the workflow.</li>\n<li>C) Automatically retry parsing the document three times with exponential backoff before reporting a failure.</li>\n<li>D) Throw an exception that terminates the entire research workflow.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> Returning an error with context to the coordinator is the most effective approach because it lets the coordinator make an informed decision—skip the file, try an alternative parsing method, or notify the user—while maintaining visibility into the failure.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 7 (Scenario: Multi-agent Research System)</div>\n<p><strong>Situation:</strong> Production logs show a persistent pattern: requests like “analyze the uploaded quarterly report” are routed to the web-search agent 45% of the time instead of the document analysis agent. Reviewing tool definitions, you find that the web-search agent has a tool <code>analyze_content</code> described as “analyzes content and extracts key information,” while the document analysis agent has a tool <code>analyze_document</code> described as “analyzes documents and extracts key information.” How should you fix the misrouting problem?</p>\n<p><strong>How should you fix the misrouting problem?</strong></p>\n<ul>\n<li>A) Add a pre-routing classifier that detects whether the user refers to uploaded files or web content before the coordinator decides on delegation.</li>\n<li>B) Rename the web-search tool to <code>extract_web_results</code> and update its description to “processes and returns information retrieved from web search and URLs.”</li>\n<li>C) Add few-shot examples to the coordinator prompt showing correct routing: “User uploads a quarterly report → document analysis agent” and “User asks about a web page → web-search agent.”</li>\n<li>D) Expand the document analysis tool description with usage examples like “Use for uploaded PDFs, Word docs, and spreadsheets,” leaving the web-search tool unchanged.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: B</strong></p>\n<p><strong>Why B:</strong> Renaming the web-search tool to <code>extract_web_results</code> and updating its description to explicitly reference web search and URLs directly removes the root cause by eliminating semantic overlap between the two tool names and descriptions. This makes each tool’s purpose unambiguous, enabling the coordinator to reliably distinguish document analysis from web search.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 8 (Scenario: Multi-agent Research System)</div>\n<p><strong>Situation:</strong> A colleague proposes that the document analysis agent should send its results directly to the synthesis agent, bypassing the coordinator. What is the main advantage of keeping the coordinator as the central hub for all communication between subagents?</p>\n<p><strong>What is the main advantage of keeping the coordinator as the central hub?</strong></p>\n<ul>\n<li>A) The coordinator can observe all interactions, handle errors uniformly, and decide what information each subagent should receive.</li>\n<li>B) The coordinator batches multiple requests to subagents, reducing total API calls and overall latency.</li>\n<li>C) Routing through the coordinator enables automatic retry logic that direct inter-agent calls cannot support.</li>\n<li>D) Subagents use isolated memory, and direct communication would require complex serialization that only the coordinator can perform.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> The coordinator pattern provides centralized visibility into all interactions, uniform error handling across the system, and fine-grained control over what information each subagent receives—these are the primary advantages of a star-shaped communication topology.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 9 (Scenario: Multi-agent Research System)</div>\n<p><strong>Situation:</strong> The web-search subagent times out while researching a complex topic. You need to design how information about this failure is returned to the coordinator. Which error-propagation approach best enables intelligent recovery?</p>\n<p><strong>Which error-propagation approach best enables intelligent recovery?</strong></p>\n<ul>\n<li>A) Return structured error context to the coordinator including the failure type, the query executed, any partial results, and potential alternative approaches.</li>\n<li>B) Catch the timeout within the subagent and return an empty result set marked as successful.</li>\n<li>C) Implement automatic exponential-backoff retries inside the subagent, only returning a generic “search unavailable” status after exhausting retries.</li>\n<li>D) Propagate the timeout exception directly to the top-level handler, terminating the entire research workflow.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> Returning structured error context—including failure type, executed query, partial results, and alternative approaches—gives the coordinator everything needed to make intelligent recovery decisions (e.g., retry with a modified query or continue with partial results). It preserves maximum context for informed coordination-level decision-making.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 10 (Scenario: Multi-agent Research System)</div>\n<p><strong>Situation:</strong> In your system design, you gave the document analysis agent access to a general-purpose tool <code>fetch_url</code> so it could download documents by URL. Production logs show this agent now frequently downloads search engine results pages to perform ad hoc web search—behavior that should be routed through the web-search agent—causing inconsistent results. Which fix is most effective?</p>\n<p><strong>Which fix is most effective?</strong></p>\n<ul>\n<li>A) Replace <code>fetch_url</code> with a <code>load_document</code> tool that validates that URLs point to document formats.</li>\n<li>B) Remove <code>fetch_url</code> from the document analysis agent and route all URL fetching through the coordinator to the web-search agent.</li>\n<li>C) Implement filtering that blocks <code>fetch_url</code> calls to known search engine domains while allowing other URLs.</li>\n<li>D) Add instructions to the document analysis agent prompt that <code>fetch_url</code> should only be used to download document URLs, not to search.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> Replacing a general-purpose tool with a document-specific tool that validates URLs against document formats fixes the root cause by constraining capability at the interface level. This follows the principle of least privilege, making undesired search behavior impossible rather than merely discouraged.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 11 (Scenario: Multi-agent Research System)</div>\n<p><strong>Situation:</strong> While researching a broad topic, you observe that the web-search agent and the document analysis agent investigate the same subtopics, leading to substantial duplication in their outputs. Token usage nearly doubles without a proportional increase in research breadth or depth. What is the most effective way to address this?</p>\n<p><strong>What is the most effective way to address this?</strong></p>\n<ul>\n<li>A) Allow both agents to finish in parallel, then have the coordinator deduplicate overlapping results before passing them to the synthesis agent.</li>\n<li>B) The coordinator explicitly partitions the research space before delegating, assigning each agent distinct subtopics or source types.</li>\n<li>C) Implement a shared-state mechanism where agents log their current focus area so other agents can dynamically avoid duplication during execution.</li>\n<li>D) Switch to sequential execution where document analysis runs only after web search completes, using web-search results as context to avoid duplication.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: B</strong></p>\n<p><strong>Why B:</strong> Having the coordinator explicitly partition the research space before delegating is most effective because it addresses the root cause—unclear task boundaries—before any work begins. It preserves parallelism while preventing duplicated effort and wasted tokens.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 12 (Scenario: Multi-agent Research System)</div>\n<p><strong>Situation:</strong> During research, the web-search subagent queries three source categories with different outcomes: academic databases return 15 relevant papers, industry reports return “0 results,” and patent databases return “Connection timeout.” When designing error propagation to the coordinator, which approach enables the best recovery decisions?</p>\n<p><strong>Which approach enables the best recovery decisions?</strong></p>\n<ul>\n<li>A) Aggregate the results into a single success-percentage metric (e.g., “67% source coverage”) with detailed logs available on demand.</li>\n<li>B) Report both “timeout” and “0 results” as failures requiring coordinator intervention.</li>\n<li>C) Retry transient failures internally and report only persistent errors.</li>\n<li>D) Distinguish access failures (timeout) that require a retry decision from valid empty results (“0 results”) that represent successful queries.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: D</strong></p>\n<p><strong>Why D:</strong> A timeout (access failure) and “0 results” (valid empty result) are semantically different outcomes requiring different responses. Distinguishing them allows the coordinator to retry the patent database while accepting the industry reports “0 results” as a valid, informative finding.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 13 (Scenario: Multi-agent Research System)</div>\n<p><strong>Situation:</strong> Production monitoring shows inconsistent synthesis quality. When aggregated results are ~75K tokens, the synthesis agent reliably cites information from the first 15K tokens (web-search headlines/snippets) and the last 10K tokens (document analysis conclusions), but often misses critical findings in the middle 50K tokens—even when they directly answer the research question. How should you restructure the aggregated input?</p>\n<p><strong>How should you restructure the aggregated input?</strong></p>\n<ul>\n<li>A) Summarize all subagent outputs to under 20K tokens before aggregation to keep content within the model’s reliable processing range.</li>\n<li>B) Stream subagent results to the synthesis agent incrementally, processing web-search results first to completion, then adding document analysis results.</li>\n<li>C) Place a key-findings summary at the start of the aggregated input and organize detailed results with explicit section headings for easier navigation.</li>\n<li>D) Implement rotation that alternates which subagent’s results appear first across research tasks to ensure both sources get equal top positioning over time.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: C</strong></p>\n<p><strong>Why C:</strong> Putting a key-findings summary at the start leverages primacy effects so critical information sits in the most reliably processed position. Adding explicit section headings throughout helps the model navigate and attend to mid-input content, directly mitigating the “lost in the middle” phenomenon.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 14 (Scenario: Multi-agent Research System)</div>\n<p><strong>Situation:</strong> In testing, the combined output of the web-search agent (85K tokens including page content) and the document analysis agent (70K tokens including chains of thought) totals 155K tokens, but the synthesis agent performs best with inputs under 50K tokens. Which solution is most effective?</p>\n<p><strong>Which solution is most effective?</strong></p>\n<ul>\n<li>A) Modify upstream agents to return structured data (key facts, quotes, relevance scores) instead of verbose content and reasoning.</li>\n<li>B) Add an intermediate summarization agent that condenses findings before passing them to synthesis.</li>\n<li>C) Have the synthesis agent process findings in sequential batches, maintaining state between calls.</li>\n<li>D) Store findings in a vector database and give the synthesis agent search tools to query during its work.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> Modifying upstream agents to return structured data fixes the root cause by reducing token volume at the source while preserving essential information. It avoids passing bulky page content and reasoning traces that inflate tokens without improving the synthesis step.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 15 (Scenario: Multi-agent Research System)</div>\n<p><strong>Situation:</strong> In testing, you observe that the synthesis agent often needs to verify specific claims while merging results. Currently, when verification is needed, the synthesis agent returns control to the coordinator, which calls the web-search agent and then re-invokes synthesis with the results. This adds 2–3 extra loops per task and increases latency by 40%. Your assessment shows 85% of these verifications are simple fact checks (dates, names, stats) and 15% require deeper research. Which approach most effectively reduces overhead while preserving system reliability?</p>\n<p><strong>Which approach is most effective?</strong></p>\n<ul>\n<li>A) Give the synthesis agent access to all web-search tools so it can handle any verification need directly without coordinator loops.</li>\n<li>B) Have the synthesis agent accumulate all verification needs and return them as a batch to the coordinator at the end, which then sends them all to the web-search agent at once.</li>\n<li>C) Have the web-search agent proactively cache extra context around each source during initial research in anticipation of synthesis needing verification.</li>\n<li>D) Give the synthesis agent a limited-scope <code>verify_fact</code> tool for simple checks, while routing complex verifications through the coordinator to the web-search agent.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: D</strong></p>\n<p><strong>Why D:</strong> A limited-scope fact-verification tool lets the synthesis agent handle 85% of simple checks directly, eliminating most loops, while preserving the coordinator delegation path for the 15% of complex verifications. This applies least privilege while significantly reducing latency.</p></div></div>", "concepts": [], "keywords": "Practice Test Scenario: Multi-agent Research System Question 1 (Scenario: Multi-agent Research System) Question 2 (Scenario: Multi-agent Research System) Question 3 (Scenario: Multi-agent Research System) Question 4 (Scenario: Multi-agent Research System) Question 5 (Scenario: Multi-agent Research System) Question 6 (Scenario: Multi-agent Research System) Question 7 (Scenario: Multi-agent Research System) Question 8 (Scenario: Multi-agent Research System) Question 9 (Scenario: Multi-agent Research System) Question 10 (Scenario: Multi-agent Research System) Question 11 (Scenario: Multi-agent Research System) Question 12 (Scenario: Multi-agent Research System) Question 13 (Scenario: Multi-agent Research System) Question 14 (Scenario: Multi-agent Research System) Question 15 (Scenario: Multi-agent Research System)"}, {"id": "pt-ci", "group": "Assessment", "title": "Practice · Claude Code for CI (Q16–30)", "short": "PT 16–30", "num": "", "html": "<button class=\"btn\" id=\"revealAll\" style=\"margin:6px 0 14px\">Reveal all answers</button><h2 id=\"s-scenario-claude-code-for-continuous-integration\">Scenario: Claude Code for Continuous Integration</h2>\n<hr />\n<div class=\"qz\"><div class=\"qh\">Question 16 (Scenario: Claude Code for Continuous Integration)</div>\n<p><strong>Situation:</strong> Your CI pipeline runs the Claude Code CLI (in <code>--print</code> mode) using CLAUDE.md to provide project context for code review, and developers generally find the reviews substantive. However, they report that integrating findings into the workflow is difficult—Claude outputs narrative paragraphs that must be manually copied into PR comments. The team wants to automatically post each finding as a separate inline PR comment at the relevant place in code, which requires structured data with file path, line number, severity level, and suggested fix. Which approach is most effective?</p>\n<p><strong>Which approach is most effective?</strong></p>\n<ul>\n<li>A) Add an “Output Format for Review” section to CLAUDE.md with examples of structured findings so Claude learns the expected format from project context.</li>\n<li>B) Use the CLI flags <code>--output-format json</code> and <code>--json-schema</code> to enforce structured findings, then parse the output to post inline comments via the GitHub API.</li>\n<li>C) Include explicit formatting instructions in the review prompt requiring each finding to follow a parseable template like <code>[FILE:path] [LINE:n] [SEVERITY:level] ...</code>.</li>\n<li>D) Keep narrative review format but add a summarization step that uses Claude to generate a structured JSON summary of findings.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: B</strong></p>\n<p><strong>Why B:</strong> Using <code>--output-format json</code> with <code>--json-schema</code> enforces structured output at the CLI level, guaranteeing well-formed JSON with the required fields (file path, line number, severity, suggested fix) that can be reliably parsed and posted as inline PR comments via the GitHub API. It leverages built-in CLI capabilities designed specifically for structured output.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 17 (Scenario: Claude Code for Continuous Integration)</div>\n<p><strong>Situation:</strong> Your team uses Claude Code for generating code suggestions, but you notice a pattern: non-obvious issues—performance optimizations that break edge cases, cleanups that unexpectedly change behavior—are only caught when another team member reviews the PR. Claude’s reasoning during generation shows it considered these cases but concluded its approach was correct. Which approach directly addresses the root cause of this self-check limitation?</p>\n<p><strong>Which approach directly addresses the root cause?</strong></p>\n<ul>\n<li>A) Run a second independent instance of Claude Code to review the changes without access to the generator’s reasoning.</li>\n<li>B) Enable extended thinking mode for the generation stage to allow more thorough deliberation before producing suggestions.</li>\n<li>C) Add explicit self-review instructions to the generation prompt asking Claude to critique its own suggestions before finalizing output.</li>\n<li>D) Include full test files and documentation in prompt context so Claude better understands expected behavior during generation.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> A second independent Claude Code instance without access to the generator’s reasoning directly addresses the root cause by avoiding confirmation bias. This “fresh eyes” perspective mirrors human peer review, where another reviewer catches issues the author rationalized.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 18 (Scenario: Claude Code for Continuous Integration)</div>\n<p><strong>Situation:</strong> Your code review component is iterative: Claude analyzes the changed file, then may request related files (imports, base classes, tests) via tool calls to understand context before providing final feedback. Your application defines a tool that lets Claude request file contents; Claude calls the tool, gets results, and continues analysis. You’re evaluating batch processing to reduce API cost. What is the primary technical limitation when considering batch processing for this workflow?</p>\n<p><strong>What is the primary technical limitation?</strong></p>\n<ul>\n<li>A) Batch processing does not include correlation IDs to map outputs back to input requests.</li>\n<li>B) The asynchronous model cannot execute tools mid-request and return results for Claude to continue analysis.</li>\n<li>C) The Batch API does not support tool definitions in request parameters.</li>\n<li>D) The batch processing latency of up to 24 hours is too slow for pull request feedback, although the workflow would otherwise function.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: B</strong></p>\n<p><strong>Why B:</strong> A “fire-and-forget” asynchronous Batch API model has no mechanism to intercept a tool call during a request, execute the tool, and return results for Claude to continue analysis. This is fundamentally incompatible with iterative tool-calling workflows that require multiple tool request/response rounds within a single logical interaction.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 19 (Scenario: Claude Code for Continuous Integration)</div>\n<p><strong>Situation:</strong> Your CI/CD system runs three Claude-based analyses: (1) fast style checks on every PR that block merging until completion, (2) comprehensive weekly security audits of the entire codebase, and (3) nightly test-case generation for recently changed modules. The Message Batches API offers 50% savings but processing can take up to 24 hours. You want to optimize API cost while maintaining an acceptable developer experience. Which combination correctly matches each task to an API approach?</p>\n<p><strong>Which combination is correct?</strong></p>\n<ul>\n<li>A) Use the Message Batches API for all three tasks to maximize 50% savings, configuring the pipeline to poll for batch completion.</li>\n<li>B) Use synchronous calls for PR style checks; use the Message Batches API for weekly security audits and nightly test generation.</li>\n<li>C) Use synchronous calls for all three tasks for consistent response times, relying on prompt caching to reduce costs across workloads.</li>\n<li>D) Use synchronous calls for PR style checks and nightly test generation; use the Message Batches API only for weekly security audits.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: B</strong></p>\n<p><strong>Why B:</strong> PR style checks block developers and require immediate responses via synchronous calls, while weekly security audits and nightly test generation are scheduled tasks with flexible deadlines that can tolerate up to a 24-hour batch window—capturing 50% savings for both.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 20 (Scenario: Claude Code for Continuous Integration)</div>\n<p><strong>Situation:</strong> Your automated reviews find real issues, but developers report the feedback is not actionable. Findings include phrases like “complex ticket routing logic” or “potential null pointer” without specifying what exactly to change. When you add detailed instructions like “always include concrete fix suggestions,” the model still produces inconsistent output—sometimes detailed, sometimes vague. Which prompting technique most reliably produces consistently actionable feedback?</p>\n<p><strong>Which prompting technique is most reliable?</strong></p>\n<ul>\n<li>A) Further refine instructions with more explicit requirements for each part of the feedback format (location, issue, severity, proposed fix).</li>\n<li>B) Expand the context window to include more surrounding codebase so the model has enough information to propose concrete fixes.</li>\n<li>C) Implement a two-pass approach where one prompt identifies issues and a second generates fixes, allowing specialization.</li>\n<li>D) Add 3–4 few-shot examples showing the exact required format: identified issue, location in code, concrete fix suggestion.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: D</strong></p>\n<p><strong>Why D:</strong> Few-shot examples are the most effective technique for achieving consistent output format when instructions alone produce variable results. Providing 3–4 examples that show the exact desired structure (issue, location, concrete fix) gives the model a concrete pattern to follow, which is more reliable than abstract instructions.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 21 (Scenario: Claude Code for Continuous Integration)</div>\n<p><strong>Situation:</strong> Your CI pipeline includes two Claude-based code review modes: a pre-merge-commit hook that blocks PR merge until completion, and a “deep analysis” that runs overnight, polls for batch completion, and posts detailed suggestions to the PR. You want to reduce API cost using the Message Batches API, which offers 50% savings but requires polling and can take up to 24 hours. Which mode should use batch processing?</p>\n<p><strong>Which mode should use batch processing?</strong></p>\n<ul>\n<li>A) Only the pre-merge-commit hook.</li>\n<li>B) Only the deep analysis.</li>\n<li>C) Both modes.</li>\n<li>D) Neither mode.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: B</strong></p>\n<p><strong>Why B:</strong> Deep analysis is an ideal candidate for batch processing because it already runs overnight, tolerates delay, and uses a polling model before publishing results—matching the asynchronous, polling-based architecture of the Message Batches API while capturing 50% savings.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 22 (Scenario: Claude Code for Continuous Integration)</div>\n<p><strong>Situation:</strong> Your automated review analyzes comments and docstrings. The current prompt instructs Claude to “check that comments are accurate and up to date.” Findings often flag acceptable patterns (TODO markers, simple descriptions) while missing comments describing behavior the code no longer implements. What change addresses the root cause of this inconsistent analysis?</p>\n<p><strong>What change addresses the root cause?</strong></p>\n<ul>\n<li>A) Include <code>git blame</code> data so Claude can identify comments that predate recent code changes.</li>\n<li>B) Add few-shot examples of misleading comments to help the model recognize similar patterns in the codebase.</li>\n<li>C) Filter TODO, FIXME, and descriptive comment patterns before analysis to reduce noise.</li>\n<li>D) Specify explicit criteria: flag comments only when the behavior they claim contradicts the code’s actual behavior.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: D</strong></p>\n<p><strong>Why D:</strong> Explicit criteria—flagging comments only when claimed behavior contradicts actual code behavior—directly addresses the root cause by replacing a vague instruction with a precise definition of what constitutes a problem. This reduces false positives on acceptable patterns and misses of truly misleading comments.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 23 (Scenario: Claude Code for Continuous Integration)</div>\n<p><strong>Situation:</strong> Your automated code review system shows inconsistent severity ratings—similar issues like null pointer risks are rated “critical” in some PRs but only “medium” in others. Developer surveys show growing distrust—many start dismissing findings without reading because “half are wrong.” High-false-positive categories erode trust in accurate categories. Which approach best restores developer trust while improving the system?</p>\n<p><strong>Which approach best restores developer trust?</strong></p>\n<ul>\n<li>A) Temporarily disable high-false-positive categories (style, naming, documentation) and keep only high-precision categories while improving prompts.</li>\n<li>B) Keep all categories enabled but display confidence scores with each finding so developers can decide what to investigate.</li>\n<li>C) Keep all categories enabled and add few-shot examples to improve accuracy for each category over the next few weeks.</li>\n<li>D) Apply a uniform strictness reduction across all categories to bring the overall false-positive rate down.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> Temporarily disabling high-false-positive categories immediately stops trust erosion by removing noisy findings that cause developers to dismiss everything, while preserving value from high-precision categories like security and correctness. It also creates space to improve prompts for problematic categories before re-enabling them.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 24 (Scenario: Claude Code for Continuous Integration)</div>\n<p><strong>Situation:</strong> Your automated review generates test-case suggestions for each PR. Reviewing a PR that adds course completion tracking, Claude suggests 10 test cases, but developer feedback shows that 6 duplicate scenarios already covered by the existing test suite. What change most effectively reduces duplicate suggestions?</p>\n<p><strong>What change is most effective?</strong></p>\n<ul>\n<li>A) Include the existing test file in context so Claude can determine what scenarios are already covered.</li>\n<li>B) Reduce the requested number of suggestions from 10 to 5, assuming Claude prioritizes the most valuable cases first.</li>\n<li>C) Add instructions directing Claude to focus exclusively on edge cases and error conditions rather than success paths.</li>\n<li>D) Implement post-processing that filters suggestions whose descriptions match existing test names via keyword overlap.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> Including the existing test file fixes the root cause of duplication: Claude can only avoid suggesting already-covered scenarios if it knows what tests already exist. This gives Claude the information needed to propose genuinely new, valuable tests.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 25 (Scenario: Claude Code for Continuous Integration)</div>\n<p><strong>Situation:</strong> After an initial automated review identifies 12 findings, a developer pushes new commits to address issues. Re-running review produces 8 findings, but developers report that 5 duplicate previous comments on code that was already fixed in the new commits. What is the most effective way to eliminate this redundant feedback while maintaining thoroughness?</p>\n<p><strong>What is the most effective way to eliminate redundant feedback?</strong></p>\n<ul>\n<li>A) Run review only when the PR is created and in the final pre-merge state, skipping intermediate commits.</li>\n<li>B) Add a post-processing filter that removes findings that match previous ones by file paths and issue descriptions before posting comments.</li>\n<li>C) Restrict review scope to files changed in the most recent push, excluding files from earlier commits.</li>\n<li>D) Include previous review findings in context and instruct Claude to report only new or still-unresolved issues.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: D</strong></p>\n<p><strong>Why D:</strong> Including prior review findings in context lets Claude distinguish new problems from those already addressed in recent commits. This preserves review thoroughness while using Claude’s reasoning to avoid redundant feedback on fixed code.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 26 (Scenario: Claude Code for Continuous Integration)</div>\n<p><strong>Situation:</strong> Your pipeline script runs <code>claude \"Analyze this pull request for security issues\"</code>, but the job hangs indefinitely. Logs show Claude Code is waiting for interactive input. What is the correct approach to run Claude Code in an automated pipeline?</p>\n<p><strong>What is the correct approach?</strong></p>\n<ul>\n<li>A) Add a <code>--batch</code> flag: <code>claude --batch \"Analyze this pull request for security issues\"</code>.</li>\n<li>B) Add the <code>-p</code> flag: <code>claude -p \"Analyze this pull request for security issues\"</code>.</li>\n<li>C) Redirect stdin from <code>/dev/null</code>: <code>claude \"Analyze this pull request for security issues\" &lt; /dev/null</code>.</li>\n<li>D) Set the environment variable <code>CLAUDE_HEADLESS=true</code> before running the command.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: B</strong></p>\n<p><strong>Why B:</strong> The <code>-p</code> (or <code>--print</code>) flag is the documented way to run Claude Code non-interactively. It processes the prompt, prints the result to stdout, and exits without waiting for user input—ideal for CI/CD pipelines.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 27 (Scenario: Claude Code for Continuous Integration)</div>\n<p><strong>Situation:</strong> A pull request changes 14 files in an inventory tracking module. A single-pass review that analyzes all files together produces inconsistent results: detailed feedback on some files but shallow comments on others, missed obvious bugs, and contradictory feedback (a pattern is flagged in one file but identical code is approved in another file in the same PR). How should you restructure the review?</p>\n<p><strong>How should you restructure the review?</strong></p>\n<ul>\n<li>A) Run three independent full-PR review passes and flag only issues that appear in at least two of the three runs.</li>\n<li>B) Split into focused passes: review each file individually for local issues, then run a separate integration-oriented pass to examine cross-file data flows.</li>\n<li>C) Require developers to split large PRs into smaller submissions of 3–4 files before running automated review.</li>\n<li>D) Switch to a larger model with a bigger context window so it can pay sufficient attention to all 14 files in one pass.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: B</strong></p>\n<p><strong>Why B:</strong> Focused per-file passes address the root cause—attention dilution—by ensuring consistent depth and reliable local issue detection. A separate integration-oriented pass then covers cross-file concerns such as dependency and data-flow interactions.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 28 (Scenario: Claude Code for Continuous Integration)</div>\n<p><strong>Situation:</strong> Your automated code review averages 15 findings per pull request, and developers report a 40% false-positive rate. The bottleneck is investigation time: developers must click into each finding to read Claude’s rationale before deciding whether to fix or dismiss it. Your CLAUDE.md already contains comprehensive rules for acceptable patterns, and stakeholders rejected any approach that filters findings before developers see them. What change best addresses investigation time?</p>\n<p><strong>What change best addresses investigation time?</strong></p>\n<ul>\n<li>A) Require Claude to include its rationale and confidence estimate directly in each finding.</li>\n<li>B) Add a post-processor that analyzes finding patterns and automatically suppresses those that match historical false-positive signatures.</li>\n<li>C) Categorize findings as “blocking issues” vs “suggestions,” with different review requirements by level.</li>\n<li>D) Configure Claude to show only high-confidence findings, filtering uncertain flags before developers see them.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> Including rationale and confidence directly in each finding reduces investigation time by letting developers quickly triage without opening each finding. It satisfies the “no filtering” constraint because all findings remain visible while accelerating developer decision-making.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 29 (Scenario: Claude Code for Continuous Integration)</div>\n<p><strong>Situation:</strong> Analysis of your automated code review shows large differences in false-positive rates by finding category: security/correctness findings have 8% false positives, performance findings 18%, style/naming findings 52%, and documentation findings 48%. Developer surveys show growing distrust—many start dismissing findings without reading because “half are wrong.” High-false-positive categories erode trust in accurate categories. Which approach best restores developer trust while improving the system?</p>\n<p><strong>Which approach best restores developer trust?</strong></p>\n<ul>\n<li>A) Temporarily disable high-false-positive categories (style, naming, documentation) and keep only high-precision categories while improving prompts.</li>\n<li>B) Keep all categories enabled but display confidence scores with each finding so developers can decide what to investigate.</li>\n<li>C) Keep all categories enabled and add few-shot examples to improve accuracy for each category over the next few weeks.</li>\n<li>D) Apply a uniform strictness reduction across all categories to bring the overall false-positive rate down.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> Temporarily disabling high-false-positive categories immediately stops trust erosion by removing noisy findings that cause developers to dismiss everything, while preserving value from high-precision categories like security and correctness. It also creates space to improve prompts for problematic categories before re-enabling them.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 30 (Scenario: Claude Code for Continuous Integration)</div>\n<p><strong>Situation:</strong> Your team wants to reduce API costs for automated analysis. Currently, synchronous Claude calls support two workflows: (1) a blocking pre-merge check that must complete before developers can merge, and (2) a technical debt report generated overnight for review the next morning. Your manager proposes moving both to the Message Batches API to save 50%. How should you evaluate this proposal?</p>\n<p><strong>How should you evaluate this proposal?</strong></p>\n<ul>\n<li>A) Move both to batch processing with fallback to synchronous calls if batches take too long.</li>\n<li>B) Move both workflows to batch processing with status polling to verify completion.</li>\n<li>C) Use batch processing only for technical debt reports; keep synchronous calls for pre-merge checks.</li>\n<li>D) Keep synchronous calls for both workflows to avoid issues with batch result ordering.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: C</strong></p>\n<p><strong>Why C:</strong> Message Batches API processing can take up to 24 hours with no latency SLA, which is acceptable for overnight technical debt reports but unacceptable for blocking pre-merge checks where developers wait. This matches each workflow to the right API based on latency requirements.</p></div></div>", "concepts": [], "keywords": "Scenario: Claude Code for Continuous Integration Question 16 (Scenario: Claude Code for Continuous Integration) Question 17 (Scenario: Claude Code for Continuous Integration) Question 18 (Scenario: Claude Code for Continuous Integration) Question 19 (Scenario: Claude Code for Continuous Integration) Question 20 (Scenario: Claude Code for Continuous Integration) Question 21 (Scenario: Claude Code for Continuous Integration) Question 22 (Scenario: Claude Code for Continuous Integration) Question 23 (Scenario: Claude Code for Continuous Integration) Question 24 (Scenario: Claude Code for Continuous Integration) Question 25 (Scenario: Claude Code for Continuous Integration) Question 26 (Scenario: Claude Code for Continuous Integration) Question 27 (Scenario: Claude Code for Continuous Integration) Question 28 (Scenario: Claude Code for Continuous Integration) Question 29 (Scenario: Claude Code for Continuous Integration) Question 30 (Scenario: Claude Code for Continuous Integration)"}, {"id": "pt-code", "group": "Assessment", "title": "Practice · Code generation (Q31–45)", "short": "PT 31–45", "num": "", "html": "<button class=\"btn\" id=\"revealAll\" style=\"margin:6px 0 14px\">Reveal all answers</button><h2 id=\"s-scenario-code-generation-with-claude-code\">Scenario: Code Generation with Claude Code</h2>\n<hr />\n<div class=\"qz\"><div class=\"qh\">Question 31 (Scenario: Code Generation with Claude Code)</div>\n<p><strong>Situation:</strong> You asked Claude Code to implement a function that transforms API responses into an internal normalized format. After two iterations, the output structure still doesn’t match expectations—some fields are nested differently and timestamps are formatted incorrectly. You described requirements in prose, but Claude interprets them differently each time.</p>\n<p><strong>Which approach is most effective for the next iteration?</strong></p>\n<ul>\n<li>A) Write a JSON schema describing the expected output structure and validate Claude’s output against it after each iteration.</li>\n<li>B) Provide 2–3 concrete input-output examples showing the expected transformation for representative API responses.</li>\n<li>C) Rewrite requirements with more technical precision, specifying exact field mappings, nesting rules, and timestamp format strings.</li>\n<li>D) Ask Claude to explain its current understanding of the requirements to identify where interpretations diverge.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: B</strong></p>\n<p><strong>Why B:</strong> Concrete input-output examples remove ambiguity inherent in prose descriptions by showing Claude the exact expected transformation results. This directly addresses the root cause—misinterpretation of textual requirements—by providing unambiguous patterns for field nesting and timestamp formatting.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 32 (Scenario: Code Generation with Claude Code)</div>\n<p><strong>Situation:</strong> You need to add Slack as a new notification channel. The existing codebase has clear, established patterns for email, SMS, and push channels. However, Slack’s API offers fundamentally different integration approaches—incoming webhooks (simple, one-way), bot tokens (support delivery confirmation and programmatic control), or Slack Apps (two-way events, requires workspace approval). Your task says “add Slack support” without specifying integration method or requiring advanced features like delivery tracking.</p>\n<p><strong>How should you approach this task?</strong></p>\n<ul>\n<li>A) Start in direct execution mode using incoming webhooks to match the existing one-way notification pattern.</li>\n<li>B) Switch to planning mode to explore integration options and architectural implications, then present a recommendation before implementation.</li>\n<li>C) Start in direct execution mode by scaffolding a Slack channel class using existing patterns, deferring the integration method decision.</li>\n<li>D) Start in direct execution mode using a bot-token approach to ensure delivery confirmation is possible.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: B</strong></p>\n<p><strong>Why B:</strong> Slack integration has multiple valid approaches with significantly different architectural implications, and requirements are ambiguous. Planning mode lets you evaluate trade-offs among webhooks, bot tokens, and Slack Apps and align on an approach before implementation.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 33 (Scenario: Code Generation with Claude Code)</div>\n<p><strong>Situation:</strong> Your CLAUDE.md file has grown to 400+ lines containing coding standards, testing conventions, a detailed PR review checklist, deployment instructions, and database migration procedures. You want Claude to always follow coding standards and testing conventions, but apply PR review, deploy, and migration guidance only when doing those tasks.</p>\n<p><strong>Which restructuring approach is most effective?</strong></p>\n<ul>\n<li>A) Move all guidance into separate Skills files organized by workflow type, leaving only a brief project description in CLAUDE.md.</li>\n<li>B) Keep everything in CLAUDE.md but use <code>@import</code> syntax to organize into separately maintained files by category.</li>\n<li>C) Split CLAUDE.md into files under <code>.claude/rules/</code> with path-bound glob patterns so each rule loads only for the relevant file types.</li>\n<li>D) Keep universal standards in CLAUDE.md and create Skills for workflow-specific guidance (PR review, deploy, migrations) with trigger keywords.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: D</strong></p>\n<p><strong>Why D:</strong> CLAUDE.md content loads in every session, ensuring coding standards and testing conventions always apply, while Skills are invoked on demand when Claude detects trigger keywords—ideal for workflow-specific guidance like PR review, deployment, and migrations.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 34 (Scenario: Code Generation with Claude Code)</div>\n<p><strong>Situation:</strong> You’re tasked with restructuring your team’s monolithic application into microservices. This impacts changes across dozens of files and requires decisions about service boundaries and module dependencies.</p>\n<p><strong>Which approach should you choose?</strong></p>\n<ul>\n<li>A) Switch to planning mode to explore the codebase, understand dependencies, and design the implementation approach before making changes.</li>\n<li>B) Start in direct execution mode and switch to planning only after encountering unexpected complexity during implementation.</li>\n<li>C) Start in direct execution mode and make incremental changes, letting implementation reveal natural service boundaries.</li>\n<li>D) Use direct execution with detailed upfront instructions that specify each service structure.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> Planning mode is the right strategy for complex architectural restructuring like splitting a monolith: it allows safe exploration and informed decisions about boundaries before committing to potentially expensive changes across many files.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 35 (Scenario: Code Generation with Claude Code)</div>\n<p><strong>Situation:</strong> Your team created a <code>/analyze-codebase</code> skill that performs deep code analysis—dependency scanning, test coverage counts, and code quality metrics. After running the command, team members report Claude becomes less responsive in the session and loses the context of the original task.</p>\n<p><strong>How do you most effectively fix this while keeping full analysis capabilities?</strong></p>\n<ul>\n<li>A) Add <code>context: fork</code> in the skill frontmatter to run the analysis in an isolated subagent context.</li>\n<li>B) Add <code>model: haiku</code> in frontmatter to use a faster, cheaper model for analysis.</li>\n<li>C) Split the skill into three smaller skills, each producing less output.</li>\n<li>D) Add instructions to the skill to compress all results into a short summary before displaying them.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> <code>context: fork</code> runs the analysis in an isolated subagent context so the large output does not pollute the main session’s context window and Claude does not lose track of the original task. It preserves full analysis capability while keeping the main session responsive.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 36 (Scenario: Code Generation with Claude Code)</div>\n<p><strong>Situation:</strong> Your team uses a <code>/commit</code> skill in <code>.claude/skills/commit/SKILL.md</code>. A developer wants to customize it for their personal workflow (different commit message format, extra checks) without affecting teammates.</p>\n<p><strong>What do you recommend?</strong></p>\n<ul>\n<li>A) Create a personal version under <code>~/.claude/skills/</code> with a different name, e.g., <code>/my-commit</code>.</li>\n<li>B) Add conditional logic based on username in the project skill frontmatter.</li>\n<li>C) Create a personal version at <code>~/.claude/skills/commit/SKILL.md</code> with the same name.</li>\n<li>D) Set <code>override: true</code> in the personal skill frontmatter to prioritize it over the project version.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: C</strong></p>\n<p><strong>Why C:</strong> Personal skills take precedence over project skills with the same name. A personal skill at <code>~/.claude/skills/commit/SKILL.md</code> will override the team’s project skill, allowing the developer to customize their workflow while maintaining the familiar <code>/commit</code> command name for their personal use. This approach is better than option A because it preserves the original command name, improving the developer’s workflow without affecting teammates.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 37 (Scenario: Code Generation with Claude Code)</div>\n<p><strong>Situation:</strong> Your team has used Claude Code for months. Recently, three developers report Claude follows the guidance “always include comprehensive error handling,” but a fourth developer who just joined says Claude does not follow it. All four work in the same repo and have up-to-date code.</p>\n<p><strong>What is the most likely cause and fix?</strong></p>\n<ul>\n<li>A) The guidance lives in the original developers’ user-level <code>~/.claude/CLAUDE.md</code> files, not in the project <code>.claude/CLAUDE.md</code>. Move the instruction to the project-level file so all team members receive it.</li>\n<li>B) The new developer’s <code>~/.claude/CLAUDE.md</code> contains conflicting instructions overriding project settings; they should delete the conflicting section.</li>\n<li>C) Claude Code learns per-user preferences over time; the new developer must repeat the requirement until Claude “remembers” it.</li>\n<li>D) Claude Code caches CLAUDE.md after first read; original developers use cached versions. Everyone should clear the Claude Code cache.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> If the guidance was added only to the original developers’ user-level configs and not to the project-level <code>.claude/CLAUDE.md</code>, new team members won’t receive it. Moving it to the project-level configuration ensures all current and future team members automatically get the guidance.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 38 (Scenario: Code Generation with Claude Code)</div>\n<p><strong>Situation:</strong> You find that including 2–3 full endpoint implementation examples as context significantly improves consistency when generating new API endpoints. However, this context is useful only when creating new endpoints—not when debugging, reviewing code, or other work in the API directory.</p>\n<p><strong>Which configuration approach is most effective?</strong></p>\n<ul>\n<li>A) Add endpoint examples and pattern documentation to the project CLAUDE.md so they are always available.</li>\n<li>B) Manually reference endpoint examples in every generation request by copying code into the prompt.</li>\n<li>C) Configure path-specific rules in <code>.claude/rules/api/</code> that include endpoint examples and activate when working in the API directory.</li>\n<li>D) Create a skill that references the endpoint examples and contains pattern-following instructions, invoked on demand via a slash command.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: D</strong></p>\n<p><strong>Why D:</strong> A skill invoked on demand loads the example context only when generating new endpoints, not during unrelated tasks like debugging or review. This keeps the main context clean while preserving high-quality generation when needed.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 39 (Scenario: Code Generation with Claude Code)</div>\n<p><strong>Situation:</strong> Your team created a <code>/migration</code> skill that generates database migration files. It takes the migration name via <code>$ARGUMENTS</code>. In production you observe three issues: (1) developers often run the skill without arguments, causing poorly named files, (2) the skill sometimes uses database schema details from unrelated prior conversations, and (3) a developer accidentally ran destructive test cleanup when the skill had broad tool access.</p>\n<p><strong>Which configuration approach fixes all three problems?</strong></p>\n<ul>\n<li>A) Use positional parameters <code>$1</code> and <code>$2</code> instead of <code>$ARGUMENTS</code> to enforce specific inputs, include explicit schema file references via <code>@</code> syntax for context control, and add a frontmatter description warning about destructive operations.</li>\n<li>B) Add <code>argument-hint</code> in frontmatter to request required parameters, use <code>context: fork</code> to isolate execution, and restrict <code>allowed-tools</code> to file-write operations.</li>\n<li>C) Split into <code>/migration-create</code> and <code>/migration-apply</code> skills, add validation instructions to request migration name if missing, and use different <code>allowed-tools</code> scopes for each.</li>\n<li>D) Add validation instructions in the skill SKILL.md to ensure <code>$ARGUMENTS</code> is a valid name, add prompts to ignore prior conversation context, and list prohibited operations to avoid.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: B</strong></p>\n<p><strong>Why B:</strong> This uses three separate configuration features to address each problem: <code>argument-hint</code> improves argument entry and reduces missing arguments, <code>context: fork</code> prevents context leakage from prior conversations, and <code>allowed-tools</code> constrains the skill to safe file-writing operations, preventing destructive actions.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 40 (Scenario: Code Generation with Claude Code)</div>\n<p><strong>Situation:</strong> Your codebase contains areas with different coding conventions: React components use functional style with hooks, API handlers use async/await with specific error handling, and database models follow the repository pattern. Test files are distributed across the codebase next to the code under test (e.g., <code>Button.test.tsx</code> next to <code>Button.tsx</code>), and you want all tests to follow the same conventions regardless of location.</p>\n<p><strong>What is the most supported way to ensure Claude automatically applies the correct conventions when generating code?</strong></p>\n<ul>\n<li>A) Put all conventions in the root CLAUDE.md under headings for each area and rely on Claude to infer which section applies.</li>\n<li>B) Create skills in <code>.claude/skills/</code> for each code type, embedding conventions in each SKILL.md.</li>\n<li>C) Place a separate CLAUDE.md file in each subdirectory containing conventions for that area.</li>\n<li>D) Create rule files under <code>.claude/rules/</code> with YAML frontmatter specifying glob patterns to conditionally apply conventions based on file paths.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: D</strong></p>\n<p><strong>Why D:</strong> <code>.claude/rules/</code> files with YAML frontmatter and glob patterns (e.g., <code>**/*.test.tsx</code>, <code>src/api/**/*.ts</code>) enable deterministic, path-based convention application regardless of directory structure. This is the most supported approach for cross-cutting patterns like distributed test files.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 41 (Scenario: Code Generation with Claude Code)</div>\n<p><strong>Situation:</strong> You want to create a custom slash command <code>/review</code> that runs your team’s standard code review checklist. It should be available to every developer when they clone or update the repository.</p>\n<p><strong>Where should you create the command file?</strong></p>\n<ul>\n<li>A) In <code>~/.claude/commands/</code> in each developer’s home directory.</li>\n<li>B) In the project repository under <code>.claude/commands/</code>.</li>\n<li>C) In <code>.claude/config.json</code> as an array of commands.</li>\n<li>D) In the root project CLAUDE.md.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: B</strong></p>\n<p><strong>Why B:</strong> Putting custom slash commands under <code>.claude/commands/</code> inside the project repository ensures they are version-controlled and automatically available to every developer who clones or updates the repo. This is the intended location for project-level custom commands in Claude Code.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 42 (Scenario: Code Generation with Claude Code)</div>\n<p><strong>Situation:</strong> Your team’s CLAUDE.md grew beyond 500 lines mixing TypeScript conventions, testing guidance, API patterns, and deployment procedures. Developers find it hard to locate and update the right sections.</p>\n<p><strong>What approach does Claude Code support to organize project-level instructions into focused topical modules?</strong></p>\n<ul>\n<li>A) Define a <code>.claude/config.yaml</code> mapping file patterns to specific sections inside CLAUDE.md.</li>\n<li>B) Create separate Markdown files in <code>.claude/rules/</code>, each covering one topic (e.g., <code>testing.md</code>, <code>api-conventions.md</code>).</li>\n<li>C) Split instructions into README.md files in relevant subdirectories that Claude automatically loads as instructions.</li>\n<li>D) Create multiple files named CLAUDE.md at different levels of the directory tree, each overriding parent instructions.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: B</strong></p>\n<p><strong>Why B:</strong> Claude Code supports a <code>.claude/rules/</code> directory where you can create separate Markdown files for topical guidance (e.g., <code>testing.md</code>, <code>api-conventions.md</code>), allowing teams to organize large instruction sets into focused, maintainable modules.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 43 (Scenario: Code Generation with Claude Code)</div>\n<p><strong>Situation:</strong> You create a custom skill <code>/explore-alternatives</code> that your team uses to brainstorm and evaluate implementation approaches before choosing one. Developers report that after running the skill, subsequent Claude responses are influenced by the alternatives discussion—sometimes referencing rejected approaches or retaining exploration context that interferes with actual implementation.</p>\n<p><strong>How should you most effectively configure this skill?</strong></p>\n<ul>\n<li>A) Use the <code>!</code> prefix in the skill to run exploration logic as a bash subprocess.</li>\n<li>B) Add <code>context: fork</code> in the skill frontmatter.</li>\n<li>C) Split into two skills—<code>/explore-start</code> and <code>/explore-end</code>—to mark boundaries when exploration context should be discarded.</li>\n<li>D) Create the skill in <code>~/.claude/skills/</code> instead of <code>.claude/skills/</code>.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: B</strong></p>\n<p><strong>Why B:</strong> <code>context: fork</code> runs the skill in an isolated subagent context so exploration discussions do not pollute the main conversation history. This prevents rejected approaches and brainstorming context from influencing subsequent implementation work.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 44 (Scenario: Code Generation with Claude Code)</div>\n<p><strong>Situation:</strong> Your team wants to add a GitHub MCP server for searching PRs and checking CI status via Claude Code. Each of six developers has their own personal GitHub access token. You want consistent tooling across the team without committing credentials to version control.</p>\n<p><strong>Which configuration approach is most effective?</strong></p>\n<ul>\n<li>A) Have each developer add the server in user scope via <code>claude mcp add --scope user</code>.</li>\n<li>B) Create an MCP server wrapper that reads tokens from a <code>.env</code> file and proxies GitHub API calls, then add the wrapper to the project <code>.mcp.json</code>.</li>\n<li>C) Add the server to the project <code>.mcp.json</code> using environment variable substitution (<code>${GITHUB_TOKEN}</code>) for auth and document the required environment variable in the project README.</li>\n<li>D) Configure the server in project scope with a placeholder token, then tell developers to override it in their local config.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: C</strong></p>\n<p><strong>Why C:</strong> A project <code>.mcp.json</code> with environment variable substitution is idiomatic: it provides a single version-controlled source of truth for MCP configuration while letting each developer supply credentials via environment variables. Documenting the variable makes onboarding easy without committing secrets.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 45 (Scenario: Code Generation with Claude Code)</div>\n<p><strong>Situation:</strong> You’re adding error-handling wrappers around external API calls across a 120-file codebase. The work has three phases: (1) discover all call sites and patterns, (2) collaboratively design the error-handling approach, and (3) implement wrappers consistently. In Phase 1, Claude generates large output listing hundreds of call sites with context, quickly filling the context window before discovery finishes.</p>\n<p><strong>Which approach is most effective to complete the task while maintaining implementation consistency?</strong></p>\n<ul>\n<li>A) Use an Explore subagent for Phase 1 to isolate verbose discovery output and return a summary, then continue Phases 2–3 in the main conversation.</li>\n<li>B) Do all phases in the main conversation, periodically using <code>/compact</code> to reduce context usage while moving through files.</li>\n<li>C) Switch to headless mode with <code>--continue</code>, passing explicit context summaries between batch calls to maintain continuity.</li>\n<li>D) Define the error-handling pattern in CLAUDE.md, then process files in batches across multiple sessions relying on the shared memory file for consistency.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> An Explore subagent isolates t
