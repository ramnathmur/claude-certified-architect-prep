<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCA-F Study Guide · illustrated</title>
<style>
:root{
  --bg:#fbfaf7; --bg2:#ffffff; --ink:#1c1b22; --ink2:#3d3b48; --ink3:#6e6b7c;
  --line:#e3e0d8; --line2:#cfcbc0;
  --brand:#5b47d6; --brand2:#7c68f0; --brandsoft:#efecff;
  --warn:#b8402a; --warnsoft:#fdeeea; --ok:#2f7a4a;
  --code:#f4f2ec; --radius:14px; --radius-sm:9px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --w-post:#3f6ad8; --w-kitchen:#c2701c; --w-crew:#c0395e; --w-plug:#12857f;
  --w-house:#7442c8; --w-intern:#2f7a4a; --w-laundry:#0f7fa8; --w-road:#a3620f;
  --w-triage:#c22f38; --w-radio:#41567f; --w-pack:#3d7a34; --w-court:#7a3f8f; --w-library:#8a6321;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15141a; --bg2:#1d1c24; --ink:#f0eef5; --ink2:#cfcbd9; --ink3:#9692a5;
  --line:#302e3a; --line2:#413e4e; --brandsoft:#241f42; --brand:#9b8bff; --brand2:#b3a6ff;
  --code:#232230; --warnsoft:#33201c; --warn:#ff9880; --ok:#6cc48d;
  --w-post:#7fa0ff; --w-kitchen:#e0a35c; --w-crew:#ef7d9c; --w-plug:#4cc3ba;
  --w-house:#b18cff; --w-intern:#6cc48d; --w-laundry:#54bde0; --w-road:#dfa25c;
  --w-triage:#ff8189; --w-radio:#8fa3d4; --w-pack:#7fc073; --w-court:#c489d8; --w-library:#d3a95f;
}}
:root[data-theme="dark"]{
  --bg:#15141a; --bg2:#1d1c24; --ink:#f0eef5; --ink2:#cfcbd9; --ink3:#9692a5;
  --line:#302e3a; --line2:#413e4e; --brandsoft:#241f42; --brand:#9b8bff; --brand2:#b3a6ff;
  --code:#232230; --warnsoft:#33201c; --warn:#ff9880; --ok:#6cc48d;
  --w-post:#7fa0ff; --w-kitchen:#e0a35c; --w-crew:#ef7d9c; --w-plug:#4cc3ba;
  --w-house:#b18cff; --w-intern:#6cc48d; --w-laundry:#54bde0; --w-road:#dfa25c;
  --w-triage:#ff8189; --w-radio:#8fa3d4; --w-pack:#7fc073; --w-court:#c489d8; --w-library:#d3a95f;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1120px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px}
.brand{font-weight:800;font-size:15px;letter-spacing:-.02em;white-space:nowrap}
.brand span{color:var(--brand)}
.bar-sp{flex:1}
.btn{font:inherit;font-size:13px;font-weight:650;padding:7px 13px;border-radius:99px;
  border:1.5px solid var(--line2);background:var(--bg2);color:var(--ink2);cursor:pointer;
  white-space:nowrap;transition:.14s}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pos{font-family:var(--mono);font-size:12px;color:var(--ink3);white-space:nowrap}
#q{font:inherit;font-size:13px;padding:7px 12px;border-radius:99px;border:1.5px solid var(--line2);
  background:var(--bg2);color:var(--ink);width:150px;transition:.14s}
#q:focus{outline:none;border-color:var(--brand);width:210px}
.prog{height:3px;background:var(--line)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));
  width:0;transition:width .3s}
.rail{max-width:1120px;margin:0 auto;padding:0 18px 9px;display:flex;gap:6px;overflow-x:auto;
  scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{font-size:12px;font-weight:600;padding:4px 11px;border-radius:99px;border:1px solid var(--line);
  background:var(--bg2);color:var(--ink3);cursor:pointer;white-space:nowrap;transition:.14s}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* ---------- TOC ---------- */
.toc{display:none;position:sticky;top:0;z-index:70;background:var(--bg2);
  border-bottom:1px solid var(--line);max-height:78vh;overflow:auto}
.toc.open{display:block}
.toc-in{max-width:1120px;margin:0 auto;padding:20px 18px 26px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:22px}
.toc-g h4{margin:0 0 9px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.toc-g a{display:block;padding:5px 9px;border-radius:7px;font-size:13.5px;color:var(--ink2);
  text-decoration:none;cursor:pointer;border-left:2px solid transparent}
.toc-g a:hover{background:var(--brandsoft);color:var(--brand)}
.toc-g a.cur{border-left-color:var(--brand);color:var(--brand);font-weight:650}
.toc-g a b{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-right:6px}

/* ---------- layout ---------- */
.wrap{max-width:820px;margin:0 auto;padding:30px 18px 90px}
.kick{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);font-weight:750}
h1,h2,h3,h4{line-height:1.22;letter-spacing:-.02em}
.wrap h1{font-size:clamp(25px,4.4vw,34px);margin:.25em 0 .5em;font-weight:800}
.wrap h2{font-size:clamp(19px,3vw,24px);margin:2em 0 .5em;font-weight:750;
  padding-top:.5em;border-top:1px solid var(--line)}
.wrap h3{font-size:17px;margin:1.5em 0 .4em;font-weight:700}
.wrap h4{font-size:15px;margin:1.3em 0 .3em;font-weight:700;color:var(--ink2)}
.wrap p{margin:.75em 0}
.wrap ul,.wrap ol{margin:.7em 0;padding-left:1.35em}
.wrap li{margin:.3em 0}
.wrap a{color:var(--brand);text-decoration:underline;text-underline-offset:2px}
.wrap blockquote{margin:1em 0;padding:.5em 1em;border-left:3px solid var(--line2);color:var(--ink2)}
.wrap hr{border:none;border-top:1px solid var(--line);margin:2em 0}
code{font-family:var(--mono);font-size:.88em;background:var(--code);padding:.12em .38em;
  border-radius:5px;word-break:break-word}
pre{background:var(--code);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:13px 15px;overflow-x:auto;margin:1em 0;font-size:13px;line-height:1.55}
pre code{background:none;padding:0;font-size:13px}
.tw{overflow-x:auto;margin:1em 0;border:1px solid var(--line);border-radius:var(--radius-sm)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:440px}
th,td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
th{background:var(--code);font-weight:700;font-size:12.5px}
tr:last-child td{border-bottom:none}

/* ---------- analogy box ---------- */
.an{--acc:var(--brand);margin:18px 0 26px;border:1.5px solid var(--line2);border-radius:var(--radius);
  background:var(--bg2);overflow:hidden;color:var(--acc)}
.an-top{display:flex;align-items:center;gap:9px;padding:8px 14px;
  background:color-mix(in srgb,var(--acc) 11%,transparent);border-bottom:1px solid var(--line)}
.an-w{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;color:var(--acc)}
.an-t{font-size:12px;color:var(--ink3);font-weight:600;margin-left:auto;font-family:var(--mono)}
.an-b{display:flex;gap:16px;padding:16px 16px 18px;align-items:flex-start}
.an-svg{flex:0 0 118px;width:118px;height:118px;border-radius:var(--radius-sm);
  background:color-mix(in srgb,var(--acc) 7%,transparent);padding:7px}
.an-svg svg{width:100%;height:100%;display:block}
.an-txt{flex:1;min-width:0;color:var(--ink)}
.an-lab{font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  color:var(--acc);margin-bottom:2px}
.an-pic{font-size:14.5px;font-weight:650;margin:0 0 9px;color:var(--ink)}
.an-txt p{margin:0 0 10px;font-size:14.5px;color:var(--ink2)}
.an-snap{border-top:1px dashed var(--line2);padding-top:9px;font-size:14px;color:var(--ink)}
.an-snap b{color:var(--acc)}
.an-nem{margin:0;padding:11px 16px;background:var(--warnsoft);border-top:1.5px solid var(--warn);
  font-size:13.5px;color:var(--ink)}
.an-nem .lab{font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  color:var(--warn);display:block;margin-bottom:3px}
.an.hi{border-color:var(--warn);border-width:2px}

/* ---------- questions ---------- */
.qz{border:1px solid var(--line);border-radius:var(--radius-sm);margin:14px 0;background:var(--bg2)}
.qz>.qh{padding:13px 15px 4px;font-weight:650;font-size:15px}
.qz .qopts{padding:0 15px}
.qz .qopts p{margin:.3em 0;font-size:14.5px;color:var(--ink2)}
.rv{margin:11px 15px 13px;font:inherit;font-size:12.5px;font-weight:700;padding:6px 14px;
  border-radius:99px;border:1.5px solid var(--brand);background:transparent;color:var(--brand);cursor:pointer}
.rv:hover{background:var(--brand);color:#fff}
.ans{display:none;padding:2px 15px 14px;border-top:1px dashed var(--line2);margin-top:2px}
.ans.show{display:block}
.ans p{font-size:14.5px}

/* ---------- cram ---------- */
.cram-f{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 22px}
.cram-note{background:var(--brandsoft);border-radius:var(--radius-sm);padding:12px 15px;
  font-size:14px;color:var(--ink2);margin-bottom:8px}

/* ---------- gaps callout ---------- */
.gaps{border:1.5px solid var(--warn);border-radius:var(--radius);background:var(--warnsoft);
  padding:15px 17px;margin:22px 0}
.gaps h4{margin:0 0 7px;color:var(--warn);font-size:14px}
.gaps table{min-width:0;font-size:13.5px}
.gaps th,.gaps td{border-bottom-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.gaps th{background:transparent}

/* ---------- foot nav ---------- */
.fnav{display:flex;gap:11px;margin-top:44px;padding-top:20px;border-top:1px solid var(--line)}
.fnav a{flex:1;padding:13px 15px;border:1.5px solid var(--line2);border-radius:var(--radius-sm);
  text-decoration:none;color:var(--ink2);cursor:pointer;transition:.14s;min-width:0}
.fnav a:hover{border-color:var(--brand);color:var(--brand)}
.fnav .d{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.fnav .t{font-size:14px;font-weight:650;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fnav a.nx{text-align:right}
.fnav a.off{opacity:.32;pointer-events:none}

/* ---------- search results ---------- */
.sr{position:absolute;z-index:80;background:var(--bg2);border:1.5px solid var(--line2);
  border-radius:var(--radius-sm);max-height:340px;overflow:auto;width:min(420px,92vw);
  box-shadow:0 14px 44px rgba(0,0,0,.16);display:none}
.sr.open{display:block}
.sr a{display:block;padding:9px 13px;font-size:13.5px;color:var(--ink2);text-decoration:none;
  cursor:pointer;border-bottom:1px solid var(--line)}
.sr a:hover,.sr a.sel{background:var(--brandsoft);color:var(--brand)}
.sr .g{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em}
.sr .none{padding:14px;font-size:13.5px;color:var(--ink3)}

@media(max-width:720px){
  .bar-in{flex-wrap:wrap;gap:8px;padding:8px 13px}
  .brand{font-size:13.5px;width:100%}
  #q{width:100%;order:9}#q:focus{width:100%}
  .wrap{padding:22px 13px 70px}
  .an-b{flex-direction:column;gap:12px}
  .an-svg{flex:0 0 auto;width:96px;height:96px}
  .fnav{flex-direction:column}
  .fnav a.nx{text-align:left}
  .rail{padding-bottom:7px}
}
@media print{.bar,.toc,.fnav,.rv,.rail{display:none!important}.ans{display:block!important}}
</style>
</head>

<div class="bar">
  <div class="bar-in">
    <div class="brand">CCA-F <span>Study Guide</span></div>
    <div class="bar-sp"></div>
    <input id="q" type="search" placeholder="Search  /" autocomplete="off">
    <button class="btn" id="tocBtn">Contents</button>
    <button class="btn" id="cramBtn">Cram</button>
    <button class="btn" id="thBtn" title="Light / dark">◐</button>
    <span class="pos" id="pos">1 / 1</span>
  </div>
  <div class="rail" id="rail"></div>

</div>
<div class="toc" id="toc"><div class="toc-in" id="tocIn"></div></div>

<script>
const SECTIONS = [{"id": "start", "group": "Orientation", "title": "Start here — format, domains, weights", "short": "Start", "num": "", "html": "<h1 id=\"s-claude-certified-architect-foundations-certification\">Claude Certified Architect — Foundations Certification</h1>\n<h2 id=\"s-study-guide-based-on-the-official-exam-guide\">Study Guide (Based on the Official Exam Guide)</h2>\n<hr />\n<h2 id=\"s-introduction\">Introduction</h2>\n<p>The <strong>Claude Certified Architect — Foundations</strong> certification confirms that a specialist can make sound trade-off decisions when implementing real-world Claude-based solutions. The exam assesses foundational knowledge of Claude Code, the Claude Agent SDK, the Claude API, and the Model Context Protocol (MCP)—the core technologies for building production applications with Claude.</p>\n<p>The exam questions are based on realistic industry scenarios: building agentic systems for customer support, designing multi-agent research pipelines, integrating Claude Code into CI/CD, creating developer productivity tools, and extracting structured data from unstructured documents.</p>\n<hr />\n<h2 id=\"s-target-candidate\">Target Candidate</h2>\n<p>The ideal candidate is a <strong>solution architect</strong> who designs and ships production applications with Claude. You should have at least 6 months of hands-on experience with:</p>\n<ul>\n<li><strong>Claude Agent SDK</strong> — multi-agent orchestration, delegating to subagents, tool integration, lifecycle hooks</li>\n<li><strong>Claude Code</strong> — CLAUDE.md, MCP servers, Agent Skills, planning mode</li>\n<li><strong>Model Context Protocol (MCP)</strong> — tools and resources for backend integration</li>\n<li><strong>Prompt engineering</strong> — JSON schemas, few-shot examples, data extraction templates</li>\n<li><strong>Context windows</strong> — working with long documents, multi-agent context passing</li>\n<li><strong>CI/CD pipelines</strong> — automated code review, test generation</li>\n<li><strong>Escalation and reliability</strong> — error handling, human-in-the-loop</li>\n</ul>\n<hr />\n<h2 id=\"s-exam-format\">Exam Format</h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Parameter</th>\n<th>Value</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Question type</td>\n<td>Multiple choice (1 correct out of 4)</td>\n</tr>\n<tr>\n<td>Scoring</td>\n<td>100–1000 scale, passing score <strong>720</strong></td>\n</tr>\n<tr>\n<td>Guessing penalty</td>\n<td>None (answer every question!)</td>\n</tr>\n<tr>\n<td>Scenarios</td>\n<td>4 out of 8 possible (randomly selected)</td>\n</tr>\n</tbody>\n</table></div>\n<hr />\n<h2 id=\"s-exam-content-5-domains\">Exam Content: 5 Domains</h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Domain</th>\n<th>Weight</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1. Agent architecture and orchestration</td>\n<td><strong>27%</strong></td>\n</tr>\n<tr>\n<td>2. Tool design and MCP integration</td>\n<td><strong>18%</strong></td>\n</tr>\n<tr>\n<td>3. Claude Code configuration and workflows</td>\n<td><strong>20%</strong></td>\n</tr>\n<tr>\n<td>4. Prompt engineering and structured output</td>\n<td><strong>20%</strong></td>\n</tr>\n<tr>\n<td>5. Context management and reliability</td>\n<td><strong>15%</strong></td>\n</tr>\n</tbody>\n</table></div>\n<hr /><div class=\"gaps\"><h4>Six things you have actually got wrong that this guide never teaches</h4><p style=\"margin:.3em 0 .7em;font-size:14px\">Checked against your ten scored mocks. These sections exist in your own corpus files but have no counterpart in Part I here, so revising this document alone will not close them.</p><div class=\"tw\"><table><tr><th>Corpus section</th><th>Topic</th><th style=\"text-align:right\">Misses</th></tr><tr><td>D2 §2.8</td><td>Composite tools vs prompt-bundling paired calls</td><td style='text-align:right'>5×</td></tr><tr><td>D2 §2.4</td><td>Two-tool token binding (replacing a dry_run boolean)</td><td style='text-align:right'>4×</td></tr><tr><td>D4 §4.2</td><td>When a step-by-step reasoning cue is required</td><td style='text-align:right'>2×</td></tr><tr><td>D5 §5.1</td><td>The stateless API and why history must be resent</td><td style='text-align:right'>2×</td></tr><tr><td>D2 §2.5</td><td>Tool count degrading selection reliability (18 vs 4–5)</td><td style='text-align:right'>1×</td></tr><tr><td>D4 §4.17</td><td>Disabling high-false-positive review categories</td><td style='text-align:right'>1×</td></tr></table></div></div>", "concepts": [], "keywords": "Claude Certified Architect — Foundations Certification Study Guide (Based on the Official Exam Guide) Introduction Target Candidate Exam Format Exam Content: 5 Domains"}, {"id": "scenarios", "group": "Orientation", "title": "The 8 exam scenarios", "short": "Scenarios", "num": "", "html": "<h2 id=\"s-exam-scenarios\">Exam Scenarios</h2>\n<h3 id=\"s-scenario-1-customer-support-agent\">Scenario 1: Customer Support Agent</h3>\n<p>You build an agent to handle returns, billing disputes, and account issues using the Claude Agent SDK. The agent uses MCP tools (<code>get_customer</code>, <code>lookup_order</code>, <code>process_refund</code>, <code>escalate_to_human</code>). The target is 80%+ first-contact resolution with appropriate escalation.</p>\n<h3 id=\"s-scenario-2-code-generation-with-claude-code\">Scenario 2: Code Generation with Claude Code</h3>\n<p>You use Claude Code to accelerate development: code generation, refactoring, debugging, documentation. You need to integrate it with custom slash commands and CLAUDE.md configuration, and understand when to use planning mode.</p>\n<h3 id=\"s-scenario-3-multi-agent-research-system\">Scenario 3: Multi-Agent Research System</h3>\n<p>A coordinator agent delegates tasks to specialized subagents: web research, document analysis, synthesis, and report generation. The system must produce complete reports with citations.</p>\n<h3 id=\"s-scenario-4-developer-productivity-tools\">Scenario 4: Developer Productivity Tools</h3>\n<p>The agent helps engineers explore unfamiliar codebases, generate boilerplate code, and automate routine tasks. Built-in tools (Read, Write, Bash, Grep, Glob) and MCP servers are used.</p>\n<h3 id=\"s-scenario-5-claude-code-for-continuous-integration\">Scenario 5: Claude Code for Continuous Integration</h3>\n<p>Integrate Claude Code into a CI/CD pipeline for automated code reviews, test generation, and pull request feedback. Prompts must be designed to minimize false positives.</p>\n<h3 id=\"s-scenario-6-structured-data-extraction\">Scenario 6: Structured Data Extraction</h3>\n<p>The system extracts information from unstructured documents, validates output with JSON schemas, and maintains high accuracy. It must correctly handle edge cases.</p>\n<h3 id=\"s-scenario-7-conversational-ai-architecture-patterns\">Scenario 7: Conversational AI Architecture Patterns</h3>\n<p>You design multi-turn conversational systems covering context window management, instruction persistence across turns, memory strategies, tool design for safe execution, and handling ambiguous or conflicting user inputs.</p>\n<h3 id=\"s-scenario-8-agentic-ai-tools-content-missing-help-us-fill-it-\">Scenario 8: Agentic AI Tools <em>(content missing — help us fill it in!)</em></h3>\n<p>This scenario has been reported by exam candidates but is not yet covered in this guide. If you have encountered questions from this scenario on the real exam, please share them in <a href=\"https://github.com/paullarionov/claude-certified-architect/issues\">GitHub Issues</a> so we can add full coverage. Your contribution will help everyone preparing for the exam.</p>\n<hr />", "concepts": [], "keywords": "Exam Scenarios Scenario 1: Customer Support Agent Scenario 2: Code Generation with Claude Code Scenario 3: Multi-Agent Research System Scenario 4: Developer Productivity Tools Scenario 5: Claude Code for Continuous Integration Scenario 6: Structured Data Extraction Scenario 7: Conversational AI Architecture Patterns Scenario 8: Agentic AI Tools *(content missing — help us fill it in!)*"}, {"id": "docs", "group": "Orientation", "title": "Official documentation", "short": "Docs", "num": "", "html": "<h1 id=\"s-official-documentation\">Official Documentation</h1>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Resource</th>\n<th>URL</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Claude API — Messages</strong></td>\n<td>https://platform.claude.com/docs/en/api/messages</td>\n</tr>\n<tr>\n<td><strong>Claude API — Tool Use</strong></td>\n<td>https://platform.claude.com/docs/en/build-with-claude/tool-use</td>\n</tr>\n<tr>\n<td><strong>Claude API — Message Batches</strong></td>\n<td>https://platform.claude.com/docs/en/build-with-claude/message-batches</td>\n</tr>\n<tr>\n<td><strong>Claude Agent SDK — Overview</strong></td>\n<td>https://platform.claude.com/docs/en/agent-sdk/overview</td>\n</tr>\n<tr>\n<td><strong>Claude Agent SDK — Hooks</strong></td>\n<td>https://platform.claude.com/docs/en/agent-sdk/hooks</td>\n</tr>\n<tr>\n<td><strong>Claude Agent SDK — Subagents</strong></td>\n<td>https://platform.claude.com/docs/en/agent-sdk/subagents</td>\n</tr>\n<tr>\n<td><strong>Claude Agent SDK — Sessions</strong></td>\n<td>https://platform.claude.com/docs/en/agent-sdk/sessions</td>\n</tr>\n<tr>\n<td><strong>Model Context Protocol (MCP)</strong></td>\n<td>https://modelcontextprotocol.io/</td>\n</tr>\n<tr>\n<td><strong>MCP — Tools</strong></td>\n<td>https://modelcontextprotocol.io/docs/concepts/tools</td>\n</tr>\n<tr>\n<td><strong>MCP — Resources</strong></td>\n<td>https://modelcontextprotocol.io/docs/concepts/resources</td>\n</tr>\n<tr>\n<td><strong>MCP — Servers</strong></td>\n<td>https://modelcontextprotocol.io/docs/concepts/servers</td>\n</tr>\n<tr>\n<td><strong>Claude Code — Documentation</strong></td>\n<td>https://code.claude.com/docs/en/overview</td>\n</tr>\n<tr>\n<td><strong>Claude Code — CLAUDE.md and Memory</strong></td>\n<td>https://code.claude.com/docs/en/memory</td>\n</tr>\n<tr>\n<td><strong>Claude Code — Skills (incl. slash commands)</strong></td>\n<td>https://code.claude.com/docs/en/skills</td>\n</tr>\n<tr>\n<td><strong>Claude Code — Hooks</strong></td>\n<td>https://code.claude.com/docs/en/hooks</td>\n</tr>\n<tr>\n<td><strong>Claude Code — Sub-agents</strong></td>\n<td>https://code.claude.com/docs/en/sub-agents</td>\n</tr>\n<tr>\n<td><strong>Claude Code — MCP Integration</strong></td>\n<td>https://code.claude.com/docs/en/mcp</td>\n</tr>\n<tr>\n<td><strong>Claude Code — GitHub Actions CI/CD</strong></td>\n<td>https://code.claude.com/docs/en/github-actions</td>\n</tr>\n<tr>\n<td><strong>Claude Code — GitLab CI/CD</strong></td>\n<td>https://code.claude.com/docs/en/gitlab-ci-cd</td>\n</tr>\n<tr>\n<td><strong>Claude Code — Headless (non-interactive mode)</strong></td>\n<td>https://code.claude.com/docs/en/headless</td>\n</tr>\n<tr>\n<td><strong>Prompt Engineering Guide</strong></td>\n<td>https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview</td>\n</tr>\n<tr>\n<td><strong>Extended Thinking</strong></td>\n<td>https://platform.claude.com/docs/en/build-with-claude/extended-thinking</td>\n</tr>\n<tr>\n<td><strong>Anthropic Cookbook (code examples)</strong></td>\n<td>https://github.com/anthropics/anthropic-cookbook</td>\n</tr>\n</tbody>\n</table></div>\n<hr />", "concepts": [], "keywords": "Official Documentation"}, {"id": "ch1", "group": "Part I · Theory", "title": "Claude API — fundamentals", "short": "Ch1", "num": "1", "html": "<h1 id=\"s-part-i-theory-foundations\">PART I: THEORY FOUNDATIONS</h1>\n<p>This part covers all the theory you need to pass the exam successfully. The material is organized by technologies and concepts rather than by exam domains—this helps you build a deeper understanding of each topic.</p>\n<hr />\n<h1 id=\"s-chapter-1-claude-api-fundamentals-of-model-interaction\">Chapter 1: Claude API — Fundamentals of Model Interaction</h1>\n<blockquote>\n<p>Documentation: <a href=\"https://platform.claude.com/docs/en/api/messages\">Messages API</a> | <a href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview\">Prompt Engineering</a></p>\n</blockquote>\n<h2 id=\"s-1-1-api-request-structure\">1.1 API Request Structure</h2><div class=\"an\" style=\"--acc:var(--w-post)\" data-an=\"1.1\"><div class=\"an-top\"><span class=\"an-w\">The postal service</span><span class=\"an-t\">§1.1</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M18 44h124v78H18z'/><path d='M18 44l62 44 62-44'/><rect x='46' y='16' width='68' height='42' rx='3' fill='var(--acc)' opacity='.16'/><path d='M46 16h68v42H46z'/><path d='M56 27h48M56 36h48M56 45h30'/><path d='M38 62v46M52 70v38' opacity='.45'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">One envelope with the entire correspondence stuffed inside.</p><div class=\"an-lab\">The analogy</div><p>You never post just the reply. You post the whole conversation again — every letter either of you has ever sent, re-copied, with the new one on top. The postal service has the memory of a goldfish and charges you by weight.</p><div class=\"an-snap\"><b>So on the exam →</b> Every request carries <code>model</code>, <code>max_tokens</code> and <code>messages[]</code> — and <code>messages[]</code> is the full history, not the latest turn.</div></div></div></div>\n<p>The Claude API follows a request–response model. Each request to the Claude Messages API includes:</p>\n<pre><code class=\"language-json\">{\n  &quot;model&quot;: &quot;claude-sonnet-4-6&quot;,\n  &quot;max_tokens&quot;: 1024,\n  &quot;system&quot;: &quot;You are a helpful assistant.&quot;,\n  &quot;messages&quot;: [\n    {&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: &quot;Hi!&quot;},\n    {&quot;role&quot;: &quot;assistant&quot;, &quot;content&quot;: &quot;Hello!&quot;},\n    {&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: &quot;How are you?&quot;}\n  ],\n  &quot;tools&quot;: [...],\n  &quot;tool_choice&quot;: {&quot;type&quot;: &quot;auto&quot;}\n}\n</code></pre>\n<p><strong>Key fields:</strong>\n- <code>model</code> — model selection (<code>claude-opus-4-6</code>, <code>claude-sonnet-4-6</code>, <code>claude-haiku-4-5</code>)\n- <code>max_tokens</code> — maximum number of tokens in the response\n- <code>system</code> — the system prompt (defines model behavior)\n- <code>messages</code> — conversation history (<strong>you must send the full history</strong> to maintain coherence)\n- <code>tools</code> — definitions of available tools\n- <code>tool_choice</code> — tool selection strategy</p>\n<h2 id=\"s-1-2-message-roles\">1.2 Message Roles</h2><div class=\"an hi\" style=\"--acc:var(--w-post)\" data-an=\"1.2\"><div class=\"an-top\"><span class=\"an-w\">The postal service</span><span class=\"an-t\">§1.2</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M80 16v128' opacity='.3' stroke-dasharray='4 6'/><rect x='16' y='26' width='52' height='30' rx='4' fill='var(--acc)' opacity='.16'/><path d='M16 26h52v30H16z'/><path d='M92 66h52v30H92z'/><rect x='92' y='66' width='52' height='30' rx='4'/><path d='M16 106h52v30H16z'/><rect x='16' y='106' width='52' height='30' rx='4' fill='var(--acc)' opacity='.16'/><path d='M26 38h32M26 46h20'/><path d='M102 78h32M102 86h20'/><path d='M26 118h32M26 126h20'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Letters alternating down one table, each signed by one of two hands.</p><div class=\"an-lab\">The analogy</div><p>Two correspondents, strictly taking turns. Slip a letter into the pile signed with the other hand and the model will read it back as something it said itself — and carry on from there quite happily.</p><div class=\"an-snap\"><b>So on the exam →</b> <code>user</code> and <code>assistant</code> alternate inside <code>messages[]</code>. The system prompt is not a role in that array.</div></div></div><div class=\"an-nem\"><span class=\"lab\">⚠ Your record · Missed on Exam 12 Q18</span>Tool results re-enter as structured <code>tool_result</code> blocks matched to their <code>tool_use</code> by <code>id</code>. Narrating what the tool returned in prose is not the protocol, so the call stays unanswered.</div></div>\n<p>The <code>messages</code> array uses three roles:\n- <code>user</code> — user messages\n- <code>assistant</code> — model responses (included when sending history)\n- <code>tool</code> — tool call results (the role is not explicitly set; this appears as a <code>tool_result</code> content block)</p>\n<p><strong>Critically important:</strong> on every API request you must send the <strong>full conversation history</strong>. The model does not persist state between requests—each call is independent.</p>\n<h2 id=\"s-1-3-the-stop-reason-field-in-the-response\">1.3 The <code>stop_reason</code> Field in the Response</h2><div class=\"an\" style=\"--acc:var(--w-post)\" data-an=\"1.3\"><div class=\"an-top\"><span class=\"an-w\">The postal service</span><span class=\"an-t\">§1.3</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M14 46h132v70H14z'/><path d='M14 46l66 40 66-40'/><circle cx='118' cy='42' r='26' fill='var(--acc)' opacity='.18'/><circle cx='118' cy='42' r='26' stroke-dasharray='5 4'/><path d='M108 42l7 8 14-16'/><path d='M28 130h40M84 130h48' opacity='.5'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A postmark franked on the returned envelope, telling you what happens next.</p><div class=\"an-lab\">The analogy</div><p>The postman does not write 'I think that's everything' in cursive at the bottom of page four. He stamps the outside: DELIVERED, or NEEDS A SIGNATURE. You read the stamp. You do not read the handwriting and form an impression.</p><div class=\"an-snap\"><b>So on the exam →</b> Branch on <code>stop_reason</code>: <code>tool_use</code> → run the tool and loop; <code>end_turn</code> → stop. Never parse the reply text for a sign-off.</div></div></div></div>\n<p>The Claude API response includes <code>stop_reason</code>, which indicates why the model stopped generating:</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Value</th>\n<th>Description</th>\n<th>Action</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>\"end_turn\"</code></td>\n<td>The model finished its response</td>\n<td>Show the result to the user</td>\n</tr>\n<tr>\n<td><code>\"tool_use\"</code></td>\n<td>The model wants to call a tool</td>\n<td>Execute the tool and return the result</td>\n</tr>\n<tr>\n<td><code>\"max_tokens\"</code></td>\n<td>Token limit reached</td>\n<td>The response is truncated; you may need to increase the limit</td>\n</tr>\n<tr>\n<td><code>\"stop_sequence\"</code></td>\n<td>A stop sequence was encountered</td>\n<td>Handle based on your application logic</td>\n</tr>\n</tbody>\n</table></div>\n<p>For agentic systems, <code>\"tool_use\"</code> and <code>\"end_turn\"</code> are the most important—they control the agent loop.</p>\n<h2 id=\"s-1-4-system-prompt\">1.4 System Prompt</h2><div class=\"an\" style=\"--acc:var(--w-post)\" data-an=\"1.4\"><div class=\"an-top\"><span class=\"an-w\">The postal service</span><span class=\"an-t\">§1.4</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='26' y='14' width='108' height='44' rx='4' fill='var(--acc)' opacity='.16'/><path d='M26 14h108v44H26z'/><path d='M40 28h80M40 38h80M40 48h48'/><path d='M56 58v10M104 58v10' opacity='.5'/><path d='M14 92h132' stroke-width='3'/><path d='M30 78h30v14H30zM68 78h30v14H68zM106 78h30v14h-30z'/><path d='M45 100v14M83 100v14M121 100v14' opacity='.4' stroke-dasharray='3 5'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A notice screwed above the sorting desk that every item passes under.</p><div class=\"an-lab\">The analogy</div><p>It is not in the post. It is bolted to the wall above the bench, and every single item travels beneath it on the way through — including the one you send in an hour, and the one after that.</p><div class=\"an-snap\"><b>So on the exam →</b> The system prompt is a top-level parameter sent with every request. Persona, tone and standing behavioural rules belong there.</div></div></div></div>\n<p>The system prompt is a special instruction that defines context and behavioral rules. It:\n- Is not part of the <code>messages</code> array; it is passed separately in the <code>system</code> field\n- Has priority over user messages\n- Is loaded once and applies throughout the conversation\n- Is used to define role, constraints, and output format</p>\n<p><strong>Important for the exam:</strong> system prompt wording can create unintended tool associations. For example, an instruction like “always verify the customer” can cause the model to overuse <code>get_customer</code>, even when it is unnecessary.</p>\n<h2 id=\"s-1-5-context-window\">1.5 Context Window</h2><div class=\"an\" style=\"--acc:var(--w-post)\" data-an=\"1.5\"><div class=\"an-top\"><span class=\"an-w\">The postal service</span><span class=\"an-t\">§1.5</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M40 50c0-8 8-14 40-14s40 6 40 14v78c0 8-10 14-40 14s-40-6-40-14z'/><path d='M40 62h80' opacity='.5' stroke-dasharray='4 5'/><path d='M52 78h56v50H52z' fill='var(--acc)' opacity='.18'/><path d='M52 88h56M52 100h56M52 112h56' opacity='.6'/><path d='M132 50v92M126 50h12M126 142h12'/><path d='M56 36c6-10 42-10 48 0'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A mail sack with a hard brim you cannot pack past.</p><div class=\"an-lab\">The analogy</div><p>One sack, one size. A longer conversation does not earn you a bigger sack — it earns you a fuller one, and everything already in there gets carried again on every future trip.</p><div class=\"an-snap\"><b>So on the exam →</b> The window bounds the entire request: system prompt + full history + tool definitions + the reply. Growth costs latency and money on every turn.</div></div></div></div>\n<p>The context window is the total amount of text (in tokens) the model can process at once. It includes:\n- The system prompt\n- The full message history\n- Tool definitions\n- Tool results</p>\n<p><strong>Key context-window problems:</strong></p>\n<ol>\n<li>\n<p><strong>Lost-in-the-middle effect:</strong> models reliably process information at the start and end of a long input but can miss details in the middle. Mitigation: place key information near the beginning or end.</p>\n</li>\n<li>\n<p><strong>Accumulation of tool results:</strong> every tool call adds output to the context. If a tool returns 40+ fields but only 5 matter, then most of the context is wasted.</p>\n</li>\n<li>\n<p><strong>Progressive summarization:</strong> when compressing history, numeric values, percentages, and dates often get lost and become vague (“about”, “roughly”, “a few”).</p>\n</li>\n</ol>\n<hr />", "concepts": ["1.1", "1.2", "1.3", "1.4", "1.5"], "keywords": "PART I: THEORY FOUNDATIONS Chapter 1: Claude API — Fundamentals of Model Interaction 1.1 API Request Structure 1.2 Message Roles 1.3 The `stop_reason` Field in the Response 1.4 System Prompt 1.5 Context Window"}, {"id": "ch2", "group": "Part I · Theory", "title": "Tools and tool_use", "short": "Ch2", "num": "2", "html": "<h1 id=\"s-chapter-2-tools-and-tool-use\">Chapter 2: Tools and <code>tool_use</code></h1>\n<blockquote>\n<p>Documentation: <a href=\"https://platform.claude.com/docs/en/build-with-claude/tool-use\">Tool Use</a></p>\n</blockquote>\n<h2 id=\"s-2-1-what-is-tool-use\">2.1 What is <code>tool_use</code></h2><div class=\"an\" style=\"--acc:var(--w-kitchen)\" data-an=\"2.1\"><div class=\"an-top\"><span class=\"an-w\">The restaurant</span><span class=\"an-t\">§2.1</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M30 14h64v58H30z'/><rect x='30' y='14' width='64' height='58' rx='3' fill='var(--acc)' opacity='.14'/><path d='M42 30h40M42 42h40M42 54h24'/><circle cx='84' cy='24' r='6'/><path d='M22 78h80' stroke-dasharray='5 5'/><ellipse cx='96' cy='120' rx='44' ry='16'/><path d='M62 120c0-12 15-20 34-20s34 8 34 20'/><circle cx='120' cy='96' r='7'/><path d='M120 89v-14' opacity='.6'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A numbered docket that has to come back pinned to the plate.</p><div class=\"an-lab\">The analogy</div><p>Claude does not cook. It writes a docket — table four, one lasagne — and pushes it through the hatch. Nothing happens until the kitchen actually cooks, and the plate comes back with that same number still pinned to it.</p><div class=\"an-snap\"><b>So on the exam →</b> The model emits a <code>tool_use</code> block; your code runs it and returns a <code>tool_result</code> carrying the same <code>id</code>.</div></div></div></div>\n<p><code>tool_use</code> is a mechanism that allows Claude to call external functions. The model does not run code directly—it generates a structured tool call request; your code executes it and returns the result.</p>\n<h2 id=\"s-2-2-tool-definition\">2.2 Tool Definition</h2><div class=\"an hi\" style=\"--acc:var(--w-kitchen)\" data-an=\"2.2\"><div class=\"an-top\"><span class=\"an-w\">The restaurant</span><span class=\"an-t\">§2.2</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M22 20h56v120H22zM82 20h56v120H82z'/><path d='M80 20v120' opacity='.4'/><path d='M32 40h36M32 52h36M32 64h36M32 76h24' opacity='.85'/><rect x='30' y='34' width='40' height='48' rx='3' fill='var(--acc)' opacity='.16'/><path d='M92 40h36'/><path d='M104 62v22M96 70h16' opacity='.5'/><circle cx='110' cy='106' r='14' stroke-dasharray='4 4'/><path d='M105 101c0-4 4-6 6-4s0 5-1 6v3' opacity='.8'/><circle cx='110' cy='114' r='1.4' fill='currentColor'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Two dishes on a menu — one described properly, one merely named.</p><div class=\"an-lab\">The analogy</div><p>'Soup' next to 'Soup' tells a diner nothing at all. 'Chilled cucumber, no dairy, starter' next to 'slow beef broth, main' tells them everything. Nobody is guessing from the name — they are reading the description underneath it.</p><div class=\"an-snap\"><b>So on the exam →</b> Tool descriptions are the model's primary basis for selection. State what it does, what input it takes, when to use it, and when not to.</div></div></div><div class=\"an-nem\"><span class=\"lab\">⚠ Your record · Missed on Exam 13 Q19</span>When a tool's behaviour surprises the agent &mdash; truncation limits, what it cannot reach &mdash; the fix is to state it in the description. The description is the model's only view of scope.</div></div>\n<p>Each tool is defined using a JSON schema:</p>\n<pre><code class=\"language-json\">{\n  &quot;name&quot;: &quot;get_customer&quot;,\n  &quot;description&quot;: &quot;Finds a customer by email or ID. Returns the customer profile, including name, email, order history, and account status. Use this tool BEFORE lookup_order to verify the customer's identity. Accepts an email (format: user@domain.com) or a numeric customer_id.&quot;,\n  &quot;input_schema&quot;: {\n    &quot;type&quot;: &quot;object&quot;,\n    &quot;properties&quot;: {\n      &quot;email&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;description&quot;: &quot;Customer email&quot;},\n      &quot;customer_id&quot;: {&quot;type&quot;: &quot;integer&quot;, &quot;description&quot;: &quot;Numeric customer ID&quot;}\n    },\n    &quot;required&quot;: []\n  }\n}\n</code></pre>\n<p><strong>Critically important aspects of a tool description:</strong></p>\n<ol>\n<li>\n<p><strong>The description is the primary selection mechanism.</strong> An LLM chooses tools based on their descriptions. Minimal descriptions (“Retrieves customer information”) lead to mistakes when tools overlap.</p>\n</li>\n<li>\n<p><strong>Include in the description:</strong>\n   - What the tool does and returns\n   - Input formats and example values\n   - Edge cases and constraints\n   - When to use this tool vs similar alternatives</p>\n</li>\n<li>\n<p><strong>Avoid</strong> identical or overlapping descriptions across tools. If <code>analyze_content</code> and <code>analyze_document</code> have nearly identical descriptions, the model will confuse them.</p>\n</li>\n<li>\n<p><strong>Built-in tools vs MCP tools:</strong> agents may prefer built-in tools (Read, Grep) over MCP tools with similar functionality. To prevent this, strengthen MCP tool descriptions—highlight concrete advantages, unique data, or context that built-in tools cannot provide.</p>\n</li>\n</ol>\n<h2 id=\"s-2-3-the-tool-choice-parameter\">2.3 The <code>tool_choice</code> Parameter</h2><div class=\"an hi\" style=\"--acc:var(--w-kitchen)\" data-an=\"2.3\"><div class=\"an-top\"><span class=\"an-w\">The restaurant</span><span class=\"an-t\">§2.3</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M8 40h40v104H8zM60 40h40v104H60zM112 40h40v104h-40z'/><path d='M8 40h40M60 40h40M112 40h40' stroke-width='3'/><circle cx='28' cy='108' r='9'/><path d='M28 99V88'/><path d='M18 74c0-7 20-7 20 0' opacity='.6'/><ellipse cx='80' cy='112' rx='16' ry='6' fill='var(--acc)' opacity='.2'/><path d='M64 112c0-9 7-15 16-15s16 6 16 15'/><path d='M80 97v-6'/><circle cx='70' cy='62' r='6'/><circle cx='80' cy='62' r='6'/><circle cx='90' cy='62' r='6'/><ellipse cx='132' cy='112' rx='16' ry='6' fill='var(--acc)' opacity='.35'/><path d='M116 112c0-9 7-15 16-15s16 6 16 15'/><circle cx='122' cy='62' r='6'/><path d='M117 57l10 10' stroke-width='2'/><circle cx='142' cy='62' r='6'/><path d='M137 57l10 10' stroke-width='2'/><circle cx='132' cy='62' r='6' fill='var(--acc)' opacity='.35'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Three doors out of the same restaurant.</p><div class=\"an-lab\">The analogy</div><p><code>auto</code> lets you sit down, chat, and leave having eaten nothing. <code>any</code> runs a door policy — you are not getting out without ordering something, though the dish is entirely your call. Naming a tool is the tasting menu: the first course was settled before you walked in.</p><div class=\"an-snap\"><b>So on the exam →</b> If the question says <em>guarantee</em>, <code>auto</code> is out. If it also wants the model to pick which schema fits, it is <code>any</code>.</div></div></div><div class=\"an-nem\"><span class=\"lab\">⚠ Your record · Missed twice in fourteen hours</span>Exam 12 Q33 and Exam 13 Q46 both asked which setting <em>guarantees</em> a tool call. You answered <code>auto</code> plus a prompt instruction both times, with the full explanation read in between. The two stems share only 0.118 similarity, so this is not a repeated question — it is a held preference. <strong>The setting outranks the instruction: <code>auto</code> permits text, full stop.</strong></div></div>\n<p><code>tool_choice</code> controls how the model selects tools:</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Value</th>\n<th>Behavior</th>\n<th>When to use</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>{\"type\": \"auto\"}</code></td>\n<td>The model decides whether to call a tool or answer in text</td>\n<td>Default for most cases</td>\n</tr>\n<tr>\n<td><code>{\"type\": \"any\"}</code></td>\n<td>The model <strong>must</strong> call some tool</td>\n<td>When you need guaranteed structured output</td>\n</tr>\n<tr>\n<td><code>{\"type\": \"tool\", \"name\": \"extract_metadata\"}</code></td>\n<td>The model <strong>must</strong> call a specific tool</td>\n<td>When you need a forced first step / execution order</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Important scenarios:</strong>\n- <code>tool_choice: \"any\"</code> + multiple extraction tools → the model picks the best one, but you still get structured output\n- Forced selection → when you must guarantee a specific first action (e.g., <code>extract_metadata</code> before enrichment)</p>\n<h2 id=\"s-2-4-json-schemas-for-structured-output\">2.4 JSON Schemas for Structured Output</h2><div class=\"an\" style=\"--acc:var(--w-kitchen)\" data-an=\"2.4\"><div class=\"an-top\"><span class=\"an-w\">The restaurant</span><span class=\"an-t\">§2.4</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx='80' cy='84' r='58' stroke-dasharray='6 5' opacity='.5'/><circle cx='80' cy='84' r='46'/><circle cx='66' cy='72' r='16' fill='var(--acc)' opacity='.2'/><circle cx='66' cy='72' r='16' stroke-dasharray='4 4'/><rect x='88' y='62' width='26' height='20' rx='3' stroke-dasharray='4 4'/><path d='M62 104h36' stroke-dasharray='4 4'/><path d='M70 100v8M80 100v8M90 100v8'/><path d='M16 22h30M16 22v10M144 22h-30M144 22v10' opacity='.55'/><path d='M50 16h60v14H50z' fill='var(--acc)' opacity='.16'/><path d='M50 16h60v14H50z'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A plating diagram taped inside the pass.</p><div class=\"an-lab\">The analogy</div><p>Protein here. Sauce there. Three spears, not four. Anything leaving the kitchen has to match the diagram, and there is no negotiating about it at the hatch.</p><div class=\"an-snap\"><b>So on the exam →</b> Make the tool's <code>input_schema</code> the shape you want back. Required versus nullable decides whether the model may return nothing instead of inventing something.</div></div></div></div>\n<p>Using <code>tool_use</code> with JSON schemas is the <strong>most reliable</strong> way to obtain structured output from Claude. It:\n- Guarantees syntactically valid JSON (no missing braces, no trailing commas)\n- Enforces the required structure (required fields are present)\n- Does <strong>not</strong> guarantee semantic correctness (values can still be wrong)</p>\n<p><strong>Schema design — key principles:</strong></p>\n<pre><code class=\"language-json\">{\n  &quot;type&quot;: &quot;object&quot;,\n  &quot;properties&quot;: {\n    &quot;category&quot;: {\n      &quot;type&quot;: &quot;string&quot;,\n      &quot;enum&quot;: [&quot;bug&quot;, &quot;feature&quot;, &quot;docs&quot;, &quot;unclear&quot;, &quot;other&quot;]\n    },\n    &quot;category_detail&quot;: {\n      &quot;type&quot;: [&quot;string&quot;, &quot;null&quot;],\n      &quot;description&quot;: &quot;Details if category = 'other' or 'unclear'&quot;\n    },\n    &quot;severity&quot;: {\n      &quot;type&quot;: &quot;string&quot;,\n      &quot;enum&quot;: [&quot;critical&quot;, &quot;high&quot;, &quot;medium&quot;, &quot;low&quot;]\n    },\n    &quot;confidence&quot;: {\n      &quot;type&quot;: &quot;number&quot;,\n      &quot;minimum&quot;: 0,\n      &quot;maximum&quot;: 1\n    },\n    &quot;optional_field&quot;: {\n      &quot;type&quot;: [&quot;string&quot;, &quot;null&quot;],\n      &quot;description&quot;: &quot;Null if the information was not found in the source&quot;\n    }\n  },\n  &quot;required&quot;: [&quot;category&quot;, &quot;severity&quot;]\n}\n</code></pre>\n<p><strong>Schema design rules:</strong>\n1. <strong>Required vs optional:</strong> mark fields as required only if the information is always available. Required fields push the model to fabricate values when data is missing.\n2. <strong>Nullable fields:</strong> use <code>\"type\": [\"string\", \"null\"]</code> for information that may be absent. The model can return <code>null</code> instead of hallucinating.\n3. <strong>Enums with <code>\"other\"</code>:</strong> add <code>\"other\"</code> + a detail string to avoid losing data outside your predefined categories.\n4. <strong>Enum <code>\"unclear\"</code>:</strong> for cases where the model cannot confidently pick a category—honest <code>\"unclear\"</code> is better than a wrong category.</p>\n<h2 id=\"s-2-5-syntax-vs-semantic-errors\">2.5 Syntax vs Semantic Errors</h2><div class=\"an\" style=\"--acc:var(--w-kitchen)\" data-an=\"2.5\"><div class=\"an-top\"><span class=\"an-w\">The restaurant</span><span class=\"an-t\">§2.5</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx='44' cy='72' r='32'/><path d='M22 50l44 44M66 50l-44 44' opacity='.85'/><circle cx='30' cy='60' r='7' fill='var(--acc)' opacity='.25'/><circle cx='62' cy='92' r='6' fill='var(--acc)' opacity='.25'/><circle cx='116' cy='72' r='32'/><circle cx='104' cy='64' r='11' fill='var(--acc)' opacity='.22'/><rect x='120' y='58' width='18' height='14' rx='3'/><path d='M104 88h24'/><path d='M96 118l7 8 14-16'/><path d='M126 112h22l-11 20z' stroke-linejoin='round'/><path d='M137 119v5' /><circle cx='137' cy='128' r='1.3' fill='currentColor'/><path d='M28 118l7 8 14-16' opacity='0'/><path d='M30 116h28' opacity='.5'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Two plates: one obviously wrong, one plated perfectly with the wrong fish.</p><div class=\"an-lab\">The analogy</div><p>The pass catches the first before it leaves the kitchen. The second walks straight out to the table, because it matches the diagram in every measurable way. Only the person who ordered cod finds out.</p><div class=\"an-snap\"><b>So on the exam →</b> Schemas eliminate the syntax class outright and do nothing for the semantic class. Valid JSON still holds a wrong number.</div></div></div></div>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Error type</th>\n<th>Example</th>\n<th>Mitigation</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Syntax</strong></td>\n<td>Invalid JSON, wrong field type</td>\n<td><code>tool_use</code> with a JSON schema (eliminates)</td>\n</tr>\n<tr>\n<td><strong>Semantic</strong></td>\n<td>Totals don't add up, value in wrong field, hallucination</td>\n<td>Validation checks, retry with feedback, self-correction</td>\n</tr>\n</tbody>\n</table></div>\n<hr />", "concepts": ["2.1", "2.2", "2.3", "2.4", "2.5"], "keywords": "Chapter 2: Tools and `tool_use` 2.1 What is `tool_use` 2.2 Tool Definition 2.3 The `tool_choice` Parameter 2.4 JSON Schemas for Structured Output 2.5 Syntax vs Semantic Errors"}, {"id": "ch3", "group": "Part I · Theory", "title": "Claude Agent SDK", "short": "Ch3", "num": "3", "html": "<h1 id=\"s-chapter-3-claude-agent-sdk-building-agentic-systems\">Chapter 3: Claude Agent SDK — Building Agentic Systems</h1>\n<blockquote>\n<p>Documentation: <a href=\"https://platform.claude.com/docs/en/agent-sdk/overview\">Agent SDK</a> | <a href=\"https://platform.claude.com/docs/en/agent-sdk/hooks\">Hooks</a> | <a href=\"https://platform.claude.com/docs/en/agent-sdk/subagents\">Subagents</a> | <a href=\"https://platform.claude.com/docs/en/agent-sdk/sessions\">Sessions</a></p>\n</blockquote>\n<h2 id=\"s-3-1-what-is-an-agentic-loop\">3.1 What is an Agentic Loop</h2><div class=\"an\" style=\"--acc:var(--w-crew)\" data-an=\"3.1\"><div class=\"an-top\"><span class=\"an-w\">The film crew</span><span class=\"an-t\">§3.1</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M28 62h74v46H28z'/><path d='M28 46h74l-8 16H36z' fill='var(--acc)' opacity='.2'/><path d='M28 46h74l-8 16H36z'/><path d='M44 46l-6 16M60 46l-6 16M76 46l-6 16M92 46l-6 16' opacity='.7'/><path d='M124 60a44 44 0 1 1-32-16' stroke-dasharray='0'/><path d='M112 40l14 6-8 13'/><rect x='44' y='76' width='42' height='24' rx='3' opacity='.55'/><path d='M52 88h26' opacity='.55'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A clapperboard with a loop arrow: shoot, watch it back, decide, go again.</p><div class=\"an-lab\">The analogy</div><p>The director is not working through a fixed list of takes. They shoot one, watch it on the monitor, and that is what tells them whether there is a next one.</p><div class=\"an-snap\"><b>So on the exam →</b> Send → inspect <code>stop_reason</code> → execute any tools → append the results → send again, until <code>end_turn</code>.</div></div></div></div>\n<p>The agentic loop is the core pattern for autonomous task execution. The model doesn't just answer—it performs a sequence of actions:</p>\n<pre><code>1. Send a request to Claude with tools\n2. Receive a response\n3. Check stop_reason:\n   - &quot;tool_use&quot; -&gt; execute the tool, append the result to history, go back to step 1\n   - &quot;end_turn&quot; -&gt; the task is complete, show the result to the user\n4. Repeat until completion\n</code></pre>\n<p><strong>This is a model-driven approach:</strong> Claude decides which tool to call next based on context and prior tool results. This differs from hard-coded decision trees where the action sequence is fixed.</p>\n<p><strong>Anti-patterns (avoid):</strong>\n- Parsing assistant text to detect completion (“Task completed”)\n- Using an arbitrary iteration limit (e.g., <code>max_iterations=5</code>) as the primary stop condition\n- Checking whether the assistant produced textual content as a completion signal</p>\n<p><strong>Correct approach:</strong> the only reliable completion signal is <code>stop_reason == \"end_turn\"</code>.</p>\n<h2 id=\"s-3-2-agentdefinition-configuration\">3.2 <code>AgentDefinition</code> Configuration</h2><div class=\"an\" style=\"--acc:var(--w-crew)\" data-an=\"3.2\"><div class=\"an-top\"><span class=\"an-w\">The film crew</span><span class=\"an-t\">§3.2</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M60 14l20 26 20-26' opacity='.6'/><rect x='42' y='40' width='76' height='104' rx='6'/><rect x='42' y='40' width='76' height='26' rx='6' fill='var(--acc)' opacity='.18'/><path d='M56 54h48'/><circle cx='80' cy='84' r='13'/><path d='M60 82h6M94 82h6' opacity='.5'/><path d='M56 108h30M56 120h30M56 132h30'/><path d='M96 104h10v10H96zM96 116h10v10H96z' fill='var(--acc)' opacity='.25'/><path d='M96 104h10v10H96zM96 116h10v10H96zM96 128h10v10H96z'/><path d='M96 128l10 10M106 128l-10 10' stroke-width='2'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A crew lanyard: name, job, and exactly which kit you may sign out.</p><div class=\"an-lab\">The analogy</div><p>The badge says who you are, what you are here to do, and which three items from the equipment cage you are allowed to take. The cage does not care what your job description aspires to.</p><div class=\"an-snap\"><b>So on the exam →</b> <code>name</code>/<code>description</code>, <code>system_prompt</code>, <code>allowed_tools</code>. The tool list is a whitelist, and least privilege per subagent type is the whole point.</div></div></div></div>\n<p><code>AgentDefinition</code> is the agent configuration object in the Claude Agent SDK:</p>\n<pre><code class=\"language-python\">agent = AgentDefinition(\n    name=&quot;customer_support&quot;,\n    description=&quot;Handles customer requests for returns and order issues&quot;,\n    system_prompt=&quot;You are a customer support agent...&quot;,\n    allowed_tools=[&quot;get_customer&quot;, &quot;lookup_order&quot;, &quot;process_refund&quot;, &quot;escalate_to_human&quot;],\n    # For a coordinator:\n    # allowed_tools=[&quot;Task&quot;, &quot;get_customer&quot;, ...]\n)\n</code></pre>\n<p><strong>Key parameters:</strong>\n- <code>name</code> / <code>description</code> — identification and description of the agent\n- <code>system_prompt</code> — system prompt with instructions\n- <code>allowed_tools</code> — list of allowed tools (principle of least privilege)</p>\n<h2 id=\"s-3-3-hub-and-spoke-coordinator-and-subagents\">3.3 Hub-and-Spoke: Coordinator and Subagents</h2><div class=\"an hi\" style=\"--acc:var(--w-crew)\" data-an=\"3.3\"><div class=\"an-top\"><span class=\"an-w\">The film crew</span><span class=\"an-t\">§3.3</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx='80' cy='80' r='22' fill='var(--acc)' opacity='.18'/><circle cx='80' cy='80' r='22'/><path d='M72 74h16M72 82h16M72 90h10' opacity='.7'/><circle cx='80' cy='20' r='13'/><circle cx='140' cy='80' r='13'/><circle cx='80' cy='140' r='13'/><circle cx='20' cy='80' r='13'/><path d='M80 33v25M127 80h-25M80 127v-25M33 80h25'/><path d='M32 32l36 36' opacity='.35' stroke-dasharray='4 5'/><path d='M40 30l-14 14M26 30l14 14' stroke-width='2.2'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Every line runs through the chair in the middle. The crew-to-crew line is crossed out.</p><div class=\"an-lab\">The analogy</div><p>Camera does not brief sound. Sound does not brief wardrobe. It all goes through the person in the chair — which is precisely how that person knows what happened when something goes wrong at 2am.</p><div class=\"an-snap\"><b>So on the exam →</b> Subagents never communicate directly. The coordinator sees every exchange, handles errors uniformly, and controls what each subagent receives.</div></div></div><div class=\"an-nem\"><span class=\"lab\">⚠ Your record · Missed on Exam 12 Q17</span>Subagents never see the coordinator's history. When one reports it has nothing to work with, the coordinator passes the findings into its prompt &mdash; it does not hand the subagent a new tool to go and fetch them.</div></div>\n<p>A multi-agent architecture is typically built as a hub-and-spoke topology:</p>\n<pre><code>         Coordinator\n        /     |      \\\n   Subagent1  Subagent2  Subagent3\n    (search)   (analysis)   (synthesis)\n</code></pre>\n<p><strong>The coordinator is responsible for:</strong>\n- Decomposing the task into subtasks\n- Deciding which subagents are needed (dynamic selection)\n- Delegating work to subagents\n- Aggregating and validating results\n- Handling errors and retries\n- Communicating results to the user</p>\n<p><strong>Critical principle: subagents have isolated context.</strong>\n- Subagents do <strong>not</strong> automatically inherit the coordinator's conversation history\n- All required context must be <strong>explicitly passed</strong> in the subagent prompt\n- Subagents do not share memory across calls\n- All communication flows through the coordinator (for observability and error control)</p>\n<h2 id=\"s-3-4-the-task-tool-for-spawning-subagents\">3.4 The <code>Task</code> Tool for Spawning Subagents</h2><div class=\"an\" style=\"--acc:var(--w-crew)\" data-an=\"3.4\"><div class=\"an-top\"><span class=\"an-w\">The film crew</span><span class=\"an-t\">§3.4</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='20' y='48' width='34' height='72' rx='6'/><rect x='28' y='58' width='18' height='16' rx='2' fill='var(--acc)' opacity='.25'/><path d='M37 48V24'/><path d='M62 44a26 26 0 0 1 0 34M74 34a40 40 0 0 1 0 54' opacity='.75'/><rect x='104' y='48' width='34' height='72' rx='6'/><rect x='112' y='58' width='18' height='16' rx='2'/><path d='M121 48V30' opacity='.35' stroke-dasharray='3 4'/><path d='M112 22l18 18M130 22l-18 18' stroke-width='2.4'/><path d='M112 96h18M112 108h18' opacity='.5'/><path d='M28 96h18M28 108h18' opacity='.5'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Two directors — one issued a radio, one not.</p><div class=\"an-lab\">The analogy</div><p>You can write 'delegates freely to the crew' into somebody's job description all day long. If nobody handed them a radio, they will quietly do the entire job themselves and you will never hear a word about it.</p><div class=\"an-snap\"><b>So on the exam →</b> A coordinator's <code>allowedTools</code> must include <code>Task</code>. No prompt can grant a tool that the configuration withholds.</div></div></div></div>\n<p>Subagents are spawned via the <code>Task</code> tool:</p>\n<pre><code class=\"language-python\"># The coordinator's allowedTools must include &quot;Task&quot;\ncoordinator_agent = AgentDefinition(\n    allowed_tools=[&quot;Task&quot;, &quot;get_customer&quot;]\n)\n</code></pre>\n<p><strong>Explicit context passing is mandatory:</strong></p>\n<pre><code># Bad: the subagent has no context\nTask: &quot;Analyze the document&quot;\n\n# Good: full context in the prompt\nTask: &quot;Analyze the following document.\nDocument: [full document text]\nPrior search results: [web search results]\nOutput format requirements: [schema]&quot;\n</code></pre>\n<p><strong>Parallel spawning:</strong> a coordinator can call multiple <code>Task</code>s in one response—subagents run in parallel:</p>\n<pre><code># One coordinator response contains:\nTask 1: &quot;Search for articles about X&quot;\nTask 2: &quot;Analyze document Y&quot;\nTask 3: &quot;Search for articles about Z&quot;\n# All three run concurrently\n</code></pre>\n<h2 id=\"s-3-5-hooks-in-the-agent-sdk\">3.5 Hooks in the Agent SDK</h2><div class=\"an\" style=\"--acc:var(--w-crew)\" data-an=\"3.5\"><div class=\"an-top\"><span class=\"an-w\">The film crew</span><span class=\"an-t\">§3.5</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M18 56h40v40H18z'/><path d='M58 66l22-12v52l-22-12z' fill='var(--acc)' opacity='.2'/><path d='M58 66l22-12v52l-22-12z'/><circle cx='114' cy='40' r='12'/><path d='M114 52v34'/><path d='M114 86l-10 34M114 86l10 34'/><path d='M114 62l-14 10M114 62l16-6'/><path d='M130 56l6-12' stroke-width='3'/><path d='M96 30h44' stroke-width='4' stroke-linecap='butt' opacity='.9'/><path d='M96 116h48' stroke-dasharray='6 5' opacity='.5'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A safety officer who physically stops the take before it rolls.</p><div class=\"an-lab\">The analogy</div><p>They do not advise. They do not hope. They stand in front of the camera when the shot breaks the rules, and they do it whether or not the director agrees, on every single take.</p><div class=\"an-snap\"><b>So on the exam →</b> <code>PreToolUse</code> runs before and can block or modify. <code>PostToolUse</code> runs after and reshapes the output. Deterministic code — not an instruction.</div></div></div></div>\n<p>Hooks allow interception and transformation at specific points in the agent lifecycle.</p>\n<p><strong>PostToolUse</strong> intercepts a tool result before it is provided to the model:</p>\n<pre><code class=\"language-python\"># Example: normalize date formats from different MCP tools\n@hook(&quot;PostToolUse&quot;)\ndef normalize_dates(tool_result):\n    # Convert Unix timestamp -&gt; ISO 8601\n    # Convert &quot;Mar 5, 2025&quot; -&gt; &quot;2025-03-05&quot;\n    return normalized_result\n</code></pre>\n<p><strong>Outgoing-call interception hook</strong> blocks actions that violate policy:</p>\n<pre><code class=\"language-python\"># Example: block refunds above $500\n@hook(&quot;PreToolUse&quot;)\ndef enforce_refund_limit(tool_call):\n    if tool_call.name == &quot;process_refund&quot; and tool_call.args.amount &gt; 500:\n        return redirect_to_escalation(tool_call)\n</code></pre>\n<p><strong>Key difference: hooks vs prompt instructions</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Attribute</th>\n<th>Hooks</th>\n<th>Prompt instructions</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Guarantee</td>\n<td><strong>Deterministic</strong> (100%)</td>\n<td><strong>Probabilistic</strong> (&gt;90%, not 100%)</td>\n</tr>\n<tr>\n<td>When to use</td>\n<td>Critical business rules, financial operations, compliance</td>\n<td>General preferences, recommendations, formatting</td>\n</tr>\n<tr>\n<td>Example</td>\n<td>Block refunds &gt; $500</td>\n<td>“Try to solve before escalating”</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Rule:</strong> when failure has financial, legal, or safety consequences—use hooks, not prompts.</p>", "concepts": ["3.1", "3.2", "3.3", "3.4", "3.5"], "keywords": "Chapter 3: Claude Agent SDK — Building Agentic Systems 3.1 What is an Agentic Loop 3.2 `AgentDefinition` Configuration 3.3 Hub-and-Spoke: Coordinator and Subagents 3.4 The `Task` Tool for Spawning Subagents 3.5 Hooks in the Agent SDK"}, {"id": "ch4", "group": "Part I · Theory", "title": "Model Context Protocol (MCP)", "short": "Ch4", "num": "4", "html": "<h1 id=\"s-chapter-4-model-context-protocol-mcp\">Chapter 4: Model Context Protocol (MCP)</h1>\n<blockquote>\n<p>Documentation: <a href=\"https://modelcontextprotocol.io/\">MCP</a> | <a href=\"https://modelcontextprotocol.io/docs/concepts/tools\">Tools</a> | <a href=\"https://modelcontextprotocol.io/docs/concepts/resources\">Resources</a> | <a href=\"https://modelcontextprotocol.io/docs/concepts/servers\">Servers</a></p>\n</blockquote>\n<h2 id=\"s-4-1-what-is-mcp\">4.1 What is MCP</h2><div class=\"an\" style=\"--acc:var(--w-plug)\" data-an=\"4.1\"><div class=\"an-top\"><span class=\"an-w\">The plug standard</span><span class=\"an-t\">§4.1</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='54' y='96' width='52' height='48' rx='6' fill='var(--acc)' opacity='.16'/><rect x='54' y='96' width='52' height='48' rx='6'/><circle cx='70' cy='116' r='5'/><circle cx='90' cy='116' r='5'/><path d='M70 128h20'/><path d='M80 96V76'/><path d='M40 40h80v22H40z'/><path d='M56 62v14M80 62v14M104 62v14'/><rect x='30' y='16' width='24' height='24' rx='4'/><rect x='68' y='12' width='24' height='28' rx='4'/><circle cx='118' cy='28' r='13'/><path d='M56 28h12M106 28h-14' opacity='.5' stroke-dasharray='3 4'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">One socket shape, three very different appliances.</p><div class=\"an-lab\">The analogy</div><p>Before the standard, every appliance shipped with its own strange prongs and its own adapter you inevitably lost. The standard does not make the kettle boil faster. It means the kettle plugs into anything without a bespoke lead.</p><div class=\"an-snap\"><b>So on the exam →</b> MCP is the open protocol connecting Claude to external tools, readable data and prompt templates through one interface.</div></div></div></div>\n<p>The Model Context Protocol (MCP) is an open protocol for connecting external systems to Claude. MCP defines three primary resource types:</p>\n<ol>\n<li><strong>Tools</strong> — functions the agent can call to perform actions (CRUD operations, API calls, command execution)</li>\n<li><strong>Resources</strong> — data the agent can read for context (documentation, database schemas, content catalogs)</li>\n<li><strong>Prompts</strong> — predefined prompt templates for common tasks</li>\n</ol>\n<h2 id=\"s-4-2-mcp-servers\">4.2 MCP Servers</h2><div class=\"an\" style=\"--acc:var(--w-plug)\" data-an=\"4.2\"><div class=\"an-top\"><span class=\"an-w\">The plug standard</span><span class=\"an-t\">§4.2</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='22' y='34' width='92' height='96' rx='7'/><rect x='36' y='50' width='64' height='24' rx='4' fill='var(--acc)' opacity='.2'/><circle cx='48' cy='96' r='9'/><circle cx='68' cy='96' r='9'/><circle cx='88' cy='96' r='9'/><path d='M44 116h48' opacity='.5'/><path d='M120 56h26v54h-26z' fill='var(--acc)' opacity='.12'/><path d='M120 56h26v54h-26z'/><path d='M126 68h14M126 78h14M126 88h9'/><path d='M114 82h6' opacity='.6'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">An appliance with buttons on the front and a booklet in the side pocket.</p><div class=\"an-lab\">The analogy</div><p>The server is the machine. Its buttons are the things you can make it do. It came with a booklet you can read without pressing anything, and a card of pre-written settings for common jobs.</p><div class=\"an-snap\"><b>So on the exam →</b> One server exposes three primitives: tools (actions you call), resources (data you read), prompts (reusable templates).</div></div></div></div>\n<p>An MCP server is a process that implements the MCP protocol and provides tools/resources. When you connect to an MCP server:\n- All tools are discovered automatically\n- Tools from all connected servers are available at once\n- Tool descriptions determine how the model will use them</p>\n<h2 id=\"s-4-3-configuring-mcp-servers\">4.3 Configuring MCP Servers</h2><div class=\"an\" style=\"--acc:var(--w-plug)\" data-an=\"4.3\"><div class=\"an-top\"><span class=\"an-w\">The plug standard</span><span class=\"an-t\">§4.3</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M14 62L52 30l38 32'/><path d='M22 62v72h60V62' /><path d='M34 84h16v16H34z' fill='var(--acc)' opacity='.2'/><path d='M34 84h16v16H34zM56 84h16v16H56z'/><path d='M42 100v34M64 100v34' opacity='.5' stroke-dasharray='3 4'/><path d='M110 44a14 14 0 1 1 0 28 14 14 0 0 1 0-28z'/><path d='M124 58c14 0 18 12 18 22s-6 22-18 26-16-6-16-16 6-16 14-16' /><rect x='96' y='114' width='26' height='18' rx='3' fill='var(--acc)' opacity='.2'/><path d='M96 114h26v18H96z'/><path d='M103 114v-8M115 114v-8'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">The building's wiring versus the extension lead you brought from home.</p><div class=\"an-lab\">The analogy</div><p>The wiring is in the walls — everyone who moves in inherits it. The lead in your bag is yours alone, which is fine right up until you assume your teammate has one too.</p><div class=\"an-snap\"><b>So on the exam →</b> <code>.mcp.json</code> at project root is version-controlled and shared. <code>~/.claude.json</code> is yours only. <code>${VAR}</code> keeps credentials out of the repo.</div></div></div></div>\n<p><strong>Project configuration (<code>.mcp.json</code>)</strong> — for team usage:</p>\n<pre><code class=\"language-json\">{\n  &quot;mcpServers&quot;: {\n    &quot;github&quot;: {\n      &quot;command&quot;: &quot;npx&quot;,\n      &quot;args&quot;: [&quot;-y&quot;, &quot;@modelcontextprotocol/server-github&quot;],\n      &quot;env&quot;: {\n        &quot;GITHUB_TOKEN&quot;: &quot;${GITHUB_TOKEN}&quot;\n      }\n    },\n    &quot;jira&quot;: {\n      &quot;command&quot;: &quot;npx&quot;,\n      &quot;args&quot;: [&quot;-y&quot;, &quot;mcp-server-jira&quot;],\n      &quot;env&quot;: {\n        &quot;JIRA_TOKEN&quot;: &quot;${JIRA_TOKEN}&quot;\n      }\n    }\n  }\n}\n</code></pre>\n<p><strong>Key points:</strong>\n- <code>.mcp.json</code> is stored at the project root and managed in version control\n- Environment variables (<code>${GITHUB_TOKEN}</code>) are used for secrets—tokens themselves are not committed\n- Available to all project contributors</p>\n<p><strong>User configuration (<code>~/.claude.json</code>)</strong> — for personal/experimental servers:\n- Stored in the user's home directory\n- Not shared via version control\n- Suitable for personal experiments and testing</p>\n<p><strong>Choosing servers:</strong>\n- For standard integrations (Jira, GitHub, Slack), prefer existing community MCP servers\n- Build your own servers only for unique, team-specific workflows</p>\n<h2 id=\"s-4-4-the-iserror-flag-in-mcp\">4.4 The <code>isError</code> Flag in MCP</h2><div class=\"an\" style=\"--acc:var(--w-plug)\" data-an=\"4.4\"><div class=\"an-top\"><span class=\"an-w\">The plug standard</span><span class=\"an-t\">§4.4</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='14' y='40' width='58' height='84' rx='6'/><circle cx='43' cy='60' r='9' fill='var(--acc)' opacity='.5'/><circle cx='43' cy='60' r='9'/><path d='M43 55v6' stroke-width='2.4'/><circle cx='43' cy='66' r='1.3' fill='currentColor'/><path d='M28 86h30M28 98h30M28 110h18' opacity='.55'/><path d='M34 34l4-10M52 34l-4-10' opacity='.7'/><rect x='88' y='40' width='58' height='84' rx='6'/><circle cx='117' cy='60' r='9'/><path d='M100 90h34v26h-34z' stroke-dasharray='5 5'/><path d='M108 103h18' opacity='.5'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A lit fault light beside an appliance that simply produced nothing.</p><div class=\"an-lab\">The analogy</div><p>'It broke' and 'it worked, and there was genuinely nothing in there' look identical from across the room, and they lead you to do opposite things. One deserves another go. The other is your answer.</p><div class=\"an-snap\"><b>So on the exam →</b> <code>isError: true</code> when the query could not run. Zero matches is a success with an empty result — never an error.</div></div></div></div>\n<p>When an MCP tool encounters an error, it uses <code>isError: true</code> in the response. This signals to the agent that the call failed.</p>\n<p><strong>Structured error (good):</strong></p>\n<pre><code class=\"language-json\">{\n  &quot;isError&quot;: true,\n  &quot;content&quot;: {\n    &quot;errorCategory&quot;: &quot;transient&quot;,\n    &quot;isRetryable&quot;: true,\n    &quot;message&quot;: &quot;The service is temporarily unavailable. Timeout while calling the orders API.&quot;,\n    &quot;attempted_query&quot;: &quot;order_id=12345&quot;,\n    &quot;partial_results&quot;: null\n  }\n}\n</code></pre>\n<p><strong>Generic error (anti-pattern):</strong></p>\n<pre><code class=\"language-json\">{\n  &quot;isError&quot;: true,\n  &quot;content&quot;: &quot;Operation failed&quot;\n}\n</code></pre>\n<p>A generic error gives the agent no information for decision-making—should it retry, change the query, or escalate?</p>\n<h2 id=\"s-4-5-mcp-resources\">4.5 MCP Resources</h2><div class=\"an\" style=\"--acc:var(--w-plug)\" data-an=\"4.5\"><div class=\"an-top\"><span class=\"an-w\">The plug standard</span><span class=\"an-t\">§4.5</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M18 40c18-8 34-8 44 4v76c-10-12-26-12-44-4z' fill='var(--acc)' opacity='.14'/><path d='M18 40c18-8 34-8 44 4v76c-10-12-26-12-44-4zM106 40c-18-8-34-8-44 4v76c10-12 26-12 44-4z'/><path d='M28 60h22M28 72h22M28 84h14M74 60h22M74 72h22M74 84h14' opacity='.7'/><path d='M126 44h22v22h-22zM126 76h22v22h-22z'/><circle cx='137' cy='120' r='11'/><path d='M137 113v6' opacity='.7'/><path d='M120 36l6-8M154 36l-6-8' opacity='.6'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Reading the contents page, versus pressing every button to find out what the machine does.</p><div class=\"an-lab\">The analogy</div><p>You can discover the menu by pressing all fourteen buttons and watching what happens. Or you can read the two-page contents list that came in the box, and then press exactly the one you needed.</p><div class=\"an-snap\"><b>So on the exam →</b> Resources hand the model a readable map of what data exists, without spending tool calls on exploratory guessing.</div></div></div></div>\n<p>Resources are data that an agent can request to get context without taking actions:</p>\n<ul>\n<li>Content catalogs (e.g., a list of all project tasks, hierarchical navigation)</li>\n<li>Database schemas (understanding data structure)</li>\n<li>Documentation (API references, internal guides)</li>\n<li>Issue/task summaries</li>\n</ul>\n<p><strong>Resource advantage:</strong> the agent does not need exploratory tool calls to understand what data exists. A resource provides an immediate “map.”</p>\n<hr />", "concepts": ["4.1", "4.2", "4.3", "4.4", "4.5"], "keywords": "Chapter 4: Model Context Protocol (MCP) 4.1 What is MCP 4.2 MCP Servers 4.3 Configuring MCP Servers 4.4 The `isError` Flag in MCP 4.5 MCP Resources"}, {"id": "ch5", "group": "Part I · Theory", "title": "Claude Code — config and workflows", "short": "Ch5", "num": "5", "html": "<h1 id=\"s-chapter-5-claude-code-configuration-and-workflows\">Chapter 5: Claude Code — Configuration and Workflows</h1>\n<blockquote>\n<p>Documentation: <a href=\"https://code.claude.com/docs/en/overview\">Claude Code</a> | <a href=\"https://code.claude.com/docs/en/memory\">Memory / CLAUDE.md</a> | <a href=\"https://code.claude.com/docs/en/skills\">Skills</a> | <a href=\"https://code.claude.com/docs/en/mcp\">MCP</a> | <a href=\"https://code.claude.com/docs/en/hooks\">Hooks</a> | <a href=\"https://code.claude.com/docs/en/sub-agents\">Sub-agents</a> | <a href=\"https://code.claude.com/docs/en/github-actions\">GitHub Actions</a> | <a href=\"https://code.claude.com/docs/en/headless\">Headless</a></p>\n</blockquote>\n<h2 id=\"s-5-1-the-claude-md-hierarchy\">5.1 The CLAUDE.md Hierarchy</h2><div class=\"an hi\" style=\"--acc:var(--w-house)\" data-an=\"5.1\"><div class=\"an-top\"><span class=\"an-w\">The house you moved into</span><span class=\"an-t\">§5.1</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M10 46L80 12l70 34'/><path d='M22 46v96h116V46'/><path d='M22 78h116M22 110h116' opacity='.45'/><rect x='34' y='54' width='22' height='18' rx='2' fill='var(--acc)' opacity='.25'/><rect x='34' y='86' width='22' height='18' rx='2' fill='var(--acc)' opacity='.25'/><rect x='34' y='118' width='22' height='18' rx='2' fill='var(--acc)' opacity='.25'/><path d='M34 54h22v18H34zM34 86h22v18H34zM34 118h22v18H34z'/><path d='M56 63h34M56 95h20a14 14 0 0 0 14-14V63M56 127h20a30 30 0 0 0 30-30V63' opacity='.75'/><rect x='96' y='52' width='30' height='22' rx='3'/><path d='M103 60h16M103 67h10' opacity='.7'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Three notes from three floors, all ending up in the same hand.</p><div class=\"an-lab\">The analogy</div><p>Building rules, flat rules, room rules. You do not reach the room and discover the building rules have evaporated — you are holding all three at once. If two of them disagree, that is now a piece of paper you have to go and fix.</p><div class=\"a
