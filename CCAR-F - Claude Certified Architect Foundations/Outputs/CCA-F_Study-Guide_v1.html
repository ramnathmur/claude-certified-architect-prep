he verbose discovery output in a separate context and returns only a concise summary to the main conversation. This preserves the main context window for the collaborative design and consistent implementation phases where retained context is most valuable.</p></div></div>", "concepts": [], "keywords": "Scenario: Code Generation with Claude Code Question 31 (Scenario: Code Generation with Claude Code) Question 32 (Scenario: Code Generation with Claude Code) Question 33 (Scenario: Code Generation with Claude Code) Question 34 (Scenario: Code Generation with Claude Code) Question 35 (Scenario: Code Generation with Claude Code) Question 36 (Scenario: Code Generation with Claude Code) Question 37 (Scenario: Code Generation with Claude Code) Question 38 (Scenario: Code Generation with Claude Code) Question 39 (Scenario: Code Generation with Claude Code) Question 40 (Scenario: Code Generation with Claude Code) Question 41 (Scenario: Code Generation with Claude Code) Question 42 (Scenario: Code Generation with Claude Code) Question 43 (Scenario: Code Generation with Claude Code) Question 44 (Scenario: Code Generation with Claude Code) Question 45 (Scenario: Code Generation with Claude Code)"}, {"id": "pt-supp", "group": "Assessment", "title": "Practice · Customer support (Q46–60)", "short": "PT 46–60", "num": "", "html": "<button class=\"btn\" id=\"revealAll\" style=\"margin:6px 0 14px\">Reveal all answers</button><h2 id=\"s-scenario-customer-support-agent\">Scenario: Customer Support Agent</h2>\n<hr />\n<div class=\"qz\"><div class=\"qh\">Question 46 (Scenario: Customer Support Agent)</div>\n<p><strong>Situation:</strong> While testing, you notice the agent often calls <code>get_customer</code> when users ask about order status, even though <code>lookup_order</code> would be more appropriate. What should you check first to address this problem?</p>\n<p><strong>What should you check first?</strong></p>\n<ul>\n<li>A) Implement a preprocessing classifier to detect order-related requests and route them directly to <code>lookup_order</code>.</li>\n<li>B) Reduce the number of tools available to the agent to simplify choice.</li>\n<li>C) Add few-shot examples to the system prompt covering all possible order request patterns to improve tool selection.</li>\n<li>D) Check the tool descriptions to ensure they clearly differentiate each tool’s purpose.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: D</strong></p>\n<p><strong>Why D:</strong> Tool descriptions are the primary input the model uses to decide which tool to call. When an agent consistently picks the wrong tool, the first diagnostic step is to verify that tool descriptions clearly separate each tool’s purpose and usage boundaries.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 47 (Scenario: Customer Support Agent)</div>\n<p><strong>Situation:</strong> Your agent handles single-issue requests with 94% accuracy (e.g., “I need a refund for order #1234”). But when customers include multiple issues in one message (e.g., “I need a refund for order #1234 and also want to update the shipping address for order #5678”), tool selection accuracy drops to 58%. The agent usually solves only one issue or mixes parameters across requests. What approach most effectively improves reliability for multi-issue requests?</p>\n<p><strong>What approach is most effective?</strong></p>\n<ul>\n<li>A) Implement a preprocessing layer that uses a separate model call to decompose multi-issue messages into separate requests, handle each independently, and merge results.</li>\n<li>B) Combine related tools into fewer universal tools.</li>\n<li>C) Add few-shot examples to the prompt demonstrating correct reasoning and tool sequencing for multi-issue requests.</li>\n<li>D) Implement response validation that detects incomplete answers and automatically reprompts the agent to resolve missed issues.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: C</strong></p>\n<p><strong>Why C:</strong> Few-shot examples that demonstrate correct reasoning and tool sequencing for multi-issue requests are most effective because the agent already performs well on single issues—what it needs is guidance on the pattern for decomposing and routing multiple issues and keeping parameters separated.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 48 (Scenario: Customer Support Agent)</div>\n<p><strong>Situation:</strong> Production logs show that for simple requests like “refund for order #1234,” your agent resolves the issue in 3–4 tool calls with 91% success. But for complex requests like “I was billed twice, my discount didn’t apply, and I want to cancel,” the agent averages 12+ tool calls with only 54% success—often investigating issues sequentially and fetching redundant customer data for each. What change most effectively improves handling of complex requests?</p>\n<p><strong>What change is most effective?</strong></p>\n<ul>\n<li>A) Add explicit verification checkpoints between stages, requiring the agent to record progress after resolving each issue before moving to the next.</li>\n<li>B) Reduce the number of tools by combining <code>get_customer</code>, <code>lookup_order</code>, and billing-related tools into a single <code>investigate_issue</code> tool.</li>\n<li>C) Decompose the request into separate issues, then investigate each in parallel using shared customer context before synthesizing a final resolution.</li>\n<li>D) Add few-shot examples to the system prompt demonstrating ideal tool-call sequences for various multi-faceted billing scenarios.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: C</strong></p>\n<p><strong>Why C:</strong> Decomposing into separate issues and investigating in parallel with shared customer context fixes both key problems: it eliminates redundant data retrieval by reusing shared context across issues and reduces total tool-call loops by parallelizing investigation before synthesizing a single resolution.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 49 (Scenario: Customer Support Agent)</div>\n<p><strong>Situation:</strong> Your agent achieves 55% first-contact resolution, well below the 80% target. Logs show it escalates simple cases (standard replacements for damaged goods with photo proof) while trying to handle complex situations requiring policy exceptions autonomously. What is the most effective way to improve escalation calibration?</p>\n<p><strong>What is the most effective way to improve escalation calibration?</strong></p>\n<ul>\n<li>\n<p>A) Require the agent to self-rate confidence on a 1–10 scale before each response and automatically route to humans when confidence drops below a threshold.</p>\n</li>\n<li>\n<p>B) Deploy a separate classifier model trained on historical tickets to predict which requests need escalation before the main agent starts processing.</p>\n</li>\n<li>C) Add explicit escalation criteria to the system prompt with few-shot examples showing when to escalate versus resolve autonomously.</li>\n<li>D) Implement sentiment analysis to determine customer frustration level and automatically escalate past a negative sentiment threshold.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: C</strong></p>\n<p><strong>Why C:</strong> Explicit escalation criteria with few-shot examples directly address the root cause—unclear decision boundaries between simple and complex cases. It’s the most proportional, effective first intervention that teaches the agent when to escalate and when to resolve autonomously without extra infrastructure.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 50 (Scenario: Customer Support Agent)</div>\n<p><strong>Situation:</strong> After calling <code>get_customer</code> and <code>lookup_order</code>, the agent has all available system data but still faces uncertainty. Which situation is the most justified trigger for calling <code>escalate_to_human</code>?</p>\n<p><strong>Which situation is most justified for escalation?</strong></p>\n<ul>\n<li>A) A customer wants to cancel an order shipped yesterday and arriving tomorrow. The agent should escalate because the customer might change their mind after receiving the package.</li>\n<li>B) A customer claims they didn’t receive an order, but tracking shows it was delivered and signed for at their address three days ago. The agent should escalate because presenting contradictory evidence could harm the customer relationship.</li>\n<li>C) A customer requests competitor price matching. Your policies allow price adjustments for price drops on your own site within 14 days, but say nothing about competitor prices. The agent should escalate for policy interpretation.</li>\n<li>D) A customer message contains both a billing question and a product return. The agent should escalate so a human can coordinate both issues in one interaction.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: C</strong></p>\n<p><strong>Why C:</strong> This is a genuine policy gap: company rules cover price drops on your own site but do not address competitor price matching. The agent must not invent policy and should escalate for human judgment on how to interpret or extend existing rules.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 51 (Scenario: Customer Support Agent)</div>\n<p><strong>Situation:</strong> Production logs show that in 12% of cases your agent skips <code>get_customer</code> and calls <code>lookup_order</code> directly using only the customer-provided name, sometimes leading to misidentified accounts and incorrect refunds. What change most effectively fixes this reliability problem?</p>\n<p><strong>What change is most effective?</strong></p>\n<ul>\n<li>A) Add few-shot examples showing that the agent always calls <code>get_customer</code> first, even when customers voluntarily provide order details.</li>\n<li>B) Implement a routing classifier that analyzes each request and enables only a subset of tools appropriate for that request type.</li>\n<li>C) Add a programmatic precondition that blocks <code>lookup_order</code> and <code>process_refund</code> until <code>get_customer</code> returns a verified customer identifier.</li>\n<li>D) Strengthen the system prompt stating that customer verification via <code>get_customer</code> is mandatory before any order operations.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: C</strong></p>\n<p><strong>Why C:</strong> A programmatic precondition provides a deterministic guarantee that required sequencing is followed. It’s the most effective approach because it eliminates the possibility of skipping verification, regardless of LLM behavior.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 52 (Scenario: Customer Support Agent)</div>\n<p><strong>Situation:</strong> Production metrics show that when resolving complex billing disputes or multi-order returns, customer satisfaction scores are 15% lower than for simple cases—even when the resolution is technically correct. Root-cause analysis shows the agent provides accurate solutions but inconsistently explains rationale: sometimes omitting relevant policy details, sometimes missing timeline info or next steps. The specific context gaps vary case by case. You want to improve solution quality without adding human oversight. What approach is most effective?</p>\n<p><strong>What approach is most effective?</strong></p>\n<ul>\n<li>A) Add a self-critique stage where the agent evaluates a draft response for completeness—ensuring it resolves the customer’s issue, includes relevant context, and anticipates follow-up questions.</li>\n<li>B) Add a confirmation stage where the agent asks “Does this fully resolve your issue?” before closing, allowing customers to request additional information if needed.</li>\n<li>C) Upgrade the model from Haiku to Sonnet for complex cases, routing based on a defined complexity metric.</li>\n<li>D) Implement few-shot examples in the system prompt showing complete explanations for five common complex case types, demonstrating how to include policy context, timelines, and next steps.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> A self-critique stage (the evaluator-optimizer pattern) directly addresses inconsistent explanation completeness by forcing the agent to assess its own draft against concrete criteria—such as policy context, timelines, and next steps—before presenting it. This catches case-specific gaps without human oversight.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 53 (Scenario: Customer Support Agent)</div>\n<p><strong>Situation:</strong> Production metrics show your agent averages 4+ API loops per resolution. Analysis reveals Claude often requests <code>get_customer</code> and <code>lookup_order</code> in separate sequential turns even when both are needed initially. What is the most effective way to reduce the number of loops?</p>\n<p><strong>What is the most effective way to reduce loops?</strong></p>\n<ul>\n<li>A) Implement speculative execution that automatically calls likely-needed tools in parallel with any requested tool and returns all results regardless of what was requested.</li>\n<li>B) Increase <code>max_tokens</code> to give Claude more room to plan and naturally combine tool requests.</li>\n<li>C) Create composite tools like <code>get_customer_with_orders</code> that bundle common lookup combinations into single calls.</li>\n<li>D) Instruct Claude in the prompt to bundle tool requests into one turn and return all results together before the next API call.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: D</strong></p>\n<p><strong>Why D:</strong> Prompting Claude to bundle related tool requests into a single turn leverages its native ability to request multiple tools at once. It directly fixes the sequential-call pattern with minimal architectural change.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 54 (Scenario: Customer Support Agent)</div>\n<p><strong>Situation:</strong> Production logs show a pattern: customers reference specific amounts (e.g., “the 15% discount I mentioned”), but the agent responds with incorrect values. Investigation shows these details were mentioned 20+ turns ago and condensed into vague summaries like “promotional pricing was discussed.” What fix is most effective?</p>\n<p><strong>What fix is most effective?</strong></p>\n<ul>\n<li>A) Increase the summarization threshold from 70% to 85% so conversations have more room before summarization triggers.</li>\n<li>B) Store full conversation history in external storage and implement retrieval when the agent detects references like “as I mentioned.”</li>\n<li>C) Extract transactional facts (amounts, dates, order numbers) into a persistent “case facts” block included in every prompt outside the summarized history.</li>\n<li>D) Revise the summarization prompt to explicitly preserve all numbers, percentages, dates, and customer-stated expectations verbatim.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: C</strong></p>\n<p><strong>Why C:</strong> Summarization inherently loses precise details. Extracting transactional facts into a structured “case facts” block outside the summarized history preserves critical information so it’s reliably available in every prompt regardless of how many turns have been summarized.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 55 (Scenario: Customer Support Agent)</div>\n<p><strong>Situation:</strong> Your <code>get_customer</code> tool returns all matches when searching by name. Currently, when there are multiple results, Claude picks the customer with the most recent order, but production data shows this selects the wrong account 15% of the time for ambiguous matches. How should you address this?</p>\n<p><strong>How should you address this?</strong></p>\n<ul>\n<li>A) Implement a confidence scoring system that acts autonomously above 85% confidence and requests clarification below the threshold.</li>\n<li>B) Instruct Claude to request an additional identifier (email, phone, or order number) when <code>get_customer</code> returns multiple matches before taking any customer-specific action.</li>\n<li>C) Modify <code>get_customer</code> to return only a single most-likely match based on a ranking algorithm, eliminating ambiguity.</li>\n<li>D) Add few-shot examples to the prompt demonstrating correct reasoning and tool sequencing for ambiguous matches.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: B</strong></p>\n<p><strong>Why B:</strong> Asking the user for an additional identifier is the most reliable way to resolve ambiguity because the user has definitive knowledge of their identity. One extra conversational turn is a small price to pay to eliminate a 15% error rate caused by choosing the wrong account.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 56 (Scenario: Customer Support Agent)</div>\n<p><strong>Situation:</strong> Production logs show a consistent pattern: when customers include the word “account” in their message (e.g., “I want to check my account for an order I made yesterday”), the agent calls <code>get_customer</code> first 78% of the time. When customers phrase similar requests without “account” (e.g., “I want to check an order I made yesterday”), it calls <code>lookup_order</code> first 93% of the time. Tool descriptions are clear and unambiguous. What is the most likely root cause of this discrepancy?</p>\n<p><strong>What is the most likely root cause?</strong></p>\n<ul>\n<li>A) The system prompt contains keyword-sensitive instructions that steer behavior based on terms like “account,” creating unintended tool-selection patterns.</li>\n<li>B) The model’s base training creates associations between “account” terminology and customer-related operations that override tool descriptions.</li>\n<li>C) The model needs more training data on multi-concept messages and should be fine-tuned on examples containing both account and order terminology.</li>\n<li>D) Tool descriptions need additional negative examples specifying when NOT to use each tool to prevent this keyword-induced confusion.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> The systematic keyword-driven pattern (78% vs 93%) strongly indicates explicit routing logic in the system prompt reacting to the word “account” and steering the agent toward customer-related tools. Since tool descriptions are already clear, the discrepancy points to prompt-level instructions creating unintended behavioral steering.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 57 (Scenario: Customer Support Agent)</div>\n<p><strong>Situation:</strong> Production logs show the agent often calls <code>get_customer</code> when users ask about orders (e.g., “check my order #12345”) instead of calling <code>lookup_order</code>. Both tools have minimal descriptions (“Gets customer information” / “Gets order details”) and accept similar-looking identifier formats. What is the most effective first step to improve tool selection reliability?</p>\n<p><strong>What is the most effective first step?</strong></p>\n<ul>\n<li>A) Implement a routing layer that analyzes user input before each turn and preselects the correct tool based on detected keywords and ID patterns.</li>\n<li>B) Combine both tools into a single <code>lookup_entity</code> that accepts any identifier and internally decides which backend to query.</li>\n<li>C) Add few-shot examples to the system prompt demonstrating correct tool selection patterns, with 5–8 examples routing order-related queries to <code>lookup_order</code>.</li>\n<li>D) Expand each tool’s description to include input formats, example queries, edge cases, and boundaries explaining when to use it versus similar tools.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: D</strong></p>\n<p><strong>Why D:</strong> Expanding tool descriptions with input formats, example queries, edge cases, and clear boundaries directly fixes the root cause—minimal descriptions that don’t give the LLM enough information to distinguish similar tools. It’s a low-effort, high-impact first step that improves the primary mechanism the LLM uses for tool selection.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 58 (Scenario: Customer Support Agent)</div>\n<p><strong>Situation:</strong> You are implementing the agent loop for your support agent. After each Claude API call, you must decide whether to continue the loop (run requested tools and call Claude again) or stop (present the final answer to the customer). What determines this decision?</p>\n<p><strong>What determines this decision?</strong></p>\n<ul>\n<li>A) Check the <code>stop_reason</code> field in Claude’s response—continue if it is <code>tool_use</code> and stop if it is <code>end_turn</code>.</li>\n<li>B) Parse Claude’s text for phrases like “I’m done” or “Can I help with anything else?”—natural language signals indicate task completion.</li>\n<li>C) Set a maximum iteration count (e.g., 10 calls) and stop when reached, regardless of whether Claude indicates more work is needed.</li>\n<li>D) Check whether the response contains assistant text content—if Claude generated explanatory text, the loop should terminate.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> <code>stop_reason</code> is Claude’s explicit structured signal for loop control: <code>tool_use</code> indicates Claude wants to run a tool and receive results back, while <code>end_turn</code> indicates Claude has completed its response and the loop should end.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 59 (Scenario: Customer Support Agent)</div>\n<p><strong>Situation:</strong> Production logs show the agent misinterprets outputs from your MCP tools: Unix timestamps from <code>get_customer</code>, ISO 8601 dates from <code>lookup_order</code>, and numeric status codes (1=pending, 2=shipped). Some tools are third-party MCP servers you cannot modify. Which approach to data format normalization is most maintainable?</p>\n<p><strong>Which approach is most maintainable?</strong></p>\n<ul>\n<li>A) Use a PostToolUse hook to intercept tool outputs and apply formatting transformations before the agent processes them.</li>\n<li>B) Modify tools you control to return human-readable formats and create wrappers for third-party tools.</li>\n<li>C) Create a <code>normalize_data</code> tool that the agent calls after every data retrieval to transform values.</li>\n<li>D) Add detailed format documentation to the system prompt explaining each tool’s data conventions.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> A PostToolUse hook provides a centralized, deterministic point to intercept and normalize all tool outputs—including third-party MCP server data—before the agent processes them. It’s more maintainable because transformations live in code and apply uniformly, rather than relying on LLM interpretation.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 60 (Scenario: Customer Support Agent)</div>\n<p><strong>Situation:</strong> Production logs show the agent sometimes chooses <code>get_customer</code> when <code>lookup_order</code> would be more appropriate, especially for ambiguous queries like “I need help with my recent purchase.” You decide to add few-shot examples to the system prompt to improve tool selection. Which approach most effectively addresses the problem?</p>\n<p><strong>Which approach is most effective?</strong></p>\n<ul>\n<li>A) Add explicit “use when” and “don’t use when” guidance in each tool description covering ambiguous cases.</li>\n<li>B) Add examples grouped by tool—all <code>get_customer</code> scenarios together, then all <code>lookup_order</code> scenarios.</li>\n<li>C) Add 4–6 examples targeted at ambiguous scenarios, each with rationale for why one tool was chosen over plausible alternatives.</li>\n<li>D) Add 10–15 examples of clear, unambiguous requests demonstrating correct tool choice for typical scenarios for each tool.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: C</strong></p>\n<p><strong>Why C:</strong> Targeting few-shot examples at the specific ambiguous scenarios where errors occur, with explicit rationale for why one tool is preferable to alternatives, teaches the model the comparative decision process needed for edge cases. This is more effective than generic examples or declarative rules.</p></div></div>", "concepts": [], "keywords": "Scenario: Customer Support Agent Question 46 (Scenario: Customer Support Agent) Question 47 (Scenario: Customer Support Agent) Question 48 (Scenario: Customer Support Agent) Question 49 (Scenario: Customer Support Agent) Question 50 (Scenario: Customer Support Agent) Question 51 (Scenario: Customer Support Agent) Question 52 (Scenario: Customer Support Agent) Question 53 (Scenario: Customer Support Agent) Question 54 (Scenario: Customer Support Agent) Question 55 (Scenario: Customer Support Agent) Question 56 (Scenario: Customer Support Agent) Question 57 (Scenario: Customer Support Agent) Question 58 (Scenario: Customer Support Agent) Question 59 (Scenario: Customer Support Agent) Question 60 (Scenario: Customer Support Agent)"}, {"id": "pt-conv", "group": "Assessment", "title": "Practice · Conversational AI (Q61–76)", "short": "PT 61–76", "num": "", "html": "<button class=\"btn\" id=\"revealAll\" style=\"margin:6px 0 14px\">Reveal all answers</button><div class=\"qz\"><div class=\"qh\">Question 61 (Scenario: Conversational AI Architecture Patterns)</div>\n<p><strong>Situation:</strong> Your <code>remove_team_member</code> tool uses a <code>dry_run: boolean</code> parameter for previewing impacts before execution. Production monitoring shows the agent bypasses the preview step by calling with <code>dry_run=false</code> directly. You need to ensure every removal is preceded by a preview that the user explicitly confirms.</p>\n<p><strong>What is the most reliable approach?</strong></p>\n<ul>\n<li>A) Add server-side validation that permits <code>dry_run=false</code> only when a <code>dry_run=true</code> call with identical parameters occurred within the past 60 seconds.</li>\n<li>B) Annotate the tool as requiring confirmation and configure the orchestration layer to prompt the user for approval before forwarding any calls to annotated tools.</li>\n<li>C) Add detailed instructions and few-shot examples to the tool description requiring the agent to always call with <code>dry_run=true</code> first and wait for user confirmation before calling again.</li>\n<li>D) Replace with two tools: <code>preview_remove_member</code> returns impact details and a single-use confirmation token; <code>execute_remove_member</code> requires that token, binding execution to the preview.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: D</strong></p>\n<p><strong>Why D:</strong> The two-tool token-binding approach makes it architecturally impossible to execute without a prior preview—the execute tool literally requires a token that only the preview tool can generate. This is the only approach that enforces the constraint at the code level rather than relying on LLM compliance with instructions (C), timing heuristics (A), or orchestration infrastructure (B).</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 62 (Scenario: Conversational AI Architecture Patterns)</div>\n<p><strong>Situation:</strong> Production monitoring shows your <code>search_catalog</code> tool fails 12% of the time: 8% are network timeouts that succeed when retried, and 4% are query syntax errors that never succeed regardless of retries. Currently both error types are returned identically, causing wasted retries.</p>\n<p><strong>How should you modify the tool's error handling?</strong></p>\n<ul>\n<li>A) Add few-shot examples to your system prompt demonstrating how to distinguish network errors from syntax errors.</li>\n<li>B) Apply exponential backoff retry logic to all errors uniformly.</li>\n<li>C) Implement automatic retry with backoff for network timeouts inside the tool; return syntax errors immediately with parameter validation details.</li>\n<li>D) Return all errors with a <code>retryable</code> boolean flag and error type details.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: C</strong></p>\n<p><strong>Why C:</strong> Handling retries at the tool level for transient errors is the correct abstraction boundary—the tool has definitive knowledge of the error type and can implement deterministic retry logic without relying on the agent to interpret a flag (D) or follow prompt-level instructions (A). Uniform backoff (B) wastes time on syntax errors that will never succeed.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 63 (Scenario: Conversational AI Architecture Patterns)</div>\n<p><strong>Situation:</strong> Over several turns discussing investment strategy, a user stated \"I have a very low risk tolerance\" and later \"I want to maximize my returns.\" They now ask: \"What should I invest in?\"</p>\n<p><strong>Which approach best ensures the recommendation aligns with the user's actual priority?</strong></p>\n<ul>\n<li>A) Surface the contradiction and ask the user to clarify which matters more.</li>\n<li>B) Provide separate recommendations for both scenarios.</li>\n<li>C) Proceed with the most recently stated preference.</li>\n<li>D) Recommend a balanced portfolio without addressing the conflict.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> When user preferences directly contradict each other, surfacing the conflict and asking for clarification is the only way to guarantee the recommendation aligns with the user's true intent. Any other approach involves making an assumption that may be wrong—maximizing returns and low risk tolerance are fundamentally incompatible goals that require a human decision.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 64 (Scenario: Conversational AI Architecture Patterns)</div>\n<p><strong>Situation:</strong> Users refine playlist preferences over multiple conversation turns. Two messages after a user said \"I love jazz,\" Claude asks \"What genres do you enjoy?\"</p>\n<p><strong>What is the most likely cause?</strong></p>\n<ul>\n<li>A) Claude requires a vector database connection to maintain conversation memory.</li>\n<li>B) The model's context window has been exceeded.</li>\n<li>C) The Claude API requires a <code>session_id</code> parameter.</li>\n<li>D) Your application isn't including prior messages in the <code>messages</code> array.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: D</strong></p>\n<p><strong>Why D:</strong> Claude has no server-side memory—every API call is stateless. Without including the full conversation history in the <code>messages</code> array of each request, Claude has no knowledge of prior turns. Vector databases (A) and <code>session_id</code> (C) are not part of Claude's architecture; context window overflow (B) is impossible for two-message exchanges.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 65 (Scenario: Conversational AI Architecture Patterns)</div>\n<p><strong>Situation:</strong> After a 40-minute cooking session, the conversation reaches 78,000 tokens. History includes allergies, recipe scaling, clarified cooking terms, and general discussion. You must reduce tokens while preserving important information.</p>\n<p><strong>What approach best balances preservation with token reduction?</strong></p>\n<ul>\n<li>A) Summarize the entire conversation history.</li>\n<li>B) Keep only the most recent 20,000 tokens.</li>\n<li>C) Extract critical structured data (allergies, quantities, preferences), summarize general discussion, and keep recent exchanges verbatim.</li>\n<li>D) Store the full conversation externally and retrieve relevant parts via semantic search.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: C</strong></p>\n<p><strong>Why C:</strong> The hybrid approach preserves the highest-value information at the lowest cost. Critical facts like allergies and recipe quantities are extracted into a compact structured block (preventing the precision loss that occurs during summarization), general discussion is summarized, and recent exchanges are kept verbatim for conversational coherence. Options A and B risk losing critical dietary information; D is architectural overkill for a single cooking session.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 66 (Scenario: Conversational AI Architecture Patterns)</div>\n<p><strong>Situation:</strong> Users report that during extended conversations the assistant loses track of earlier topics and preferences. Your current implementation keeps only the last 25 message pairs.</p>\n<p><strong>What is the most effective solution?</strong></p>\n<ul>\n<li>A) Hybrid approach: summarize older messages while keeping recent ones verbatim.</li>\n<li>B) Vector similarity search over the full conversation history.</li>\n<li>C) Increase the window to 50 message pairs.</li>\n<li>D) Summarize dropped messages every turn and prepend the running summary.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> The hybrid approach addresses both dimensions of the problem: retaining exact recent context (critical for conversational coherence) while maintaining a compressed representation of earlier preferences (preventing total loss when pairs are dropped). Increasing the window (C) simply delays the same problem. Vector search (B) may miss important context that isn't semantically similar to the current query. Full per-turn summarization (D) adds overhead and accumulates summarization errors.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 67 (Scenario: Conversational AI Architecture Patterns)</div>\n<p><strong>Situation:</strong> Users report that latency increases and costs rise when conversations exceed 50 turns.</p>\n<p><strong>What is the primary cause?</strong></p>\n<ul>\n<li>A) The entire conversation history is included with each API request.</li>\n<li>B) The model generates progressively longer responses.</li>\n<li>C) Database operations slow down as history grows.</li>\n<li>D) The model builds an internal user profile requiring more processing.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> Claude's API is fully stateless—every request must include the complete conversation history in the <code>messages</code> array. As conversations grow, each request carries more tokens, which directly increases both processing latency and cost. The model does not maintain any internal state between calls (D is false), and response length is not inherently tied to conversation length (B).</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 68 (Scenario: Conversational AI Architecture Patterns)</div>\n<p><strong>Situation:</strong> After three months of weekly sessions, conversation history grows to 85,000 tokens. When a user asks \"What did we conclude about the theme of isolation?\", the assistant gives generic answers instead of referencing previous discussions.</p>\n<p><strong>What is the most effective approach?</strong></p>\n<ul>\n<li>A) Rolling window truncation.</li>\n<li>B) Progressive summarization capturing key conclusions.</li>\n<li>C) Semantic embeddings with retrieval of relevant exchanges.</li>\n<li>D) Add structured XML tags marking discussion conclusions.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: C</strong></p>\n<p><strong>Why C:</strong> Semantic search over conversation history is the only approach that scales to three months of discussion while being able to surface specific relevant exchanges on demand. Rolling window (A) would discard most of the history. Progressive summarization (B) compresses discussions into abstractions that lose the specific conclusions users are asking about. XML tags (D) require restructuring all past content and don't solve the retrieval problem at this scale.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 69 (Scenario: Conversational AI Architecture Patterns)</div>\n<p><strong>Situation:</strong> During QA testing, Claude follows system prompt guidelines for the first 10–15 turns, but later responses deviate. The conversation is still within token limits.</p>\n<p><strong>What is the best solution?</strong></p>\n<ul>\n<li>A) Move behavioral guidelines into the first user message.</li>\n<li>B) Start a new conversation after 20 turns.</li>\n<li>C) Insert user-role messages reinforcing guidelines at conversation breakpoints.</li>\n<li>D) Use post-response validation to regenerate non-compliant responses.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: C</strong></p>\n<p><strong>Why C:</strong> Periodic injection of behavioral reminders directly combats instruction drift by re-establishing constraints at regular intervals as conversation history accumulates. Moving guidelines to the first user message (A) reduces their authority. Starting a new conversation (B) destroys context. Post-response validation (D) is corrective rather than preventive and adds significant latency.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 70 (Scenario: Conversational AI Architecture Patterns)</div>\n<p><strong>Situation:</strong> Your AI tutor has a 2,800-token system prompt defining teaching methodology and adaptation rules. After 12 turns, the assistant starts ignoring proficiency levels.</p>\n<p><strong>What is the most effective fix?</strong></p>\n<ul>\n<li>A) Inject reminders every 4–5 turns.</li>\n<li>B) Replace verbose rules with few-shot examples demonstrating proficiency-level adaptation.</li>\n<li>C) Place critical rules at the end of the system prompt.</li>\n<li>D) Evaluate responses and regenerate if difficulty level mismatches.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: B</strong></p>\n<p><strong>Why B:</strong> A 2,800-token system prompt with declarative rules is vulnerable to drift because abstract rules require the model to reason about them on every turn. Replacing verbose rules with concrete few-shot examples that demonstrate correct proficiency-level adaptation gives the model clear behavioral patterns to match—this is more reliably followed across many turns than abstract instructions. Reminder injection (A) helps but addresses symptoms; end-placement (C) helps initially but not with turn-level drift; regeneration (D) is expensive and corrective.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 71 (Scenario: Conversational AI Architecture Patterns)</div>\n<p><strong>Situation:</strong> Your assistant must maintain an enthusiastic tone, explain its reasoning, and ask clarifying questions. Where should these behavioral guidelines be defined?</p>\n<p><strong>Where should these behavioral guidelines be defined?</strong></p>\n<ul>\n<li>A) Prepended to each user message.</li>\n<li>B) In the system prompt.</li>\n<li>C) In the first assistant message.</li>\n<li>D) In environment variables.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: B</strong></p>\n<p><strong>Why B:</strong> The system prompt is specifically designed for persistent behavioral constraints and guidelines that apply throughout the entire conversation. Prepending to each user message (A) is redundant overhead. The first assistant message (C) is unreliable because the model can deviate from its own prior statements. Environment variables (D) have no effect on model behavior.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 72 (Scenario: Conversational AI Architecture Patterns)</div>\n<p><strong>Situation:</strong> Users report repetitive response openings like \"Certainly!\" and \"I'd be happy to help!\"</p>\n<p><strong>What is the most effective approach?</strong></p>\n<ul>\n<li>A) Append a partial assistant message with a direct response opening.</li>\n<li>B) Lower the temperature setting.</li>\n<li>C) Post-process responses to remove greetings.</li>\n<li>D) Add system prompt instructions to avoid those phrases.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> Prefilling the assistant's response with the beginning of a direct answer prevents greeting patterns at the generation level—the model continues from the prefill rather than generating new opening phrases. System prompt instructions (D) can help but are less reliable since the model may still produce variants. Post-processing (C) is a fragile workaround. Temperature (B) controls randomness, not specific phrase patterns.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 73 (Scenario: Conversational AI Architecture Patterns)</div>\n<p><strong>Situation:</strong> A webhook notifies your system that a user's package has shipped while the user is actively chatting. You want the assistant to incorporate this naturally into the next response.</p>\n<p><strong>What is the best approach?</strong></p>\n<ul>\n<li>A) Add shipping status to the system prompt.</li>\n<li>B) Send an immediate synthetic user message.</li>\n<li>C) Force the assistant to call a status tool on each turn.</li>\n<li>D) Append the status update as a prefix to the next user message.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: D</strong></p>\n<p><strong>Why D:</strong> Prefixing the status update to the next user message injects real-time context at a natural conversation boundary without disrupting the flow. Modifying the system prompt (A) requires rebuilding the session or is architecturally cumbersome. A synthetic user message (B) can break the natural dialogue flow and confuse attribution. Forcing a tool call each turn (C) is wasteful when events are rare.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 74 (Scenario: Conversational AI Architecture Patterns)</div>\n<p><strong>Situation:</strong> Users frequently send requests like \"Book a venue for the party.\" The assistant asks 4+ clarifying questions, causing 35% abandonment.</p>\n<p><strong>What approach best improves the trade-off?</strong></p>\n<ul>\n<li>A) Proceed with hidden defaults.</li>\n<li>B) Ask all clarifying questions in one compound message.</li>\n<li>C) State assumptions explicitly and proceed while inviting corrections.</li>\n<li>D) Use a structured intake form.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: C</strong></p>\n<p><strong>Why C:</strong> Stating assumptions explicitly and proceeding gives the user an immediate, useful response while preserving their ability to correct wrong assumptions. Hidden defaults (A) leave the user unaware of what was assumed. A compound question list (B) still demands upfront effort from the user. A structured form (D) adds more friction, not less—contradicting the goal of reducing abandonment.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 75 (Scenario: Conversational AI Architecture Patterns)</div>\n<p><strong>Situation:</strong> Your assistant uses a contractor-persona system prompt. Early turns follow the rules, but by turn 7 the assistant gives generic advice. Conversation length is only 2,500 tokens.</p>\n<p><strong>What is the most likely cause?</strong></p>\n<ul>\n<li>A) System prompts only establish initial behavior.</li>\n<li>B) Model attention weakens as turns accumulate.</li>\n<li>C) Accumulated assistant responses dilute system prompt influence.</li>\n<li>D) The system prompt is only sent once.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: C</strong></p>\n<p><strong>Why C:</strong> As assistant responses accumulate in the conversation history, the proportion of text reflecting the system prompt's behavioral constraints decreases relative to the growing body of assistant-generated content. The model increasingly pattern-matches to its own prior outputs rather than the system prompt, compounding drift even at short token lengths. The system prompt is included in every API call (D is false as a standalone explanation), and model attention degradation (B) doesn't operate at 2,500 tokens.</p></div></div>\n<div class=\"qz\"><div class=\"qh\">Question 76 (Scenario: Conversational AI Architecture Patterns)</div>\n<p><strong>Situation:</strong> Users ask vague requests like \"Can you help with the report?\" The assistant responds by asking multiple questions (which report? what help? deadline?), causing 40% abandonment.</p>\n<p><strong>What is the best solution?</strong></p>\n<ul>\n<li>A) Make reasonable assumptions, state them explicitly, and offer to adjust.</li>\n<li>B) Classify ambiguity with a smaller model before responding.</li>\n<li>C) Use predefined interpretations without stating assumptions.</li>\n<li>D) Limit the assistant to one clarifying question per turn.</li>\n</ul><button class=\"rv\">Reveal answer</button><div class=\"ans\"><p><strong>Correct answer: A</strong></p>\n<p><strong>Why A:</strong> Proceeding with reasonable stated assumptions eliminates the back-and-forth entirely while keeping the user informed and in control. Predefined silent interpretations (C) leave users confused when the response doesn't match their intent. A single-question limit (D) still requires turns of back-and-forth. A smaller classification model (B) adds latency and infrastructure complexity without solving the core UX problem.</p></div></div>", "concepts": [], "keywords": "Question 61 (Scenario: Conversational AI Architecture Patterns) Question 62 (Scenario: Conversational AI Architecture Patterns) Question 63 (Scenario: Conversational AI Architecture Patterns) Question 64 (Scenario: Conversational AI Architecture Patterns) Question 65 (Scenario: Conversational AI Architecture Patterns) Question 66 (Scenario: Conversational AI Architecture Patterns) Question 67 (Scenario: Conversational AI Architecture Patterns) Question 68 (Scenario: Conversational AI Architecture Patterns) Question 69 (Scenario: Conversational AI Architecture Patterns) Question 70 (Scenario: Conversational AI Architecture Patterns) Question 71 (Scenario: Conversational AI Architecture Patterns) Question 72 (Scenario: Conversational AI Architecture Patterns) Question 73 (Scenario: Conversational AI Architecture Patterns) Question 74 (Scenario: Conversational AI Architecture Patterns) Question 75 (Scenario: Conversational AI Architecture Patterns) Question 76 (Scenario: Conversational AI Architecture Patterns)"}, {"id": "exercises", "group": "Closing", "title": "Practical exercises", "short": "Exercises", "num": "", "html": "<h1 id=\"s-practical-exercises\">Practical Exercises</h1>\n<h2 id=\"s-exercise-1-multi-tool-agent-with-escalation-logic\">Exercise 1: Multi-tool Agent with Escalation Logic</h2>\n<p><strong>Goal:</strong> Design an agent loop with tool integration, structured error handling, and escalation.</p>\n<p><strong>Steps:</strong>\n1. Define 3–4 MCP tools with detailed descriptions (include two similar tools to test tool selection)\n2. Implement an agent loop checking <code>stop_reason</code> (<code>\"tool_use\"</code> / <code>\"end_turn\"</code>)\n3. Add structured error responses: <code>errorCategory</code>, <code>isRetryable</code>, description\n4. Implement an interceptor hook that blocks operations above a threshold and routes to escalation\n5. Test with multi-aspect requests</p>\n<p><strong>Domains:</strong> 1 (Agent architecture), 2 (Tools and MCP), 5 (Context and reliability)</p>\n<hr />\n<h2 id=\"s-exercise-2-configuring-claude-code-for-team-development\">Exercise 2: Configuring Claude Code for Team Development</h2>\n<p><strong>Goal:</strong> Configure CLAUDE.md, custom commands, path-specific rules, and MCP servers.</p>\n<p><strong>Steps:</strong>\n1. Create a project-level CLAUDE.md with universal standards\n2. Create <code>.claude/rules/</code> files with YAML frontmatter for different code areas (<code>paths: [\"src/api/**/*\"]</code>, <code>paths: [\"**/*.test.*\"]</code>)\n3. Create a project skill under <code>.claude/skills/</code> with <code>context: fork</code> and <code>allowed-tools</code>\n4. Configure an MCP server in <code>.mcp.json</code> with environment variables + a personal override in <code>~/.claude.json</code>\n5. Test planning mode vs direct execution on tasks of different complexity</p>\n<p><strong>Domains:</strong> 3 (Claude Code configuration), 2 (Tools and MCP)</p>\n<hr />\n<h2 id=\"s-exercise-3-structured-data-extraction-pipeline\">Exercise 3: Structured Data Extraction Pipeline</h2>\n<p><strong>Goal:</strong> JSON schemas, <code>tool_use</code> for structured output, validation/retry loops, batch processing.</p>\n<p><strong>Steps:</strong>\n1. Define an extraction tool with a JSON schema (required/optional fields, enums with \"other\", nullable fields)\n2. Build a validation loop: on error, retry with the document, the incorrect extraction, and the specific validation error\n3. Add few-shot examples for documents with different structures\n4. Use batch processing via the Message Batches API: 100 documents, handle failures via <code>custom_id</code>\n5. Route to humans: field-level confidence scores, document-type analysis</p>\n<p><strong>Domains:</strong> 4 (Prompt engineering), 5 (Context and reliability)</p>\n<hr />\n<h2 id=\"s-exercise-4-designing-and-debugging-a-multi-agent-research-pi\">Exercise 4: Designing and Debugging a Multi-agent Research Pipeline</h2>\n<p><strong>Goal:</strong> Subagent orchestration, context passing, error propagation, synthesis with source tracking.</p>\n<p><strong>Steps:</strong>\n1. A coordinator with 2+ subagents (<code>allowedTools</code> includes <code>\"Task\"</code>, context is passed explicitly in prompts)\n2. Run subagents in parallel via multiple <code>Task</code> calls in a single response\n3. Require structured subagent output: claim, quote, source URL, publication date\n4. Simulate a subagent timeout: return structured error context to the coordinator and continue with partial results\n5. Test with conflicting data: preserve both values with attribution; separate confirmed vs disputed findings</p>\n<p><strong>Domains:</strong> 1 (Agent architecture), 2 (Tools and MCP), 5 (Context and reliability)</p>\n<hr />", "concepts": [], "keywords": "Practical Exercises Exercise 1: Multi-tool Agent with Escalation Logic Exercise 2: Configuring Claude Code for Team Development Exercise 3: Structured Data Extraction Pipeline Exercise 4: Designing and Debugging a Multi-agent Research Pipeline"}, {"id": "appendix", "group": "Closing", "title": "Appendix — technologies and concepts", "short": "Appendix", "num": "", "html": "<h1 id=\"s-appendix-technologies-and-concepts\">Appendix: Technologies and Concepts</h1>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Technology</th>\n<th>Key aspects</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Claude Agent SDK</strong></td>\n<td>AgentDefinition, agent loops, <code>stop_reason</code>, hooks (PostToolUse), spawning subagents via Task, <code>allowedTools</code></td>\n</tr>\n<tr>\n<td><strong>Model Context Protocol (MCP)</strong></td>\n<td>MCP servers, tools, resources, <code>isError</code>, tool descriptions, <code>.mcp.json</code>, environment variables</td>\n</tr>\n<tr>\n<td><strong>Claude Code</strong></td>\n<td>CLAUDE.md hierarchy, <code>.claude/rules/</code> with glob patterns, <code>.claude/commands/</code>, <code>.claude/skills/</code> with SKILL.md, planning mode, <code>/compact</code>, <code>--resume</code>, <code>fork_session</code></td>\n</tr>\n<tr>\n<td><strong>Claude Code CLI</strong></td>\n<td><code>-p</code> / <code>--print</code> for non-interactive mode, <code>--output-format json</code>, <code>--json-schema</code></td>\n</tr>\n<tr>\n<td><strong>Claude API</strong></td>\n<td><code>tool_use</code> with JSON schemas, <code>tool_choice</code> (\"auto\"/\"any\"/forced), <code>stop_reason</code>, <code>max_tokens</code>, system prompts</td>\n</tr>\n<tr>\n<td><strong>Message Batches API</strong></td>\n<td>50% savings, up to 24-hour window, <code>custom_id</code>, no multi-turn tool calling</td>\n</tr>\n<tr>\n<td><strong>JSON Schema</strong></td>\n<td>Required vs optional, nullable fields, enum types, \"other\" + detail, strict mode</td>\n</tr>\n<tr>\n<td><strong>Pydantic</strong></td>\n<td>Schema validation, semantic errors, validation/retry loops</td>\n</tr>\n<tr>\n<td><strong>Built-in tools</strong></td>\n<td>Read, Write, Edit, Bash, Grep, Glob — purpose and selection criteria</td>\n</tr>\n<tr>\n<td><strong>Few-shot prompting</strong></td>\n<td>Targeted examples for ambiguous situations, generalization to new patterns</td>\n</tr>\n<tr>\n<td><strong>Prompt chaining</strong></td>\n<td>Sequential decomposition into focused passes</td>\n</tr>\n<tr>\n<td><strong>Context window</strong></td>\n<td>Token budgets, progressive summarization, \"lost in the middle\", scratchpad files</td>\n</tr>\n<tr>\n<td><strong>Session management</strong></td>\n<td>Resume, <code>fork_session</code>, named sessions, context isolation</td>\n</tr>\n<tr>\n<td><strong>Confidence calibration</strong></td>\n<td>Field-level scoring, calibration on labeled sets, stratified sampling</td>\n</tr>\n</tbody>\n</table></div>\n<hr />", "concepts": [], "keywords": "Appendix: Technologies and Concepts"}, {"id": "scope", "group": "Closing", "title": "Out-of-scope topics", "short": "Out of scope", "num": "", "html": "<h1 id=\"s-out-of-scope-topics\">Out-of-Scope Topics</h1>\n<p>The following adjacent topics will <strong>NOT</strong> be on the exam:</p>\n<ul>\n<li>Fine-tuning Claude models or training custom models</li>\n<li>Claude API authentication, billing, or account management</li>\n<li>Detailed implementation in specific programming languages or frameworks (beyond what’s needed for tool/schema configuration)</li>\n<li>Deploying or hosting MCP servers (infrastructure, networking, container orchestration)</li>\n<li>Claude’s internal architecture, training process, or model weights</li>\n<li>Constitutional AI, RLHF, or safety training methodologies</li>\n<li>Embedding models or vector database implementation details</li>\n<li>Computer use (browser automation, desktop interaction)</li>\n<li>Image analysis capabilities (Vision)</li>\n<li>Streaming API or server-sent events</li>\n<li>Rate limiting, quotas, or detailed API cost calculations</li>\n<li>OAuth, API key rotation, or authentication protocol details</li>\n<li>Cloud-provider-specific configurations (AWS, GCP, Azure)</li>\n<li>Performance benchmarks or model comparison metrics</li>\n<li>Prompt caching implementation details (beyond knowing it exists)</li>\n<li>Token counting algorithms or tokenization specifics</li>\n</ul>\n<hr />", "concepts": [], "keywords": "Out-of-Scope Topics"}, {"id": "prep", "group": "Closing", "title": "Preparation recommendations", "short": "Prep", "num": "", "html": "<h1 id=\"s-preparation-recommendations\">Preparation Recommendations</h1>\n<ol>\n<li>\n<p><strong>Build an agent with the Claude Agent SDK</strong> — implement a full agent loop with tool calling, error handling, and session management. Practice subagents and explicit context passing.</p>\n</li>\n<li>\n<p><strong>Configure Claude Code for a real project</strong> — use CLAUDE.md hierarchy, path-specific rules in <code>.claude/rules/</code>, skills with <code>context: fork</code> and <code>allowed-tools</code>, and MCP server integration.</p>\n</li>\n<li>\n<p><strong>Design and test MCP tools</strong> — write descriptions that differentiate similar tools, return structured errors with categories and retry flags, and test against ambiguous user requests.</p>\n</li>\n<li>\n<p><strong>Build a data extraction pipeline</strong> — use <code>tool_use</code> with JSON schemas, validation/retry loops, optional/nullable fields, and batch processing via the Message Batches API.</p>\n</li>\n<li>\n<p><strong>Practice prompt engineering</strong> — add few-shot examples for ambiguous scenarios, explicit review criteria, and multi-pass architectures for large code reviews.</p>\n</li>\n<li>\n<p><strong>Study context management patterns</strong> — extract facts from verbose outputs, use scratchpad files, and delegate discovery to subagents to handle context limits.</p>\n</li>\n<li>\n<p><strong>Understand escalation and human-in-the-loop</strong> — when to escalate (policy gaps, explicit user request, inability to make progress) and confidence-based routing workflows.</p>\n</li>\n<li>\n<p><strong>Take a practice exam</strong> before the real one. It uses the same scenarios and format.</p>\n</li>\n</ol>", "concepts": [], "keywords": "Preparation Recommendations"}, {"id": "cram", "group": "Extra", "title": "Cram mode — all 65 pictures", "short": "Cram", "num": "", "html": "", "concepts": [], "keywords": "cram revision analogies pictures"}];
const ANALOGIES = [{"id": "1.1", "title": "API Request Structure", "picture": "One envelope with the entire correspondence stuffed inside.", "snapback": "Every request carries <code>model</code>, <code>max_tokens</code> and <code>messages[]</code> — and <code>messages[]</code> is the full history, not the latest turn.", "html": "<div class=\"an\" style=\"--acc:var(--w-post)\" data-an=\"1.1\"><div class=\"an-top\"><span class=\"an-w\">The postal service</span><span class=\"an-t\">§1.1</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M18 44h124v78H18z'/><path d='M18 44l62 44 62-44'/><rect x='46' y='16' width='68' height='42' rx='3' fill='var(--acc)' opacity='.16'/><path d='M46 16h68v42H46z'/><path d='M56 27h48M56 36h48M56 45h30'/><path d='M38 62v46M52 70v38' opacity='.45'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">One envelope with the entire correspondence stuffed inside.</p><div class=\"an-lab\">The analogy</div><p>You never post just the reply. You post the whole conversation again — every letter either of you has ever sent, re-copied, with the new one on top. The postal service has the memory of a goldfish and charges you by weight.</p><div class=\"an-snap\"><b>So on the exam →</b> Every request carries <code>model</code>, <code>max_tokens</code> and <code>messages[]</code> — and <code>messages[]</code> is the full history, not the latest turn.</div></div></div></div>", "nemesis": false, "world": "The postal service", "analogy": "You never post just the reply. You post the whole conversation again — every letter either of you has ever sent, re-copied, with the new one on top. The postal service has the memory of a goldfish and charges you by weight."}, {"id": "1.2", "title": "Message Roles", "picture": "Letters alternating down one table, each signed by one of two hands.", "snapback": "<code>user</code> and <code>assistant</code> alternate inside <code>messages[]</code>. The system prompt is not a role in that array.", "html": "<div class=\"an hi\" style=\"--acc:var(--w-post)\" data-an=\"1.2\"><div class=\"an-top\"><span class=\"an-w\">The postal service</span><span class=\"an-t\">§1.2</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M80 16v128' opacity='.3' stroke-dasharray='4 6'/><rect x='16' y='26' width='52' height='30' rx='4' fill='var(--acc)' opacity='.16'/><path d='M16 26h52v30H16z'/><path d='M92 66h52v30H92z'/><rect x='92' y='66' width='52' height='30' rx='4'/><path d='M16 106h52v30H16z'/><rect x='16' y='106' width='52' height='30' rx='4' fill='var(--acc)' opacity='.16'/><path d='M26 38h32M26 46h20'/><path d='M102 78h32M102 86h20'/><path d='M26 118h32M26 126h20'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Letters alternating down one table, each signed by one of two hands.</p><div class=\"an-lab\">The analogy</div><p>Two correspondents, strictly taking turns. Slip a letter into the pile signed with the other hand and the model will read it back as something it said itself — and carry on from there quite happily.</p><div class=\"an-snap\"><b>So on the exam →</b> <code>user</code> and <code>assistant</code> alternate inside <code>messages[]</code>. The system prompt is not a role in that array.</div></div></div><div class=\"an-nem\"><span class=\"lab\">⚠ Your record · Missed on Exam 12 Q18</span>Tool results re-enter as structured <code>tool_result</code> blocks matched to their <code>tool_use</code> by <code>id</code>. Narrating what the tool returned in prose is not the protocol, so the call stays unanswered.</div></div>", "nemesis": true, "world": "The postal service", "analogy": "Two correspondents, strictly taking turns. Slip a letter into the pile signed with the other hand and the model will read it back as something it said itself — and carry on from there quite happily."}, {"id": "1.3", "title": "The stop_reason Field", "picture": "A postmark franked on the returned envelope, telling you what happens next.", "snapback": "Branch on <code>stop_reason</code>: <code>tool_use</code> → run the tool and loop; <code>end_turn</code> → stop. Never parse the reply text for a sign-off.", "html": "<div class=\"an\" style=\"--acc:var(--w-post)\" data-an=\"1.3\"><div class=\"an-top\"><span class=\"an-w\">The postal service</span><span class=\"an-t\">§1.3</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M14 46h132v70H14z'/><path d='M14 46l66 40 66-40'/><circle cx='118' cy='42' r='26' fill='var(--acc)' opacity='.18'/><circle cx='118' cy='42' r='26' stroke-dasharray='5 4'/><path d='M108 42l7 8 14-16'/><path d='M28 130h40M84 130h48' opacity='.5'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A postmark franked on the returned envelope, telling you what happens next.</p><div class=\"an-lab\">The analogy</div><p>The postman does not write 'I think that's everything' in cursive at the bottom of page four. He stamps the outside: DELIVERED, or NEEDS A SIGNATURE. You read the stamp. You do not read the handwriting and form an impression.</p><div class=\"an-snap\"><b>So on the exam →</b> Branch on <code>stop_reason</code>: <code>tool_use</code> → run the tool and loop; <code>end_turn</code> → stop. Never parse the reply text for a sign-off.</div></div></div></div>", "nemesis": false, "world": "The postal service", "analogy": "The postman does not write 'I think that's everything' in cursive at the bottom of page four. He stamps the outside: DELIVERED, or NEEDS A SIGNATURE. You read the stamp. You do not read the handwriting and form an impression."}, {"id": "1.4", "title": "System Prompt", "picture": "A notice screwed above the sorting desk that every item passes under.", "snapback": "The system prompt is a top-level parameter sent with every request. Persona, tone and standing behavioural rules belong there.", "html": "<div class=\"an\" style=\"--acc:var(--w-post)\" data-an=\"1.4\"><div class=\"an-top\"><span class=\"an-w\">The postal service</span><span class=\"an-t\">§1.4</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='26' y='14' width='108' height='44' rx='4' fill='var(--acc)' opacity='.16'/><path d='M26 14h108v44H26z'/><path d='M40 28h80M40 38h80M40 48h48'/><path d='M56 58v10M104 58v10' opacity='.5'/><path d='M14 92h132' stroke-width='3'/><path d='M30 78h30v14H30zM68 78h30v14H68zM106 78h30v14h-30z'/><path d='M45 100v14M83 100v14M121 100v14' opacity='.4' stroke-dasharray='3 5'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A notice screwed above the sorting desk that every item passes under.</p><div class=\"an-lab\">The analogy</div><p>It is not in the post. It is bolted to the wall above the bench, and every single item travels beneath it on the way through — including the one you send in an hour, and the one after that.</p><div class=\"an-snap\"><b>So on the exam →</b> The system prompt is a top-level parameter sent with every request. Persona, tone and standing behavioural rules belong there.</div></div></div></div>", "nemesis": false, "world": "The postal service", "analogy": "It is not in the post. It is bolted to the wall above the bench, and every single item travels beneath it on the way through — including the one you send in an hour, and the one after that."}, {"id": "1.5", "title": "Context Window", "picture": "A mail sack with a hard brim you cannot pack past.", "snapback": "The window bounds the entire request: system prompt + full history + tool definitions + the reply. Growth costs latency and money on every turn.", "html": "<div class=\"an\" style=\"--acc:var(--w-post)\" data-an=\"1.5\"><div class=\"an-top\"><span class=\"an-w\">The postal service</span><span class=\"an-t\">§1.5</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M40 50c0-8 8-14 40-14s40 6 40 14v78c0 8-10 14-40 14s-40-6-40-14z'/><path d='M40 62h80' opacity='.5' stroke-dasharray='4 5'/><path d='M52 78h56v50H52z' fill='var(--acc)' opacity='.18'/><path d='M52 88h56M52 100h56M52 112h56' opacity='.6'/><path d='M132 50v92M126 50h12M126 142h12'/><path d='M56 36c6-10 42-10 48 0'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A mail sack with a hard brim you cannot pack past.</p><div class=\"an-lab\">The analogy</div><p>One sack, one size. A longer conversation does not earn you a bigger sack — it earns you a fuller one, and everything already in there gets carried again on every future trip.</p><div class=\"an-snap\"><b>So on the exam →</b> The window bounds the entire request: system prompt + full history + tool definitions + the reply. Growth costs latency and money on every turn.</div></div></div></div>", "nemesis": false, "world": "The postal service", "analogy": "One sack, one size. A longer conversation does not earn you a bigger sack — it earns you a fuller one, and everything already in there gets carried again on every future trip."}, {"id": "2.1", "title": "What is tool_use", "picture": "A numbered docket that has to come back pinned to the plate.", "snapback": "The model emits a <code>tool_use</code> block; your code runs it and returns a <code>tool_result</code> carrying the same <code>id</code>.", "html": "<div class=\"an\" style=\"--acc:var(--w-kitchen)\" data-an=\"2.1\"><div class=\"an-top\"><span class=\"an-w\">The restaurant</span><span class=\"an-t\">§2.1</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M30 14h64v58H30z'/><rect x='30' y='14' width='64' height='58' rx='3' fill='var(--acc)' opacity='.14'/><path d='M42 30h40M42 42h40M42 54h24'/><circle cx='84' cy='24' r='6'/><path d='M22 78h80' stroke-dasharray='5 5'/><ellipse cx='96' cy='120' rx='44' ry='16'/><path d='M62 120c0-12 15-20 34-20s34 8 34 20'/><circle cx='120' cy='96' r='7'/><path d='M120 89v-14' opacity='.6'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A numbered docket that has to come back pinned to the plate.</p><div class=\"an-lab\">The analogy</div><p>Claude does not cook. It writes a docket — table four, one lasagne — and pushes it through the hatch. Nothing happens until the kitchen actually cooks, and the plate comes back with that same number still pinned to it.</p><div class=\"an-snap\"><b>So on the exam →</b> The model emits a <code>tool_use</code> block; your code runs it and returns a <code>tool_result</code> carrying the same <code>id</code>.</div></div></div></div>", "nemesis": false, "world": "The restaurant", "analogy": "Claude does not cook. It writes a docket — table four, one lasagne — and pushes it through the hatch. Nothing happens until the kitchen actually cooks, and the plate comes back with that same number still pinned to it."}, {"id": "2.2", "title": "Tool Definition", "picture": "Two dishes on a menu — one described properly, one merely named.", "snapback": "Tool descriptions are the model's primary basis for selection. State what it does, what input it takes, when to use it, and when not to.", "html": "<div class=\"an hi\" style=\"--acc:var(--w-kitchen)\" data-an=\"2.2\"><div class=\"an-top\"><span class=\"an-w\">The restaurant</span><span class=\"an-t\">§2.2</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M22 20h56v120H22zM82 20h56v120H82z'/><path d='M80 20v120' opacity='.4'/><path d='M32 40h36M32 52h36M32 64h36M32 76h24' opacity='.85'/><rect x='30' y='34' width='40' height='48' rx='3' fill='var(--acc)' opacity='.16'/><path d='M92 40h36'/><path d='M104 62v22M96 70h16' opacity='.5'/><circle cx='110' cy='106' r='14' stroke-dasharray='4 4'/><path d='M105 101c0-4 4-6 6-4s0 5-1 6v3' opacity='.8'/><circle cx='110' cy='114' r='1.4' fill='currentColor'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Two dishes on a menu — one described properly, one merely named.</p><div class=\"an-lab\">The analogy</div><p>'Soup' next to 'Soup' tells a diner nothing at all. 'Chilled cucumber, no dairy, starter' next to 'slow beef broth, main' tells them everything. Nobody is guessing from the name — they are reading the description underneath it.</p><div class=\"an-snap\"><b>So on the exam →</b> Tool descriptions are the model's primary basis for selection. State what it does, what input it takes, when to use it, and when not to.</div></div></div><div class=\"an-nem\"><span class=\"lab\">⚠ Your record · Missed on Exam 13 Q19</span>When a tool's behaviour surprises the agent &mdash; truncation limits, what it cannot reach &mdash; the fix is to state it in the description. The description is the model's only view of scope.</div></div>", "nemesis": true, "world": "The restaurant", "analogy": "'Soup' next to 'Soup' tells a diner nothing at all. 'Chilled cucumber, no dairy, starter' next to 'slow beef broth, main' tells them everything. Nobody is guessing from the name — they are reading the description underneath it."}, {"id": "2.3", "title": "The tool_choice Parameter", "picture": "Three doors out of the same restaurant.", "snapback": "If the question says <em>guarantee</em>, <code>auto</code> is out. If it also wants the model to pick which schema fits, it is <code>any</code>.", "html": "<div class=\"an hi\" style=\"--acc:var(--w-kitchen)\" data-an=\"2.3\"><div class=\"an-top\"><span class=\"an-w\">The restaurant</span><span class=\"an-t\">§2.3</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M8 40h40v104H8zM60 40h40v104H60zM112 40h40v104h-40z'/><path d='M8 40h40M60 40h40M112 40h40' stroke-width='3'/><circle cx='28' cy='108' r='9'/><path d='M28 99V88'/><path d='M18 74c0-7 20-7 20 0' opacity='.6'/><ellipse cx='80' cy='112' rx='16' ry='6' fill='var(--acc)' opacity='.2'/><path d='M64 112c0-9 7-15 16-15s16 6 16 15'/><path d='M80 97v-6'/><circle cx='70' cy='62' r='6'/><circle cx='80' cy='62' r='6'/><circle cx='90' cy='62' r='6'/><ellipse cx='132' cy='112' rx='16' ry='6' fill='var(--acc)' opacity='.35'/><path d='M116 112c0-9 7-15 16-15s16 6 16 15'/><circle cx='122' cy='62' r='6'/><path d='M117 57l10 10' stroke-width='2'/><circle cx='142' cy='62' r='6'/><path d='M137 57l10 10' stroke-width='2'/><circle cx='132' cy='62' r='6' fill='var(--acc)' opacity='.35'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">Three doors out of the same restaurant.</p><div class=\"an-lab\">The analogy</div><p><code>auto</code> lets you sit down, chat, and leave having eaten nothing. <code>any</code> runs a door policy — you are not getting out without ordering something, though the dish is entirely your call. Naming a tool is the tasting menu: the first course was settled before you walked in.</p><div class=\"an-snap\"><b>So on the exam →</b> If the question says <em>guarantee</em>, <code>auto</code> is out. If it also wants the model to pick which schema fits, it is <code>any</code>.</div></div></div><div class=\"an-nem\"><span class=\"lab\">⚠ Your record · Missed twice in fourteen hours</span>Exam 12 Q33 and Exam 13 Q46 both asked which setting <em>guarantees</em> a tool call. You answered <code>auto</code> plus a prompt instruction both times, with the full explanation read in between. The two stems share only 0.118 similarity, so this is not a repeated question — it is a held preference. <strong>The setting outranks the instruction: <code>auto</code> permits text, full stop.</strong></div></div>", "nemesis": true, "world": "The restaurant", "analogy": "auto lets you sit down, chat, and leave having eaten nothing. any runs a door policy — you are not getting out without ordering something, though the dish is entirely your call. Naming a tool is the tasting menu: the first course was settled before you walked in."}, {"id": "2.4", "title": "JSON Schemas for Structured Output", "picture": "A plating diagram taped inside the pass.", "snapback": "Make the tool's <code>input_schema</code> the shape you want back. Required versus nullable decides whether the model may return nothing instead of inventing something.", "html": "<div class=\"an\" style=\"--acc:var(--w-kitchen)\" data-an=\"2.4\"><div class=\"an-top\"><span class=\"an-w\">The restaurant</span><span class=\"an-t\">§2.4</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx='80' cy='84' r='58' stroke-dasharray='6 5' opacity='.5'/><circle cx='80' cy='84' r='46'/><circle cx='66' cy='72' r='16' fill='var(--acc)' opacity='.2'/><circle cx='66' cy='72' r='16' stroke-dasharray='4 4'/><rect x='88' y='62' width='26' height='20' rx='3' stroke-dasharray='4 4'/><path d='M62 104h36' stroke-dasharray='4 4'/><path d='M70 100v8M80 100v8M90 100v8'/><path d='M16 22h30M16 22v10M144 22h-30M144 22v10' opacity='.55'/><path d='M50 16h60v14H50z' fill='var(--acc)' opacity='.16'/><path d='M50 16h60v14H50z'/></svg></div><div class=\"an-txt\"><div class=\"an-lab\">The picture</div><p class=\"an-pic\">A plating diagram taped inside the pass.</p><div class=\"an-lab\">The analogy</div><p>Protein here. Sauce there. Three spears, not four. Anything leaving the kitchen has to match the diagram, and there is no negotiating about it at the hatch.</p><div class=\"an-snap\"><b>So on the exam →</b> Make the tool's <code>input_schema</code> the shape you want back. Required versus nullable decides whether the model may return nothing instead of inventing something.</div></div></div></div>", "nemesis": false, "world": "The restaurant", "analogy": "Protein here. Sauce there. Three spears, not four. Anything leaving the kitchen has to match the diagram, and there is no negotiating about it at the hatch."}, {"id": "2.5", "title": "Syntax vs Semantic Errors", "picture": "Two plates: one obviously wrong, one plated perfectly with the wrong fish.", "snapback": "Schemas eliminate the syntax class outright and do nothing for the semantic class. Valid JSON still holds a wrong number.", "html": "<div class=\"an\" style=\"--acc:var(--w-kitchen)\" data-an=\"2.5\"><div class=\"an-top\"><span class=\"an-w\">The restaurant</span><span class=\"an-t\">§2.5</span></div><div class=\"an-b\"><div class=\"an-svg\"><svg viewBox=\"0 0 160 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx='44' cy='72' r='32'/><path d='M22 50l44 44M66 50l-44 44' opacity='.85'/><circle cx='30' cy='60' r='7' fill='var(--acc)' opacity='.25'/><circle cx='62' cy='92' r='6' fill='var(--acc)' opacity='.25'/><circle cx='116' cy='72' r='32'/><circle cx='104' cy='64' r='11' fill='var(--acc)' opacity='.22'/><rect x='120' y='58' width='18' height='14' rx='3'/><path d='M104 88h24'/><path d='M96 118l7 8 14-16'/><path d='M126 112h22l-11 20z' stroke-linejoin='round'/><path d='M137 119v5' /><circle cx='137' cy='128' r='1.3' fill='current
